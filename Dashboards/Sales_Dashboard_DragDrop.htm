<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sales Dashboard — Grid Layout</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link  rel="stylesheet" href="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack.min.css">
  <script src="https://cdn.jsdelivr.net/npm/gridstack@10.3.1/dist/gridstack-all.js"></script>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.29.4/moment.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', -apple-system, sans-serif; background: #f1f5f9; }
    :root { --primary: #2d9cdb; --primary-dark: #1e7bb4; }

    /* ── Scrollbar ─────────────────────────────────────── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }

    /* ── Main layout ───────────────────────────────────── */
    #main-content { height: calc(100vh - 64px); overflow-y: auto; padding: 16px 20px; }
    .grid-stack { background: transparent; }
    .grid-stack-item-content { border-radius: 12px; overflow: hidden; }
    .grid-stack-placeholder > .placeholder-content { background: rgba(45,156,219,.08); border: 2px dashed var(--primary); border-radius: 12px; }

    /* ── Widget chrome ─────────────────────────────────── */
    .widget-wrapper { width: 100%; height: 100%; display: flex; flex-direction: column; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.08), 0 0 0 1px rgba(0,0,0,.06); transition: box-shadow .2s; }
    .widget-wrapper:hover { box-shadow: 0 4px 16px rgba(0,0,0,.12), 0 0 0 1px rgba(0,0,0,.07); }

    .widget-header { display: flex; align-items: center; gap: 8px; padding: 9px 12px; border-bottom: 1px solid #f1f5f9; flex-shrink: 0; background: white; cursor: grab; user-select: none; }
    .widget-header:active { cursor: grabbing; }
    .widget-drag-handle { color: #d1d5db; display: flex; align-items: center; flex-shrink: 0; transition: color .15s; }
    .widget-header:hover .widget-drag-handle { color: #94a3b8; }
    .widget-title { font-size: 12.5px; font-weight: 600; color: #475569; flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    /* CRITICAL FIX: padding:0 so clientHeight = exact usable area for D3 */
    .widget-body { flex: 1; overflow: hidden; padding: 0; position: relative; min-height: 0; }

    .widget-remove { width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; color: #d1d5db; border-radius: 6px; border: none; background: none; cursor: pointer; transition: all .15s; flex-shrink: 0; }
    .widget-remove:hover { color: #ef4444; background: #fef2f2; }

    .chart-toggle-btn { width: 24px; height: 22px; display: flex; align-items: center; justify-content: center; border: none; border-radius: 5px; cursor: pointer; background: transparent; color: #94a3b8; transition: all .15s; }
    .chart-toggle-btn.active { background: #f1f5f9; color: #475569; }
    .chart-toggle-btn:hover:not(.active) { color: #64748b; }

    /* ── D3 ────────────────────────────────────────────── */
    .axis line, .axis path { stroke: #e2e8f0; shape-rendering: crispEdges; }
    .axis text { fill: #94a3b8; font-size: 10px; font-family: inherit; }
    .grid-line { stroke: #f1f5f9; stroke-width: 1; }

    /* ── Sortable table ────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; }
    .data-table th { background: #f8fafc; padding: 5px 10px; text-align: left; font-size: 10px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid #e2e8f0; position: sticky; top: 0; cursor: pointer; white-space: nowrap; user-select: none; z-index: 1; }
    .data-table th:hover { background: #f1f5f9; }
    .data-table td { padding: 5px 10px; font-size: 11px; color: #475569; border-bottom: 1px solid #f8fafc; white-space: nowrap; }
    .data-table tbody tr:hover td { background: #f8fafc; }

    /* ── KPI tile ──────────────────────────────────────── */
    .kpi-root { height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 10px; gap: 4px; }
    .kpi-value { font-size: clamp(20px, 3.5vw, 34px); font-weight: 800; color: #1e293b; line-height: 1; }
    .kpi-label { font-size: 11px; color: #64748b; font-weight: 500; }
    .kpi-accent { width: 28px; height: 3px; border-radius: 2px; margin-top: 6px; }

    /* ── Skeleton loader ───────────────────────────────── */
    .tile-skel { height: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .tile-skel-spin { width: 24px; height: 24px; border: 3px solid #e2e8f0; border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; }
    .tile-skel-lbl { font-size: 11px; color: #94a3b8; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Locked state ──────────────────────────────────── */
    .dashboard-locked .widget-remove { visibility: hidden; pointer-events: none; }
    .dashboard-locked .widget-drag-handle { visibility: hidden; }
    .dashboard-locked .widget-header { cursor: default !important; }
    .dashboard-locked .widget-header:active { cursor: default !important; }
    .dashboard-locked .gs-resizable-handle { display: none !important; }

    /* ── KPI badge edit controls ───────────────────────── */
    .kpi-badge { position: relative; }
    .badge-remove { display:none;position:absolute;top:3px;right:5px;background:none;border:none;color:#ef4444;font-size:11px;font-weight:700;line-height:1;cursor:pointer;padding:0;opacity:0.6; }
    .badge-remove:hover { opacity:1; }
    body:not(.dashboard-locked) .badge-remove { display:block; }
    .kpi-badge.drag-over { border-color:var(--primary) !important; background:#eff9ff !important; }
    .kpi-badge[draggable=true] { cursor:grab; }
    .badge-add-btn { display:flex;align-items:center;justify-content:center;width:26px;height:36px;border:1px dashed #cbd5e1;border-radius:8px;background:none;color:#94a3b8;cursor:pointer;transition:all .15s;flex-shrink:0; }
    .badge-add-btn:hover { border-color:var(--primary);color:var(--primary); }
    .dashboard-locked .badge-add-btn { display:none; }

    /* ── Tooltip ───────────────────────────────────────── */
    #ttip { position: fixed; background: rgba(15,23,42,.93); color: white; padding: 10px 14px; border-radius: 8px; font-size: 12px; line-height: 1.5; pointer-events: none; opacity: 0; transition: opacity .15s; z-index: 10000; max-width: 260px; box-shadow: 0 8px 24px rgba(0,0,0,.25); }

    /* ── Modal ─────────────────────────────────────────── */
    .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 9000; display: none; align-items: center; justify-content: center; }
    .modal-overlay.show { display: flex; }
    .tab-btn { padding: 6px 14px; font-size: 13px; font-weight: 500; color: #64748b; border: none; background: none; cursor: pointer; border-radius: 8px; transition: all .15s; }
    .tab-btn:hover { background: #f1f5f9; }
    .tab-btn.active { background: var(--primary); color: white; }
    .widget-card { background: white; border: 1.5px solid #e2e8f0; border-radius: 12px; padding: 16px; display: flex; flex-direction: column; gap: 10px; transition: border-color .15s, box-shadow .15s; }
    .widget-card:hover { border-color: var(--primary); box-shadow: 0 4px 16px rgba(45,156,219,.12); }

    /* ── Drilldown modal ───────────────────────────────── */
    #drilldownModal .dd-body { flex: 1; overflow-y: auto; padding: 16px 20px; }
    .dd-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .dd-table th { background: #f8fafc; padding: 7px 12px; text-align: left; font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; letter-spacing: .04em; border-bottom: 2px solid #e2e8f0; position: sticky; top: 0; cursor: pointer; white-space: nowrap; }
    .dd-table td { padding: 7px 12px; border-bottom: 1px solid #f0f4f8; color: #334155; }
    .dd-table tbody tr:hover td { background: #f8fafc; cursor: pointer; }

    /* ── Save toast ────────────────────────────────────── */
    #saveToast { position: fixed; bottom: 24px; right: 24px; background: #10b981; color: white; padding: 10px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 16px rgba(16,185,129,.35); transform: translateY(60px); opacity: 0; transition: transform .3s, opacity .3s; z-index: 8000; }
    #saveToast.show { transform: translateY(0); opacity: 1; }

    /* ── Filters panel ─────────────────────────────────── */
    #filtersPanel { background: white; border-bottom: 1px solid #e2e8f0; padding: 10px 24px; display: none; }
    #filtersPanel.open { display: block; }
    #filtersPanel select { padding: 5px 8px; border: 1px solid #e2e8f0; border-radius: 7px; font-size: 12px; color: #374151; background: #f9fafb; width: 100%; }

    /* ── KPI header badges ─────────────────────────────── */
    .kpi-badge { display: flex; flex-direction: column; padding: 5px 12px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 8px; min-width: 90px; }
    .kpi-badge-val { font-size: 14px; font-weight: 700; color: #1e293b; line-height: 1.2; }
    .kpi-badge-lbl { font-size: 9px; font-weight: 600; color: #94a3b8; text-transform: uppercase; letter-spacing: .05em; margin-top: 1px; }

    /* ── Misc overrides ────────────────────────────────── */
    .bg-indigo-600 { background-color: var(--primary) !important; }
    .text-indigo-600 { color: var(--primary) !important; }
    .hover\:text-indigo-600:hover { color: var(--primary) !important; }
    .order-link { color: var(--primary); font-weight: 600; cursor: pointer; text-decoration: none; }
    .order-link:hover { color: var(--primary-dark); text-decoration: underline; }
  </style>
</head>
<body>

<!-- ═══ HEADER ════════════════════════════════════════════════════════════ -->
<header style="height:64px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:200;box-shadow:0 1px 3px rgba(0,0,0,.06);">
  <div style="display:flex;align-items:center;gap:10px;min-width:0;">
    <div style="width:34px;height:34px;background:#06162d;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0;">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2"><path d="M3 3v18h18"/><path d="M7 16l4-4 4 4 4-8"/></svg>
    </div>
    <div style="min-width:0;">
      <div style="font-size:14px;font-weight:700;color:#0f172a;white-space:nowrap;">Sales Dashboard</div>
      <div style="font-size:10px;color:#94a3b8;white-space:nowrap;" id="dateRangeDisplay">Loading…</div>
    </div>
    <!-- KPI header badges -->
    <div id="kpiBadges" style="display:none;align-items:center;gap:6px;margin-left:8px;" class="lg:flex"></div>
  </div>

  <div style="display:flex;align-items:center;gap:6px;flex-shrink:0;">
    <!-- Filters toggle -->
    <button id="filtersToggleBtn" onclick="toggleFilters()" title="Show/hide filters" style="padding:6px 10px;background:white;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-weight:500;color:#64748b;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;">
      <svg width="13" height="13" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
      Filters
    </button>

    <!-- Date range -->
    <div style="display:flex;align-items:center;gap:4px;background:#f8fafc;padding:5px 8px;border-radius:8px;border:1px solid #e2e8f0;">
      <svg width="12" height="12" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
      <select id="dateRangeFilter" onchange="onDateRangeChange()" style="font-size:11px;border:none;background:transparent;color:#374151;font-weight:600;outline:none;cursor:pointer;">
        <option value="today">Today</option>
        <option value="this_week">This Week</option>
        <option value="this_month">This Month</option>
        <option value="last_month">Last Month</option>
        <option value="30">Last 30 Days</option>
        <option value="60">Last 60 Days</option>
        <option value="90">Last 90 Days</option>
        <option value="180">Last 6 Months</option>
        <option value="365">Last Year</option>
        <option value="this_quarter">This Quarter</option>
        <option value="last_quarter">Last Quarter</option>
        <option value="current_fy" selected>Current Financial Year</option>
        <option value="last_fy">Last Financial Year</option>
        <option value="current_cy">Current Calendar Year</option>
        <option value="last_cy">Last Calendar Year</option>
        <option value="custom">Custom Range</option>
      </select>
    </div>
    <div id="customDateWrap" style="display:none;align-items:center;gap:4px;background:#f8fafc;padding:5px 8px;border-radius:8px;border:1px solid #e2e8f0;">
      <input type="date" id="customStart" onchange="onCustomDateChange()" style="font-size:11px;border:none;background:transparent;outline:none;color:#374151;">
      <span style="color:#94a3b8;font-size:11px;">to</span>
      <input type="date" id="customEnd" onchange="onCustomDateChange()" style="font-size:11px;border:none;background:transparent;outline:none;color:#374151;">
    </div>

    <!-- Refresh -->
    <button onclick="refreshDashboard()" title="Refresh data" style="padding:6px;background:white;border:1px solid #e2e8f0;border-radius:8px;color:#64748b;cursor:pointer;display:flex;align-items:center;transition:all .15s;">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
    </button>

    <!-- Lock toggle -->
    <button id="lockBtn" onclick="toggleLock()" title="Dashboard locked — click to edit" style="padding:5px 6px;background:none;border:1px solid transparent;border-radius:7px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#94a3b8;transition:color .15s,border-color .15s;" onmouseover="this.style.borderColor='#e2e8f0'" onmouseout="this.style.borderColor='transparent'">
      <svg id="lockIcon" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
    </button>

    <!-- Edit controls (hidden when locked) -->
    <div id="editControls" style="display:none;align-items:center;gap:6px;">
      <button onclick="resetLayout()" style="padding:6px 10px;background:white;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-weight:500;color:#64748b;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 109-9 9.75 9.75 0 00-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
      <button onclick="saveLayout()" style="padding:6px 10px;background:white;border:1px solid #e2e8f0;border-radius:8px;font-size:12px;font-weight:500;color:#64748b;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save Layout
      </button>
      <button onclick="openWidgetPicker()" style="padding:6px 13px;background:#2d9cdb;border:none;border-radius:8px;font-size:12px;font-weight:600;color:white;cursor:pointer;display:flex;align-items:center;gap:4px;box-shadow:0 2px 8px rgba(45,156,219,.3);transition:all .15s;" onmouseover="this.style.background='#1e7bb4'" onmouseout="this.style.background='#2d9cdb'">
        <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Add Widget
      </button>
      <!-- Admin-only controls — inside edit controls, only visible when unlocked -->
      <div id="adminControls" style="display:none;align-items:center;gap:4px;padding-left:6px;border-left:1px solid #e2e8f0;margin-left:2px;">
        <button id="userEditingBtn" onclick="toggleUserEditing()" style="padding:5px 9px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;border:1px solid #e2e8f0;background:#f8fafc;color:#64748b;"></button>
        <button onclick="publishMasterLayout()" title="Publish current layout and filters as the default for all users" style="padding:5px 9px;background:white;border:1px solid #e2e8f0;border-radius:7px;font-size:11px;font-weight:500;color:#64748b;cursor:pointer;display:flex;align-items:center;gap:3px;transition:all .15s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='white'">
          <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
          Publish
        </button>
      </div>
    </div>
  </div>
</header>

<!-- ═══ FILTERS PANEL ═════════════════════════════════════════════════════ -->
<div id="filtersPanel">
  <div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;align-items:end;">
    <div>
      <label style="display:block;font-size:10px;font-weight:600;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;">Customer Group</label>
      <select id="filterCustomerGroup" onchange="onFilterChange()"><option value="%">All Groups</option></select>
    </div>
    <div>
      <label style="display:block;font-size:10px;font-weight:600;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;">Product Category</label>
      <select id="filterProductCategory" onchange="onFilterChange()"><option value="%">All Categories</option></select>
    </div>
    <div>
      <label style="display:block;font-size:10px;font-weight:600;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;">Sales Person</label>
      <select id="filterSalesperson" onchange="onFilterChange()"><option value="%">All Sales People</option></select>
    </div>
    <div>
      <label style="display:block;font-size:10px;font-weight:600;color:#64748b;margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em;">Margin Level</label>
      <select id="filterMargin" onchange="onFilterChange()">
        <option value="%">All Margins</option>
        <option value="good">Good (&gt;30%)</option>
        <option value="medium">Medium (15–30%)</option>
        <option value="low">Low (&lt;15%)</option>
      </select>
    </div>
    <div style="display:flex;align-items:flex-end;">
      <button onclick="clearAllFilters()" style="padding:5px 12px;background:#f1f5f9;border:1px solid #e2e8f0;border-radius:7px;font-size:11px;color:#64748b;cursor:pointer;">Clear Filters</button>
    </div>
  </div>
</div>

<!-- ═══ GRID ═══════════════════════════════════════════════════════════════ -->
<main id="main-content">
  <div id="myGrid" class="grid-stack"></div>
</main>

<!-- ═══ WIDGET PICKER MODAL ═══════════════════════════════════════════════ -->
<div id="widgetPickerModal" class="modal-overlay" onclick="if(event.target===this)closeWidgetPicker()">
  <div style="background:white;border-radius:20px;width:min(900px,96vw);max-height:88vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.28);">
    <div style="padding:18px 22px 14px;border-bottom:1px solid #f1f5f9;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0;">
      <div>
        <h2 style="font-size:17px;font-weight:700;color:#0f172a;margin:0 0 2px;">Add Widget</h2>
        <p style="font-size:11px;color:#94a3b8;margin:0;">Select a report type. Tiles can be resized and rearranged after adding.</p>
      </div>
      <button onclick="closeWidgetPicker()" style="width:30px;height:30px;background:#f8fafc;border:none;border-radius:8px;cursor:pointer;color:#64748b;display:flex;align-items:center;justify-content:center;margin-left:12px;">
        <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div style="padding:10px 22px 8px;border-bottom:1px solid #f1f5f9;display:flex;gap:4px;flex-shrink:0;">
      <button class="tab-btn active" onclick="switchPickerTab('all',this)">All</button>
      <button class="tab-btn" onclick="switchPickerTab('kpi',this)">KPIs</button>
      <button class="tab-btn" onclick="switchPickerTab('chart',this)">Charts</button>
      <button class="tab-btn" onclick="switchPickerTab('table',this)">Tables</button>
    </div>
    <div id="pickerGrid" style="flex:1;overflow-y:auto;padding:18px 22px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;align-content:start;"></div>
  </div>
</div>

<!-- ═══ DRILLDOWN MODAL ════════════════════════════════════════════════════ -->
<div id="drilldownModal" class="modal-overlay" onclick="if(event.target===this)closeDrilldown()">
  <div style="background:white;border-radius:20px;width:min(920px,96vw);max-height:90vh;display:flex;flex-direction:column;box-shadow:0 24px 64px rgba(0,0,0,.28);">

<!-- ═══════════════════════════════════════════════════════════════════════ -->
<script>
'use strict';

// ============================================================
// 1.  FEATURE DETECTION
// ============================================================
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#475569;"><h2>Not running inside Fishbowl</h2><p>This report requires the Fishbowl embedded browser.</p></div>';
  throw new Error('Fishbowl API not available');
}

// ============================================================
// 2.  CONSTANTS & HELPERS
// ============================================================
const COLOR_PALETTE = ['#2d9cdb','#10b981','#f59e0b','#8b5cf6','#ef4444','#ec4899','#14b8a6','#f97316','#06b6d4','#3b82f6'];
const KPI_COLORS = { revenue:'#2d9cdb', cogs:'#ef4444', grossprofit:'#10b981', orders:'#8b5cf6', avgorder:'#f59e0b', avgmargin:'#10b981' };
const FY_START = parseInt(getProperty('BI_FY_START_MONTH','7')) || 7;
const CURR = (function(){ try { return currencyLocale(); } catch(e){ return {locale:'en-US',symbol:'$'}; } })();
const SYM = CURR.symbol || '$';
const LOC = CURR.locale || 'en-US';
const DEBUG_MODE = (function(){ try { const v = getProperty('BI_SHOW_DEBUG','false'); return v === 'true' || v === true; } catch(e){ return false; } })();

function fmt$(v, compact=false) {
  const n = parseFloat(v||0), neg = n < 0, abs = Math.abs(n);
  let s;
  if (compact) {
    if (abs >= 1e6) s = SYM + (abs/1e6).toFixed(2) + 'M';
    else if (abs >= 1e3) s = SYM + (abs/1e3).toFixed(1) + 'k';
    else s = SYM + abs.toFixed(0);
  } else {
    s = SYM + abs.toLocaleString(LOC, {minimumFractionDigits:2, maximumFractionDigits:2});
  }
  return neg ? '-'+s : s;
}
function fmtPct(v) { return (parseFloat(v||0)*100).toFixed(1)+'%'; }
function fmtNum(v) { return parseInt(v||0).toLocaleString(); }
function fmtDate(s) { if (!s) return '—'; return moment(s).format('D MMM YY'); }
function escSQL(v) { if (v==null) return ''; return String(v).replace(/'/g,"''"); }

const BADGE_META = {
  revenue:     { label:'Revenue',     color:'#2d9cdb', get:(k)=>fmt$(parseFloat(k.total_revenue||0),true) },
  cogs:        { label:'COGS',        color:'#ef4444', get:(k)=>fmt$(parseFloat(k.total_cogs||0),true) },
  grossprofit: { label:'Gross Profit',color:'#10b981', get:(k)=>fmt$(parseFloat(k.total_revenue||0)-parseFloat(k.total_cogs||0),true) },
  orders:      { label:'Orders',      color:'#8b5cf6', get:(k)=>fmtNum(parseInt(k.order_count||0)) },
  avgorder:    { label:'Avg Order',   color:'#f59e0b', get:(k)=>{ const r=parseFloat(k.total_revenue||0),o=parseInt(k.order_count||0); return fmt$(o>0?r/o:0,true); } },
  avgmargin:   { label:'Margin',      color:null,      get:(k)=>fmtPct(parseFloat(k.avg_margin||0)), colorFn:(k)=>{ const m=parseFloat(k.avg_margin||0); return m>=0.3?'#10b981':m>=0.15?'#f59e0b':'#ef4444'; } }
};
let _badgeConfig = ['revenue','orders','avgorder','avgmargin'];

function debugLog(message, type = 'info') {
  if (!DEBUG_MODE) return;
  const ts = new Date().toLocaleTimeString();
  const logDiv = document.getElementById('debugLog');
  if (!logDiv) return;
  if (logDiv.querySelector('span[style*="italic"]')) logDiv.innerHTML = '';
  const colors = { info:'#60a5fa', success:'#34d399', warning:'#fbbf24', error:'#f87171', click:'#c084fc' };
  const entry = document.createElement('div');
  entry.style.marginBottom = '3px';
  entry.innerHTML = `<span style="color:#475569">[${ts}]</span> <span style="color:${colors[type]||colors.info}">${message}</span>`;
  logDiv.appendChild(entry);
  logDiv.scrollTop = logDiv.scrollHeight;
}

function toggleDebugConsole() {
  const content = document.getElementById('debugContent');
  const chevron = document.getElementById('debugChevron');
  const open = content.style.display !== 'none';
  content.style.display = open ? 'none' : 'block';
  chevron.style.transform = open ? 'rotate(180deg)' : 'rotate(0deg)';
}

function clearDebugLog() {
  const logDiv = document.getElementById('debugLog');
  if (logDiv) logDiv.innerHTML = '<span style="color:#475569;font-style:italic;">Log cleared</span>';
}

function copyDebugLog() {
  const logDiv = document.getElementById('debugLog');
  if (!logDiv) return;
  const text = Array.from(logDiv.querySelectorAll('div')).map(d => d.textContent).join('\n');
  navigator.clipboard.writeText(text).then(() => {
    const btn = document.getElementById('debugCopyBtn');
    if (btn) { const orig = btn.innerHTML; btn.innerHTML = '<svg width="11" height="11" fill="none" stroke="#34d399" stroke-width="2" viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg> Copied!'; btn.style.color='#34d399'; setTimeout(()=>{ btn.innerHTML=orig; btn.style.color='#64748b'; }, 1500); }
  }).catch(() => {});
}

// Debug console vertical resize
(function() {
  let _resizing = false, _startY = 0, _startH = 0;
  document.addEventListener('DOMContentLoaded', () => {
    const handle = document.getElementById('debugResizeHandle');
    const log    = document.getElementById('debugLog');
    if (!handle || !log) return;
    handle.addEventListener('mousedown', e => {
      _resizing = true; _startY = e.clientY; _startH = log.offsetHeight;
      document.body.style.userSelect = 'none';
      e.preventDefault();
    });
    document.addEventListener('mousemove', e => {
      if (!_resizing) return;
      const delta = _startY - e.clientY;
      log.style.height = Math.max(80, Math.min(window.innerHeight * 0.7, _startH + delta)) + 'px';
    });
    document.addEventListener('mouseup', () => {
      if (_resizing) { _resizing = false; document.body.style.userSelect = ''; }
    });
  });
})();

async function runQueryP(sql) {
  if (typeof runQueryAsync === 'function') {
    const r = await runQueryAsync(sql);
    return Array.isArray(r) ? r : [];
  }
  try { const p = JSON.parse(runQuery(sql)); return Array.isArray(p) ? p : []; } catch(e) { return []; }
}

async function runQueryLogged(label, sql) {
  debugLog(`${label}: executing query`, 'info');
  console.log(`${label} Query:`, sql);
  try {
    const r = await runQueryP(sql);
    debugLog(`${label}: returned ${r.length} row(s)`, r.length ? 'success' : 'warning');
    return r;
  } catch(e) {
    debugLog(`${label}: ERROR — ${e.message}`, 'error');
    throw e;
  }
}

// ============================================================
// 3.  SETTINGS PERSISTENCE  (saveSettings / loadSettings)
// ============================================================
const SETTINGS_KEY = 'cdx.bi.sales-dashboard-grid';
let _isAdmin = false;
let _userEditingAllowed = true;
let _globalData = {};

function _biSave(data) {
  if (typeof saveSettings === 'function') {
    try { saveSettings(SETTINGS_KEY, JSON.stringify(data)); } catch(e) {}
  }
}

function _biLoad() {
  if (typeof loadSettings !== 'function') return null;
  try { const r = loadSettings(SETTINGS_KEY); return r ? JSON.parse(r) : null; } catch(e) { return null; }
}

// ============================================================
// 4.  DATE RANGE
// ============================================================
let _customStart = null, _customEnd = null;

function getDateRange() {
  const sel = document.getElementById('dateRangeFilter').value;
  if (sel === 'custom') return { start: _customStart, end: _customEnd };

  const now = moment();
  const y = now.year(), m = now.month();

  if (sel === 'today')       return { start: now.format('YYYY-MM-DD'), end: now.format('YYYY-MM-DD') };
  if (sel === 'this_week')   return { start: now.clone().startOf('isoWeek').format('YYYY-MM-DD'), end: now.clone().endOf('isoWeek').format('YYYY-MM-DD') };
  if (sel === 'this_month')  return { start: now.clone().startOf('month').format('YYYY-MM-DD'), end: now.clone().endOf('month').format('YYYY-MM-DD') };
  if (sel === 'last_month')  { const lm = now.clone().subtract(1,'month'); return { start: lm.startOf('month').format('YYYY-MM-DD'), end: lm.endOf('month').format('YYYY-MM-DD') }; }
  if (!isNaN(parseInt(sel))) { const d = parseInt(sel); return { start: now.clone().subtract(d,'days').format('YYYY-MM-DD'), end: now.format('YYYY-MM-DD') }; }
  if (sel === 'this_quarter'){ const qs = now.clone().startOf('quarter'); return { start: qs.format('YYYY-MM-DD'), end: qs.clone().endOf('quarter').format('YYYY-MM-DD') }; }
  if (sel === 'last_quarter'){ const lqs = now.clone().subtract(1,'quarter').startOf('quarter'); return { start: lqs.format('YYYY-MM-DD'), end: lqs.clone().endOf('quarter').format('YYYY-MM-DD') }; }

  // FY helpers
  function fyDates(offset) {
    const fsm = FY_START;
    const curMonth = now.month() + 1;
    let fyY = (curMonth >= fsm ? y : y-1) - offset;
    let endM, endY;
    if (fsm === 1) { endM = 12; endY = fyY; }
    else { endM = fsm-1; endY = fyY+1; }
    const end = moment([endY, endM-1, 1]).endOf('month');
    return { start: `${fyY}-${String(fsm).padStart(2,'0')}-01`, end: end.format('YYYY-MM-DD') };
  }
  if (sel === 'current_fy') return fyDates(0);
  if (sel === 'last_fy')    return fyDates(1);
  if (sel === 'current_cy') return { start: `${y}-01-01`, end: `${y}-12-31` };
  if (sel === 'last_cy')    return { start: `${y-1}-01-01`, end: `${y-1}-12-31` };
  return fyDates(0);
}

function getDateCondition() {
  const r = getDateRange();
  if (!r.start || !r.end) return "PostSo.DateCreated >= DATE_SUB(NOW(), INTERVAL 365 DAY)";
  return `PostSo.DateCreated >= '${r.start}' AND PostSo.DateCreated <= '${r.end} 23:59:59'`;
}

function updateDateDisplay() {
  const r = getDateRange();
  const el = document.getElementById('dateRangeDisplay');
  if (el && r.start && r.end) {
    el.textContent = moment(r.start).format('D MMM YYYY') + ' – ' + moment(r.end).format('D MMM YYYY');
  }
}

function onDateRangeChange() {
  const sel = document.getElementById('dateRangeFilter').value;
  document.getElementById('customDateWrap').style.display = sel === 'custom' ? 'flex' : 'none';
  if (sel !== 'custom') { updateDateDisplay(); onFilterChange(); }
}

function onCustomDateChange() {
  _customStart = document.getElementById('customStart').value;
  _customEnd   = document.getElementById('customEnd').value;
  if (_customStart && _customEnd) { updateDateDisplay(); onFilterChange(); }
}

// ============================================================
// 5.  SQL CONSTANTS & FILTER CONDITIONS
// ============================================================
const REV_EXPR    = `COALESCE(((PostSoItem.TotalPrice/PostSoItem.Qty)-((PostSoItem.TotalPrice/PostSoItem.Qty)*PSI.AdjustPercent)), PostSoItem.TotalPrice/PostSoItem.Qty) * PostSoItem.Qty`;
const MARGIN_EXPR = `((${REV_EXPR}) - PostSoItem.PostedTotalCost) / NULLIF(${REV_EXPR}, 0)`;
const BASE_JOIN   = `
  FROM PostSo
  JOIN PostSoItem ON PostSoItem.PostSoId = PostSo.Id
  JOIN SoItem ON SoItem.Id = PostSoItem.SoItemId
  JOIN So ON So.Id = SoItem.SoId
  LEFT JOIN PostSoItem PSI ON PSI.SoItemId = COALESCE(
    (SELECT K.Id FROM SoItem K WHERE K.SoLineItem = SoItem.SoLineItem+1 AND K.TypeId = 30 AND SoItem.typeId != 30 AND K.SoId = SoItem.SoId ORDER BY K.SoLineItem ASC LIMIT 1),
    (SELECT K.Id FROM SoItem K WHERE K.SoLineItem > SoItem.SoLineItem AND EXISTS (SELECT 1 FROM SoItem J WHERE J.TypeId = 40 AND J.SoId = K.SoId AND J.SoLineItem >= K.SoLineItem-1 ORDER BY J.SoLineItem ASC) AND K.TypeId = 30 AND SoItem.typeId != 30 AND K.SoId = SoItem.SoId ORDER BY K.SoLineItem ASC LIMIT 1)
  ) AND PSI.PostSoId = PostSo.Id
  LEFT JOIN Product ON Product.Id = SoItem.ProductId
  LEFT JOIN ProductTree ON ProductTree.Id = (SELECT ProductToTree.ProductTreeId FROM ProductToTree WHERE ProductToTree.ProductId = Product.Id ORDER BY ProductToTree.Id ASC LIMIT 1)
  LEFT JOIN Customer ON Customer.Id = So.CustomerId
  LEFT JOIN SysUser ON SysUser.Id = Customer.DefaultSalesManId
  LEFT JOIN AccountGroup ON AccountGroup.Id = (SELECT AccountGroupRelation.GroupId FROM AccountGroupRelation WHERE AccountGroupRelation.AccountId = Customer.AccountId ORDER BY AccountGroupRelation.AccountId ASC LIMIT 1)`;

function buildFilterConditions() {
  const cg   = document.getElementById('filterCustomerGroup').value;
  const cat  = document.getElementById('filterProductCategory').value;
  const sp   = document.getElementById('filterSalesperson').value;
  const mg   = document.getElementById('filterMargin').value;

  let w = `WHERE ${getDateCondition()} AND SoItem.typeId NOT IN (30,40)`;
  if (cg  !== '%') w += ` AND AccountGroup.Name = '${escSQL(cg)}'`;
  if (cat !== '%') w += ` AND ProductTree.Name = '${escSQL(cat)}'`;
  if (sp  !== '%' && !isNaN(parseInt(sp))) w += ` AND So.salesmanId = ${parseInt(sp)}`;

  if (mg === 'good')   { const me = `((${REV_EXPR}) - PostSoItem.PostedTotalCost) / NULLIF(${REV_EXPR},0)`; w += ` AND ${me} >= 0.30`; }
  if (mg === 'medium') { const me = `((${REV_EXPR}) - PostSoItem.PostedTotalCost) / NULLIF(${REV_EXPR},0)`; w += ` AND ${me} >= 0.15 AND ${me} < 0.30`; }
  if (mg === 'low')    { const me = `((${REV_EXPR}) - PostSoItem.PostedTotalCost) / NULLIF(${REV_EXPR},0)`; w += ` AND ${me} < 0.15`; }
  return w;
}

// ============================================================
// 6.  DATA CACHE
// ============================================================
let _qcache = {};

function qget(key, fn) {
  if (!_qcache[key]) _qcache[key] = fn();
  return _qcache[key];
}

function qclear() { _qcache = {}; }

// Query functions (each uses cache keyed on filter state)
const Q = {
  kpis: () => qget('kpis', () => {
    const sql = `SELECT SUM(${REV_EXPR}) as total_revenue, SUM(PostSoItem.PostedTotalCost) as total_cogs, COUNT(DISTINCT So.Num) as order_count, AVG(${MARGIN_EXPR}) as avg_margin ${BASE_JOIN} ${buildFilterConditions()}`;
    return runQueryLogged('KPIs', sql);
  }),

  monthly: () => qget('monthly', () => {
    const sql = `SELECT DATE_FORMAT(PostSo.DateCreated,'%Y-%m-01') as month, SUM(${REV_EXPR}) as revenue, SUM(PostSoItem.PostedTotalCost) as cogs, AVG(${MARGIN_EXPR}) as avg_margin ${BASE_JOIN} ${buildFilterConditions()} GROUP BY month ORDER BY month ASC`;
    return runQueryLogged('Monthly Revenue', sql);
  }),

  topCustomers: () => qget('topCustomers', () => {
    const sql = `SELECT Customer.Name as name, SUM(${REV_EXPR}) as revenue, COUNT(DISTINCT So.Num) as orders, AVG(${MARGIN_EXPR}) as avg_margin ${BASE_JOIN} ${buildFilterConditions()} GROUP BY Customer.Name ORDER BY revenue DESC LIMIT 10`;
    return runQueryLogged('Top Customers', sql);
  }),

  topProducts: () => qget('topProducts', () => {
    const sql = `SELECT Product.Num as name, Product.Description as desc_text, SUM(IF(SoItem.typeId IN (20,21), PostSoItem.Qty*-1, PostSoItem.Qty)) as qty, SUM(${REV_EXPR}) as revenue ${BASE_JOIN} ${buildFilterConditions()} GROUP BY Product.Num, Product.Description ORDER BY qty DESC LIMIT 10`;
    return runQueryLogged('Top Products', sql);
  }),

  categoryMix: () => qget('categoryMix', () => {
    const sql = `SELECT COALESCE(ProductTree.Name,'No Category') as name, SUM(${REV_EXPR}) as revenue ${BASE_JOIN} ${buildFilterConditions()} GROUP BY name ORDER BY revenue DESC LIMIT 8`;
    return runQueryLogged('Category Mix', sql);
  }),

  customerGroups: () => qget('customerGroups', () => {
    const sql = `SELECT COALESCE(AccountGroup.Name,'No Group') as name, SUM(${REV_EXPR}) as revenue ${BASE_JOIN} ${buildFilterConditions()} GROUP BY name ORDER BY revenue DESC LIMIT 8`;
    return runQueryLogged('Customer Groups', sql);
  }),

  topSalespeople: () => qget('topSalespeople', () => {
    const sql = `SELECT COALESCE(NULLIF(TRIM(CONCAT(SalesUser.FirstName,' ',SalesUser.LastName)),''),SalesUser.userName) as name, SUM(${REV_EXPR}) as revenue, COUNT(DISTINCT So.Num) as orders, AVG(${MARGIN_EXPR}) as avg_margin FROM PostSo JOIN PostSoItem ON PostSoItem.PostSoId = PostSo.Id JOIN SoItem ON SoItem.Id = PostSoItem.SoItemId JOIN So ON So.Id = SoItem.SoId JOIN SysUser AS SalesUser ON SalesUser.Id = So.salesmanId LEFT JOIN PostSoItem PSI ON PSI.SoItemId = COALESCE((SELECT K.Id FROM SoItem K WHERE K.SoLineItem = SoItem.SoLineItem+1 AND K.TypeId = 30 AND SoItem.typeId != 30 AND K.SoId = SoItem.SoId ORDER BY K.SoLineItem ASC LIMIT 1),(SELECT K.Id FROM SoItem K WHERE K.SoLineItem > SoItem.SoLineItem AND EXISTS (SELECT 1 FROM SoItem J WHERE J.TypeId = 40 AND J.SoId = K.SoId AND J.SoLineItem >= K.SoLineItem-1 ORDER BY J.SoLineItem ASC) AND K.TypeId = 30 AND SoItem.typeId != 30 AND K.SoId = SoItem.SoId ORDER BY K.SoLineItem ASC LIMIT 1)) AND PSI.PostSoId = PostSo.Id LEFT JOIN Product ON Product.Id = SoItem.ProductId LEFT JOIN ProductTree ON ProductTree.Id = (SELECT ProductToTree.ProductTreeId FROM ProductToTree WHERE ProductToTree.ProductId = Product.Id ORDER BY ProductToTree.Id ASC LIMIT 1) LEFT JOIN Customer ON Customer.Id = So.CustomerId LEFT JOIN AccountGroup ON AccountGroup.Id = (SELECT AccountGroupRelation.GroupId FROM AccountGroupRelation WHERE AccountGroupRelation.AccountId = Customer.AccountId ORDER BY AccountGroupRelation.AccountId ASC LIMIT 1) ${buildFilterConditions()} GROUP BY So.salesmanId, SalesUser.FirstName, SalesUser.LastName ORDER BY revenue DESC LIMIT 8`;
    return runQueryLogged('Top Salespeople', sql);
  }),

  lowMargin: () => qget('lowMargin', () => {
    const sql = `SELECT Customer.Name as name, SUM(${REV_EXPR}) as revenue, AVG(${MARGIN_EXPR}) as avg_margin, COUNT(DISTINCT So.Num) as orders ${BASE_JOIN} ${buildFilterConditions()} GROUP BY Customer.Name HAVING avg_margin < 0.15 AND avg_margin > -1 ORDER BY avg_margin ASC LIMIT 10`;
    return runQueryLogged('Low Margin Customers', sql);
  }),

  highValue: () => qget('highValue', () => {
    const sql = `SELECT So.Num as name, Customer.Name as customer, SUM(${REV_EXPR}) as revenue, AVG(${MARGIN_EXPR}) as avg_margin ${BASE_JOIN} ${buildFilterConditions()} GROUP BY So.Num, Customer.Name HAVING revenue > 10000 ORDER BY revenue DESC LIMIT 15`;
    return runQueryLogged('High Value Orders', sql);
  }),

  ordersPerSalesperson: () => qget('ordersSP', () => {
    const sql = `SELECT COALESCE(NULLIF(TRIM(CONCAT(SalesUser.FirstName,' ',SalesUser.LastName)),''),SalesUser.userName) as name, COUNT(DISTINCT So.Num) as orders, SUM(${REV_EXPR}) as revenue FROM PostSo JOIN PostSoItem ON PostSoItem.PostSoId = PostSo.Id JOIN SoItem ON SoItem.Id = PostSoItem.SoItemId JOIN So ON So.Id = SoItem.SoId JOIN SysUser AS SalesUser ON SalesUser.Id = So.salesmanId LEFT JOIN PostSoItem PSI ON PSI.SoItemId = COALESCE((SELECT K.Id FROM SoItem K WHERE K.SoLineItem = SoItem.SoLineItem+1 AND K.TypeId = 30 AND SoItem.typeId != 30 AND K.SoId = SoItem.SoId ORDER BY K.SoLineItem ASC LIMIT 1),(SELECT K.Id FROM SoItem K WHERE K.SoLineItem > SoItem.SoLineItem AND EXISTS (SELECT 1 FROM SoItem J WHERE J.TypeId = 40 AND J.SoId = K.SoId AND J.SoLineItem >= K.SoLineItem-1 ORDER BY J.SoLineItem ASC) AND K.TypeId = 30 AND SoItem.typeId != 30 AND K.SoId = SoItem.SoId ORDER BY K.SoLineItem ASC LIMIT 1)) AND PSI.PostSoId = PostSo.Id LEFT JOIN Customer ON Customer.Id = So.CustomerId LEFT JOIN AccountGroup ON AccountGroup.Id = (SELECT AccountGroupRelation.GroupId FROM AccountGroupRelation WHERE AccountGroupRelation.AccountId = Customer.AccountId ORDER BY AccountGroupRelation.AccountId ASC LIMIT 1) ${buildFilterConditions()} GROUP BY So.salesmanId, SalesUser.FirstName, SalesUser.LastName ORDER BY orders DESC LIMIT 8`;
    return runQueryLogged('Orders per Salesperson', sql);
  })
};

const _ttip = document.getElementById('ttip');
function showTip(ev, html) {
  _ttip.innerHTML = html;
  _ttip.style.opacity = '1';
  moveTip(ev);
}
function moveTip(ev) {
  const x = ev.clientX + 14, y = ev.clientY - 10;
  _ttip.style.left = (x + 260 > window.innerWidth ? ev.clientX - 274 : x) + 'px';
  _ttip.style.top  = (y + 120 > window.innerHeight ? ev.clientY - 130 : y) + 'px';

function renderSkeleton(el) {
  el.innerHTML = '<div class="tile-skel"><div class="tile-skel-spin"></div><span class="tile-skel-lbl">Loading…</span></div>';
}

// ── KPI ─────────────────────────────────────────────────────
async function renderKPI(el, kpiKey) {
  debugLog(`Rendering KPI: ${kpiKey}`, 'info');
  renderSkeleton(el);
  const rows = await Q.kpis();
  const k = rows[0] || {};
  const rev    = parseFloat(k.total_revenue || 0);
  const cogs   = parseFloat(k.total_cogs    || 0);
  const orders = parseInt(k.order_count     || 0);
  const margin = parseFloat(k.avg_margin    || 0);
  const avgord = orders > 0 ? rev / orders : 0;

  let val, label, color;
  switch (kpiKey) {
    case 'revenue':    val = fmt$(rev, true);         label = 'Total Revenue';    color = '#2d9cdb'; break;
    case 'cogs':       val = fmt$(cogs, true);        label = 'Cost of Goods';    color = '#ef4444'; break;
    case 'grossprofit':val = fmt$(rev-cogs, true);    label = 'Gross Profit';     color = '#10b981'; break;
    case 'orders':     val = fmtNum(orders);          label = 'Total Orders';     color = '#8b5cf6'; break;
    case 'avgorder':   val = fmt$(avgord, true);      label = 'Avg Order Value';  color = '#f59e0b'; break;
    case 'avgmargin':  val = fmtPct(margin);          label = 'Avg Gross Margin'; color = margin >= 0.30 ? '#10b981' : margin >= 0.15 ? '#f59e0b' : '#ef4444'; break;
    default: val = '—'; label = kpiKey; color = '#64748b';
  }

  debugLog(`KPI ${kpiKey}: ${val}`, 'success');
  el.innerHTML = `<div class="kpi-root">
    <div class="kpi-value" style="color:${color};">${val}</div>
    <div class="kpi-label">${label}</div>
    <div class="kpi-accent" style="background:${color};"></div>
  </div>`;
}

// ── Time-series (bar or line + margin overlay) ───────────────
async function renderTimeSeries(el, cfg) {
  debugLog(`Rendering Monthly Revenue (mode: ${(cfg&&cfg.chartType)||'bar'})`, 'info');
  renderSkeleton(el);
  const raw = await Q.monthly();
  if (!raw.length) { debugLog('Monthly Revenue: no data for period', 'warning'); el.innerHTML = '<div class="tile-skel"><span class="tile-skel-lbl">No data for period</span></div>'; return; }
  debugLog(`Monthly Revenue: rendering ${raw.length} months`, 'success');

  el.innerHTML = '';
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 80 || H < 50) return;

  const mode = (cfg && cfg.chartType) || 'bar';
  const m    = { top:12, right:56, bottom:42, left:70 };
  const iw   = W - m.left - m.right;
  const ih   = H - m.top  - m.bottom;
  if (iw < 20 || ih < 20) return;

  const data = raw.map(d => ({ month: d.month, revenue: parseFloat(d.revenue||0), cogs: parseFloat(d.cogs||0), avg_margin: parseFloat(d.avg_margin||0) }));

  const svg = d3.select(el).append('svg').attr('width',W).attr('height',H).style('overflow','hidden').append('g').attr('transform',`translate(${m.left},${m.top})`);

  const xBand = d3.scaleBand().domain(data.map(d=>d.month)).range([0,iw]).padding(0.25);
  const yRev  = d3.scaleLinear().domain([0, d3.max(data,d=>d.revenue)*1.18]).nice().range([ih,0]);
  const yMarg = d3.scaleLinear().domain([0,0.65]).range([ih,0]);

  // gridlines
  svg.append('g').selectAll('line').data(yRev.ticks(5)).join('line').attr('class','grid-line').attr('x1',0).attr('x2',iw).attr('y1',d=>yRev(d)).attr('y2',d=>yRev(d));

  if (mode === 'bar') {
    svg.selectAll('.rev-bar').data(data).join('rect').attr('class','rev-bar')
      .attr('x',d=>xBand(d.month)).attr('y',d=>yRev(d.revenue))
      .attr('width',xBand.bandwidth()).attr('height',d=>Math.max(0,ih-yRev(d.revenue)))
      .attr('fill','#2d9cdb').attr('rx',3).attr('opacity',0.85)
      .on('mouseover',(ev,d)=>showTip(ev,`<strong>${moment(d.month).format('MMM YYYY')}</strong><br>Revenue: ${fmt$(d.revenue)}<br>COGS: ${fmt$(d.cogs)}<br>Margin: ${fmtPct(d.avg_margin)}`))
      .on('mousemove',moveTip).on('mouseout',hideTip);
  } else {
    const linePath = d3.line().x(d=>xBand(d.month)+xBand.bandwidth()/2).y(d=>yRev(d.revenue)).curve(d3.curveMonotoneX);
    svg.append('path').datum(data).attr('fill','none').attr('stroke','#2d9cdb').attr('stroke-width',2.5).attr('d',linePath);
    svg.append('path').datum(data).attr('fill','#2d9cdb').attr('opacity',0.08)
      .attr('d', d3.area().x(d=>xBand(d.month)+xBand.bandwidth()/2).y0(ih).y1(d=>yRev(d.revenue)).curve(d3.curveMonotoneX));
    svg.selectAll('.rv-dot').data(data).join('circle').attr('class','rv-dot')
      .attr('cx',d=>xBand(d.month)+xBand.bandwidth()/2).attr('cy',d=>yRev(d.revenue))
      .attr('r',4).attr('fill','white').attr('stroke','#2d9cdb').attr('stroke-width',2)
      .on('mouseover',(ev,d)=>showTip(ev,`<strong>${moment(d.month).format('MMM YYYY')}</strong><br>Revenue: ${fmt$(d.revenue)}<br>Margin: ${fmtPct(d.avg_margin)}`))
      .on('mousemove',moveTip).on('mouseout',hideTip);
  }

  // Margin % line overlay
  const margLine = d3.line().x(d=>xBand(d.month)+xBand.bandwidth()/2).y(d=>yMarg(d.avg_margin)).curve(d3.curveMonotoneX);
  svg.append('path').datum(data).attr('fill','none').attr('stroke','#f59e0b').attr('stroke-width',2).attr('stroke-dasharray','5,4').attr('d',margLine);
  svg.selectAll('.mg-dot').data(data).join('circle').attr('class','mg-dot')
    .attr('cx',d=>xBand(d.month)+xBand.bandwidth()/2).attr('cy',d=>yMarg(d.avg_margin))
    .attr('r',3).attr('fill','white').attr('stroke','#f59e0b').attr('stroke-width',1.5);

  // Axes
  svg.append('g').attr('class','axis').attr('transform',`translate(0,${ih})`).call(d3.axisBottom(xBand).tickFormat(d=>moment(d).format('MMM YY'))).selectAll('text').attr('transform','rotate(-40)').style('text-anchor','end');
  svg.append('g').attr('class','axis').call(d3.axisLeft(yRev).ticks(5).tickFormat(d=>'$'+d3.format('.2s')(d)));
  svg.append('g').attr('class','axis').attr('transform',`translate(${iw},0)`).call(d3.axisRight(yMarg).ticks(4).tickFormat(d=>(d*100).toFixed(0)+'%'));

  // Legend
  const lgx = iw - 120, lgy = -2;
  [{ c:'#2d9cdb', lbl:'Revenue', dash:false },{ c:'#f59e0b', lbl:'Margin %', dash:true }].forEach((l,i)=>{
    const g = svg.append('g').attr('transform',`translate(${lgx + i*64},${lgy})`);
    if (l.dash) g.append('line').attr('x1',0).attr('x2',14).attr('y1',5).attr('y2',5).attr('stroke',l.c).attr('stroke-width',2).attr('stroke-dasharray','4,3');
    else g.append('rect').attr('width',12).attr('height',7).attr('rx',2).attr('fill',l.c).attr('y',2);
    g.append('text').attr('x',18).attr('y',9).style('fill','#64748b').style('font-size','9px').text(l.lbl);
  });
}

// ── Horizontal Bar ───────────────────────────────────────────
async function renderHorizBar(el, dataFn, opts={}) {
  debugLog(`Rendering horizontal bar chart`, 'info');
  renderSkeleton(el);
  const raw = await dataFn();
  if (!raw.length) { debugLog('Horizontal bar: no data for period', 'warning'); el.innerHTML = '<div class="tile-skel"><span class="tile-skel-lbl">No data for period</span></div>'; return; }
  debugLog(`Horizontal bar: rendering ${raw.length} rows`, 'success');

  el.innerHTML = '';
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 80 || H < 50) return;

  const data = raw.map(d => ({ name: d.name, value: parseFloat(d.revenue || d.orders || d.qty || 0), meta: d }));
  const m  = { top:6, right:84, bottom:18, left: Math.min(120, W*0.32) };
  const iw = W - m.left - m.right;
  const ih = H - m.top  - m.bottom;
  if (iw < 20 || ih < 20) return;

  const svg = d3.select(el).append('svg').attr('width',W).attr('height',H).style('overflow','hidden').append('g').attr('transform',`translate(${m.left},${m.top})`);

  const x = d3.scaleLinear().domain([0, d3.max(data,d=>d.value)||1]).nice().range([0,iw]);
  const y = d3.scaleBand().domain(data.map(d=>d.name)).range([0,ih]).padding(0.22);

  svg.append('g').selectAll('line').data(x.ticks(4)).join('line').attr('class','grid-line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',0).attr('y2',ih);

  svg.selectAll('.bar').data(data).join('rect').attr('class','bar')
    .attr('x',0).attr('y',d=>y(d.name))
    .attr('width',d=>Math.max(1,x(d.value))).attr('height',y.bandwidth())
    .attr('rx',3)
    .attr('fill',(d,i)=>{
      if (opts.colorMode === 'margin' && d.meta) {
        const mg = parseFloat(d.meta.avg_margin||0);
        return mg >= 0.30 ? '#10b981' : mg >= 0.15 ? '#f59e0b' : '#ef4444';
      }
      return COLOR_PALETTE[i % COLOR_PALETTE.length];
    })
    .style('cursor', opts.clickable ? 'pointer' : 'default')
    .on('mouseover',(ev,d)=>{
      const fmtV = opts.fmt === 'count' ? fmtNum(d.value) : fmt$(d.value);
      const mgStr = d.meta.avg_margin != null ? `<br>Margin: ${fmtPct(d.meta.avg_margin)}` : '';
      const ordStr = d.meta.orders != null ? `<br>Orders: ${fmtNum(d.meta.orders)}` : '';
      showTip(ev, `<strong>${d.name}</strong><br>${fmtV}${ordStr}${mgStr}`);
    })
    .on('mousemove',moveTip).on('mouseout',hideTip)
    .on('click', opts.clickable ? ((ev,d) => opts.clickable(d)) : null);

  // Value labels
  svg.selectAll('.val-lbl').data(data).join('text').attr('class','val-lbl')
    .attr('x',d=>x(d.value)+4).attr('y',d=>y(d.name)+y.bandwidth()/2)
    .attr('dy','0.35em').style('fill','#94a3b8').style('font-size','9px')
    .text(d => opts.fmt === 'count' ? fmtNum(d.value) : fmt$(d.value, true));

  svg.append('g').attr('class','axis').attr('transform',`translate(0,${ih})`).call(d3.axisBottom(x).ticks(4).tickFormat(d=>opts.fmt==='count' ? d3.format('.2s')(d) : '$'+d3.format('.2s')(d)));
  svg.append('g').attr('class','axis').call(d3.axisLeft(y).tickFormat(d=>d.length>15?d.slice(0,14)+'…':d)).selectAll('text').style('font-size','10px');
}

// ── Donut ────────────────────────────────────────────────────
async function renderDonut(el, dataFn) {
  debugLog(`Rendering donut chart`, 'info');
  renderSkeleton(el);
  const raw = await dataFn();
  if (!raw.length) { debugLog('Donut: no data for period', 'warning'); el.innerHTML = '<div class="tile-skel"><span class="tile-skel-lbl">No data for period</span></div>'; return; }
  debugLog(`Donut: rendering ${raw.length} segments`, 'success');

  el.innerHTML = '';
  const W = el.clientWidth, H = el.clientHeight;
  if (W < 80 || H < 50) return;

  const data  = raw.map(d => ({ name: d.name, value: parseFloat(d.revenue||0) }));
  const total = d3.sum(data,d=>d.value) || 1;
  const csz   = Math.min(W*0.48, H-4, 220);
  const r     = csz/2;
  const color = d3.scaleOrdinal().domain(data.map(d=>d.name)).range(COLOR_PALETTE);

  const wrap = d3.select(el).append('div').style('display','flex').style('align-items','center').style('gap','10px').style('height','100%').style('overflow','hidden').style('padding','4px 8px');
  const svgWrap = wrap.append('div').style('flex-shrink','0');
  const legWrap = wrap.append('div').style('flex','1').style('overflow-y','auto').style('min-width','0');

  const svg = svgWrap.append('svg').attr('width',csz).attr('height',csz).append('g').attr('transform',`translate(${r},${r})`);
  const arc     = d3.arc().innerRadius(r*.44).outerRadius(r*.84);
  const arcHov  = d3.arc().innerRadius(r*.44).outerRadius(r*.92);
  const pie     = d3.pie().value(d=>d.value).sort(null);

  svg.selectAll('path').data(pie(data)).join('path').attr('d',arc)
    .attr('fill',d=>color(d.data.name)).attr('stroke','white').attr('stroke-width',2)
    .on('mouseover', function(ev,d){
      d3.select(this).transition().duration(100).attr('d',arcHov);
      showTip(ev,`<strong>${d.data.name}</strong><br>${fmt$(d.data.value)}<br>${(d.data.value/total*100).toFixed(1)}% of total`);
    })
    .on('mousemove',moveTip).on('mouseout', function(){ d3.select(this).transition().duration(100).attr('d',arc); hideTip(); });

  svg.selectAll('text.pct').data(pie(data)).join('text').attr('class','pct')
    .attr('transform',d=>`translate(${arc.centroid(d)})`).attr('text-anchor','middle')
    .style('fill','white').style('font-size',Math.max(8,Math.min(11,r/5))+'px').style('font-weight','700').style('pointer-events','none')
    .text(d=>(d.data.value/total*100)>6?(d.data.value/total*100).toFixed(0)+'%':'');

  data.forEach(d=>{
    const row = legWrap.append('div').style('display','flex').style('align-items','center').style('gap','6px').style('margin-bottom','5px').style('font-size','10px');
    row.append('div').style('width','9px').style('height','9px').style('background',color(d.name)).style('border-radius','2px').style('flex-shrink','0');
    row.append('span').style('color','#64748b').style('line-height','1.3').text(`${d.name} (${fmt$(d.value,true)})`);
  });
}

// ── Sortable table ───────────────────────────────────────────
async function renderSortableTable(el, dataFn, columns) {
  debugLog(`Rendering sortable table (${columns.length} columns)`, 'info');
  renderSkeleton(el);
  const raw = await dataFn();
  debugLog(`Sortable table: ${raw.length} rows`, raw.length ? 'success' : 'warning');
  el.innerHTML = '';

  let data = [...raw], sortKey = null, sortDir = 'asc';

  const scroll = document.createElement('div');
  scroll.style.cssText = 'height:100%;overflow:auto;';
  el.appendChild(scroll);

  const tbl  = document.createElement('table'); tbl.className = 'data-table';
  const thead = document.createElement('thead');
  const hrow  = document.createElement('tr');

  columns.forEach(col => {
    const th = document.createElement('th');
    th.innerHTML = `${col.label} <span style="color:#d1d5db;font-size:8px;">↕</span>`;
    th.addEventListener('click', () => {
      if (sortKey === col.key) sortDir = sortDir === 'asc' ? 'desc' : 'asc';
      else { sortKey = col.key; sortDir = 'asc'; }
      data.sort((a,b) => {
        const av = a[col.key], bv = b[col.key];
        const nv = parseFloat(av) - parseFloat(bv);
        if (!isNaN(nv)) return sortDir === 'asc' ? nv : -nv;
        return sortDir === 'asc' ? String(av).localeCompare(String(bv)) : String(bv).localeCompare(String(av));
      });
      hrow.querySelectorAll('th span').forEach(s => s.innerHTML = '<span style="color:#d1d5db;font-size:8px;">↕</span>');
      th.querySelector('span').innerHTML = `<span style="color:#475569;font-size:8px;">${sortDir==='asc'?'↑':'↓'}</span>`;
      renderRows();
    });
    hrow.appendChild(th);
  });
  thead.appendChild(hrow);

  const tbody = document.createElement('tbody');

  function renderRows() {
    tbody.innerHTML = '';
    if (!data.length) {
      const tr = document.createElement('tr');
      tr.innerHTML = `<td colspan="${columns.length}" style="text-align:center;color:#94a3b8;padding:20px;">No data for period</td>`;
      tbody.appendChild(tr); return;
    }
    data.forEach(row => {
      const tr = document.createElement('tr');
      columns.forEach(col => {
        const td = document.createElement('td');
        const v  = row[col.key];
        if      (col.fmt === 'currency') td.textContent = fmt$(v);
        else if (col.fmt === 'percent')  {
          const pct = parseFloat(v||0)*100;
          td.textContent = pct.toFixed(1)+'%';
          if (col.colorCode) { td.style.fontWeight='600'; td.style.color = pct>=30?'#10b981':pct>=15?'#f59e0b':'#ef4444'; }
        }
        else if (col.fmt === 'count')    td.textContent = fmtNum(v);
        else if (col.fmt === 'date')     td.textContent = fmtDate(v);
        else if (col.fmt === 'solink')   { td.innerHTML = `<span class="order-link" onclick="openModule('Sales Order','${escSQL(String(v))}')">${v||'—'}</span>`; }
        else td.textContent = v ?? '—';
        tr.appendChild(td);
      });
      tbody.appendChild(tr);
    });
  }

  tbl.appendChild(thead); tbl.appendChild(tbody);
  scroll.appendChild(tbl);
  renderRows();
}

let grid = null;
const widgetStore = new Map();

function buildWidgetContent(type, cfg) {
  const reg = WIDGET_REGISTRY[type];
  const activeLine = (cfg.chartType || 'bar') === 'line';
  const toggleHTML = reg.hasChartToggle ? `
    <div style="display:flex;gap:2px;margin-right:2px;">
      <button class="chart-toggle-btn ${!activeLine?'active':''}" data-chart="bar" title="Bar Chart">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="12" width="4" height="9" rx="1"/><rect x="10" y="7" width="4" height="14" rx="1"/><rect x="17" y="3" width="4" height="18" rx="1"/></svg>
      </button>
      <button class="chart-toggle-btn ${activeLine?'active':''}" data-chart="line" title="Line Chart">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 7"/></svg>
      </button>
    </div>` : '';

  return `<div class="widget-wrapper">
    <div class="widget-header">
      <div class="widget-drag-handle">
        <svg width="13" height="13" viewBox="0 0 14 14" fill="currentColor">
          <circle cx="4" cy="3.5" r="1.2"/><circle cx="10" cy="3.5" r="1.2"/>
          <circle cx="4" cy="7"   r="1.2"/><circle cx="10" cy="7"   r="1.2"/>
          <circle cx="4" cy="10.5" r="1.2"/><circle cx="10" cy="10.5" r="1.2"/>
        </svg>
      </div>
      <span class="widget-title">${reg.title}</span>
      ${toggleHTML}
      <button class="widget-remove" title="Remove widget">
        <svg width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
      </button>
    </div>
    <div class="widget-body"></div>
  </div>`;
}

function addWidget(type, cfg={}, pos={}) {
  debugLog(`Adding widget: ${type}`, 'info');
  const reg = WIDGET_REGISTRY[type];
  if (!reg) { debugLog(`Unknown widget type: ${type}`, 'error'); return null; }

  const opts = { w: pos.w || reg.defaultW, h: pos.h || reg.defaultH, content: buildWidgetContent(type, cfg) };
  if (pos.x !== undefined) opts.x = pos.x;
  if (pos.y !== undefined) opts.y = pos.y;

  const el     = grid.addWidget(opts);
  const bodyEl = el.querySelector('.widget-body');
  const state  = { type, config:{...cfg}, bodyEl, reg };
  widgetStore.set(el, state);
  el.dataset.widgetType   = type;
  el.dataset.widgetConfig = JSON.stringify(cfg);

  el.querySelector('.widget-remove').addEventListener('click', () => {
    grid.removeWidget(el); widgetStore.delete(el);
  });

  el.querySelectorAll('.chart-toggle-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.config.chartType = btn.dataset.chart;
      el.dataset.widgetConfig = JSON.stringify(state.config);
      el.querySelectorAll('.chart-toggle-btn').forEach(b => b.classList.toggle('active', b.dataset.chart === state.config.chartType));
      doRender(el);
    });
  });

  requestAnimationFrame(() => requestAnimationFrame(() => doRender(el)));
  return el;
}

async function doRender(el) {
  const state = widgetStore.get(el);
  if (!state) return;
  debugLog(`Re-rendering: ${state.type}`, 'info');
  state.bodyEl.innerHTML = '';
  try {
    await state.reg.render(state.bodyEl, state.config);
  } catch(e) {
    debugLog(`Render error (${state.type}): ${e.message}`, 'error');
    console.error('doRender error:', e);
  }
}

function rerenderAll() {
  widgetStore.forEach((_, el) => doRender(el));
}

let _lastKpiData = {};
let _dragBadgeKey = null;

async function updateKPIBadges() {
  const rows = await Q.kpis();
  _lastKpiData = (rows && rows[0]) || {};
  renderBadges(_lastKpiData);
}

function renderBadges(k) {
  const el = document.getElementById('kpiBadges');
  if (!el) return;
  el.style.display = 'flex';
  el.innerHTML = '';

  _badgeConfig.forEach(key => {
    const meta = BADGE_META[key];
    if (!meta) return;
    const color = meta.colorFn ? meta.colorFn(k) : meta.color;
    const val   = k && Object.keys(k).length ? meta.get(k) : '—';

    const div = document.createElement('div');
    div.className = 'kpi-badge';
    div.dataset.badgeKey = key;
    div.draggable = true;
    div.innerHTML = `<div class="kpi-badge-val" style="color:${color};">${val}</div><div class="kpi-badge-lbl">${meta.label}</div><button class="badge-remove" title="Remove badge">✕</button>`;

    div.querySelector('.badge-remove').addEventListener('click', () => {
      _badgeConfig = _badgeConfig.filter(k2 => k2 !== key);
      renderBadges(k);
    });

    div.addEventListener('dragstart', e => {
      if (isLocked) { e.preventDefault(); return; }
      _dragBadgeKey = key;
      e.dataTransfer.effectAllowed = 'move';
      setTimeout(() => div.style.opacity = '0.4', 0);
    });
    div.addEventListener('dragend', () => {
      div.style.opacity = '';
      el.querySelectorAll('.kpi-badge').forEach(b => b.classList.remove('drag-over'));
    });
    div.addEventListener('dragover', e => {
      if (isLocked) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      div.classList.add('drag-over');
    });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => {
      e.preventDefault();
      div.classList.remove('drag-over');
      if (!_dragBadgeKey || _dragBadgeKey === key) return;
      const fi = _badgeConfig.indexOf(_dragBadgeKey);
      const ti = _badgeConfig.indexOf(key);
      if (fi < 0 || ti < 0) return;
      _badgeConfig.splice(fi, 1);
      _badgeConfig.splice(ti, 0, _dragBadgeKey);
      _dragBadgeKey = null;
      renderBadges(k);
    });

    el.appendChild(div);
  });

  // "+" add button — CSS hides it when locked
  const addBtn = document.createElement('button');
  addBtn.className = 'badge-add-btn';
  addBtn.title = 'Add KPI badge';
  addBtn.innerHTML = '<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>';
  addBtn.addEventListener('click', ev => { ev.stopPropagation(); openBadgePicker(addBtn, k); });
  el.appendChild(addBtn);
}

function openBadgePicker(anchor, k) {
  const existing = document.getElementById('_badgePop');
  if (existing) { existing.remove(); return; }
  const available = Object.keys(BADGE_META).filter(key => !_badgeConfig.includes(key));
  if (!available.length) return;

  const pop = document.createElement('div');
  pop.id = '_badgePop';
  pop.style.cssText = 'position:fixed;background:white;border:1px solid #e2e8f0;border-radius:10px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.15);z-index:5000;display:flex;flex-direction:column;gap:2px;min-width:128px;';

  available.forEach(key => {
    const meta = BADGE_META[key];
    const btn = document.createElement('button');
    btn.style.cssText = 'padding:5px 10px;background:none;border:none;border-radius:6px;text-align:left;cursor:pointer;font-size:12px;color:#475569;transition:background .1s;display:flex;align-items:center;gap:7px;';
    const dot = document.createElement('span');
    dot.style.cssText = `width:8px;height:8px;border-radius:50%;background:${meta.color||'#10b981'};flex-shrink:0;display:inline-block;`;
    btn.appendChild(dot);
    btn.appendChild(document.createTextNode(meta.label));
    btn.onmouseover = () => btn.style.background = '#f1f5f9';
    btn.onmouseout  = () => btn.style.background = 'none';
    btn.addEventListener('click', () => { _badgeConfig.push(key); pop.remove(); renderBadges(k); });
    pop.appendChild(btn);
  });

  const rect = anchor.getBoundingClientRect();
  pop.style.top  = (rect.bottom + 4) + 'px';
  pop.style.left = rect.left + 'px';
  document.body.appendChild(pop);
  setTimeout(() => document.addEventListener('click', function h(e) {
    if (!pop.contains(e.target)) { pop.remove(); document.removeEventListener('click', h); }
  }), 0);
}

async function openCustomerDrilldown(customerName) {
  debugLog(`Opening drilldown for customer: "${customerName}"`, 'click');
  document.getElementById('ddTitle').textContent    = customerName;
  document.getElementById('ddSubtitle').textContent = 'Orders in selected period';
  document.getElementById('ddHead').innerHTML = '<tr><th>Order #</th><th>Date</th><th>Revenue</th><th>Margin</th></tr>';
  document.getElementById('ddBody').innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:#94a3b8;">Loading…</td></tr>';
  document.getElementById('drilldownModal').classList.add('show');

  const dr = getDateRange();
  const dateCond = dr.start && dr.end ? `PostSo.DateCreated >= '${dr.start}' AND PostSo.DateCreated <= '${dr.end} 23:59:59'` : `PostSo.DateCreated >= DATE_SUB(NOW(), INTERVAL 365 DAY)`;
  const sql = `SELECT So.Num as num, DATE(PostSo.DateCreated) as date, SUM(${REV_EXPR}) as revenue, AVG(${MARGIN_EXPR}) as avg_margin ${BASE_JOIN} WHERE ${dateCond} AND SoItem.typeId NOT IN (30,40) AND Customer.Name = '${escSQL(customerName)}' GROUP BY So.Num, PostSo.DateCreated ORDER BY PostSo.DateCreated DESC LIMIT 50`;
  debugLog('Customer drilldown query executing', 'info');
  console.log('Customer Drilldown Query:', sql);
  const rows = await runQueryP(sql);
  debugLog(`Customer drilldown: ${rows.length} orders returned`, rows.length ? 'success' : 'warning');

  const tbody = document.getElementById('ddBody');
  if (!rows.length) { tbody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:16px;color:#94a3b8;">No orders found</td></tr>'; return; }

  tbody.innerHTML = rows.map(r => {
    const mg = parseFloat(r.avg_margin||0)*100;
    const mc = mg>=30?'#10b981':mg>=15?'#f59e0b':'#ef4444';
    return `<tr onclick="openModule('Sales Order','${escSQL(r.num)}')">
      <td><span class="order-link">${r.num}</span></td>
      <td>${fmtDate(r.date)}</td>
      <td>${fmt$(r.revenue)}</td>
      <td style="font-weight:600;color:${mc};">${mg.toFixed(1)}%</td>
    </tr>`;
  }).join('');
}

function closeDrilldown() { debugLog('Drilldown closed', 'info'); document.getElementById('drilldownModal').classList.remove('show'); }

async function loadFilters() {
  debugLog('Loading filter options…', 'info');
  try {
    const cgSql = `SELECT DISTINCT COALESCE(AccountGroup.Name,'No Group') as name FROM So JOIN Customer ON Customer.Id = So.CustomerId LEFT JOIN AccountGroup ON AccountGroup.Id = (SELECT AccountGroupRelation.GroupId FROM AccountGroupRelation WHERE AccountGroupRelation.AccountId = Customer.AccountId ORDER BY AccountGroupRelation.AccountId ASC LIMIT 1) ORDER BY name`;
    debugLog('Customer Groups filter query executing', 'info');
    console.log('Customer Groups filter query:', cgSql);
    const cg = await runQueryP(cgSql);
    debugLog(`Customer Groups filter: ${cg.length} options loaded`, cg.length ? 'success' : 'warning');
    const cgSel = document.getElementById('filterCustomerGroup');
    cg.forEach(r => { if (r.name) { const o = document.createElement('option'); o.value = r.name; o.textContent = r.name; cgSel.appendChild(o); } });

    const catSql = `SELECT DISTINCT COALESCE(ProductTree.Name,'No Category') as name FROM ProductToTree JOIN ProductTree ON ProductTree.Id = ProductToTree.ProductTreeId ORDER BY name`;
    debugLog('Product Categories filter query executing', 'info');
    console.log('Product Categories filter query:', catSql);
    const cats = await runQueryP(catSql);
    debugLog(`Product Categories filter: ${cats.length} options loaded`, cats.length ? 'success' : 'warning');
    const catSel = document.getElementById('filterProductCategory');
    cats.forEach(r => { if (r.name) { const o = document.createElement('option'); o.value = r.name; o.textContent = r.name; catSel.appendChild(o); } });

    const spSql = `SELECT DISTINCT SysUser.Id as id, COALESCE(NULLIF(TRIM(CONCAT(SysUser.FirstName,' ',SysUser.LastName)),''),SysUser.userName) as name FROM So JOIN SysUser ON SysUser.Id = So.salesmanId WHERE So.salesmanId IS NOT NULL ORDER BY name`;
    debugLog('Salespeople filter query executing', 'info');
    console.log('Salespeople filter query:', spSql);
    const sps = await runQueryP(spSql);
    debugLog(`Salespeople filter: ${sps.length} options loaded`, sps.length ? 'success' : 'warning');
    const spSel = document.getElementById('filterSalesperson');
    sps.forEach(r => { if (r.id && r.name) { const o = document.createElement('option'); o.value = r.id; o.textContent = r.name; spSel.appendChild(o); } });
  } catch(e) {
    debugLog(`loadFilters ERROR: ${e.message}`, 'error');
    console.error('loadFilters error:', e);
  }
}

function applyFilterState(state) {
  if (!state) return;
  const set = (id, val) => { const el = document.getElementById(id); if (el) el.value = val || '%'; };
  if (state.datePreset) document.getElementById('dateRangeFilter').value = state.datePreset;
  set('filterCustomerGroup',   state.customerGroup);
  set('filterProductCategory', state.productCategory);
  set('filterSalesperson',     state.salesperson);
  set('filterMargin',          state.margin);
  onDateRangeChange();
}

function onFilterChange() {
  debugLog('Filter changed — clearing cache and re-rendering', 'info');
  qclear();
  rerenderAll();
  updateKPIBadges();
  updateDateDisplay();
}

function clearAllFilters() {
  document.getElementById('filterCustomerGroup').value   = '%';
  document.getElementById('filterProductCategory').value = '%';
  document.getElementById('filterSalesperson').value     = '%';
  document.getElementById('filterMargin').value          = '%';
  onFilterChange();
}

function toggleFilters() {
  const panel = document.getElementById('filtersPanel');
  const btn   = document.getElementById('filtersToggleBtn');
  panel.classList.toggle('open');
  btn.style.background = panel.classList.contains('open') ? '#f0f9ff' : 'white';
  btn.style.borderColor = panel.classList.contains('open') ? '#bfdbfe' : '#e2e8f0';
  btn.style.color = panel.classList.contains('open') ? '#2563eb' : '#64748b';
}

function refreshDashboard() { qclear(); rerenderAll(); updateKPIBadges(); }

// ============================================================
// 16b. ADMIN CONTROLS
// ============================================================
function toggleUserEditing() {
  _userEditingAllowed = !_userEditingAllowed;
  _globalData.userEditing = _userEditingAllowed;
  try { saveReportData(JSON.stringify(_globalData)); } catch(e) {}
  updateAdminUI();
  showToast(_userEditingAllowed ? 'User editing enabled ✓' : 'User editing disabled ✓');
  debugLog('userEditing set to: ' + _userEditingAllowed, 'click');
}

function publishMasterLayout() {
  const layout = [];
  document.querySelectorAll('#myGrid .grid-stack-item').forEach(el => {
    const node = el.gridstackNode;
    if (!node || !el.dataset.widgetType) return;
    layout.push({ type: el.dataset.widgetType, cfg: JSON.parse(el.dataset.widgetConfig||'{}'), x: node.x, y: node.y, w: node.w, h: node.h });
  });
  _globalData.masterLayout = layout;
  _globalData.masterFilterState = {
    datePreset:      document.getElementById('dateRangeFilter').value,
    customerGroup:   document.getElementById('filterCustomerGroup').value,
    productCategory: document.getElementById('filterProductCategory').value,
    salesperson:     document.getElementById('filterSalesperson').value,
    margin:          document.getElementById('filterMargin').value
  };
  _globalData.masterBadgeConfig = [..._badgeConfig];
  _globalData.userEditing = _userEditingAllowed;
  try { saveReportData(JSON.stringify(_globalData)); } catch(e) {}
  debugLog(`Master layout published (${layout.length} widgets, userEditing: ${_userEditingAllowed})`, 'success');
  showToast('Master layout published ✓');
}

function updateAdminUI() {
  const btn = document.getElementById('userEditingBtn');
  if (!btn) return;
  if (_userEditingAllowed) {
    btn.style.cssText = 'padding:5px 9px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;border:1px solid #6ee7b7;background:#d1fae5;color:#065f46;';
    btn.innerHTML = '<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/></svg> Users: Can Edit';
  } else {
    btn.style.cssText = 'padding:5px 9px;border-radius:7px;font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;gap:4px;transition:all .15s;border:1px solid #fca5a5;background:#fee2e2;color:#991b1b;';
    btn.innerHTML = '<svg width="10" height="10" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg> Users: Read Only';
  }
}

// ============================================================
// 17. GRIDSTACK INIT
// ============================================================
function initGrid() {
  grid = GridStack.init({
    column:    12,
    cellHeight: 80,
    margin:    10,
    resizable: { handles: 'all' },
    draggable: { handle: '.widget-header' },
    animate:   true
  }, '#myGrid');

  grid.on('resizestop', (ev, el) => { setTimeout(() => doRender(el), 60); });
}

// ============================================================
// 18. WINDOW RESIZE
// ============================================================
let _resizeTimer;
window.addEventListener('resize', () => { clearTimeout(_resizeTimer); _resizeTimer = setTimeout(rerenderAll, 250); });

// ============================================================
// 19. INIT
// ============================================================
document.addEventListener('DOMContentLoaded', async () => {
  if (DEBUG_MODE) {
    const dc = document.getElementById('debugConsoleContainer');
    if (dc) dc.style.display = 'block';
  }

  initGrid();

  // Detect current user (follows Core_Dashboard_Template pattern)
  // Admin detection: matches BI_ADMIN_USER_ID (numeric, default 1) OR BI_ADMIN_USER (username string).
  // Using ID is more reliable — Fishbowl admin accounts sometimes have a blank userName field.
  try {
    const u = JSON.parse(getUser());
    const _userId   = u.id || u.userId;   // maps to sysuser.id
    const _userName = u.userName || '';
    const prop = (k, d) => typeof getProperty === 'function' ? getProperty(k, d) : d;
    const adminId   = parseInt(prop('BI_ADMIN_USER_ID', '1')) || 1;
    const adminUser = prop('BI_ADMIN_USER', '');
    const byId   = _userId === adminId;
    const byName = adminUser && _userName.toLowerCase() === adminUser.toLowerCase();
    _isAdmin = byId || byName;
    debugLog(`User: "${_userName}" (id: ${_userId}) | Admin: ${_isAdmin} (byId:${byId} byName:${byName})`, _isAdmin ? 'success' : 'info');
    console.log('[Sales Dashboard] User:', _userName, '| id:', _userId, '| Admin:', _isAdmin);
  } catch(e) {
    debugLog('getUser() failed: ' + e, 'error');
    console.warn('[Sales Dashboard] getUser() failed:', e);
  }

  // Load global (report-scoped) admin settings — readable by all users
  try {
    const rd = loadReportData();
    if (rd) _globalData = JSON.parse(rd);
    _userEditingAllowed = _globalData.userEditing !== false;
    debugLog(`Global settings loaded | userEditing: ${_userEditingAllowed}`, 'info');
  } catch(e) { debugLog('loadReportData() failed: ' + e, 'warning'); }

  await loadFilters();
  debugLog('Filters loaded', 'success');

  let layout = DEFAULT_LAYOUT;

  if (!_isAdmin && !_userEditingAllowed) {
    // Non-admin, editing locked by admin: use published master layout (read-only)
    layout = _globalData.masterLayout || DEFAULT_LAYOUT;
    if (_globalData.masterFilterState) applyFilterState(_globalData.masterFilterState);
    if (_globalData.masterBadgeConfig && _globalData.masterBadgeConfig.length) _badgeConfig = _globalData.masterBadgeConfig;
    isLocked = true;
    const lb = document.getElementById('lockBtn');
    if (lb) lb.style.display = 'none';
    debugLog('Read-only mode: master layout applied', 'warning');
  } else {
    // Admin or user editing allowed: each user gets their own saved layout
    const saved = _biLoad();
    if (saved) {
      if (saved.filterState) applyFilterState(saved.filterState);
      if (saved.locked !== undefined) isLocked = saved.locked;
      if (saved.layout && saved.layout.length) layout = saved.layout;
      debugLog(`User layout restored (${layout.length} widgets, locked: ${isLocked})`, 'info');
      if (saved.badgeConfig && saved.badgeConfig.length) _badgeConfig = saved.badgeConfig;
    }
    if (_isAdmin) {
      const ac = document.getElementById('adminControls');
      if (ac) { ac.style.display = 'flex'; updateAdminUI(); }
    }
  }

  updateDateDisplay();
  loadLayout(layout);
  applyLockState();
  updateKPIBadges();
});
</script>
