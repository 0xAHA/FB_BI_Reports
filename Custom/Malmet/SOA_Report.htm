<!DOCTYPE html>
<!--
================================================================================
  REPORT: SOA Report (Statement of Account)
  PATH:   Custom/Malmet/SOA_Report.htm
  --------------------------------------------------------------------------------
  Invoiced (shipped) sales order lines for a customer group over a date range,
  filterable by product-tree category and free text. Columns are drag-reorderable
  and resizable, persisted per user via FBLib.Settings.

  Re-platformed onto the shared fb-lib / fb-styles stack (2026-08): shared chrome
  now comes from fb-styles (header/.hdr-btn, .split-btn, .rpt-table §29, .ms-* §32,
  fb-drawer §11, spinner §19) instead of ~100 lines of duplicated local CSS; the
  settings modal became a canonical fb-drawer; the hand-rolled product-tree
  dropdown became FBLib.Common.MultiSelect; and export moved to FBLib.Export,
  which adds a formatted .xlsx alongside the existing CSV.
================================================================================
-->
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOA Report - Fishbowl BI</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared Fishbowl BI lib (Settings layer + Common formatting/debug helpers,
       MultiSelect, drawers, and FBLib.Export). Inlined by Fishbowl from the saved
       script named "fb-lib". Source of truth: scripts/fb-lib.js. MUST come before
       fb-styles so window.FBLib exists before any inline body code runs. -->
  <script>
    {% Script fb-lib %}
  </script>

  <!-- Shared chrome (source: scripts/fb-styles.css). Owns the design tokens,
       header/.hdr-btn/.split-btn family, .rpt-table, .ms-*, .row-link, fb-drawer
       and the spinner keyframes. Do NOT redeclare any of those locally. -->
  <style>
    {% Style fb-styles %}
  </style>

  <style>
    /* REPORT-LOCAL CSS ONLY.
       Tokens, header + .hdr-btn/.split-btn, .rpt-table (§29), .ms-* (§32),
       .row-link (§31), fb-drawer (§11), .ds-* controls and the spinner
       keyframes all come from fb-styles. Everything below is either layout
       unique to this report or a deliberate override of a shared rule. */

    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }

    /* ── PAGE ── */
    .wrap { max-width: 100%; margin: 0; padding: 16px 20px 60px; }
    .card { background: #fff; border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--sh1); margin-bottom: 16px; }

    /* ── CONTROLS ── */
    .controls { display: flex; flex-wrap: wrap; gap: 14px 20px; padding: 14px 16px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 10px; font-weight: 600; color: #506872; text-transform: uppercase; letter-spacing: 0.04em; }
    .field input[type=text] { min-width: 200px; }
    .field select { min-width: 180px; }
    /* The shared .ms-trigger is a fixed 30px pill sized for a filter strip;
       widen it here so it lines up with the neighbouring 34px inputs. */
    .field .ms-container { min-width: 220px; max-width: 340px; }
    .field .ms-trigger { height: 34px; }

    /* ── TABLE ──
       .rpt-table supplies the navy header, zebra, hover and totals styling.
       These overrides add what this report needs on top: a FIXED layout so
       the <colgroup> widths the user drags are respected, the sticky offset
       for the 56px page header (§29 assumes a scroll container at top: 0),
       and the drag/resize affordances. */
    .rpt-table { table-layout: fixed; font-size: 12.5px; }
    .rpt-table th { position: sticky; top: 56px; z-index: 5; padding: 8px 10px;
        font-size: 11px; text-transform: uppercase; letter-spacing: 0.03em; overflow: hidden; }
    .rpt-table th.nr { text-align: right; }
    .rpt-table th.dragging { opacity: 0.4; }
    .rpt-table td { padding: 6px 10px; overflow: hidden; text-overflow: ellipsis; }
    .col-resize { position: absolute; top: 0; right: 0; width: 7px; height: 100%; cursor: col-resize; }
    .desc { max-width: 280px; overflow: hidden; text-overflow: ellipsis; }
    .loc { max-width: 240px; overflow: hidden; text-overflow: ellipsis; }
    .empty { padding: 36px; text-align: center; color: #8FA1A7; font-style: italic; }

    /* ── SPINNER (keyframes + .spin come from fb-styles §19) ── */
    #spinner { display: none; padding: 40px; text-align: center; color: #506872; }

    /* ── SETTINGS DRAWER (chrome from fb-styles §11) ── */
    #setOverlay .ds-section { margin-bottom: 18px; }
    #setOverlay .ds-checks label { display: block; padding: 5px 0; font-size: 13px; cursor: pointer; }
    #setOverlay .ds-checks input { margin-right: 7px; }

  </style>
</head>
<body>

  <header>
    <div>
      <h1>SOA Report</h1>
      <p id="statusLine">Initialising…</p>
    </div>
    <div class="hdr-actions">
      <button class="hdr-btn" onclick="loadData()" title="Reload"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>Refresh</button>
      <div class="split-btn">
        <button id="xlsxBtn" class="hdr-btn hdr-btn-primary" onclick="exportExcel()" title="Download a formatted Excel workbook (.xlsx)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 9h18M3 15h18M9 3v18"/></svg>Excel</button>
        <button id="csvBtn" class="hdr-btn" onclick="exportCSV()" title="Download the raw data as a CSV file"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6"/><path d="M8 13h8M8 17h5"/></svg>CSV</button>
      </div>
      <button id="setBtn" class="hdr-btn hdr-btn-icon" onclick="FBLib.Common.toggleDrawer('setOverlay')" title="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.62.06-.94 0-.32-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94 0 .32.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 018.4 12 3.6 3.6 0 0112 8.4a3.6 3.6 0 013.6 3.6 3.6 3.6 0 01-3.6 3.6z"/></svg></button>
    </div>
  </header>

  <div class="wrap">

    <!-- CONTROLS -->
    <div class="card">
      <div class="controls">
        <div class="field">
          <label>Customer Group</label>
          <select id="groupSel" onchange="loadData()"></select>
        </div>
        <div class="field">
          <label>Product Tree</label>
          <!-- Canonical FBLib.Common.MultiSelect markup (fb-lib MULTI-SELECT
               doc block); the widget is created in init(). -->
          <div class="ms-container" id="treeMs">
            <div class="ms-trigger" id="treeMs-trigger">
              <span class="ms-placeholder" id="treeMs-placeholder">All categories</span>
            </div>
            <div class="ms-dropdown hidden" id="treeMs-dropdown">
              <div class="ms-search"><input type="text" id="treeMs-search" placeholder="Filter categories…" /></div>
              <div class="ms-actions">
                <span id="treeMs-all">Select All</span>
                <span id="treeMs-clear">Clear All</span>
              </div>
              <div class="ms-list" id="treeMs-list"></div>
            </div>
          </div>
        </div>
        <div class="field">
          <label>Date Invoiced — From</label>
          <input type="date" id="dateFrom" onchange="loadData()" />
        </div>
        <div class="field">
          <label>Date Invoiced — To</label>
          <input type="date" id="dateTo" onchange="loadData()" />
        </div>
        <div class="field">
          <label>Search product / customer / invoice / PO</label>
          <input type="text" id="search" placeholder="contains…" oninput="applyFiltersDebounced()" />
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <div id="spinner"><svg class="spin" width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#E3E3E3" stroke-width="3"/><path d="M12 2a10 10 0 0 1 10 10" stroke="#2d9cdb" stroke-width="3" stroke-linecap="round"/></svg><div style="margin-top:8px;">Loading invoiced sales…</div></div>
      <table class="rpt-table" id="soaTable">
        <colgroup id="soaColgroup"></colgroup>
        <thead id="soaHead"></thead>
        <tbody id="soaBody">
          <tr><td class="empty" colspan="12">Loading…</td></tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- SETTINGS — canonical fb-drawer (fb-styles §11 + FBLib.Common.registerDrawer).
       Must be a sibling of <header>; fb-lib positions it under the live header
       height and supplies the shared scrim. Never override its z-index. -->
  <div id="setOverlay" class="fb-drawer">
    <div class="fb-drawer-head">
      <h2>Settings — SOA Report</h2>
      <button type="button" class="fb-drawer-close" onclick="FBLib.Common.closeDrawer('setOverlay')">&times;</button>
    </div>
    <div class="fb-drawer-body">
      <div id="dsLockBadge" class="ds-lock-badge" style="display:none;">Locked by admin — your changes won't be saved.</div>
      <div class="ds-section ds-checks">
        <label class="ds-label">Options</label>
        <label><input type="checkbox" id="dsDebug" /> Show debug console</label>
      </div>
      <div id="dsAdminSection" class="ds-section ds-admin" style="display:none;">
        <label class="ds-label">Admin</label>
        <button type="button" class="ds-btn ds-btn-admin" onclick="PageSettings.publishMaster()">Publish as default for everyone</button>
        <button type="button" class="ds-btn ds-btn-admin" id="dsLockBtn" onclick="PageSettings.toggleLock()">Lock user editing</button>
      </div>
    </div>
    <div class="fb-drawer-foot">
      <button type="button" class="ds-btn" onclick="PageSettings.resetToDefaults()">Reset to defaults</button>
      <button type="button" class="ds-btn ds-btn-primary" onclick="PageSettings.saveUser()">Save (just me)</button>
    </div>
  </div>

<script>
/* ── RUNTIME GUARD ── */
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#475569;"><h2>Not running inside Fishbowl</h2><p>This report requires the Fishbowl BI environment.</p></div>';
  throw new Error('Fishbowl API not available');
}

/* ── FB-LIB SETTINGS ── */
FBLib.Settings.init({
  userKey:   'cdx.bi.soa.user.v1',
  masterKey: 'cdx.bi.soa.master.v1',
  defaults: { v: 1, group: 'NSW LHG', dateFrom: '', dateTo: '', cols: [], treeCats: [], debug: false },
  propFallback: { debug: { name: 'BI_SHOW_DEBUG', dflt: 'false', parse: v => (v === 'true' || v === true) } }
});

/* ── THIN HELPERS ── */
const _C = (window.FBLib && FBLib.Common) ? FBLib.Common : null;
function fmtMoney(v) {
  if (_C && _C.formatMoney) return _C.formatMoney(v);
  const n = parseFloat(v || 0); if (isNaN(n)) return '';
  return (n < 0 ? '-$' : '$') + Math.abs(n).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function fmtQty(v) {
  if (_C && _C.formatQty) return _C.formatQty(v);
  const n = parseFloat(v); if (isNaN(n)) return '';
  return n % 1 === 0 ? String(Math.round(n)) : n.toFixed(4).replace(/\.?0+$/, '');
}
function fmtDate(s) { try { return _C && _C.formatDate ? _C.formatDate(s) : String(s || '').split(' ')[0]; } catch (_) { return String(s || ''); } }
function esc(s) { if (_C && _C.escSQL) return _C.escSQL(s); return String(s == null ? '' : s).replace(/'/g, "''"); }
function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function setStatus(m) { document.getElementById('statusLine').textContent = m; }
function safeDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ''; }
function ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }

/* ── QUERY HELPERS ── */
function norm(r) {
  if (r == null) return [];
  if (typeof r === 'string') { try { const p = JSON.parse(r); return Array.isArray(p) ? p : []; } catch (_) { return []; } }
  return Array.isArray(r) ? r : [];
}
async function qp(sql) {
  try { return norm(await runQueryAsync(sql)); }
  catch (e) { try { return norm(runQuery(sql)); } catch (e2) { throw e2; } }
}

/* ── COLUMNS (default order matches the requested spreadsheet; reorderable + resizable) ── */
const _DEFAULT_COLS = [
  { key: 'productnum',   label: 'Product', w: 130 },
  { key: 'proddesc',     label: 'Product Description', w: 240 },
  { key: 'qty',          label: 'Quantity', w: 80, qty: true, nr: true },
  { key: 'dateordered',  label: 'Date Ordered', w: 110, date: true },
  { key: 'invoicenum',   label: 'Invoice Number', w: 120, link: 'Sales Order' },
  { key: 'totalincl',    label: 'Value (inc GST)', w: 130, money: true, nr: true },
  { key: 'totalexcl',    label: 'Value (ex GST)', w: 130, money: true, nr: true },
  // noTotal: a unit price is a RATE — summing it down the column is
  // meaningless, so the Excel totals row leaves it blank.
  { key: 'unitprice',    label: 'Unit Price', w: 110, money: true, nr: true, noTotal: true },
  { key: 'orderref',     label: 'Customer PO', w: 130 },
  { key: 'dateinvoiced', label: 'Date Invoiced', w: 110, date: true },
  { key: 'partnerloc',   label: 'Partner Location', w: 220 },
  { key: 'customer',     label: 'Customer', w: 180 }
];
let _cols = _DEFAULT_COLS.map(function (c) { return Object.assign({}, c); });
let _dragKey = null;
let _resizing = null;

/* ── STATE ── */
let _all = [];
let _shown = [];
let _filterTimer = null;
let _treeCats = [];          // [{ name }] product-tree categories for the filter
const _selTree = new Set();  // selected category names (never reassign — use clear()/add())
let _treeMs = null;          // FBLib.Common.MultiSelect instance

/* ── COLUMN PREFS (reorder + width, persisted via fb-lib) ── */
function loadColPrefs() {
  let saved = null;
  try { saved = FBLib.Settings.resolve('cols'); } catch (_) {}
  if (!Array.isArray(saved) || !saved.length) {
    _cols = _DEFAULT_COLS.map(function (c) { return Object.assign({}, c); });
    fitColsToScreen();   // first run: size columns to fill the screen
    return;
  }
  const byKey = {}; _DEFAULT_COLS.forEach(function (c) { byKey[c.key] = c; });
  const out = []; const seen = {};
  saved.forEach(function (s) {
    const d = byKey[s.key];
    if (d && !seen[s.key]) { out.push(Object.assign({}, d, { w: (s.w > 40 ? s.w : d.w) })); seen[s.key] = 1; }
  });
  _DEFAULT_COLS.forEach(function (c) { if (!seen[c.key]) out.push(Object.assign({}, c)); });
  _cols = out;
}
function saveColPrefs() {
  try { FBLib.Settings.setUserKey('cols', _cols.map(function (c) { return { key: c.key, w: c.w }; })); FBLib.Settings.saveUser(); } catch (_) {}
}
// Scale the default widths so the columns fill the available width on first load.
function fitColsToScreen() {
  const host = document.getElementById('soaTable').parentElement;
  const avail = (host && host.clientWidth) ? host.clientWidth : (window.innerWidth - 40);
  const sum = _cols.reduce(function (s, c) { return s + c.w; }, 0);
  if (avail < 200 || sum <= 0) return;
  const factor = avail / sum;
  _cols.forEach(function (c) { c.w = Math.max(60, Math.round(c.w * factor)); });
}

function renderHead() {
  const cg = document.getElementById('soaColgroup');
  const head = document.getElementById('soaHead');
  let total = 0;
  cg.innerHTML = _cols.map(function (c) { total += c.w; return '<col style="width:' + c.w + 'px">'; }).join('');
  document.getElementById('soaTable').style.width = total + 'px';

  const tr = document.createElement('tr');
  _cols.forEach(function (c) {
    const th = document.createElement('th');
    if (c.nr) th.className = 'nr';
    th.dataset.key = c.key;
    th.draggable = true;
    th.appendChild(document.createTextNode(c.label));
    const rz = document.createElement('div'); rz.className = 'col-resize';
    rz.addEventListener('mousedown', function (e) { startResize(e, c, th); });
    th.appendChild(rz);
    th.addEventListener('dragstart', function (e) { if (_resizing) { e.preventDefault(); return; } _dragKey = c.key; e.dataTransfer.effectAllowed = 'move'; th.classList.add('dragging'); });
    th.addEventListener('dragover', function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (_dragKey && _dragKey !== c.key) th.classList.add('drag-over'); });
    th.addEventListener('dragleave', function () { th.classList.remove('drag-over'); });
    th.addEventListener('drop', function (e) {
      e.preventDefault(); th.classList.remove('drag-over');
      if (!_dragKey || _dragKey === c.key) return;
      const fi = _cols.findIndex(function (x) { return x.key === _dragKey; });
      const ti = _cols.findIndex(function (x) { return x.key === c.key; });
      if (fi < 0 || ti < 0) return;
      const m = _cols.splice(fi, 1)[0]; _cols.splice(ti, 0, m);
      saveColPrefs(); renderHead(); render();
    });
    th.addEventListener('dragend', function () { _dragKey = null; document.querySelectorAll('#soaHead th').forEach(function (t) { t.classList.remove('dragging', 'drag-over'); }); });
    tr.appendChild(th);
  });
  head.innerHTML = ''; head.appendChild(tr);
}

function startResize(e, col, th) {
  e.preventDefault(); e.stopPropagation();
  _resizing = { col: col, startX: e.clientX, startW: col.w };
  th.draggable = false;
  document.addEventListener('mousemove', onResizeMove);
  document.addEventListener('mouseup', onResizeUp);
}
function onResizeMove(e) {
  if (!_resizing) return;
  const w = Math.max(50, _resizing.startW + (e.clientX - _resizing.startX));
  _resizing.col.w = w;
  const idx = _cols.indexOf(_resizing.col);
  const colEl = document.getElementById('soaColgroup').children[idx];
  if (colEl) colEl.style.width = w + 'px';
  let total = 0; _cols.forEach(function (c) { total += c.w; });
  document.getElementById('soaTable').style.width = total + 'px';
}
function onResizeUp() {
  document.removeEventListener('mousemove', onResizeMove);
  document.removeEventListener('mouseup', onResizeUp);
  if (_resizing) { _resizing = null; saveColPrefs(); renderHead(); }
}

/* ── DEBUG ── */
/* The debug console is fb-lib's shared bottom drawer (mountDebugDrawer) —
   the report no longer carries its own console card or CSS. */
function dbg(msg, type) { try { if (FBLib.Common.DEBUG_MODE) FBLib.Common.debugLog(msg, type || 'info'); } catch (_) {} }
function applyDebugVisibility() {
  try {
    const api = FBLib.Common.mountDebugDrawer();
    if (!api) return;
    // show() reveals the collapsed bar; collapse() only un-expands, so both
    // are needed to land in the "visible but not expanded" state.
    if (FBLib.Common.DEBUG_MODE) { api.show(); api.collapse(); } else { api.hide(); }
  } catch (_) {}
}

/* ── CUSTOMER GROUP DROPDOWN ── */
async function loadGroups() {
  const sel = document.getElementById('groupSel');
  let groups = [];
  try { groups = await qp("SELECT name FROM accountgroup WHERE name IS NOT NULL AND name <> '' ORDER BY name"); }
  catch (e) { dbg('accountgroup lookup failed: ' + e.message, 'warning'); }
  const want = FBLib.Settings.resolve('group') || 'NSW LHG';
  sel.innerHTML = '';
  if (!groups.length) { const o = document.createElement('option'); o.value = ''; o.textContent = '(no customer groups found)'; sel.appendChild(o); return; }
  groups.forEach(function (g) {
    const o = document.createElement('option'); o.value = g.name; o.textContent = g.name;
    if (g.name === want) o.selected = true;
    sel.appendChild(o);
  });
}

/* ── PRODUCT TREE MULTI-SELECT ──
   Uses the shared FBLib.Common.MultiSelect widget (fb-lib) against the
   canonical .ms-container markup, replacing ~60 lines of bespoke dropdown
   code. Filtering is purely client-side, so re-filtering on every checkbox
   (onChange) is cheap — there is no query to defer to onClose. */
async function loadTreeCats() {
  let cats = [];
  try {
    cats = await qp("SELECT DISTINCT pt.name AS name FROM producttree pt " +
      "JOIN producttotree ptt ON ptt.producttreeid = pt.id " +
      "WHERE pt.name IS NOT NULL AND pt.name <> '' ORDER BY pt.name");
  } catch (e) { dbg('producttree lookup failed: ' + e.message, 'warning'); }
  _treeCats = cats.map(function (c) { return { name: c.name }; });

  const saved = FBLib.Settings.resolve('treeCats');
  // Never reassign _selTree — buildMS-style closures hold the Set reference.
  _selTree.clear();
  if (Array.isArray(saved)) saved.forEach(function (v) { _selTree.add(v); });

  _treeMs = FBLib.Common.MultiSelect.create({
    containerId: 'treeMs',
    items: treeOptions().map(function (c) { return { value: c.name, label: c.name }; }),
    selected: [..._selTree],
    placeholder: 'All categories',
    maxTags: 3,
    onChange: function (selected) {
      _selTree.clear();
      selected.forEach(function (v) { _selTree.add(v); });
      persistTree();
      applyFilters();
    }
  });
}
// "(Uncategorised)" pseudo-category catches products with no tree mapping.
function treeOptions() { return [{ name: '(Uncategorised)' }].concat(_treeCats); }
function persistTree() { try { FBLib.Settings.setUserKey('treeCats', [..._selTree]); FBLib.Settings.saveUser(); } catch (_) {} }

/* ── LOAD DATA ── */
async function loadData() {
  const group = document.getElementById('groupSel').value;
  const from = safeDate(document.getElementById('dateFrom').value);
  const to = safeDate(document.getElementById('dateTo').value);
  persistControls();

  if (!group) { setStatus('Select a customer group.'); return; }
  if (!from || !to) { setStatus('Choose a Date Invoiced range.'); return; }

  document.getElementById('spinner').style.display = 'block';
  document.getElementById('soaTable').style.display = 'none';
  setStatus('Loading…');

  try {
    // Invoiced = shipped SO lines (ship.statusId = 30 Shipped). Date Invoiced =
    // ship.dateShipped; Invoice Number = so.num. Customer group via the account's
    // accountgrouprelation → accountgroup. Product-tree category via producttotree.
    //
    // Two legs UNIONed so service / non-inventory items are captured too:
    //   Leg 1 — physical lines that ship (one row per shipitem, qty = qtyShipped).
    //   Leg 2 — lines fulfilled WITHOUT a physical shipment (service, labor, etc.):
    //           one row per soitem on a shipped SO, qty = qtyFulfilled, dated to the
    //           SO's earliest in-range shipment. The NOT EXISTS guard means this leg
    //           adds only lines NOT already counted in leg 1 — so it's correct whether
    //           or not service items happen to create shipitem rows (no double count).
    const treeJoin =
      "LEFT JOIN (SELECT productid, MIN(producttreeid) AS treeid FROM producttotree GROUP BY productid) ptt ON ptt.productid = soitem.productid " +
      "LEFT JOIN producttree ptree ON ptree.id = ptt.treeid ";
    const rows = await qp(
      "SELECT * FROM ( " +
      // ── Leg 1: physical shipped lines ──
      "SELECT so.num AS invoicenum, so.customerpo AS orderref, " +
      "so.dateissued AS dateordered, ship.dateshipped AS dateinvoiced, " +
      "soitem.productnum AS productnum, COALESCE(prod.description, soitem.description) AS proddesc, " +
      "soitem.unitprice AS unitprice, shipitem.qtyshipped AS qty, " +
      "COALESCE(soitem.taxrate,0) AS taxrate, cust.name AS customer, " +
      "COALESCE(NULLIF(ship.shiptoname,''), so.shiptoname) AS shiptoname, " +
      "ship.shiptocity AS shiptocity, ship.shiptoaddress AS shiptoaddr, ptree.name AS treecat " +
      "FROM shipitem " +
      "JOIN ship ON ship.id = shipitem.shipid " +
      "JOIN soitem ON soitem.id = shipitem.soitemid " +
      "JOIN so ON so.id = soitem.soid " +
      "JOIN customer cust ON cust.id = so.customerid " +
      "JOIN accountgrouprelation agr ON agr.accountid = cust.accountid " +
      "JOIN accountgroup ag ON ag.id = agr.groupid " +
      "LEFT JOIN product prod ON prod.id = soitem.productid " + treeJoin +
      "WHERE ship.statusid = 30 AND shipitem.soitemid IS NOT NULL " +
      "AND COALESCE(shipitem.qtyshipped,0) > 0 " +
      "AND ag.name = '" + esc(group) + "' " +
      "AND DATE(ship.dateshipped) BETWEEN '" + from + "' AND '" + to + "' " +
      "UNION ALL " +
      // ── Leg 2: fulfilled-but-not-shipped lines (service / non-inventory) ──
      "SELECT so.num AS invoicenum, so.customerpo AS orderref, " +
      "so.dateissued AS dateordered, shx.dateinvoiced AS dateinvoiced, " +
      "soitem.productnum AS productnum, COALESCE(prod.description, soitem.description) AS proddesc, " +
      "soitem.unitprice AS unitprice, soitem.qtyfulfilled AS qty, " +
      "COALESCE(soitem.taxrate,0) AS taxrate, cust.name AS customer, " +
      "so.shiptoname AS shiptoname, so.shiptocity AS shiptocity, so.shiptoaddress AS shiptoaddr, ptree.name AS treecat " +
      "FROM soitem " +
      "JOIN so ON so.id = soitem.soid " +
      "JOIN (SELECT soid, MIN(dateshipped) AS dateinvoiced FROM ship WHERE statusid = 30 " +
      "AND DATE(dateshipped) BETWEEN '" + from + "' AND '" + to + "' GROUP BY soid) shx ON shx.soid = so.id " +
      "JOIN customer cust ON cust.id = so.customerid " +
      "JOIN accountgrouprelation agr ON agr.accountid = cust.accountid " +
      "JOIN accountgroup ag ON ag.id = agr.groupid " +
      "LEFT JOIN product prod ON prod.id = soitem.productid " + treeJoin +
      "WHERE ag.name = '" + esc(group) + "' " +
      "AND soitem.productid IS NOT NULL AND soitem.showitemflag = 1 " +
      "AND COALESCE(soitem.qtyfulfilled,0) > 0 " +
      "AND NOT EXISTS (SELECT 1 FROM shipitem si2 WHERE si2.soitemid = soitem.id AND COALESCE(si2.qtyshipped,0) > 0) " +
      ") u ORDER BY u.dateinvoiced ASC, u.invoicenum LIMIT 20000");

    _all = rows.map(function (r) {
      const loc = (r.shiptoname || '') + (r.shiptocity ? ', ' + r.shiptocity : '');
      // Per-line values: ex-GST = qtyShipped × unit price; inc-GST applies the line tax rate.
      const qty = parseFloat(r.qty) || 0;
      const unitprice = parseFloat(r.unitprice) || 0;
      const taxrate = parseFloat(r.taxrate) || 0;
      const totalexcl = qty * unitprice;
      const totalincl = totalexcl * (1 + taxrate);
      return {
        productnum: r.productnum || '', proddesc: r.proddesc || '',
        qty: qty, dateordered: r.dateordered, invoicenum: r.invoicenum || '',
        totalincl: totalincl, totalexcl: totalexcl,
        unitprice: unitprice, orderref: r.orderref || '',
        dateinvoiced: r.dateinvoiced,
        partnerloc: loc || '', partnerlocFull: [r.shiptoname, r.shiptoaddr, r.shiptocity].filter(Boolean).join(', '),
        customer: r.customer || '', treecat: r.treecat || ''
      };
    });

    applyFilters();
    const inv = new Set(_all.map(function (r) { return r.invoicenum; }));
    const lineVal = _all.reduce(function (s, r) { return s + r.qty * r.unitprice; }, 0);
    setStatus(_all.length + ' invoiced line(s) · ' + inv.size + ' order(s) · ' + fmtMoney(lineVal) + ' line value · group "' + group + '"');
  } catch (e) {
    console.error(e);
    setStatus('Error: ' + (e.message || e));
    document.getElementById('soaBody').innerHTML = '<tr><td class="empty" colspan="' + _cols.length + '">Error: ' + escHtml(e.message || String(e)) + '</td></tr>';
  } finally {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('soaTable').style.display = '';
  }
}

/* ── FILTER + RENDER ── */
function applyFiltersDebounced() { clearTimeout(_filterTimer); _filterTimer = setTimeout(applyFilters, 200); }

function applyFilters() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const useTree = _selTree.size > 0;
  _shown = _all.filter(function (r) {
    if (useTree && !_selTree.has(r.treecat || '(Uncategorised)')) return false;
    if (q && (r.productnum + ' ' + r.proddesc + ' ' + r.customer + ' ' + r.invoicenum + ' ' + r.orderref).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  render();
}

function render() {
  const tbody = document.getElementById('soaBody');
  tbody.innerHTML = '';
  if (!_shown.length) {
    tbody.innerHTML = '<tr><td class="empty" colspan="' + _cols.length + '">No invoiced lines for this group / date range.</td></tr>';
    return;
  }
  const frag = document.createDocumentFragment();
  _shown.forEach(function (r) {
    const tr = document.createElement('tr');
    _cols.forEach(function (c) { tr.appendChild(buildCell(r, c)); });
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
}

function buildCell(r, col) {
  const v = r[col.key];
  if (col.link === 'Sales Order' && v) {
    const td = document.createElement('td');
    const a = document.createElement('a'); a.className = 'row-link'; a.href = '#'; a.textContent = v;
    a.addEventListener('click', function (e) { e.preventDefault(); openModule('Sales Order', v); });
    td.appendChild(a); return td;
  }
  if (col.money) return numTd(fmtMoney(v));
  if (col.qty)   return numTd(fmtQty(v));
  if (col.date)  { const td = document.createElement('td'); td.textContent = fmtDate(v); return td; }
  const td = document.createElement('td');
  if (col.cls) td.className = col.cls;
  td.textContent = v == null ? '' : v;
  if (col.key === 'partnerloc' && r.partnerlocFull) td.title = r.partnerlocFull;
  else if (v) td.title = v;
  return td;
}
function numTd(text) { const el = document.createElement('td'); el.className = 'num-cell'; el.textContent = text == null ? '' : text; return el; }

/* ── EXPORTS ──
   Both formats stay available: .xlsx is the deliverable the customer works
   in (formatting travels with the file, so no re-styling and Save-As on
   every run), CSV is kept for feeding other systems.

   Everything below delegates to FBLib.Export — including the blob download
   itself, which is where the "second export loses its file extension" bug
   came from. The old code revoked the object URL synchronously after
   click(), so the download handler could find the URL already dead and
   fall back to the blob's UUID (no extension). See fb-lib for the detail. */

function _exportEnv() { return (window.FBLib && FBLib.Export) ? FBLib.Export : null; }

function _exportBase() {
  const grp = document.getElementById('groupSel').value || 'group';
  const stamp = ymd(new Date());
  return 'SOA_' + grp.replace(/[^A-Za-z0-9]+/g, '_').replace(/^_+|_+$/g, '') + '_' + stamp;
}

// The banner lines that record exactly which slice of data was exported —
// the file gets emailed around, so it has to be self-describing.
function _exportSubtitle() {
  const lines = [];
  const grp = document.getElementById('groupSel').value;
  if (grp) lines.push('Customer group: ' + grp);
  const from = document.getElementById('dateFrom').value;
  const to = document.getElementById('dateTo').value;
  if (from || to) lines.push('Invoiced ' + (from ? fmtDate(from) : '…') + ' – ' + (to ? fmtDate(to) : '…'));
  lines.push('Product tree: ' + (_selTree.size ? Array.from(_selTree).join(', ') : 'All categories'));
  const q = (document.getElementById('search').value || '').trim();
  if (q) lines.push('Search: "' + q + '"');
  let who = '';
  try { who = (JSON.parse(getUser()) || {}).userName || ''; } catch (_) {}
  lines.push(_shown.length + ' line' + (_shown.length === 1 ? '' : 's') +
    ' · generated ' + fmtDate(ymd(new Date())) + (who ? ' by ' + who : ''));
  return lines;
}

// Export the columns the user is actually looking at, in their order and at
// their widths — _cols carries the persisted reorder/resize state.
function _exportCols() { return _cols; }

async function exportExcel() {
  if (!_shown.length) { alert('Nothing to export.'); return; }
  const X = _exportEnv();
  if (!X || !X.xlsx) {
    alert('Excel export needs an updated "fb-lib" script on this server.\n\nAsk your administrator to re-save the fb-lib Script, or use the CSV button.');
    return;
  }
  const btn = document.getElementById('xlsxBtn');
  const prev = btn ? btn.innerHTML : '';
  if (btn) { btn.disabled = true; btn.textContent = 'Building…'; }
  setStatus('Building Excel workbook…');
  try {
    const name = await X.xlsx({
      filename: _exportBase() + '.xlsx',
      sheet: {
        name: 'SOA Detail',
        title: 'Statement of Account',
        subtitle: _exportSubtitle(),
        cols: _exportCols(),
        rows: _shown,
        totals: true
      }
    });
    dbg('Exported ' + name + ' (' + _shown.length + ' rows)', 'success');
    setStatus(_shown.length + ' line' + (_shown.length === 1 ? '' : 's') + ' — exported ' + name);
  } catch (e) {
    dbg('Excel export failed: ' + e.message, 'error');
    alert('Could not build the Excel file: ' + e.message);
    setStatus('Excel export failed.');
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = prev; }
  }
}

function exportCSV() {
  if (!_shown.length) { alert('Nothing to export.'); return; }
  const X = _exportEnv();
  const name = _exportBase() + '.csv';
  if (X && X.csv) {
    X.csv({ filename: name, cols: _exportCols(), rows: _shown });
  } else {
    // Fallback for a server still running an older fb-lib. Same deferred
    // cleanup as FBLib.Export.download — do NOT revoke synchronously.
    const q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
    const lines = [_cols.map(function (c) { return q(c.label); }).join(',')];
    _shown.forEach(function (r) {
      lines.push(_cols.map(function (c) {
        let v = r[c.key];
        if (c.date) v = fmtDate(v);
        else if (c.money) v = (parseFloat(v) || 0).toFixed(2);
        return q(v);
      }).join(','));
    });
    const blob = new Blob([String.fromCharCode(0xFEFF) + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener'; a.style.display = 'none';
    document.body.appendChild(a); a.click();
    setTimeout(function () {
      try { document.body.removeChild(a); } catch (_) {}
      try { URL.revokeObjectURL(url); } catch (_) {}
    }, 4000);
  }
  dbg('Exported ' + name + ' (' + _shown.length + ' rows)', 'success');
  setStatus(_shown.length + ' line' + (_shown.length === 1 ? '' : 's') + ' — exported ' + name);
}

/* ── SETTINGS PERSISTENCE ── */
function persistControls() {
  try {
    FBLib.Settings.setUserKey('group', document.getElementById('groupSel').value || '');
    FBLib.Settings.setUserKey('dateFrom', document.getElementById('dateFrom').value || '');
    FBLib.Settings.setUserKey('dateTo', document.getElementById('dateTo').value || '');
    FBLib.Settings.saveUser();
  } catch (_) {}
}

/* ── SETTINGS PANEL ──
   Chrome is the shared fb-drawer; fb-lib owns open/close, the scrim, ESC
   and the trigger's .active state. This module only hydrates and reads the
   form (via the registerDrawer onBeforeOpen hook wired in init). */
window.PageSettings = (function () {
  'use strict';
  function init() {
    const admin = document.getElementById('dsAdminSection');
    if (admin) admin.style.display = FBLib.Settings.isAdmin() ? 'block' : 'none';
    FBLib.Common.registerDrawer({
      id: 'setOverlay',
      triggerId: 'setBtn',
      onBeforeOpen: hydrate
    });
    refreshLockUI();
  }
  function refreshLockUI() {
    const allowed = FBLib.Settings.userEditingAllowed();
    const badge = document.getElementById('dsLockBadge');
    if (badge) badge.style.display = (!allowed && !FBLib.Settings.isAdmin()) ? 'block' : 'none';
    const lockBtn = document.getElementById('dsLockBtn');
    if (lockBtn) lockBtn.textContent = allowed ? 'Lock user editing' : 'Unlock user editing';
  }
  function hydrate() {
    const eff = FBLib.Settings.effective();
    document.getElementById('dsDebug').checked = !!eff.debug;
    refreshLockUI();
  }
  function openPanel() { FBLib.Common.openDrawer('setOverlay'); }
  function closePanel() { FBLib.Common.closeDrawer('setOverlay'); }
  function readPanel() {
    return { debug: document.getElementById('dsDebug').checked };
  }
  function applyAndClose() {
    closePanel();
    applyDebugVisibility();
  }
  function saveUser() {
    const p = readPanel();
    Object.keys(p).forEach(function (k) { FBLib.Settings.setUserKey(k, p[k]); });
    if (!FBLib.Settings.saveUser()) { alert('User editing is locked by admin.'); return; }
    applyAndClose();
  }
  function resetToDefaults() { if (!confirm('Reset your personal settings to defaults?')) return; FBLib.Settings.clearUser(); location.reload(); }
  function publishMaster() {
    if (!FBLib.Settings.isAdmin()) return;
    if (!confirm('Publish current panel values as the default for all users?')) return;
    FBLib.Settings.publishMaster(readPanel()); alert('Published.'); applyAndClose();
  }
  function toggleLock() {
    if (!FBLib.Settings.isAdmin()) return;
    const nowLocked = FBLib.Settings.userEditingAllowed();
    FBLib.Settings.setLock(nowLocked); refreshLockUI();
    alert('User editing: ' + (nowLocked ? 'LOCKED' : 'UNLOCKED'));
  }
  return { init: init, openPanel: openPanel, closePanel: closePanel,
    saveUser: saveUser, resetToDefaults: resetToDefaults, publishMaster: publishMaster, toggleLock: toggleLock };
})();

/* ── INIT ── */
window.onload = async function () {
  // Default date range: current month to today (persisted values win).
  const today = new Date();
  const monthStart = new Date(today.getFullYear(), today.getMonth(), 1);
  document.getElementById('dateFrom').value = FBLib.Settings.resolve('dateFrom') || ymd(monthStart);
  document.getElementById('dateTo').value = FBLib.Settings.resolve('dateTo') || ymd(today);
  applyDebugVisibility();
  PageSettings.init();
  loadColPrefs();
  renderHead();
  // Outside-click closing of the product-tree dropdown is handled by
  // FBLib.Common.MultiSelect — no local listener needed.
  await loadGroups();
  await loadTreeCats();
  loadData();
};
</script>
