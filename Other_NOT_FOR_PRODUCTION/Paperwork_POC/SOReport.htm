<!DOCTYPE html>
<!--
================================================================================
  REPORT: Sales Order Report / Sales Invoice  (PROOF OF CONCEPT)
  PATH:   Other_NOT_FOR_PRODUCTION/Paperwork_POC/SOReport.htm
  --------------------------------------------------------------------------------
  HTML replica of Fishbowl's standard SalesOrder/SOReport.jrxml and
  SOInvoiceReport.jrxml, printed and saved as PDF from the BI Report module's own
  Print / Save / Email buttons. The page IS the paper: fb-doc.js lays the order
  out into fixed-size sheets (page header on every sheet, item-table column
  header repeated, page footer "Page X of Y", totals pinned to the bottom of the
  last sheet, kits and BOM rows kept with their line).

  SOURCE vs BUILD
    This file is the source. `node build.js` inlines fb-doc.js and
    fb-doc-fonts.css into dist/SOReport.htm, and also writes
    dist/SOInvoiceReport.htm: this page with the Invoice setting defaulting on,
    its own settings key and the record name "Sales Invoice".
    Paste the dist files into the BI Script Editor (fb-lib and fb-styles are the
    deployed shared records).

  SCREEN
    The toolbar, record picker, Settings drawer, paper choice and launch handling
    are FBDoc.app (fb-doc.js); this file supplies the document only.

  FISHBOWL REPORT SETTINGS (Parameters button on the BI Report)
    Sales_Order  the order to print (Fishbowl's own SO picker); adopted once,
                 after that each user's in-page pick stands
    Invoice      print as the Sales Invoice (SOInvoiceReport) instead
    Page_setup   paper size / margins (default A4, Jasper margins)
    The setting tokens are in the text/plain blocks at the top of <body>. They
    are substituted by global text replacement: never repeat them anywhere else.

  LAUNCH FROM THE SALES ORDER MODULE (LAUNCH_CONTEXT.md)
    The fb-launch meta tag in <head> (content SO) lists this report under
    Reports > Apps in the Sales Order module (report_btn plugin). Opened from
    there, the host's window.FB_LAUNCH names the open order: it is printed
    straight away and cannot be changed (the toolbar shows only Print and
    Settings). Write that tag only once: the plugin reads the first one in the page.

  OPTIONS
    The stock report's saved options (reportparameter rows of SOReport.jasper /
    SOInvoiceReport.jasper) are read as the starting point, so a customer's
    existing setup carries over. An admin can override them in Settings and
    save for everyone (FBLib.Settings master, userProperties storage).

  DELIBERATE DEVIATIONS FROM THE JRXML
    - LEFT joins throughout: a null ship terms no longer blanks the info strip.
    - No literal "null" for a missing phone/email/fax/salesperson.
    - One currency source: so.currencyId (customer's as fallback); the jrxml
      mixes the customer's and the order's.
    - Info strips refit to the page width instead of running off it past six
      columns; item columns use the shared fb-doc catalogue widths.
    - Payments ordered by date; Kit headers re-shown "(continued)" on the next
      page when a kit runs over a page break.

  STATUS: proof of concept. Desk-tested against demodb through the live-SQL
  harness (tests/). Not client-tested.
================================================================================
-->

<body>

<!-- Fishbowl report settings: each token exactly once, never elsewhere. -->
<script type="text/plain" id="set-so">$SO{Sales_Order|0|Order}</script>
<script type="text/plain" id="set-invoice">$CHECK{Invoice|false|Document}</script>
<script type="text/plain" id="set-print">$PRINT{Page_setup|A4|Print}</script>

<script>
// ============================================================================
//  BAIL EARLY — needs the Fishbowl embedded browser, fb-lib and fb-doc.
// ============================================================================
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#506872;">' +
        '<h2>Not running inside Fishbowl</h2><p>Open this report from the Fishbowl client\'s BI module.</p></div>';
    throw new Error('runQuery unavailable');
}
if (!window.FBLib || !window.FBDoc) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="background:#F0D7DD;color:#8A1E30;padding:10px 16px;font:13px sans-serif">' +
        'Missing ' + (!window.FBLib ? 'fb-lib' : 'fb-doc') + '. Paste the BUILT file from dist/, not the source.</div>');
    throw new Error('fb-lib / fb-doc missing');
}

// Shell access (FBDoc.app, created at the end of this script).
function opt(name) { return APP.opt(name); }
function label(key, dflt) { return APP.label(key, dflt); }
function debugLog(m, t) { APP.debug(m, t); }

var esc = FBDoc.esc;
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round2(x) { return Math.sign(x) * Math.round(Math.abs(x) * 100 + 1e-7) / 100; }
function has(v) { return v != null && String(v) !== ''; }

// ============================================================================
//  OPTIONS — jrxml defaults (spec of SOReport.jrxml §2), stock presets, admin
// ============================================================================
var SO_REPORT_PATH = '../reports/SalesOrder/SOReport.jasper';
var INV_REPORT_PATH = '../reports/SalesOrder/SOInvoiceReport.jasper';

function jrxmlDefaults(env) {
    var MC = env.multiCurrency;
    return {
        cbDisplaySeller: 'username', cbShowDate: 'issued', cbLogoAlignment: 'left',
        ShowCompanyName: true, ShowCompanyAddress: true, ShowCountry: false,
        ShowBillToPhoneNumber: false, ShowBillToEmail: false, ShowBillToFax: false, ShowCustomerNameInAddress: false,
        ShowContact: true, ShowStatus: false, ShowRevision: false, ShowOrderNotes: true, ShowMemos: false,
        ShowBarcode: true, ShowSOCustomFields: false,
        ShowCfSO1: true, ShowCfSO2: true, ShowCfSO3: true, ShowCfSO4: true, ShowCfSO5: true, ShowCfSO6: true,
        ShowCfItem1: false, ShowCfItem2: false, ShowCfItem3: false,
        IncludeCustomerPartNumbers: true, ShowLineItemNotes: true, ShowZeroPriceItems: true,
        ShowBOMOnWOItems: true, ShowDescriptionOnWOItems: false, ShowAdjustmentAmounts: false, OnlyShowBOMPriceAdjustments: false,
        ShowTotals: !MC, ShowCurrencyTotals: MC, ShowHomeCurrencyTotals: false,
        ShowPayments: false, ShowCreditCardNumber: false, ShowHomeCurrency: false, ShowTaxRateName: false,
        AddTaxIntegrationEstimatedTaxToTotal: false, ShowPayOnlineButton: true,
        'Column:SalesOrderSeller': true, 'Column:SalesOrderPaymentTerms': true, 'Column:SalesOrderFOBPoint': true,
        'Column:SalesOrderShippingTerms': false, 'Column:SalesOrderCarrier': true, 'Column:SalesOrderShipService': true,
        'Column:DateScheduled': true, 'Column:PONumber': false, 'Column:OrderCurrencyCode': false,
        'Column:OrderCurrencyRate': false, 'Column:TaxIntegrationEstimatedTax': false,
        'Column:CustomerName': true, 'Column:CustomFooterText': true,
        'Column:ItemLineNumber': true, 'Column:ItemType': env.edition === 'US', 'Column:ItemNumberAndDescription': false,
        'Column:ItemNumber': true, 'Column:ItemDescription': true, 'Column:ItemDateScheduled': false,
        'Column:ItemUnitPrice': !MC, 'Column:ItemCurrencyUnitPrice': MC, 'Column:ItemQuantityOrdered': true,
        'Column:ItemTotalPrice': !MC, 'Column:ItemCurrencyTotalPrice': MC,
        'Column:ItemTaxCode': true, 'Column:ItemTaxAmount': false, 'Column:ItemCurrencyTax': false,
        'CustomField:SO1': -1, 'CustomField:SO2': -1, 'CustomField:SO3': -1, 'CustomField:SO4': -1,
        'CustomField:SO5': -1, 'CustomField:SO6': -1, 'CustomField:Item1': -1, 'CustomField:Item2': -1, 'CustomField:Item3': -1
    };
}

// The options shown in the Settings drawer (labels are the stock report's).
var OPTION_GROUPS = [
    ['Header', [['cbLogoAlignment', 'Logo position', ['left', 'top']], ['ShowCompanyName', 'Company name'], ['ShowCompanyAddress', 'Company address'],
        ['ShowCountry', 'Show country'], ['ShowStatus', 'Order status'], ['ShowBarcode', 'Barcode'], ['ShowRevision', 'Revision'],
        ['cbShowDate', 'Date shown', ['issued', 'created', 'completed', 'firstship', 'lastmodified', 'revision', 'today']],
        ['cbDisplaySeller', 'Sales rep shows', ['username', 'first', 'full']]]],
    ['Addresses', [['ShowCustomerNameInAddress', 'Customer name in bill-to'], ['ShowBillToPhoneNumber', 'Bill-to phone'],
        ['ShowBillToEmail', 'Bill-to email'], ['ShowBillToFax', 'Bill-to fax'], ['ShowContact', 'Contact'], ['Column:CustomerName', 'Customer line']]],
    ['Sections', [['ShowOrderNotes', 'Order notes'], ['ShowMemos', 'Memos'], ['ShowSOCustomFields', 'SO custom fields'], ['ShowPayments', 'Payments']]],
    ['Order info strip', [['Column:SalesOrderSeller', 'Sales rep'], ['Column:SalesOrderPaymentTerms', 'Payment terms'], ['Column:SalesOrderFOBPoint', 'FOB point'],
        ['Column:SalesOrderShippingTerms', 'Shipping terms'], ['Column:SalesOrderCarrier', 'Carrier'], ['Column:SalesOrderShipService', 'Ship service'],
        ['Column:DateScheduled', 'Date scheduled'], ['Column:PONumber', 'PO # (moves it out of the contact box)'], ['Column:OrderCurrencyCode', 'Currency code'],
        ['Column:OrderCurrencyRate', 'Currency rate'], ['Column:TaxIntegrationEstimatedTax', 'Estimated tax']]],
    ['Line item columns', [['Column:ItemLineNumber', 'Item #'], ['Column:ItemType', 'Type'], ['Column:ItemNumberAndDescription', 'Number / Description'],
        ['Column:ItemNumber', 'Number'], ['Column:ItemDescription', 'Description'], ['Column:ItemTaxCode', 'Tax code (AU/CA)'],
        ['Column:ItemTaxAmount', 'Tax amount (AU/CA)'], ['Column:ItemCurrencyTax', 'Order-currency tax (AU/CA)'], ['Column:ItemDateScheduled', 'Date scheduled'],
        ['Column:ItemUnitPrice', 'Unit price (home)'], ['Column:ItemCurrencyUnitPrice', 'Unit price (order currency)'], ['Column:ItemQuantityOrdered', 'Qty ordered'],
        ['Column:ItemTotalPrice', 'Total price (home)'], ['Column:ItemCurrencyTotalPrice', 'Total price (order currency)'],
        ['ShowCfItem1', 'Item CF 1'], ['ShowCfItem2', 'Item CF 2'], ['ShowCfItem3', 'Item CF 3']]],
    ['Line items', [['IncludeCustomerPartNumbers', 'Customer part numbers'], ['ShowLineItemNotes', 'Line notes'], ['ShowZeroPriceItems', 'Zero-price lines'],
        ['ShowBOMOnWOItems', 'BOM under WO lines (Number / Description column)'], ['ShowDescriptionOnWOItems', 'BOM part descriptions'],
        ['ShowAdjustmentAmounts', 'BOM adjustments'], ['OnlyShowBOMPriceAdjustments', 'Only priced BOM items']]],
    ['Totals', [['ShowTotals', 'Totals (single currency)'], ['ShowCurrencyTotals', 'Totals (multi-currency)'], ['ShowHomeCurrencyTotals', 'Home-currency column'],
        ['ShowTaxRateName', 'Tax rate name as label'], ['AddTaxIntegrationEstimatedTaxToTotal', 'Estimated tax in total (open orders)'],
        ['ShowCreditCardNumber', 'Payment reference'], ['ShowHomeCurrency', 'Payments in home currency'], ['ShowPayOnlineButton', 'Pay Online button'],
        ['Column:CustomFooterText', 'Footer message (SO Notice)']]]
];

// ============================================================================
//  DATA
// ============================================================================
// Configured custom-field columns only, each with a leading comma. Never select
// a bare NULL: the server's MariaDB driver types it as a binary string, Fishbowl
// then fails Class.forName("byte[]") and the whole query returns "An unknown
// error has occurred". An omitted column simply reads as undefined (blank).
function cfSelect(prefix, alias, count, keyBase) {
    var out = '', params = [];
    for (var i = 1; i <= count; i++) {
        var id = opt('CustomField:' + keyBase + i);
        if (id > 0) { out += ', CustomFieldById(' + alias + '.customFields, ?) AS ' + prefix + i; params.push(id); }
    }
    return { sql: out, params: params };
}

async function fetchModel(soId) {
    var cfS = cfSelect('socf', 'so', 6, 'SO');
    var hdr = await FBDoc.q([
        'SELECT so.id, so.num, so.statusId AS statusid, sostatus.name AS sostatus, so.note, so.revisionNum AS revisionnum,',
        '  so.dateIssued AS dateissued, so.dateCompleted AS datecompleted, so.dateCreated AS datecreated,',
        '  so.dateFirstShip AS datefirstship, so.dateRevision AS daterevision, so.dateLastModified AS datelastmodified,',
        '  so.locationGroupId AS lgid, so.paymentLink AS paymentlink, COALESCE(so.customerContact, \'\') AS customercontact,',
        '  so.customerPO AS customerpo, customer.name AS customername,',
        '  so.totalTax AS totaltax, so.mcTotalTax AS mctotaltax, so.estimatedTax AS estimatedtax,',
        '  so.shipToName AS shiptoname, so.shipToAddress AS shiptoaddress, so.shipToCity AS shiptocity, so.shipToZip AS shiptozip,',
        '  ss.code AS shiptostate, sc.name AS shiptocountry,',
        '  so.billToName AS billtoname, so.billToAddress AS billtoaddress, so.billToCity AS billtocity, so.billToZip AS billtozip,',
        '  bs.code AS billtostate, bc.name AS billtocountry,',
        '  COALESCE(NULLIF(so.currencyRate, 0), 1) AS currencyrate, cur.code AS currencycode, hc.code AS homecurrencycode,',
        '  company.name AS company, company.abn AS abn, so.phone, so.email,',
        '  (SELECT c.datus FROM contact c WHERE c.accountId = customer.accountId AND c.typeId = 40 AND c.defaultFlag = 1 ORDER BY c.id LIMIT 1) AS fax,',
        '  so.salesman, su.firstName AS firstname, su.lastName AS lastname,',
        '  pt.name AS paymentterms, fob.name AS fobpoint, st.name AS shippingterms, car.name AS carriername, cs.name AS shipservice,',
        '  ot.name AS ordertaxname,',
        '  (SELECT COALESCE(SUM(p.amount), 0) FROM postransaction p WHERE p.soId = so.id) AS paymentamount,',
        '  (SELECT SUM(i.unitPrice * i.qtyToFulfill + COALESCE(i.adjustAmount, 0)) FROM soitem i WHERE i.soId = so.id AND i.typeId <> 40) AS sototal' + cfS.sql,
        'FROM so',
        'JOIN customer ON customer.id = so.customerId',
        'LEFT JOIN company ON company.id = 1',
        'LEFT JOIN sostatus ON sostatus.id = so.statusId',
        'LEFT JOIN stateconst ss ON ss.id = so.shipToStateId',
        'LEFT JOIN countryconst sc ON sc.id = so.shipToCountryId',
        'LEFT JOIN stateconst bs ON bs.id = so.billToStateId',
        'LEFT JOIN countryconst bc ON bc.id = so.billToCountryId',
        'LEFT JOIN currency cur ON cur.id = COALESCE(so.currencyId, customer.currencyId)',
        'LEFT JOIN currency hc ON hc.homeCurrency = 1',
        'LEFT JOIN sysuser su ON su.userName = so.salesman',
        'LEFT JOIN paymentterms pt ON pt.id = so.paymentTermsId',
        'LEFT JOIN fobpoint fob ON fob.id = so.fobPointId',
        'LEFT JOIN shipterms st ON st.id = so.shipTermsId',
        'LEFT JOIN carrier car ON car.id = so.carrierId',
        'LEFT JOIN carrierservice cs ON cs.id = so.carrierServiceId',
        'LEFT JOIN taxrate ot ON ot.id = so.taxRateId',
        'WHERE so.id = ?'
    ].join('\n'), cfS.params.concat([soId]));
    if (!hdr.length) throw new Error('Sales order ' + soId + ' not found');
    var h = hdr[0];

    var cfI = cfSelect('itemcf', 'si', 3, 'Item');
    var lines = await FBDoc.q([
        'SELECT si.id AS itemid, si.soLineItem AS lineno, sit.name AS itemtype, si.typeId AS typeid,',
        '  si.customerPartNum AS cpn, si.productNum AS productnum, si.description, si.note,',
        '  COALESCE(si.qtyToFulfill, 0) AS qty, uom.code AS uomcode, COALESCE(si.adjustAmount, 0) AS adjust,',
        '  COALESCE(si.unitPrice, 0) AS unitprice, COALESCE(si.totalPrice, 0) AS totalprice,',
        '  si.dateScheduledFulfillment AS datesched, COALESCE(si.taxRate, 0) AS taxrate, tr.code AS taxcode,',
        '  oto.recordId2 AS kitparent,',
        '  (SELECT COUNT(*) FROM moitem mi WHERE mi.soItemId = si.id) AS mocount,',
        '  COALESCE(kit.kittotal, 0) AS kittotal' + cfI.sql,
        'FROM soitem si',
        'JOIN soitemtype sit ON sit.id = si.typeId',
        'LEFT JOIN uom ON uom.id = si.uomId',
        'LEFT JOIN taxrate tr ON tr.id = si.taxId',
        'LEFT JOIN objecttoobject oto ON oto.recordId1 = si.id AND oto.typeId = 30',
        'LEFT JOIN (SELECT o.recordId2 AS parentid, SUM(c.totalPrice) AS kittotal FROM soitem c',
        '           JOIN objecttoobject o ON o.recordId1 = c.id AND o.typeId = 30',
        '           WHERE c.soId = ? AND c.showItemFlag = 0 GROUP BY o.recordId2) kit',
        '       ON kit.parentid = si.id AND si.typeId = 80 AND si.totalPrice = 0',
        'WHERE si.soId = ? AND si.showItemFlag = 1',
        'ORDER BY si.soLineItem, si.id'
    ].join('\n'), cfI.params.concat([soId, soId]));

    var woIds = lines.filter(function (l) { return num(l.mocount) > 0; }).map(function (l) { return parseInt(l.itemid, 10); });
    var wo = [];
    if (woIds.length && opt('ShowBOMOnWOItems')) {
        wo = await FBDoc.q([
            'SELECT mi.soItemId AS soitemid, part.num AS partnum, part.description AS partdescription, uom.code AS uomcode,',
            '  bt.name AS bomtype, mi.priceAdjustment AS priceadj,',
            '  (mi.qtyToFulfill * COALESCE(uc.multiply, 1)) / COALESCE(uc.factor, 1) AS qtyordered',
            'FROM moitem mi JOIN part ON part.id = mi.partId JOIN bomitemtype bt ON bt.id = mi.typeId',
            'JOIN uom ON uom.id = part.uomId',
            'LEFT JOIN uomconversion uc ON uc.toUomId = part.uomId AND uc.fromUomId = mi.uomId',
            'WHERE mi.soItemId IN (' + woIds.map(function () { return '?'; }).join(',') + ') AND mi.typeId IN (20, 30)',
            'ORDER BY mi.soItemId, mi.typeId, mi.sortIdInstruct'
        ].join('\n'), woIds);
    }
    var payments = opt('ShowPayments') ? await FBDoc.q(
        'SELECT p.amount, pm.name AS paymentmethod, COALESCE(NULLIF(p.currencyRate, 0), 1) AS currencyrate, p.info AS reference, p.dateTime AS paymentdate ' +
        'FROM postransaction p LEFT JOIN paymentmethod pm ON pm.id = p.paymentMethodId WHERE p.soId = ? ORDER BY p.dateTime, p.id', [soId]) : [];
    var memos = opt('ShowMemos') ? await FBDoc.q(
        'SELECT memo, userName AS username, dateCreated AS datecreated FROM memo WHERE tableId = 1012013120 AND recordId = ? ORDER BY id', [soId]) : [];
    var companyAddress = '';
    try { companyAddress = typeof getCompanyAddress === 'function' ? String(getCompanyAddress(parseInt(h.lgid, 10), !!opt('ShowCountry')) || '') : ''; }
    catch (e) { debugLog('getCompanyAddress failed: ' + e.message, 'warn'); }

    return { h: h, lines: lines, wo: wo, payments: payments, memos: memos, companyAddress: companyAddress };
}

// ============================================================================
//  CALCULATIONS — the ItemInfo variables of the jrxml (§4, §9)
// ============================================================================
function compute(model, invoice) {
    var h = model.h, E = APP.env, rate = num(h.currencyrate) || 1;
    var lines = model.lines.filter(function (l) {
        return opt('ShowZeroPriceItems') || (num(l.unitprice) + num(l.adjust)) !== 0;
    });
    var sub = 0, homeSub = 0;
    lines.forEach(function (l) {
        var t = parseInt(l.typeid, 10), up = num(l.unitprice), q = num(l.qty), adj = num(l.adjust), tp = num(l.totalprice);
        var qd = q === 0 ? 1 : q, ext2 = round2(up * q);
        l._t = t;
        l.homeUnit = up + adj / qd;
        l.homeExt = ext2 + adj;
        l.homeExtNR = up * q + adj;
        l.homeTax = E.isUS ? 0 : round2(num(l.taxrate) * tp);
        l.curUnit = up / rate + (adj / qd) / rate;
        l.curTotal = tp / rate;
        if (E.isAU) {
            l.curExt = invoice ? (ext2 + adj) / rate : round2((ext2 + adj) / rate);
            l.curExtNR = (up * q + adj) / rate;
        } else {
            l.curExt = invoice ? ext2 / rate + adj / rate : round2(ext2 / rate + adj / rate);
            l.curExtNR = up * q / rate + adj / rate;
        }
        l.curTax = E.isUS ? 0 : round2(num(l.taxrate) * tp / rate);
        if (t !== 90 && t !== 40) { sub += l.curExt + num(l.kittotal); homeSub += l.homeExt + num(l.kittotal); }
    });
    var est = opt('AddTaxIntegrationEstimatedTaxToTotal') && parseInt(h.statusid, 10) < 60;
    var mcTax = num(h.mctotaltax);
    var tax = est ? num(h.estimatedtax) / rate : (mcTax !== 0 ? mcTax : num(h.totaltax) / rate);
    var homeTax = est ? num(h.estimatedtax) : num(h.totaltax);
    var paid = num(h.paymentamount) / rate, homePaid = num(h.paymentamount);
    return {
        lines: lines, rate: rate,
        sub: sub, tax: tax, total: sub + tax, paid: paid, balance: sub + tax - paid,
        homeSub: homeSub, homeTax: homeTax, homeTotal: homeSub + homeTax, homePaid: homePaid, homeBalance: homeSub + homeTax - homePaid
    };
}

        var block = { table: 'items', stripe: true, split: true, html: '<tr>' + cells.join('') + '</tr>' };
        // Kit parent: keep with its first child; re-shown "(continued)" if the kit runs over a page.

            });
        }
    });

    // ---- Payments ----
    if (opt('ShowPayments') && model.payments.length) {
        blocks.push({ kwn: true, html: '<div style="height:10pt"></div>' });
        var pw = FBDoc.Columns.fit([{ key: 'payDate' }, { key: 'payMethod' }, { key: 'payAmount' }], geom.CWpt);
        tables.pay = { className: 'so-doc so-sub', colgroup: FBDoc.Columns.colgroup(pw.widths),
            thead: '<thead><tr><th>' + esc(label('PaymentDate', 'Date')) + '</th><th>' + esc(label('Payment', 'Payment')) + '</th><th>' + esc(label('Amount', 'Amount')) + '</th></tr></thead>' };
        model.payments.forEach(function (p) {
            var suffix = (!E.multiCurrency || opt('ShowHomeCurrency')) ? '' : ' : Currency Rate: ' + p.currencyrate;
            var method = (p.paymentmethod || '') + (opt('ShowCreditCardNumber') && has(p.reference) ? ' ' + p.reference : '') + suffix;
            var amt = !E.multiCurrency ? fmtRaw(p.amount, E.price)
                : opt('ShowHomeCurrency') ? fmtCur(homeSym, p.amount, E.price)
                : fmtCur(curSym, num(p.amount) / (num(p.currencyrate) || 1), E.price);
            blocks.push({ table: 'pay', stripe: true, html: '<tr><td>' + esc(fmtD(p.paymentdate)) + '</td><td>' + esc(method) + '</td><td style="text-align:right">' + esc(amt) + '</td></tr>' });
        });
    }

    return { id: 'so-' + h.num, pageHeader: pageHeader, pageFooter: pageFooter, lastPageFooter: lastPageFooter, tables: tables, blocks: blocks };
}

function stripHtml(cells, geom) {
    var fit = FBDoc.Columns.fit(cells.map(function (c, i) { return { key: 's' + i, kind: 'strip' }; }), geom.CWpt);
    return '<div class="so-doc so-strip"><table>' + FBDoc.Columns.colgroup(fit.widths) +
        '<thead><tr>' + cells.map(function (c) { return '<th title="' + esc(c[1]) + '">' + esc(c[1]) + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody><tr>' + cells.map(function (c) { return '<td>' + esc(c[2] == null ? '' : c[2]) + '</td>'; }).join('') + '</tr></tbody></table></div>';
}

// Visible item columns, in the jrxml's order for the edition.
function itemColumns(h, E) {
    var cols = [];
    var curHdr = function (txt) { return has(h.currencycode) ? h.currencycode + '\n' + txt : txt; };
    var add = function (key, kind, on, lbl, align) { if (on) cols.push({ key: key, kind: kind, label: lbl, align: align }); };
    add('line', 'line', opt('Column:ItemLineNumber'), label('Item#', 'Item #'), 'center');
    add('type', 'type', opt('Column:ItemType'), label('Type', 'Type'), 'center');
    add('cf1', 'cf', opt('ShowCfItem1'), label('Itemcf1', 'Item CF 1'), 'center');
    add('numdesc', 'numdesc', opt('Column:ItemNumberAndDescription'), label('Number/Description', 'Number / Description'), 'left');
    add('num', 'num', opt('Column:ItemNumber'), label('Number', 'Number'), 'left');
    add('desc', 'desc', opt('Column:ItemDescription'), label('Description', 'Description'), 'left');
    add('cf2', 'cf', opt('ShowCfItem2'), label('Itemcf2', 'Item CF 2'), 'center');
    if (!E.isUS) {
        add('taxCode', 'taxCode', opt('Column:ItemTaxCode'), label('TaxCode', 'Tax Code'), 'left');
        add('taxAmt', 'taxAmt', opt('Column:ItemTaxAmount'), label('TaxAmount', 'Tax Amount'), 'right');
        add('curTax', 'curTax', opt('Column:ItemCurrencyTax'), curHdr(label('TaxAmount', 'Tax Amount')), 'right');
    }
    add('date', 'date', opt('Column:ItemDateScheduled'), label('ItemDateScheduled', 'Date Scheduled'), 'center');
    add('unitPrice', 'unitPrice', opt('Column:ItemUnitPrice'), label('UnitPrice', 'Unit Price'), 'right');
    add('curUnitPrice', 'curUnitPrice', opt('Column:ItemCurrencyUnitPrice'), curHdr(label('UnitPrice', 'Unit Price')), 'right');
    add('qty', 'qty', opt('Column:ItemQuantityOrdered'), label('QtyOrdered', 'Qty Ordered'), 'right');
    add('total', 'total', opt('Column:ItemTotalPrice'), label('TotalPrice', 'Total Price'), 'right');
    add('curTotal', 'curTotal', opt('Column:ItemCurrencyTotalPrice'), curHdr(label('TotalPrice', 'Total Price')), 'right');
    add('cf3', 'cf', opt('ShowCfItem3'), label('Itemcf3', 'Item CF 3'), 'center');
    return cols;
}

// ============================================================================
//  ORDER PICKER — typeahead + browse with status / period filters (per user)
// ============================================================================
var PERIODS = [{ value: '30', label: '30 days' }, { value: '90', label: '90 days' }, { value: '365', label: '1 year' }, { value: 'all', label: 'All' }];
function pickFilterSql(f) {
    var where = [];
    var st = ((f && f.status) || []).map(function (x) { return parseInt(x, 10); }).filter(function (n) { return !isNaN(n); });
    if (st.length) where.push('so.statusId IN (' + st.join(',') + ')');
    var days = parseInt(f && f.period, 10);
    if (days > 0) where.push('so.dateCreated >= DATE_SUB(CURDATE(), INTERVAL ' + days + ' DAY)');
    return where;
}
async function searchOrders(term, f) {
    var where = pickFilterSql(f), params = [];
    if (term) {
        where.push('(so.num LIKE ? OR c.name LIKE ? OR so.customerPO LIKE ?)');
        params.push(term + '%', '%' + term + '%', '%' + term + '%');
    }
    var rows = await FBDoc.q(
        'SELECT so.id, so.num, c.name AS customer, st.name AS status, so.dateCreated AS datecreated, so.totalPrice AS totalprice, so.customerPO AS customerpo ' +
        'FROM so JOIN customer c ON c.id = so.customerId LEFT JOIN sostatus st ON st.id = so.statusId ' +
        (where.length ? 'WHERE ' + where.join(' AND ') + ' ' : '') +
        'ORDER BY so.dateCreated DESC, so.id DESC LIMIT 60', params);
    return rows.map(function (r) {
        return { value: r.id, label: r.num, sub: r.customer + (has(r.customerpo) ? ' · PO ' + r.customerpo : ''),
                 meta: [r.status || '', FBDoc.fmt.date(APP.env ? APP.env.date : 'dd/MM/yyyy', r.datecreated),
                        FBDoc.fmt.number(APP.env ? APP.env.total : '$ #,##0.00', r.totalprice, { rounding: 'halfUp' })] };
    });
}
// ============================================================================
//  THE APP — FBDoc.app runs the screen; this report supplies its document.
// ============================================================================
var APP = FBDoc.app({
    title: 'Sales Order',
    record: { code: 'SO', table: 'so', numColumn: 'num', noun: 'order', setting: 'set-so' },
    flags: [{ key: 'invoice', label: 'Invoice', title: 'Print as the Sales Invoice (SOInvoiceReport)', setting: 'set-invoice', reloadEnv: true }],
    sys: ['SO Notice', 'Estimate Title'],
    env: function (env, s) { env.notice = s['SO Notice'] || ''; env.estimateTitle = s['Estimate Title'] || ''; },
    presets: function (flags) { return flags.invoice ? [SO_REPORT_PATH, INV_REPORT_PATH] : [SO_REPORT_PATH]; },
    defaults: function (env) { return jrxmlDefaults(env); },
    options: OPTION_GROUPS,
    optionsIntro: 'the stock Sales Order report',
    fetch: function (id) { return fetchModel(id); },
    build: function (model, geom, app) { return buildDoc(model, geom, !!app.flags.invoice); },
    picker: {
        placeholder: 'SO #, customer or PO…',
        alias: 'so',
        where: pickFilterSql,
        search: function (term, f) { return searchOrders(term, f); },
        filters: async function (saved) {
            var statuses = [];
            try { statuses = await FBDoc.q('SELECT id, name FROM sostatus ORDER BY id'); } catch (e) { debugLog('sostatus: ' + FBDoc.errText(e), 'warn'); }
            return [
                { key: 'status', label: 'Status', multi: true, value: saved.status || [],
                  options: statuses.map(function (r) { return { value: String(r.id), label: r.name }; }) },
                { key: 'period', label: 'Created', value: saved.period || '365', options: PERIODS }
            ];
        }
    }
});
