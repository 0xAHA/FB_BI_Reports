<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Email</title>
<!--
  The rich email window's body editor (report_btn documents PoC). The email is a
  whole HTML document in an iframe in design mode, so a template's own head and
  style sheet are kept and shown as they will be sent. Java calls Composer.load(html)
  and Composer.html(). No libraries, no network.
-->
<style>
  html, body { margin: 0; height: 100%; }
  body { display: flex; flex-direction: column; font: 12px "Segoe UI", Arial, sans-serif; color: #415157; background: #f4f6f7; }
  .bar { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 8px; background: #fff; border-bottom: 1px solid #e3e3e3; }
  .bar button, .bar select { font: inherit; height: 26px; min-width: 26px; padding: 0 7px; border: 1px solid #e3e3e3; border-radius: 6px; background: #fff; color: #415157; cursor: pointer; }
  .bar .rich { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; }
  .bar button svg { display: block; margin: 0 auto; }
  .bar button:hover { background: #f7f7f7; border-color: #c6d0d4; }
  .bar button.on { background: #deeaf4; border-color: #cbe5fb; }
  .bar .sep { width: 1px; height: 20px; background: #e3e3e3; margin: 0 4px; }
  .bar input[type=color] { width: 30px; height: 26px; padding: 1px; border: 1px solid #e3e3e3; border-radius: 6px; background: #fff; cursor: pointer; }
  .bar .note { margin-left: auto; color: #8a979c; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 45%; }
  .link { display: none; gap: 6px; align-items: center; padding: 6px 8px; background: #fffbe8; border-bottom: 1px solid #f0e2a8; }
  .link.on { display: flex; }
  .link input { flex: 1; font: inherit; height: 24px; padding: 0 6px; border: 1px solid #c6d0d4; border-radius: 5px; }
  .wrap { flex: 1 1 auto; min-height: 0; display: flex; padding: 10px; }
  #ed, #src { flex: 1 1 auto; border: 1px solid #c6d0d4; border-radius: 6px; background: #fff; }
  #src { display: none; font: 12px Consolas, monospace; padding: 8px; resize: none; white-space: pre; }
  body.source #ed { display: none; }
  body.source #src { display: block; }
  body.source .rich { opacity: .35; pointer-events: none; }
</style>
</head>
<body>
<div class="bar">
  <span class="rich">
    <button type="button" data-cmd="bold" title="Bold (Ctrl+B)"><b>B</b></button>
    <button type="button" data-cmd="italic" title="Italic (Ctrl+I)"><i>I</i></button>
    <button type="button" data-cmd="underline" title="Underline (Ctrl+U)"><u>U</u></button>
    <select id="size" title="Text size">
      <option value="">Size</option><option value="2">Small</option><option value="3">Normal</option>
      <option value="4">Large</option><option value="5">Larger</option><option value="6">Huge</option>
    </select>
    <input type="color" id="color" value="#1a5276" title="Text colour">
    <span class="sep"></span>
    <button type="button" data-cmd="insertUnorderedList" title="Bulleted list"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="2.5" cy="4" r="1" fill="currentColor" stroke="none"/><circle cx="2.5" cy="8" r="1" fill="currentColor" stroke="none"/><circle cx="2.5" cy="12" r="1" fill="currentColor" stroke="none"/><line x1="6" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="6" y1="12" x2="14" y2="12"/></svg></button>
    <button type="button" data-cmd="insertOrderedList" title="Numbered list"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><text x="0.5" y="5.5" font-size="5" font-family="Arial" fill="currentColor" stroke="none">1</text><text x="0.5" y="9.5" font-size="5" font-family="Arial" fill="currentColor" stroke="none">2</text><text x="0.5" y="13.5" font-size="5" font-family="Arial" fill="currentColor" stroke="none">3</text><line x1="6" y1="4" x2="14" y2="4"/><line x1="6" y1="8" x2="14" y2="8"/><line x1="6" y1="12" x2="14" y2="12"/></svg></button>
    <button type="button" data-cmd="outdent" title="Decrease indent"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="3" x2="14" y2="3"/><line x1="8" y1="6.5" x2="14" y2="6.5"/><line x1="8" y1="9.5" x2="14" y2="9.5"/><line x1="2" y1="13" x2="14" y2="13"/><polyline points="5,6 2.5,8 5,10"/></svg></button>
    <button type="button" data-cmd="indent" title="Increase indent"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="3" x2="14" y2="3"/><line x1="8" y1="6.5" x2="14" y2="6.5"/><line x1="8" y1="9.5" x2="14" y2="9.5"/><line x1="2" y1="13" x2="14" y2="13"/><polyline points="2.5,6 5,8 2.5,10"/></svg></button>
    <span class="sep"></span>
    <button type="button" data-cmd="justifyLeft" title="Align left"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="3" x2="14" y2="3"/><line x1="2" y1="6.5" x2="10" y2="6.5"/><line x1="2" y1="10" x2="14" y2="10"/><line x1="2" y1="13.5" x2="10" y2="13.5"/></svg></button>
    <button type="button" data-cmd="justifyCenter" title="Centre"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="3" x2="14" y2="3"/><line x1="4" y1="6.5" x2="12" y2="6.5"/><line x1="2" y1="10" x2="14" y2="10"/><line x1="4" y1="13.5" x2="12" y2="13.5"/></svg></button>
    <button type="button" data-cmd="justifyRight" title="Align right"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><line x1="2" y1="3" x2="14" y2="3"/><line x1="6" y1="6.5" x2="14" y2="6.5"/><line x1="2" y1="10" x2="14" y2="10"/><line x1="6" y1="13.5" x2="14" y2="13.5"/></svg></button>
    <span class="sep"></span>
    <button type="button" id="linkBtn" title="Add a link (Ctrl+K)" aria-pressed="false"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6.6 9.4a2.6 2.6 0 0 0 3.7 0l2.4-2.4a2.6 2.6 0 0 0-3.7-3.7L8 4.3"/><path d="M9.4 6.6a2.6 2.6 0 0 0-3.7 0L3.3 9a2.6 2.6 0 0 0 3.7 3.7L8 11.7"/></svg></button>
    <button type="button" data-cmd="removeFormat" title="Clear the selected text's formatting">Clear</button>
    <span class="sep"></span>
    <button type="button" data-cmd="undo" title="Undo (Ctrl+Z)"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="5.5,3 2.5,6 5.5,9"/><path d="M2.5 6h7a4 4 0 0 1 0 8H7"/></svg></button>
    <button type="button" data-cmd="redo" title="Redo (Ctrl+Y)"><svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="10.5,3 13.5,6 10.5,9"/><path d="M13.5 6h-7a4 4 0 0 0 0 8H9"/></svg></button>
  </span>
  <span class="sep"></span>
  <button type="button" id="srcBtn" title="Edit the email's HTML">HTML</button>
  <span class="note" id="note"></span>
</div>
<div class="link" id="linkBar">
  <span>Link to</span><input id="linkUrl" type="text" placeholder="https://…">
  <button type="button" id="linkOk">Link</button><button type="button" id="linkCancel">Cancel</button>
</div>
<div class="wrap"><iframe id="ed" title="Email body"></iframe><textarea id="src" spellcheck="false" aria-label="Email HTML"></textarea></div>
<script>
(function () {
  var ed = document.getElementById('ed'), src = document.getElementById('src');
  var source = false, savedRange = null;
  var EMPTY = '<!DOCTYPE html><html><head><meta charset="UTF-8"></head><body style="font-family:Arial,sans-serif;font-size:14px"></body></html>';

  // A file dragged from Explorer onto the composer or the body would be opened by the
  // browser in place of the email. Attachments are added with Attach…, so drops are ignored.
  function noFileDrop(target) {
    ['dragover', 'drop'].forEach(function (t) {
      target.addEventListener(t, function (e) {
        var dt = e.dataTransfer;
        if (dt && Array.prototype.indexOf.call(dt.types || [], 'Files') >= 0) {
          e.preventDefault();
          if (t === 'dragover') dt.dropEffect = 'none';
        }
      });
    });
  }
  noFileDrop(window);

  function doc() { return ed.contentDocument; }
  function write(html) {
    var d = doc();
    d.open();
    d.write(html && String(html).trim() ? html : EMPTY);
    d.close();
    noFileDrop(d);
    d.designMode = 'on';
    try { d.execCommand('styleWithCSS', false, true); } catch (e) {}
    d.addEventListener('beforeinput', beforeDelete);
    d.addEventListener('input', afterDelete);
    d.addEventListener('keydown', undoClear);
    d.addEventListener('keydown', function (e) {
      if ((e.ctrlKey || e.metaKey) && (e.key === 'k' || e.key === 'K')) { e.preventDefault(); toggleLink(); }
    });
    d.addEventListener('selectionchange', function () { syncLink(); });
    if (typeof syncLink === 'function') syncLink();
  }

  // Deleting everything (select all, then Delete / Backspace / Cut) starts a plain
  // email: the template's own style sheet and wrapper elements go too, which the
  // browser would otherwise keep. Ctrl+Z straight after brings the template back.
  var beforeClear = null, cleared = null;
  function isEmpty(d) {
    var b = d.body;
    // No text and no picture: empty layout tables and wrappers a template leaves behind count as empty.
    return !b || (!b.textContent.replace(/\s/g, '') && !b.querySelector('img,hr,video'));
  }
  function beforeDelete(e) {
    beforeClear = null;
    if (!/^delete/.test(e.inputType || '')) return;
    var sel = ed.contentWindow.getSelection();
    if (sel && sel.rangeCount && !sel.isCollapsed) beforeClear = current();
  }
  function afterDelete(e) {
    if (!/^delete/.test(e.inputType || '') || beforeClear == null) return;
    var was = beforeClear;
    beforeClear = null;
    if (!isEmpty(doc())) return;
    setTimeout(function () {   // not inside the editor's own input event
      if (!isEmpty(doc())) return;
      write('');
      cleared = was;
      ed.contentWindow.focus();
      if (doc().body) doc().body.focus();
    }, 0);
  }
  function undoClear(e) {
    if (cleared == null) return;
    if ((e.ctrlKey || e.metaKey) && !e.shiftKey && (e.key === 'z' || e.key === 'Z') && isEmpty(doc())) {
      e.preventDefault();
      var html = cleared;
      cleared = null;
      write(html);
      ed.contentWindow.focus();
      return;
    }
    if (e.key.length === 1 || e.key === 'Enter') cleared = null;   // typing starts the new email
  }
  function current() {
    var d = doc();
    var dt = d.doctype ? '<!DOCTYPE ' + d.doctype.name + '>' : '<!DOCTYPE html>';
    return dt + '\n' + d.documentElement.outerHTML;
  }
  function exec(cmd, value) {
    var d = doc();
    ed.contentWindow.focus();
    d.execCommand(cmd, false, value == null ? null : value);
  }

  document.querySelectorAll('[data-cmd]').forEach(function (b) {
    b.addEventListener('mousedown', function (e) { e.preventDefault(); });
    b.addEventListener('click', function () { exec(b.getAttribute('data-cmd')); });
  });
  document.getElementById('size').addEventListener('change', function (e) {
    if (e.target.value) exec('fontSize', e.target.value);
    e.target.value = '';
  });
  document.getElementById('color').addEventListener('change', function (e) { exec('foreColor', e.target.value); });

  // The link button toggles: inside a link it removes that link, elsewhere it asks
  // for an address and links the selected text (or inserts the address as a link).
  var linkBar = document.getElementById('linkBar'), linkUrl = document.getElementById('linkUrl');
  var linkBtn = document.getElementById('linkBtn');
  function linkAt() {
    var sel = ed.contentWindow.getSelection();
    if (!sel || !sel.rangeCount) return null;
    var n = sel.anchorNode;
    if (n && n.nodeType === 3) n = n.parentNode;
    return n && n.closest ? n.closest('a[href]') : null;
  }
  function syncLink() {
    var on = !!linkAt();
    linkBtn.classList.toggle('on', on);
    linkBtn.setAttribute('aria-pressed', on ? 'true' : 'false');
    linkBtn.title = on ? 'Remove the link' : 'Add a link (Ctrl+K)';
  }
  function toggleLink() {
    var a = linkAt();
    if (a) {
      var sel = ed.contentWindow.getSelection(), r = doc().createRange();
      r.selectNodeContents(a);
      sel.removeAllRanges();
      sel.addRange(r);
      doc().execCommand('unlink', false, null);
      sel.collapseToEnd();
      syncLink();
      return;
    }
    var s = ed.contentWindow.getSelection();
    savedRange = s && s.rangeCount ? s.getRangeAt(0).cloneRange() : null;
    linkBar.classList.add('on');
    linkUrl.value = 'https://';
    linkUrl.focus();
    linkUrl.select();
  }
  linkBtn.addEventListener('mousedown', function (e) { e.preventDefault(); });
  linkBtn.addEventListener('click', toggleLink);
  function closeLink() { linkBar.classList.remove('on'); savedRange = null; }
  document.getElementById('linkCancel').addEventListener('click', closeLink);
  function applyLink() {
    var url = linkUrl.value.trim();
    if (url && url !== 'https://' && savedRange) {
      ed.contentWindow.focus();
      var sel = ed.contentWindow.getSelection();
      sel.removeAllRanges();
      sel.addRange(savedRange);
      if (savedRange.collapsed) {
        var esc = url.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');
        doc().execCommand('insertHTML', false, '<a href="' + esc + '">' + esc + '</a>');
      } else {
        doc().execCommand('createLink', false, url);
      }
    }
    closeLink();
    syncLink();
  }
  document.getElementById('linkOk').addEventListener('click', applyLink);
  linkUrl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { e.preventDefault(); applyLink(); }
    if (e.key === 'Escape') closeLink();
  });

  var srcBtn = document.getElementById('srcBtn');
  function setSource(on) {
    if (on === source) return;
    if (on) src.value = current(); else write(src.value);
    source = on;
    document.body.classList.toggle('source', on);
    srcBtn.classList.toggle('on', on);
    srcBtn.textContent = on ? 'Back to the email' : 'HTML';
  }
  srcBtn.addEventListener('click', function () { setSource(!source); });

  window.Composer = {
    load: function (html) { setSource(false); write(html); return true; },
    html: function () { if (source) setSource(false); return current(); },
    note: function (text) { var n = document.getElementById('note'); n.textContent = text || ''; n.title = text || ''; return true; }
  };
  write('');
})();
</script>
</body>
</html>
