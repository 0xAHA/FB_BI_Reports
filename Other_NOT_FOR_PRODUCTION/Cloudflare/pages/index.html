<!DOCTYPE html>
<!--
    Redirect-only landing page for the Fishbowl BI Pages site.
    Cloudflare Pages serves this when staff hit the apex
    (https://portal.example.com/) with no path. Without it the Pages router
    returns 404 since the only file in the deploy is report-sample.htm.

    location.search + location.hash are preserved so any URL params
    (?key=…, ?worker=…) carry through to report-sample.htm. The <meta
    refresh> fallback covers browsers where JS is disabled or blocked.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=report-sample.htm">
    <title>Fishbowl BI Portal</title>
    <script>
        location.replace('report-sample.htm' + location.search + location.hash);
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               display: flex; align-items: center; justify-content: center;
               height: 100vh; margin: 0; color: #475569; background: #f8fafc; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <p>Loading Fishbowl BI Portal — <a href="report-sample.htm">click here if not redirected</a>.</p>
</body>
</html>
