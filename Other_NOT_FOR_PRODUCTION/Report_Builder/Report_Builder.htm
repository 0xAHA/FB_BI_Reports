<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="fb-folder" content="Other">
    <meta name="fb-origin" content="custom">
    <meta name="description" content="Build your own report: drag fields into columns, groups and filters, with a live preview.">
    <script>
        // ================================================================
        // REPORT BUILDER (proof of concept): the drag-and-drop screen,
        // scripts/fb-builder.js, over the catalog (fb-model) and the report
        // runtime (fb-report). Until the plugin can publish, a report is
        // saved by pasting its definition into a builder report page.
        // ================================================================
        window.FB_REPORT = {
            key:   'cdx.bi.reportBuilder',
            name:  'Report Builder',
            build: 'UNSTAMPED'     // @fb-build
        };
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Builder</title>
    <script>
        {% Script fb-lib %}
    </script>
    <script>
        {% Script fb-model %}
    </script>
    <script>
        {% Script fb-report %}
    </script>
    <script>
        {% Script fb-builder %}
    </script>
    <style>
        {% Style fb-styles %}
    </style>
    <style>
        body { margin: 0; overflow: hidden; }
    </style>
</head>
<body>
<div id="fbb-host"></div>
<script>
    (function () {
        var host = document.getElementById('fbb-host');
        if (!window.FBReport || !window.FBModel || !window.FBBuilder) {
            host.innerHTML = '<div style="padding:24px;color:#8a1e30">The Report Builder needs the fb-model, fb-report and fb-builder scripts. One of them is not saved in Fishbowl.</div>';
            return;
        }
        FBBuilder.mount(host, { catalog: FBModel.catalog });
    })();
</script>
</body>
</html>
