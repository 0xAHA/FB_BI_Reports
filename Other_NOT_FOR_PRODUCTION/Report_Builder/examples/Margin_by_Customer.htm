<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="fb-folder" content="Custom">
    <meta name="fb-origin" content="custom">
    <meta name="fb-builder" content="1">
    <meta name="description" content="Posted revenue, cost and margin by customer and month: the first Report Builder example.">
    <script>
        // A Report Builder report: everything below comes from its definition (the JSON
        // block in the body). fb-report compiles it against the fb-model catalog each run.
        window.FB_REPORT = {
            key:   'cdx.bi.rbMarginByCustomer',
            name:  'Margin by Customer',
            build: 'UNSTAMPED'     // @fb-build
        };
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Margin by Customer</title>
    <script>
        {% Script fb-lib %}
    </script>
    <script>
        {% Script fb-doc %}
    </script>
    <script>
        {% Script fb-model %}
    </script>
    <script>
        {% Script fb-report %}
    </script>
    <style>
        {% Style fb-styles %}
    </style>
    <style>
        {% Style fb-doc-fonts %}
    </style>
</head>
<body class="rpt-page">
<div id="fbr"></div>
<script type="application/json" id="fb-report-spec">
{
  "kind": "fb-report-spec",
  "v": 1,
  "catalog": {
    "id": "fb.core",
    "version": 1
  },
  "subject": "sales.posted",
  "title": "Margin by Customer",
  "description": "Posted revenue, cost of goods and margin for each customer, month by month.",
  "calcs": [],
  "params": [
    {
      "id": "p.date",
      "label": "Posted",
      "field": "posted.date",
      "op": "between",
      "value": {
        "preset": "current_fy"
      },
      "ask": true
    },
    {
      "id": "p.group",
      "label": "Customer group",
      "field": "customer.group",
      "op": "in",
      "value": [],
      "ask": true
    }
  ],
  "steps": [
    {
      "id": "src",
      "type": "source",
      "subject": "sales.posted"
    },
    {
      "id": "flt",
      "type": "filter",
      "in": "src",
      "all": [
        {
          "param": "p.date"
        },
        {
          "param": "p.group"
        }
      ]
    },
    {
      "id": "grp",
      "type": "group",
      "in": "flt",
      "detail": false,
      "levels": [
        {
          "field": "customer.name"
        },
        {
          "field": "posted.date",
          "bucket": "month"
        }
      ]
    },
    {
      "id": "tbl",
      "type": "table",
      "in": "grp",
      "columns": [
        {
          "id": "customer",
          "ref": "customer.name"
        },
        {
          "id": "month",
          "ref": "posted.date",
          "bucket": "month",
          "label": "Month"
        },
        {
          "id": "orders",
          "ref": "posted.orders"
        },
        {
          "id": "revenue",
          "ref": "posted.revenue"
        },
        {
          "id": "cogs",
          "ref": "posted.cogs"
        },
        {
          "id": "margin",
          "ref": "posted.margin"
        },
        {
          "id": "marginPct",
          "ref": "posted.marginPct",
          "format": {
            "type": "percent",
            "dp": 1
          }
        }
      ],
      "sort": []
    }
  ],
  "page": {
    "size": "Letter",
    "orientation": "portrait"
  },
  "ui": {
    "flow": {
      "positions": {}
    }
  }
}
</script>
<script>FBReport.boot();</script>
</body>
</html>
