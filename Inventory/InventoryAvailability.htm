<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Inventory Availability — Fishbowl BI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared Fishbowl BI lib — inlined by Fishbowl from the saved "fb-lib"
       Script at save time. Source of truth: scripts/fb-lib.js. Powers the
       multi-select filter widgets (FBLib.Common.MultiSelect). Must sit BEFORE
       the shared style include so window.FBLib exists when inline code runs. -->
  <script>
    {% Script fb-lib %}
  </script>

  <!-- Shared Fishbowl BI stylesheet — injected from the saved "fb-styles"
       Style. Source of truth: scripts/fb-styles.css. Provides .hdr-btn, .btn,
       modal-*, toasts, scrollbar, spinner, tokens, .rpt-table, .ms-*, .row-link
       and the .b* badges. MUST come BEFORE the inline block so per-report
       rules win the cascade on identical selectors. -->
  <style>
    {% Style fb-styles %}
  </style>

  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; }

    /* Filter chip strip — permanently visible single-row layout.
       Filters wrap onto a second row only when the viewport can't
       fit them all horizontally. Each filter has a small uppercase
       label-chip to its left so the row reads scannable left-to-right. */
    #filtersPanel {
      background: white; border-bottom: 1px solid #e2e8f0;
      padding: 8px 16px; flex-shrink: 0;
      display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
      position: relative; z-index: 30;
    }
    #filtersPanel input[type=text] {
      padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 6px;
      font-size: 12px; color: #374151; background: white; font-family: 'Inter', sans-serif;
      height: 30px;
    }
    .fl-group { display: flex; align-items: center; gap: 6px; }
    .fl-label {
      font-size: 9px; font-weight: 700; letter-spacing: 0.04em;
      text-transform: uppercase; color: #64748b;
      padding: 4px 8px; background: #f1f5f9; border-radius: 999px;
      white-space: nowrap;
    }
    .fl-divider { width: 1px; height: 22px; background: #e2e8f0; flex-shrink: 0; }
    .fl-checkbox { display: flex; align-items: center; gap: 5px; font-size: 11px; color: #475569; cursor: pointer; }
    .fl-checkbox input { margin: 0; }
    /* Drill-down source toggles compact pill row */
    .src-pill {
      display: inline-flex; align-items: center; gap: 4px;
      padding: 3px 8px; border-radius: 999px;
      font-size: 11px; font-weight: 500; cursor: pointer;
      border: 1px solid #e2e8f0; background: white; color: #94a3b8;
      user-select: none; transition: all 0.12s;
    }
    .src-pill input { display: none; }
    .src-pill.on { background: #eff6ff; border-color: #bfdbfe; color: #1e3a8a; }
    .src-pill .dot { width: 6px; height: 6px; border-radius: 50%; background: #cbd5e1; flex-shrink: 0; }
    .src-pill.on .dot { background: #2563eb; }

    /* Multi-select skin (.ms-*) ships from fb-styles §32; widgets built by
       FBLib.Common.MultiSelect. */

    /* Table — base table styling (branded sticky header, zebra, hover) ships
       from fb-styles §29 as .rpt-table; the <table> keeps id="dataTable" for
       JS and adds that class. Only report-specific cells stay local. */
    #tableWrap { flex: 1; overflow: auto; }
    #dataTable th.num { text-align: right; }
    .num-cell { text-align: right; font-variant-numeric: tabular-nums; }
    .desc-cell { max-width: 240px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Chevron */
    .chev { display:inline-block; width:14px; text-align:center; color:#6366f1; cursor:pointer; font-size:10px;
            transition: transform 0.12s; user-select: none; }
    .chev.open { transform: rotate(90deg); }
    .chev.loading { color: #94a3b8; }

    /* Child rows — column-aligned with parent. The first cell is the
       chevron-column placeholder; the rest mirror the parent grid so
       qty values fall under the right header. */
    tr.child-row td { background: #fafbff !important; font-size: 11px; padding: 3px 10px; color: #334155; }
    tr.child-row:hover td { background: #eef2ff !important; }
    tr.child-row td.child-indent { width: 24px; }
    tr.child-row td.child-id-cell { padding-left: 30px; }
    tr.child-row td.child-desc { max-width: 320px; overflow: hidden; text-overflow: ellipsis; color: #475569; }
    tr.child-row td.child-num { font-variant-numeric: tabular-nums; }
    tr.child-row.child-row-msg td { padding-left: 30px; }
    tr.child-header td { background: #eef2ff !important; font-weight: 600; color: #1e3a5f; padding: 4px 10px 4px 30px; font-size: 11px; }
    tr.child-empty td { background: #fafbff !important; color: #94a3b8; font-style: italic; padding: 6px 10px 6px 30px; }

    /* Projected-availability timeline (per-part, top of drill-down). The SVG
       is generated in JS; the td just hosts it full-width. */
    tr.child-timeline td { background: #fbfcff !important; padding: 6px 12px 4px 30px; border-bottom: 1px solid #eef2f7; }
    tr.child-timeline:hover td { background: #fbfcff !important; }
    .tl-svg { display: block; width: 100%; }

    /* Source-type badges (child rows) */
    .src-badge { display:inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; }
    .src-SO     { background:#dbeafe; color:#1e40af; }
    .src-WO     { background:#fef3c7; color:#92400e; }
    .src-XO_OUT { background:#fde68a; color:#854d0e; }
    .src-XO_IN  { background:#d1fae5; color:#065f46; }
    .src-PO_IN  { background:#e0e7ff; color:#3730a3; }

    /* .row-link ships from fb-styles §31. */

    /* Column panel */
    #colPanel {
      position: absolute; z-index: 200; top: calc(100% + 4px); right: 0;
      background: white; border: 1px solid #d1d5db; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.13); width: 220px; max-height: 400px; overflow-y: auto;
    }
    .col-row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #f3f4f6; cursor: grab; user-select: none; }
    .col-row:last-child { border: none; }
    .col-row:active { cursor: grabbing; }
    .col-row.drag-over { background: #eff6ff; border-top: 2px solid #3b82f6; }
    .col-row.dragging { opacity: 0.4; }
    .col-row label { font-size: 12px; cursor: pointer; flex: 1; color: #374151; }
    .drag-handle { color: #94a3b8; font-size: 13px; flex-shrink: 0; cursor: grab; line-height: 1; }

    /* .hdr-btn family, toasts, scrollbar and @keyframes spin ship from
       fb-styles (§4/§14/§18/§19). Only report-specific bits stay local:
       the primary Apply button variant and the spinner class. */
    .hdr-btn.primary { background: var(--color-primary); color: #fff; border-color: var(--color-primary); }
    .hdr-btn.primary:hover { background: var(--color-primary-dark); border-color: var(--color-primary-dark); }
    .spinner { animation: spin 0.75s linear infinite; }
  </style>
</head>
<body class="bg-slate-50 flex flex-col">

<div class="toast-container" id="toastContainer"></div>

<!-- HEADER -->
<header class="bg-white border-b border-slate-200 px-5 flex items-center justify-between flex-shrink-0 shadow-sm" style="height:56px;">
  <div>
    <h1 class="text-base font-bold text-slate-900 leading-tight">Inventory Availability</h1>
    <p id="statusLine" class="text-xs text-slate-400 leading-tight">Initialising...</p>
  </div>
  <div class="flex items-center gap-2">

    <div class="relative" id="colWrap">
      <button onclick="toggleColPanel()" class="hdr-btn" id="colBtn">
        <svg fill="currentColor" viewBox="0 0 24 24"><circle cx="8" cy="6" r="1.5"/><circle cx="8" cy="12" r="1.5"/><circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="6" r="1.5"/><circle cx="16" cy="12" r="1.5"/><circle cx="16" cy="18" r="1.5"/></svg>
        Columns
      </button>
      <div id="colPanel" class="hidden">
        <div class="px-3 py-2 text-xs font-semibold text-slate-400 border-b border-slate-100 sticky top-0 bg-white">Show / Reorder</div>
        <div id="colList"></div>
      </div>
    </div>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <button onclick="refresh()" class="hdr-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
      Refresh
    </button>

    <div class="flex" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;flex-shrink:0;">
      <button onclick="expandAll()" class="hdr-btn" style="border:none;border-radius:0;border-right:1px solid #e2e8f0;" title="Expand every part that has drill-down data">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
        Expand
      </button>
      <button onclick="collapseAll()" class="hdr-btn" style="border:none;border-radius:0;" title="Collapse all">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14" stroke-linecap="round"/></svg>
        Collapse
      </button>
    </div>

    <!-- 3-way drill-down display selector: what an expanded part shows. -->
    <div class="flex" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;flex-shrink:0;" title="What an expanded part shows">
      <button onclick="setDrillMode('timeline')" class="hdr-btn drill-mode" data-mode="timeline" style="border:none;border-radius:0;border-right:1px solid #e2e8f0;">Timeline</button>
      <button onclick="setDrillMode('rows')" class="hdr-btn drill-mode" data-mode="rows" style="border:none;border-radius:0;border-right:1px solid #e2e8f0;">Rows</button>
      <button onclick="setDrillMode('both')" class="hdr-btn drill-mode" data-mode="both" style="border:none;border-radius:0;">Both</button>
    </div>

    <div class="flex" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;flex-shrink:0;">
      <button onclick="saveCurrentSettings()" class="hdr-btn" style="border:none;border-radius:0;border-right:1px solid #e2e8f0;" title="Save settings">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
        Save
      </button>
      <button onclick="resetSettings()" class="hdr-btn" style="border:none;border-radius:0;" title="Reset to defaults">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
        Reset
      </button>
    </div>

    <div class="w-px h-6 bg-slate-200 mx-1"></div>

    <button onclick="exportCSV()" class="hdr-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
      CSV
    </button>

    <button onclick="printTable()" class="hdr-btn">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
      Print
    </button>
  </div>
</header>

<!-- FILTER CHIP STRIP — always visible -->
<div id="filtersPanel">

  <div class="fl-group" style="min-width:200px;">
    <span class="fl-label">Location</span>
    <div class="ms-container" id="lg-ms" style="flex:1;">
      <div class="ms-trigger" id="lgTrigger" style="min-width:160px;"><span class="ms-placeholder" id="lgPlaceholder">All location groups</span></div>
      <div class="ms-dropdown hidden" id="lgDropdown">
        <div class="ms-actions"><span id="lgAll">Select All</span><span id="lgClear">Clear All</span></div>
        <div class="ms-list" id="lgList"></div>
      </div>
    </div>
  </div>

  <div class="fl-group">
    <span class="fl-label">Part</span>
    <!-- Fixed width: flex:none + a set width so the trigger doesn't grow as
         selection tags are added (fb-lib collapses to "+N more" after 3 tags
         and .ms-trigger clips with overflow:hidden). -->
    <div class="ms-container" id="part-ms" style="flex:0 0 210px; width:210px;">
      <div class="ms-trigger" id="partTrigger" style="width:100%;"><span class="ms-placeholder" id="partPlaceholder">All parts</span></div>
      <div class="ms-dropdown hidden" id="partDropdown">
        <div class="ms-search"><input id="partSearch" type="text" placeholder="Search part # or description…" /></div>
        <div class="ms-actions"><span id="partAll">Select All</span><span id="partClear">Clear All</span></div>
        <div class="ms-list" id="partList"></div>
      </div>
    </div>
  </div>

  <div class="fl-divider"></div>

  <label class="fl-checkbox"><input type="checkbox" id="showZero" /> Show zero qty</label>
  <label class="fl-checkbox"><input type="checkbox" id="activeOnly" checked /> Active only</label>
  <label class="fl-checkbox" title="Parts with no open orders stay visible but can't be expanded (no drill-down)"><input type="checkbox" id="onlyWithData" /> Only with data</label>
  <label class="fl-checkbox" title="Show only parts with open orders — allocated (SO/WO/TO) or on-order (PO/TO-in). Day-to-day operational view."><input type="checkbox" id="openOrdersOnly" /> Open orders only</label>

  <div class="fl-divider"></div>

  <div class="fl-group" style="flex-wrap:wrap; gap:4px;">
    <span class="fl-label">Drill-down</span>
    <label class="src-pill on" data-pill="SO"><span class="dot"></span><input type="checkbox" class="src-toggle" data-src="SO" checked /> SO</label>
    <label class="src-pill on" data-pill="WO"><span class="dot"></span><input type="checkbox" class="src-toggle" data-src="WO" checked /> WO</label>
    <label class="src-pill on" data-pill="XO_OUT"><span class="dot"></span><input type="checkbox" class="src-toggle" data-src="XO_OUT" checked /> TO send</label>
    <label class="src-pill on" data-pill="XO_IN"><span class="dot"></span><input type="checkbox" class="src-toggle" data-src="XO_IN" checked /> TO recv</label>
    <label class="src-pill on" data-pill="PO_IN"><span class="dot"></span><input type="checkbox" class="src-toggle" data-src="PO_IN" checked /> PO in</label>
  </div>

  <div style="flex:1;"></div>
  <button class="hdr-btn primary" onclick="refresh()" style="flex-shrink:0;">Apply</button>

</div>

<!-- TABLE -->
<div id="tableWrap">
  <table id="dataTable" class="rpt-table">
    <thead id="dataHead"></thead>
    <tbody id="dataBody"></tbody>
  </table>
</div>

<script>
// ════════════════════════════════════════════════════════════════════
// Inventory Availability — Fishbowl BI report
// Runs inside the Fishbowl client (JxBrowser). Shared chrome + the
// multi-select widgets come from the saved fb-lib / fb-styles Scripts,
// injected by the Script/Style directives in <head> and expanded at save
// time. (Never repeat the literal directive placeholder syntax in a
// comment — it's a global text replace and a second occurrence breaks it.)
// Settings key: 'inv.bi.availability.v1'
// ════════════════════════════════════════════════════════════════════

/* ── RUNTIME GUARD ── */
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#475569;"><h2>Not running inside Fishbowl</h2><p>This report requires the Fishbowl BI environment.</p></div>';
  throw new Error('Fishbowl API not available');
}
/* fb-lib guard — the multi-select filters are built by FBLib.Common.MultiSelect.
   If the fb-lib Script isn't deployed/expanded, surface the fix instead of a
   half-dead page. */
if (!window.FBLib || !FBLib.Common || !FBLib.Common.MultiSelect) {
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#8A1E30;background:#F0D7DD;">' +
    '<h2>fb-lib not loaded</h2><p>This report requires the shared <code>fb-lib</code> script. ' +
    'In BI Script Editor, confirm a Script named exactly <code>fb-lib</code> exists with the current ' +
    'contents of scripts/fb-lib.js, then re-save THIS report (directives expand at save time).</p></div>';
  throw new Error('FBLib not available');
}

const SETTINGS_KEY = 'inv.bi.availability.v1';
const ROW_CAP = 5000;

// ── Settings persistence — thin wrappers over the Fishbowl built-ins. ──
function _readSettings(key)        { return (typeof loadSettings === 'function') ? loadSettings(key) : null; }
function _writeSettings(key, value) { if (typeof saveSettings === 'function') saveSettings(key, value); }

// ── Column model ────────────────────────────────────────────────────
const COL_DEFS = {
  num:             { label: 'Part #',          numeric: false, defaultOn: true,  always: true },
  description:     { label: 'Description',     numeric: false, defaultOn: true },
  uom:             { label: 'UOM',             numeric: false, defaultOn: true },
  onHand:          { label: 'On Hand',         numeric: true,  defaultOn: true },
  allocated:       { label: 'Allocated',       numeric: true,  defaultOn: true },
  committed:       { label: 'Committed',       numeric: true,  defaultOn: true },
  unavailable:     { label: 'Not Available',   numeric: true,  defaultOn: false },
  dropShip:        { label: 'Drop Ship',       numeric: true,  defaultOn: false },
  onOrder:         { label: 'On Order',        numeric: true,  defaultOn: true },
  available:       { label: 'Available',       numeric: true,  defaultOn: true },
  availableToPick: { label: 'Avail to Pick',   numeric: true,  defaultOn: true },
};

const DEFAULT_COL_ORDER = ['num','description','uom','onHand','allocated','committed','unavailable','dropShip','onOrder','available','availableToPick'];

// ── State ───────────────────────────────────────────────────────────
let _lgList = [];      // [{val, lbl}]
let _selLg = new Set();
let _partOpts = [];    // [{val: part num, lbl}] — option list for the Part multi-select
let _selPart = new Set();  // selected part numbers (empty = all parts)
// Part-type filter removed: quantities are only tracked for Inventory parts
// (part.typeId = 10), so the parent query hard-filters to that type.
let _showZero = false;
let _activeOnly = true;
let _childSources = { SO: true, WO: true, XO_OUT: true, XO_IN: true, PO_IN: true };
// What an expanded part shows: 'timeline' (SVG only) | 'rows' (allocation
// lines only) | 'both'. Default 'both' so the timeline is visible out of the box.
let _drillMode = 'both';
// Keep no-order parts visible but non-expandable (see hasActivity below).
let _onlyWithData = false;
// Row FILTER (distinct from _onlyWithData): when on, hide parts with no open
// orders entirely, so only operationally-relevant parts (pending SO/PO/WO/TO)
// remain. Same activity predicate, but it removes rows rather than gating expand.
let _openOrdersOnly = false;

let _columnsVisible = {};
let _columnsOrder = DEFAULT_COL_ORDER.slice();

let _parts = [];                          // current parent rows
let _expanded = new Set();                // partIds currently expanded
let _childCache = new Map();              // partId -> array of child rows
let _childLoading = new Set();            // partIds currently fetching
let _limitHit = false;
let _initialExpandedToRestore = [];
let _pendingTimelines = [];               // timeline <td>s awaiting a width-measured render

// A part "has activity" if Fishbowl's rollups show any open demand or supply.
// With "Only with data" on, parts WITHOUT activity stay in the list but are
// made non-expandable (no chevron) rather than hidden — the row still shows,
// it just can't drill down. (expandAll uses the authoritative loaded
// allocations to decide what actually opens.)
function hasActivity(p) { return (p.allocated + p.committed + p.onOrder) > 0; }
// The parts actually rendered as rows: filtered to open-order parts when the
// "Open orders only" toggle is on. Shared by renderTable() and expandAll().
function shownParts() { return _openOrdersOnly ? _parts.filter(hasActivity) : _parts; }

// ── Helpers ─────────────────────────────────────────────────────────
function escSQL(s) { return String(s == null ? '' : s).replace(/'/g, "''"); }
function qstr(s) { return "'" + escSQL(s) + "'"; }
function fmtNum(n) {
  if (n == null || isNaN(n)) return '';
  const v = parseFloat(n);
  if (v === 0) return '0';
  // Show up to 4 decimals, strip trailing zeros
  return v.toLocaleString(undefined, { maximumFractionDigits: 4 });
}
// Honour the Fishbowl DateFormatShort property (e.g. MM/dd/yyyy, dd/MM/yyyy)
// like the summary reports do, rather than dumping raw ISO. getProperty is
// absent in standalone/REST mode, so fall back to MM/DD/YYYY there.
var _dateFmt = 'MM/DD/YYYY';
(function () {
  try {
    var jf = (typeof getProperty === 'function') ? getProperty('DateFormatShort', 'MM/dd/yyyy') : 'MM/dd/yyyy';
    _dateFmt = jf.replace(/yyyy/g, 'YYYY').replace(/dd/g, 'DD');
  } catch (e) {}
})();
function fmtDate(s) {
  if (!s || String(s).length < 10) return '';
  var str = String(s).split('T')[0].split(' ')[0]; // tolerate ISO or space-separated
  var y = str.substring(0, 4), m = str.substring(5, 7), d = str.substring(8, 10);
  return _dateFmt.replace('YYYY', y).replace('MM', m).replace('DD', d);
}

function showToast(message, type = 'info', duration = 3000) {
  const container = document.getElementById('toastContainer') || document.querySelector('.toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  // .toast / .toast-icon / .toast-msg skin ships from fb-styles §14.
  toast.innerHTML = `<span class="toast-icon">${icon}</span><span class="toast-msg"></span>`;
  toast.querySelector('.toast-msg').textContent = message;
  container.appendChild(toast);
  setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
  }, duration);
}

function setStatus(text) {
  document.getElementById('statusLine').textContent = text;
}

// ── qp() — Fishbowl data-query router ───────────────────────────────
// runQueryAsync resolves to an already-parsed array; runQuery returns a
// JSON string. The runtime guard above guarantees one of them exists.
async function qp(sql) {
  if (typeof runQueryAsync === 'function') {
    const r = await runQueryAsync(sql);
    return Array.isArray(r) ? r : (typeof r === 'string' ? JSON.parse(r) : []);
  }
  const r = runQuery(sql);
  return typeof r === 'string' ? JSON.parse(r) : (Array.isArray(r) ? r : []);
}

// ── openModule wrapper ──────────────────────────────────────────────
function openInModule(moduleName, item) {
  if (typeof openModule === 'function') {
    try { openModule(moduleName, item); } catch (e) { showToast('openModule failed: ' + e.message, 'error'); }
  } else {
    showToast('Module navigation only works inside Fishbowl: ' + moduleName + ' / ' + item, 'info');
  }
}

// ── UI toggles ──────────────────────────────────────────────────────
// (Filters panel is permanently visible; no toggle needed.)
function setDrillMode(mode) {
  if (['timeline','rows','both'].indexOf(mode) === -1) mode = 'both';
  _drillMode = mode;
  document.querySelectorAll('.drill-mode').forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
  renderTable();
}
function toggleColPanel() {
  const p = document.getElementById('colPanel');
  p.classList.toggle('hidden');
  if (!p.classList.contains('hidden')) renderColPanel();
}
document.addEventListener('click', e => {
  const wrap = document.getElementById('colWrap');
  if (wrap && !wrap.contains(e.target)) document.getElementById('colPanel').classList.add('hidden');
});

// ── Column panel ────────────────────────────────────────────────────
function renderColPanel() {
  const listEl = document.getElementById('colList');
  listEl.innerHTML = '';
  _columnsOrder.forEach((key, i) => {
    const def = COL_DEFS[key]; if (!def) return;
    const row = document.createElement('div'); row.className = 'col-row'; row.draggable = true; row.dataset.col = key;
    const handle = document.createElement('span'); handle.className = 'drag-handle'; handle.textContent = '⋮⋮';
    const cb = document.createElement('input'); cb.type = 'checkbox';
    cb.checked = _columnsVisible[key] !== false;
    if (def.always) { cb.disabled = true; cb.checked = true; }
    const label = document.createElement('label'); label.textContent = def.label;
    cb.addEventListener('change', () => {
      _columnsVisible[key] = cb.checked;
      renderTable();
    });
    row.appendChild(handle); row.appendChild(cb); row.appendChild(label);
    // Drag-and-drop reorder
    row.addEventListener('dragstart', ev => {
      row.classList.add('dragging');
      ev.dataTransfer.setData('text/plain', key);
      ev.dataTransfer.effectAllowed = 'move';
    });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', ev => { ev.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', ev => {
      ev.preventDefault(); row.classList.remove('drag-over');
      const from = ev.dataTransfer.getData('text/plain');
      if (!from || from === key) return;
      const fromIdx = _columnsOrder.indexOf(from);
      const toIdx = _columnsOrder.indexOf(key);
      if (fromIdx < 0 || toIdx < 0) return;
      _columnsOrder.splice(fromIdx, 1);
      _columnsOrder.splice(toIdx, 0, from);
      renderColPanel(); renderTable();
    });
    listEl.appendChild(row);
  });
}

// ── Settings save/load/reset ────────────────────────────────────────
function loadSavedState() {
  try {
    const raw = _readSettings(SETTINGS_KEY);
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s.v !== 1) return;
    if (Array.isArray(s.locationGroupIds)) _selLg = new Set(s.locationGroupIds.map(String));
    if (Array.isArray(s.partIds)) _selPart = new Set(s.partIds.map(String));
    if (typeof s.showZero === 'boolean') _showZero = s.showZero;
    if (typeof s.activeOnly === 'boolean') _activeOnly = s.activeOnly;
    if (s.columnsVisible && typeof s.columnsVisible === 'object') _columnsVisible = Object.assign({}, s.columnsVisible);
    if (Array.isArray(s.columnsOrder) && s.columnsOrder.length) {
      // Sanitize against current COL_DEFS
      const valid = s.columnsOrder.filter(k => COL_DEFS[k]);
      const missing = DEFAULT_COL_ORDER.filter(k => !valid.includes(k));
      _columnsOrder = valid.concat(missing);
    }
    if (Array.isArray(s.expandedPartIds)) _initialExpandedToRestore = s.expandedPartIds.map(n => parseInt(n, 10)).filter(n => !isNaN(n));
    if (s.childSources && typeof s.childSources === 'object') {
      ['SO','WO','XO_OUT','XO_IN','PO_IN'].forEach(k => {
        if (typeof s.childSources[k] === 'boolean') _childSources[k] = s.childSources[k];
      });
    }
    if (['timeline','rows','both'].indexOf(s.drillMode) !== -1) _drillMode = s.drillMode;
    if (typeof s.onlyWithData === 'boolean') _onlyWithData = s.onlyWithData;
    if (typeof s.openOrdersOnly === 'boolean') _openOrdersOnly = s.openOrdersOnly;
  } catch (e) { /* ignore corrupt */ }
}
function saveCurrentSettings() {
  const payload = {
    v: 1,
    locationGroupIds: [..._selLg],
    partIds: [..._selPart],
    showZero: _showZero,
    activeOnly: _activeOnly,
    columnsVisible: Object.assign({}, _columnsVisible),
    columnsOrder: _columnsOrder.slice(),
    expandedPartIds: [..._expanded],
    childSources: Object.assign({}, _childSources),
    drillMode: _drillMode,
    onlyWithData: _onlyWithData,
    openOrdersOnly: _openOrdersOnly,
    savedAt: new Date().toISOString(),
  };
  _writeSettings(SETTINGS_KEY, JSON.stringify(payload));
  showToast('Settings saved', 'success', 1800);
}
function resetSettings() {
  _writeSettings(SETTINGS_KEY, '');
  // Mutate the selection Sets in place — never reassign: FBLib's onChange
  // closures captured these exact Set objects at create() time.
  _selLg.clear();
  _selPart.clear();
  _showZero = false; _activeOnly = true;
  _onlyWithData = false; _openOrdersOnly = false;
  _columnsVisible = {}; _columnsOrder = DEFAULT_COL_ORDER.slice();
  _expanded.clear(); _childCache.clear();
  _childSources = { SO: true, WO: true, XO_OUT: true, XO_IN: true, PO_IN: true };
  document.querySelectorAll('.src-toggle').forEach(cb => cb.checked = true);
  document.getElementById('showZero').checked = false;
  document.getElementById('activeOnly').checked = true;
  document.getElementById('onlyWithData').checked = false;
  document.getElementById('openOrdersOnly').checked = false;
  setDrillMode('both');   // resets _drillMode + active buttons
  syncLgSelected();
  syncPartSelected();
  refresh();
  showToast('Settings reset', 'info', 1800);
}

// ── Sync UI with state ──────────────────────────────────────────────
function applyUiFromState() {
  document.getElementById('showZero').checked = !!_showZero;
  document.getElementById('activeOnly').checked = !!_activeOnly;
  document.getElementById('onlyWithData').checked = !!_onlyWithData;
  document.getElementById('openOrdersOnly').checked = !!_openOrdersOnly;
  document.querySelectorAll('.src-toggle').forEach(cb => {

  });

  document.querySelectorAll('.drill-mode').forEach(b => b.classList.toggle('active', b.dataset.mode === _drillMode));
}

  _showZero = document.getElementById('showZero').checked;
  _activeOnly = document.getElementById('activeOnly').checked;
  _onlyWithData = document.getElementById('onlyWithData').checked;

// ── Location groups ─────────────────────────────────────────────────
async function loadLocationGroups() {
  // Prefer the user's accessible LG IDs (inside Fishbowl); otherwise fall
  // back to all active LGs visible via the data-query endpoint.
  let userLgIds = null;
  try {
    if (typeof getLocationGroupList === 'function') {
      const arr = getLocationGroupList();
      if (Array.isArray(arr) && arr.length) userLgIds = arr.map(n => parseInt(n, 10)).filter(n => !isNaN(n));
    }
  } catch (_) {}
  let sql = 'SELECT id, name FROM locationgroup WHERE activeFlag = 1';
  if (userLgIds && userLgIds.length) sql += ' AND id IN (' + userLgIds.join(',') + ')';
  sql += ' ORDER BY name';
  const rows = await qp(sql);
  _lgList = rows.map(r => ({ val: String(r.id), lbl: r.name || ('LG ' + r.id) }));
}

// ── Part options (for the Part multi-select) ────────────────────────
// All inventory parts (typeId 10) by number; the widget's own search box lets
// the user find/pick specific parts. Capped so a huge catalogue can't stall the
// dropdown — the free-text Search still covers anything beyond the cap.
const PART_OPT_CAP = 6000;
async function loadPartOptions() {
  const rows = await qp('SELECT num, description FROM part WHERE typeid = 10 ORDER BY num LIMIT ' + PART_OPT_CAP);
  _partOpts = rows.map(r => ({
    val: String(r.num),
    lbl: (r.num || '') + (r.description ? ' — ' + r.description : '')
  }));
}

// ── Parent query (mirrors jrxml SQL) ────────────────────────────────
function lgListSql() {
  if (_selLg.size) return [..._selLg].map(v => parseInt(v, 10)).filter(n => !isNaN(n)).join(',');
  // No selection — include every LG the user can see
  return _lgList.map(o => parseInt(o.val, 10)).filter(n => !isNaN(n)).join(',') || '0';
}
async function loadParts() {
  const lgIds = lgListSql();
  const havingClause = _showZero ? '' : 'HAVING (qty + unavailable + dropship + qtycommitted + allocated + onorder) > 0';
  const activeClause = _activeOnly ? 'AND part.activeflag = 1' : '';
  // Part filter — the multi-select's chosen part numbers (empty = all parts).
  // Its own in-widget search finds parts by number OR description (the option
  // labels are "num — description"), which is why the free-text box was dropped.
  const partInClause = _selPart.size
    ? 'AND part.num IN (' + [..._selPart].map(n => qstr(n)).join(',') + ')'
    : '';
  const sql =
    "SELECT part.id, part.num, part.description, uom.code AS uomcode," +
    " COALESCE(inv.totalonhand, 0)            AS qty," +
    " COALESCE(inv.totalnotavailable, 0)      AS unavailable," +
    " COALESCE(inv.totalnotavailabletopick, 0) AS notavailtopick," +
    " COALESCE(inv.totaldropship, 0)          AS dropship," +
    " COALESCE(com.total, 0)                  AS qtycommitted," +
    " COALESCE(inv.totalallocated, 0)         AS allocated," +
    " COALESCE(inv.totalonorder, 0)           AS onorder" +
    " FROM part" +
    " LEFT JOIN uom ON part.uomid = uom.id" +
    " LEFT JOIN (SELECT partId," +
    "                  SUM(qtyOnHand)             AS totalonhand," +
    "                  SUM(qtyNotAvailable)       AS totalnotavailable," +
    "                  SUM(qtyNotAvailableToPick) AS totalnotavailabletopick," +
    "                  SUM(qtyDropship)           AS totaldropship," +
    "                  SUM(qtyAllocated)          AS totalallocated," +
    "                  SUM(qtyOnOrder)            AS totalonorder" +
    "           FROM qtyInventoryTotals" +
    "           WHERE locationGroupId IN (" + lgIds + ")" +
    "           GROUP BY partId) inv ON inv.partId = part.id" +
    " LEFT JOIN (SELECT partId, SUM(qty) AS total" +
    "           FROM qtyCommitted" +
    "           WHERE locationGroupId IN (" + lgIds + ")" +
    "           GROUP BY partId) com ON com.partId = part.id" +
    " WHERE part.id > 0" +
    " " + activeClause +
    " AND part.typeid = 10" +   // Inventory parts only — the only type with tracked qty
    " " + partInClause +
    " " + havingClause +
    " ORDER BY part.num" +
    " LIMIT " + (ROW_CAP + 1);

  const rows = await qp(sql);
  _limitHit = rows.length > ROW_CAP;
  _parts = rows.slice(0, ROW_CAP).map(r => ({
    id: parseInt(r.id, 10),
    num: r.num || '',
    description: r.description || '',
    uom: r.uomcode || '',
    onHand: parseFloat(r.qty) || 0,
    unavailable: parseFloat(r.unavailable) || 0,
    notAvailToPick: parseFloat(r.notavailtopick) || 0,
    dropShip: parseFloat(r.dropship) || 0,
    committed: parseFloat(r.qtycommitted) || 0,
    allocated: parseFloat(r.allocated) || 0,
    onOrder: parseFloat(r.onorder) || 0,
  })).map(p => {
    p.available = Math.max(0, p.onHand - p.allocated - p.unavailable + p.dropShip);
    p.availableToPick = Math.max(0, p.onHand - p.committed - p.notAvailToPick);
    return p;
  });
}

// ── Child / drill-down query ────────────────────────────────────────
function buildAllocationsSQL(partId) {
  const lgIds = lgListSql();

  // Per-source-item committed qty via pickitem. "Committed" specifically
  // means qty actually pulled onto a tag in a pick (pickitemstatus.id = 20
  // "Picked") — this is the subset that aggregates up to tag.qtyCommitted
  // in the parent QTYCOMMITTED view. Status 10 (Available / Open) lines
  // are merely allocated to a pick, not yet committed; they were inflating
  // the previous version so Committed equalled Allocated on every line.
  //
  // pickitemstatus values (Fishbowl convention):
  //   10 = Available     allocated to a pick but no tag pulled yet
  //   20 = Picked        qty pulled to a tag → counts as committed
  //   30 = Partial/Short
  //   40 = Voided
  //
  // Each branch LEFT JOINs the matching subquery so a row without a
  // pick still appears (committed = 0).
  // pickitem.qty is stored in pickitem.uomId, which may differ from the part
  // base UOM (~5% of picks do). Convert to base so committed reconciles with
  // the parent Committed column (tag.qtyCommitted, always base).
  const piSubBase = " ( SELECT %FK% AS itemId," +
                    "     SUM(CASE WHEN pickitem.uomId <> ppart.uomId AND puc.id > 0" +
                    "              THEN pickitem.qty * puc.multiply / puc.factor" +
                    "              ELSE pickitem.qty END) AS qtycommitted" +
                    "   FROM pickitem" +
                    "   JOIN pick ON pick.id = pickitem.pickId" +
                    "   JOIN part ppart ON ppart.id = pickitem.partId" +
                    "   LEFT JOIN uomconversion puc ON puc.toUomId = ppart.uomId AND puc.fromUomId = pickitem.uomId" +
                    "   WHERE %FK% IS NOT NULL" +
                    "     AND pickitem.statusId = 20" +
                    "     AND pick.statusId NOT IN (40)" +
                    "   GROUP BY %FK% ) ";
  const piSoSub = piSubBase.replace(/%FK%/g, 'pickitem.soItemId');
  const piWoSub = piSubBase.replace(/%FK%/g, 'pickitem.woItemId');
  const piXoSub = piSubBase.replace(/%FK%/g, 'pickitem.xoItemId');

  // UOM-normalise a line qty to the part BASE UOM (mirrors the
  // qtyInventoryTotals views: qty * multiply / factor when the line UOM
  // differs). Requires the branch to JOIN part (base UOM) and LEFT JOIN
  // uomconversion uc (to = part.uomId, from = <item>.uomId). Without this the
  // drill-down shows raw line qty (e.g. 4668 mm) that can't be compared to the
  // base-UOM On Hand / Allocated columns or fed to the timeline projection.
  function conv(rawExpr, itemAlias) {
    return "CASE WHEN " + itemAlias + ".uomId <> part.uomId AND uc.id > 0" +
           " THEN (" + rawExpr + ") * uc.multiply / uc.factor" +
           " ELSE (" + rawExpr + ") END";
  }

  // SO outbound (mirror QTYALLOCATEDSO filters)
  const soSql =
    "SELECT 'SO' AS srctype, so.num AS ordernum, so.id AS orderid," +
    "       c.name AS counterparty," +
    "       soitem.id AS lineid, soitem.soLineItem AS lineno," +
    "       " + conv("soitem.qtyToFulfill - soitem.qtyFulfilled", "soitem") + " AS qty," +
    "       COALESCE(pi.qtycommitted, 0) AS qtycommitted," +
    "       sostatus.name AS statusname, so.statusId AS statusid," +
    "       so.locationGroupId AS lgid, lg.name AS lgname," +
    "       soitem.dateScheduledFulfillment AS datesched," +
    "       NULL AS counterparty2" +
    " FROM soitem" +
    " JOIN product ON product.id = soitem.productId" +
    " JOIN part ON part.id = product.partId" +
    " JOIN so ON so.id = soitem.soId" +
    " LEFT JOIN customer c ON c.id = so.customerId" +
    " LEFT JOIN sostatus ON sostatus.id = so.statusId" +
    " LEFT JOIN locationgroup lg ON lg.id = so.locationGroupId" +
    " LEFT JOIN uomconversion uc ON uc.toUomId = part.uomId AND uc.fromUomId = soitem.uomId" +
    " LEFT JOIN" + piSoSub + "pi ON pi.itemId = soitem.id" +
    " WHERE product.partId = " + partId +
    "   AND soitem.typeId IN (10, 12)" +
    "   AND soitem.statusId IN (10, 14, 20, 30, 40)" +
    "   AND so.statusId IN (20, 25)" +
    "   AND so.locationGroupId IN (" + lgIds + ")";

  // WO outbound (raw-material requirements)
  const woSql =
    "SELECT 'WO' AS srctype, wo.num AS ordernum, wo.id AS orderid," +
    "       NULL AS counterparty," +
    "       woitem.id AS lineid, NULL AS lineno," +
    "       " + conv("woitem.qtyTarget", "woitem") + " AS qty," +
    "       COALESCE(pi.qtycommitted, 0) AS qtycommitted," +
    "       wostatus.name AS statusname, wo.statusId AS statusid," +
    "       wo.locationGroupId AS lgid, lg.name AS lgname," +
    "       wo.dateScheduledToStart AS datesched," +
    "       NULL AS counterparty2" +
    " FROM woitem" +
    " JOIN wo ON wo.id = woitem.woId" +
    " JOIN part ON part.id = woitem.partId" +
    " LEFT JOIN wostatus ON wostatus.id = wo.statusId" +
    " LEFT JOIN locationgroup lg ON lg.id = wo.locationGroupId" +
    " LEFT JOIN uomconversion uc ON uc.toUomId = part.uomId AND uc.fromUomId = woitem.uomId" +
    " LEFT JOIN" + piWoSub + "pi ON pi.itemId = woitem.id" +
    " WHERE woitem.partId = " + partId +
    "   AND woitem.typeId IN (20, 30)" +
    "   AND wo.statusId < 40" +
    "   AND wo.locationGroupId IN (" + lgIds + ")";

  // TO send (outbound transfer from fromLGID)
  const xoOutSql =
    "SELECT 'XO_OUT' AS srctype, xo.num AS ordernum, xo.id AS orderid," +
    "       fromLg.name AS counterparty," +
    "       xoitem.id AS lineid, NULL AS lineno," +
    "       " + conv("xoitem.qtyToFulfill - xoitem.qtyFulfilled", "xoitem") + " AS qty," +
    "       COALESCE(pi.qtycommitted, 0) AS qtycommitted," +
    "       xostatus.name AS statusname, xo.statusId AS statusid," +
    "       xo.fromLGID AS lgid, fromLg.name AS lgname," +
    "       xoitem.dateScheduledFulfillment AS datesched," +
    "       toLg.name AS counterparty2" +
    " FROM xoitem" +
    " JOIN xo ON xo.id = xoitem.xoId" +
    " JOIN part ON part.id = xoitem.partId" +
    " LEFT JOIN xostatus ON xostatus.id = xo.statusId" +
    " LEFT JOIN locationgroup fromLg ON fromLg.id = xo.fromLGID" +
    " LEFT JOIN locationgroup toLg ON toLg.id = xo.shipToLGID" +
    " LEFT JOIN uomconversion uc ON uc.toUomId = part.uomId AND uc.fromUomId = xoitem.uomId" +
    " LEFT JOIN" + piXoSub + "pi ON pi.itemId = xoitem.id" +
    " WHERE xoitem.partId = " + partId +
    "   AND xoitem.typeId = 10" +
    "   AND xoitem.statusId IN (10, 20, 30, 40, 50)" +
    "   AND xo.statusId IN (20, 30, 40, 50, 60)" +
    "   AND xo.fromLGID IN (" + lgIds + ")";

  // TO receive (inbound leg into shipToLGID). A transfer is a SINGLE xoitem
  // (typeId 10) carrying fromLGID (source) + shipToLGID (destination) — there is
  // NO separate typeId-20 "receive" row. So the IN leg is the SAME row as the
  // OUT leg, just filtered on shipToLGID instead of fromLGID. (The old
  // typeId = 20 filter matched nothing → the "TO Recv never shows" bug.)
  // No commit path (incoming, not outgoing).
  const xoInSql =
    "SELECT 'XO_IN' AS srctype, xo.num AS ordernum, xo.id AS orderid," +
    "       toLg.name AS counterparty," +
    "       xoitem.id AS lineid, NULL AS lineno," +
    "       " + conv("xoitem.qtyToFulfill - xoitem.qtyFulfilled", "xoitem") + " AS qty," +
    "       0 AS qtycommitted," +
    "       xostatus.name AS statusname, xo.statusId AS statusid," +
    "       xo.shipToLGID AS lgid, toLg.name AS lgname," +
    "       xoitem.dateScheduledFulfillment AS datesched," +
    "       fromLg.name AS counterparty2" +
    " FROM xoitem" +
    " JOIN xo ON xo.id = xoitem.xoId" +
    " JOIN part ON part.id = xoitem.partId" +
    " LEFT JOIN xostatus ON xostatus.id = xo.statusId" +
    " LEFT JOIN locationgroup fromLg ON fromLg.id = xo.fromLGID" +
    " LEFT JOIN locationgroup toLg ON toLg.id = xo.shipToLGID" +
    " LEFT JOIN uomconversion uc ON uc.toUomId = part.uomId AND uc.fromUomId = xoitem.uomId" +
    " WHERE xoitem.partId = " + partId +
    "   AND xoitem.typeId = 10" +
    "   AND xoitem.statusId IN (10, 20, 30, 40, 50)" +
    "   AND xo.statusId IN (20, 30, 40, 50, 60)" +
    "   AND xo.shipToLGID IN (" + lgIds + ")";

  // PO inbound — no commit path (incoming, not outgoing).
  // poitem.typeId: 10 = Purchase, 11 = Misc. Purchase (both incoming stock);
  // 20 = Credit Return (a return TO the vendor — outbound), 30 = Out Sourced,
  // 40 = Shipping. Earlier this filtered IN (20,30) — copied from the
  // QTYALLOCATEDPO view, which is Fishbowl's PO-*allocated* measure, NOT
  // on-order — so normal Purchase lines never appeared (e.g. LS100). Incoming
  // supply is Purchase + Misc Purchase.
  const poSql =
    "SELECT 'PO_IN' AS srctype, po.num AS ordernum, po.id AS orderid," +
    "       v.name AS counterparty," +
    "       poitem.id AS lineid, poitem.poLineItem AS lineno," +
    "       " + conv("poitem.qtyToFulfill - poitem.qtyFulfilled", "poitem") + " AS qty," +
    "       0 AS qtycommitted," +
    "       postatus.name AS statusname, po.statusId AS statusid," +
    "       po.locationGroupId AS lgid, lg.name AS lgname," +
    "       poitem.dateScheduledFulfillment AS datesched," +
    "       NULL AS counterparty2" +
    " FROM poitem" +
    " JOIN po ON po.id = poitem.poId" +
    " JOIN part ON part.id = poitem.partId" +
    " LEFT JOIN vendor v ON v.id = po.vendorId" +
    " LEFT JOIN postatus ON postatus.id = po.statusId" +
    " LEFT JOIN locationgroup lg ON lg.id = po.locationGroupId" +
    " LEFT JOIN uomconversion uc ON uc.toUomId = part.uomId AND uc.fromUomId = poitem.uomId" +
    " WHERE poitem.partId = " + partId +
    "   AND poitem.typeId IN (10, 11)" +
    "   AND poitem.statusId IN (10, 20, 30, 40, 45)" +
    "   AND po.statusId BETWEEN 20 AND 55" +
    "   AND po.locationGroupId IN (" + lgIds + ")";

  // Date-first ordering turns the drill-down into a chronological movement
  // list for the part: the soonest-dated obligation (inbound OR outbound)
  // sits at the top, so you read "what happens to this stock next" top-down.
  // NULL scheduled dates (only WOs — wo.dateScheduledToStart is nullable)
  // sort to the bottom rather than the top.
  return soSql + " UNION ALL " + woSql + " UNION ALL " + xoOutSql + " UNION ALL " + xoInSql + " UNION ALL " + poSql
       + " ORDER BY datesched IS NULL, datesched, srctype, ordernum";
}

async function loadAllocations(partId) {
  if (_childCache.has(partId)) return _childCache.get(partId);
  if (_childLoading.has(partId)) return null;
  _childLoading.add(partId);
  try {
    const rows = await qp(buildAllocationsSQL(partId));
    const norm = rows.map(r => ({
      srcType: r.srctype,
      orderNum: r.ordernum,
      orderId: r.orderid,
      counterparty: r.counterparty,
      counterparty2: r.counterparty2,
      lineNo: r.lineno,
      qty: parseFloat(r.qty) || 0,
      committed: parseFloat(r.qtycommitted) || 0,
      statusName: r.statusname,
      statusId: r.statusid,
      lgId: r.lgid,
      lgName: r.lgname,
      dateSched: r.datesched,
    }));
    _childCache.set(partId, norm);
    return norm;
  } finally {
    _childLoading.delete(partId);
  }
}

// ── Table render ────────────────────────────────────────────────────
function visibleColumns() {
  return _columnsOrder.filter(k => {
    const def = COL_DEFS[k]; if (!def) return false;
    if (def.always) return true;
    return _columnsVisible[k] !== false && (_columnsVisible[k] !== undefined || def.defaultOn);
  });
}

function renderTable() {
  const cols = visibleColumns();
  // Head — extra leading column for the chevron
  const head = document.getElementById('dataHead');
  let html = '<tr><th style="width:24px;"></th>';
  cols.forEach(k => {
    const def = COL_DEFS[k];
    html += '<th' + (def.numeric ? ' class="num"' : '') + '>' + def.label + '</th>';
  });
  html += '</tr>';
  head.innerHTML = html;

  const body = document.getElementById('dataBody');
  body.innerHTML = '';
  _pendingTimelines = [];

  const rows = shownParts();
  if (!rows.length) {
    const tr = document.createElement('tr');
    const msg = _parts.length ? 'No parts with open orders — uncheck “Open orders only”.' : 'No parts match the current filters.';
    tr.innerHTML = '<td colspan="' + (cols.length + 1) + '" style="padding:24px;text-align:center;color:#94a3b8;">' + msg + '</td>';
    body.appendChild(tr);
    setStatus(_parts.length ? _parts.length + ' parts · 0 with open orders' : '0 parts');
    return;
  }

  rows.forEach(p => {
    // "Only with data": parts with no open orders stay visible but are not
    // expandable (no chevron). Collapse any that were open when it turns on.
    const expandable = !(_onlyWithData && !hasActivity(p));
    if (!expandable) _expanded.delete(p.id);

    const tr = document.createElement('tr');
    tr.className = 'part-row';
    tr.dataset.partId = p.id;
    // Chevron cell — omitted for non-expandable parts.
    const chevTd = document.createElement('td');
    if (expandable) {
      const chev = document.createElement('span');
      chev.className = 'chev' + (_expanded.has(p.id) ? ' open' : '');
      chev.textContent = '▶';
      chev.addEventListener('click', e => { e.stopPropagation(); togglePart(p.id); });
      chevTd.appendChild(chev);
    }
    tr.appendChild(chevTd);

    cols.forEach(k => {
      const td = document.createElement('td');
      if (COL_DEFS[k].numeric) td.className = 'num-cell';
      let v;
      if (k === 'num') {
        const a = document.createElement('a');
        a.className = 'row-link';
        a.textContent = p.num;
        a.addEventListener('click', e => { e.preventDefault(); openInModule('Part', p.num); });
        td.appendChild(a);
      } else if (k === 'description') {
        td.className = 'desc-cell';
        td.textContent = p.description || '';
        td.title = p.description || '';
      } else if (k === 'uom') {
        td.textContent = p.uom || '';
      } else {
        v = p[k];
        td.textContent = fmtNum(v);
      }
      tr.appendChild(td);
    });
    body.appendChild(tr);

    if (expandable && _expanded.has(p.id)) {
      renderChildRows(p, body, cols.length + 1);
    }
  });

  flushTimelines();

  // Status line
  let status = rows.length + ' part' + (rows.length === 1 ? '' : 's');
  if (_openOrdersOnly && rows.length !== _parts.length) status += ' with open orders (of ' + _parts.length + ')';
  else if (_onlyWithData) status += ' · ' + _parts.filter(hasActivity).length + ' expandable';
  if (_limitHit) status += ' (limit ' + ROW_CAP + ' reached — refine filters)';
  if (_expanded.size) status += ' · ' + _expanded.size + ' expanded';
  setStatus(status);
}

// Map a child source-type to the labels and the parent-column qty
// targets. Outbound (SO/WO/TO_OUT) puts qty into Allocated + committed
// into Committed. Inbound (PO_IN / TO_IN) puts qty into On Order; no
// committed contribution. Centralised so badge + column mapping
// agree everywhere.
const SRC_META = {
  SO:     { label: 'SO Out',  module: 'Sales Order',    isOutbound: true  },
  WO:     { label: 'WO Out',  module: 'Work Order',     isOutbound: true  },
  XO_OUT: { label: 'TO Send', module: 'Transfer Order', isOutbound: true  },
  XO_IN:  { label: 'TO Recv', module: 'Transfer Order', isOutbound: false },
  PO_IN:  { label: 'PO In',   module: 'Purchase Order', isOutbound: false },
};

// ── Projected-availability timeline (inline SVG) ────────────────────
// A 6-month step line of projected on-hand for one part: seed at current
// On Hand, then each dated allocation (−) / incoming order (+) steps the
// level at its scheduled date. Line is GREEN where the projection stays
// ≥ 0 and RED where it goes negative (a stock-out window) — reinforced by
// the zero baseline, the red under-zero band, and per-event signed flags,
// so direction is never conveyed by colour alone. Overdue items clamp to
// today; items past the 6-month window (or undated) are noted, not plotted.
// These are the fb brand STATUS colours (good / critical), a reserved
// palette — not a categorical series set — so the categorical-separation
// validator does not apply.
const _MONTHS3 = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function _xmlEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

function buildTimelineSVG(part, enabled, W) {
  const H = 108;
  const padL = 12, padR = 14, plotTop = 40, plotH = 48, plotBot = plotTop + plotH;
  const plotL = padL, plotR = Math.max(padL + 40, W - padR), plotW = plotR - plotL;

  const TODAY = new Date(); TODAY.setHours(0, 0, 0, 0);
  const END = new Date(TODAY.getFullYear(), TODAY.getMonth() + 6, TODAY.getDate());
  const t0 = TODAY.getTime(), tEnd = END.getTime(), span = Math.max(1, tEnd - t0);

  const GREEN = '#1B7A46', RED = '#C43046', GRID = '#e2e8f0', AXIS = '#94a3b8', MUTE = '#94a3b8';

  // Classify each enabled line into a plotted event (dated, within window),
  // clamping overdue to today; count beyond-window + undated for a footnote.
  let beyond = 0, undated = 0;
  const evts = [];
  enabled.forEach(c => {
    const meta = SRC_META[c.srcType] || { isOutbound: false, label: c.srcType };
    const delta = meta.isOutbound ? -c.qty : c.qty;
    const s = c.dateSched ? String(c.dateSched) : '';
    if (s.length < 10) { undated++; return; }
    const d = new Date(s); if (isNaN(d.getTime())) { undated++; return; }
    d.setHours(0, 0, 0, 0);
    if (d.getTime() > tEnd) { beyond++; return; }
    evts.push({ t: Math.max(t0, d.getTime()), delta, c, meta, overdue: d.getTime() < t0 });
  });
  evts.sort((a, b) => a.t - b.t);

  // Rolling projected level across the plotted events.
  let lvl = part.onHand, minL = Math.min(0, lvl), maxL = Math.max(0, lvl);
  evts.forEach(e => { lvl += e.delta; e.after = lvl; if (lvl < minL) minL = lvl; if (lvl > maxL) maxL = lvl; });

  const rangePad = ((maxL - minL) || Math.abs(maxL) || 1) * 0.15;
  let vTop = maxL + rangePad, vBot = minL - rangePad;
  if (vTop === vBot) { vTop += 1; vBot -= 1; }
  const x = t => plotL + (t - t0) / span * plotW;
  const y = v => plotTop + (vTop - v) / (vTop - vBot) * plotH;
  const y0 = y(0);

  const out = [];
  out.push('<svg class="tl-svg" viewBox="0 0 ' + W + ' ' + H + '" style="height:' + H + 'px" xmlns="http://www.w3.org/2000/svg" font-family="Inter, sans-serif">');

  // Under-zero danger band (position + colour both signal the stock-out zone).
  if (vBot < 0) out.push('<rect x="' + plotL + '" y="' + y0.toFixed(1) + '" width="' + plotW.toFixed(1) + '" height="' + (plotBot - y0).toFixed(1) + '" fill="' + RED + '" opacity="0.06"/>');

  // Month gridlines + labels.
  let mt = new Date(TODAY.getFullYear(), TODAY.getMonth(), 1);
  if (mt.getTime() < t0) mt = new Date(mt.getFullYear(), mt.getMonth() + 1, 1);
  while (mt.getTime() <= tEnd) {
    const gx = x(mt.getTime());
    out.push('<line x1="' + gx.toFixed(1) + '" y1="' + plotTop + '" x2="' + gx.toFixed(1) + '" y2="' + plotBot + '" stroke="' + GRID + '" stroke-width="1"/>');
    out.push('<text x="' + gx.toFixed(1) + '" y="' + (plotBot + 12) + '" fill="' + MUTE + '" font-size="9" text-anchor="middle">' + _MONTHS3[mt.getMonth()] + (mt.getMonth() === 0 ? " '" + String(mt.getFullYear()).slice(2) : '') + '</text>');
    mt = new Date(mt.getFullYear(), mt.getMonth() + 1, 1);
  }

  // Zero baseline.
  out.push('<line x1="' + plotL + '" y1="' + y0.toFixed(1) + '" x2="' + plotR + '" y2="' + y0.toFixed(1) + '" stroke="' + AXIS + '" stroke-width="1" stroke-dasharray="3 3"/>');
  out.push('<text x="' + (plotL - 3) + '" y="' + (y0 + 3).toFixed(1) + '" fill="' + MUTE + '" font-size="8" text-anchor="end">0</text>');

  // Step line: horizontal segments coloured by level sign + vertical risers.
  let curT = t0, curL = part.onHand;
  const hseg = [], vseg = [];
  evts.forEach(e => { hseg.push([curT, e.t, curL]); vseg.push([e.t, curL, e.after]); curT = e.t; curL = e.after; });
  hseg.push([curT, tEnd, curL]);
  hseg.forEach(s => out.push('<line x1="' + x(s[0]).toFixed(1) + '" y1="' + y(s[2]).toFixed(1) + '" x2="' + x(s[1]).toFixed(1) + '" y2="' + y(s[2]).toFixed(1) + '" stroke="' + (s[2] < 0 ? RED : GREEN) + '" stroke-width="2" stroke-linecap="round"/>'));
  vseg.forEach(s => out.push('<line x1="' + x(s[0]).toFixed(1) + '" y1="' + y(s[1]).toFixed(1) + '" x2="' + x(s[0]).toFixed(1) + '" y2="' + y(s[2]).toFixed(1) + '" stroke="' + (s[2] < 0 ? RED : GREEN) + '" stroke-width="1.5" opacity="0.5"/>'));

  // Start marker (on-hand anchor) with a native tooltip.
  out.push('<circle cx="' + x(t0).toFixed(1) + '" cy="' + y(part.onHand).toFixed(1) + '" r="2.5" fill="' + (part.onHand < 0 ? RED : GREEN) + '"><title>On hand today: ' + _xmlEsc(fmtNum(part.onHand)) + '</title></circle>');

  // Event flags — signed qty in a coloured pill, staggered across two rows to
  // reduce overlap; a stem drops to the data point. Sign text is the primary
  // signal; colour reinforces (green in / red out).
  evts.forEach((e, i) => {
    const px = x(e.t), py = y(e.after);
    const inbound = e.delta > 0, fCol = inbound ? GREEN : RED;
    const sign = inbound ? '+' : '−';               // U+2212 minus
    const txt = sign + fmtNum(Math.abs(e.delta));
    const fw = Math.max(16, txt.length * 5.4 + 8), fy = (i % 2 === 1) ? 20 : 6;
    let fx = px - fw / 2; if (fx < plotL) fx = plotL; if (fx + fw > plotR) fx = plotR - fw;
    const title = _xmlEsc((e.meta.label || e.c.srcType) + ' ' + (e.c.orderNum || '') + ' · ' + txt + ' · ' + fmtDate(e.c.dateSched) + (e.overdue ? ' (overdue)' : '') + ' → proj OH ' + fmtNum(e.after));
    out.push('<circle cx="' + px.toFixed(1) + '" cy="' + py.toFixed(1) + '" r="2.5" fill="' + (e.after < 0 ? RED : GREEN) + '"/>');
    out.push('<line x1="' + px.toFixed(1) + '" y1="' + (fy + 12) + '" x2="' + px.toFixed(1) + '" y2="' + py.toFixed(1) + '" stroke="' + fCol + '" stroke-width="1" opacity="0.4"/>');
    out.push('<g><title>' + title + '</title><rect x="' + fx.toFixed(1) + '" y="' + fy + '" width="' + fw.toFixed(1) + '" height="12" rx="2" fill="' + fCol + '"/>');
    out.push('<text x="' + (fx + fw / 2).toFixed(1) + '" y="' + (fy + 9) + '" fill="#fff" font-size="8.5" font-weight="600" text-anchor="middle">' + _xmlEsc(txt) + '</text></g>');
  });

  // Footnotes: lowest projected point (if it dips negative) + out-of-window count.
  if (minL < 0) out.push('<text x="' + plotL + '" y="' + (plotTop - 6) + '" fill="' + RED + '" font-size="9" font-weight="600">Low ' + _xmlEsc(fmtNum(minL)) + '</text>');
  if (!evts.length) out.push('<text x="' + ((plotL + plotR) / 2).toFixed(1) + '" y="' + (plotTop - 6) + '" fill="' + MUTE + '" font-size="9" text-anchor="middle">No scheduled movements in the next 6 months</text>');
  const notes = [];
  if (beyond) notes.push('+' + beyond + ' beyond 6mo');
  if (undated) notes.push(undated + ' undated');
  if (notes.length) out.push('<text x="' + plotR + '" y="' + (plotTop - 6) + '" fill="' + MUTE + '" font-size="8" text-anchor="end">' + _xmlEsc(notes.join(' · ')) + '</text>');

  out.push('</svg>');
  return out.join('');
}
function flushTimelines() {
  if (!_pendingTimelines.length) return;
  // One layout read per batch (td.clientWidth) → width-accurate, undistorted SVG.
  _pendingTimelines.forEach(function (job) {
    const w = Math.max(360, (job.td.clientWidth || 900) - 16);
    try { job.td.innerHTML = buildTimelineSVG(job.part, job.enabled, w); }
    catch (e) { job.td.textContent = 'timeline unavailable'; }
  });
  _pendingTimelines = [];
}

function renderChildRows(part, body, colSpan) {
  const cache = _childCache.get(part.id);
  const cols = visibleColumns();

  if (_childLoading.has(part.id) || cache === undefined) {
    const tr = document.createElement('tr');
    tr.className = 'child-row child-row-msg';
    tr.dataset.parentPartId = part.id;
    const td = document.createElement('td');
    td.colSpan = colSpan;
    td.innerHTML = '<span class="spinner" style="display:inline-block;width:10px;height:10px;border:2px solid #cbd5e1;border-top-color:#3b82f6;border-radius:50%;"></span> Loading allocations…';
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }
  // Filter by enabled sources
  const enabled = cache.filter(c => _childSources[c.srcType]);
  if (!enabled.length) {
    const tr = document.createElement('tr');
    tr.className = 'child-empty';
    tr.dataset.parentPartId = part.id;
    const td = document.createElement('td');
    td.colSpan = colSpan;
    td.textContent = 'No matching open orders for this part.';
    tr.appendChild(td);
    body.appendChild(tr);
    return;
  }
  // Timeline (top of the drill-down) — shown in 'timeline' and 'both' modes.
  // The SVG needs the rendered cell width, so defer it: append an empty td
  // now and let flushTimelines() fill it after the table has laid out.
  if (_drillMode === 'timeline' || _drillMode === 'both') {
    const tlTr = document.createElement('tr');
    tlTr.className = 'child-timeline';
    tlTr.dataset.parentPartId = part.id;
    const tlTd = document.createElement('td');
    tlTd.colSpan = colSpan;
    tlTr.appendChild(tlTd);
    body.appendChild(tlTr);
    _pendingTimelines.push({ td: tlTd, part: part, enabled: enabled });
  }

  // Allocation detail rows — shown in 'rows' and 'both' modes only.
  if (_drillMode === 'timeline') return;

  // Header row
  const hdr = document.createElement('tr');
  hdr.className = 'child-header';
  hdr.dataset.parentPartId = part.id;
  const hdrTd = document.createElement('td');
  hdrTd.colSpan = colSpan;
  hdrTd.innerHTML = 'Allocations · ' + enabled.length + ' line' + (enabled.length === 1 ? '' : 's');
  hdr.appendChild(hdrTd);
  body.appendChild(hdr);

  // Rolling projected on-hand: seed at the part's current On Hand, then walk
  // the date-sorted lines — outbound (SO/WO/TO-out) consumes, inbound (PO/
  // TO-in) replenishes. When projected on-hand can't cover an outbound line
  // at its scheduled date, that quantity renders red (the shortfall point).
  let running = part.onHand;

  enabled.forEach(c => {
    const meta = SRC_META[c.srcType] || { label: c.srcType, module: '', isOutbound: false };

    running += meta.isOutbound ? -c.qty : c.qty;
    const shortfall = meta.isOutbound && running < 0;

    const tr = document.createElement('tr');
    tr.className = 'child-row';
    tr.dataset.parentPartId = part.id;
    tr.title = 'Projected on-hand after this line: ' + fmtNum(running);

    // Leading empty cell (chevron column on parent rows)
    const chevTd = document.createElement('td');
    chevTd.className = 'child-indent';
    tr.appendChild(chevTd);

    // Pre-compute the qty values that land in the aggregate columns
    // so each column-cell render is a single lookup.
    const cellQty = {
      allocated:  meta.isOutbound ? c.qty       : null,
      committed:  meta.isOutbound ? c.committed : null,
      onOrder:    !meta.isOutbound ? c.qty      : null,
    };

    cols.forEach((k, idx) => {
      const td = document.createElement('td');
      if (COL_DEFS[k].numeric) td.className = 'num-cell child-num';

      if (k === 'num') {
        // Badge + order # (clickable) + line #
        td.className = 'child-id-cell';
        const badge = document.createElement('span');
        badge.className = 'src-badge src-' + c.srcType;
        badge.textContent = meta.label;
        td.appendChild(badge);
        const link = document.createElement('a');
        link.className = 'row-link';
        link.style.marginLeft = '6px';
        link.textContent = c.orderNum || '—';
        link.addEventListener('click', e => { e.preventDefault(); openInModule(meta.module, c.orderNum); });
        td.appendChild(link);
        if (c.lineNo != null) {
          const ln = document.createElement('span');
          ln.style.cssText = 'color:#64748b;margin-left:6px;font-size:10px;';
          ln.textContent = '· #' + c.lineNo;
          td.appendChild(ln);
        }
      } else if (k === 'description') {
        // Counterparty + arrow (for TO) + status + scheduled date
        td.className = 'desc-cell child-desc';
        // Lead with the scheduled date so the date-first ordering reads as a
        // timeline; counterparty / status follow.
        const bits = [];
        if (c.dateSched) bits.push(fmtDate(c.dateSched));
        if (c.counterparty) bits.push(c.counterparty);
        if (c.counterparty2 && c.srcType.startsWith('XO')) bits.push('→ ' + c.counterparty2);
        if (c.statusName) bits.push(c.statusName);
        td.textContent = bits.join(' · ');
        td.title = td.textContent;
      } else if (k === 'uom') {
        td.textContent = c.lgName || '';
        td.style.color = '#64748b';
      } else if (cellQty[k] != null) {
        td.textContent = fmtNum(cellQty[k]);
        td.style.fontWeight = '600';
        if (shortfall && k === 'allocated') {
          // Projected on-hand goes negative here — this demand isn't covered
          // by on-hand + earlier inbound supply at its scheduled date.
          td.style.color = '#C43046';
          td.title = 'Projected on-hand after this line: ' + fmtNum(running) + ' — NOT covered';
        } else {
          td.style.color = (k === 'committed') ? '#92400e'
                         : (k === 'onOrder')   ? '#065f46'
                                                : '#1e3a5f';
        }
      } else {
        // Empty placeholder for columns this child doesn't contribute to
        td.textContent = '';
        td.style.color = '#cbd5e1';
      }
      tr.appendChild(td);
    });

    body.appendChild(tr);
  });
}

async function togglePart(partId) {
  if (_expanded.has(partId)) {
    _expanded.delete(partId);
    renderTable();
    return;
  }
  _expanded.add(partId);
  renderTable();
  if (!_childCache.has(partId)) {
    try {
      await loadAllocations(partId);
    } catch (e) {
      showToast('Failed to load allocations: ' + (e.message || e), 'error', 4000);
      _childCache.set(partId, []);
    }
    renderTable();
  }
}

function expandAll() {
  // Only expand parts that actually have drill-down data for the enabled
  // sources. Use the cache when present; otherwise load, then expand only if
  // the result is non-empty. Operates on the currently shown rows.
  shownParts().forEach(p => {
    if (_onlyWithData && !hasActivity(p)) return;   // non-expandable while the toggle is on
    const cached = _childCache.get(p.id);
    if (cached !== undefined) {
      if (cached.some(c => _childSources[c.srcType])) _expanded.add(p.id);
    } else if (!_childLoading.has(p.id)) {
      loadAllocations(p.id).then(rows => {
        if (rows && rows.some(c => _childSources[c.srcType])) { _expanded.add(p.id); renderTable(); }
      }).catch(() => {});
    }
  });
  renderTable();
}
function collapseAll() {
  _expanded.clear(); renderTable();
}

// ── Refresh pipeline ────────────────────────────────────────────────
async function refresh() {
  readUiToState();
  setStatus('Loading parts…');
  try {
    await loadParts();
  } catch (e) {
    setStatus('Error: ' + (e.message || e));
    showToast('Query failed: ' + (e.message || e), 'error', 5000);
    return;
  }
  // Filters changed → per-part child caches may be stale (different LG scope),
  // so drop them all. We must then RE-FETCH whatever stays expanded — otherwise
  // an already-open part shows its drill-down against an empty cache and sits on
  // "Loading allocations…" forever (the Apply-hang bug).
  _childCache.clear();
  const validIds = new Set(_parts.map(p => p.id));
  // Drop expanded parts that fell out of the current result set.
  [..._expanded].forEach(id => { if (!validIds.has(id)) _expanded.delete(id); });
  // First load only: fold in the saved-expanded set.
  if (_initialExpandedToRestore.length) {
    const ids = _initialExpandedToRestore;
    _initialExpandedToRestore = [];
    ids.forEach(id => { if (validIds.has(id)) _expanded.add(id); });
  }
  // renderTable() also prunes parts made non-expandable by the current toggles,
  // so re-fetch over the pruned _expanded set afterwards.
  renderTable();
  [..._expanded].forEach(id => {
    loadAllocations(id).then(() => renderTable()).catch(() => {});
  });
}

// ── CSV export ──────────────────────────────────────────────────────
function csvEscape(v) {
  if (v == null) return '';
  const s = String(v);
  if (/[",\n\r]/.test(s)) return '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function exportCSV() {
  const cols = visibleColumns();
  const lines = [];
  // Parent header
  lines.push(['Row Type'].concat(cols.map(k => COL_DEFS[k].label)).concat(['Child Source','Order','Line','Counterparty','Counterparty 2','Status','LG','Scheduled','Allocated Qty','Committed Qty','On Order Qty']).map(csvEscape).join(','));
  _parts.forEach(p => {
    const parentCells = cols.map(k => {
      if (k === 'num') return p.num;
      if (k === 'description') return p.description;
      if (k === 'uom') return p.uom;
      return p[k];
    });
    lines.push(['PART'].concat(parentCells).concat(['','','','','','','','','','','']).map(csvEscape).join(','));
    if (_expanded.has(p.id)) {
      const children = _childCache.get(p.id) || [];
      children.filter(c => _childSources[c.srcType]).forEach(c => {
        const meta = SRC_META[c.srcType] || {};
        const blank = cols.map(() => '');
        const row = ['CHILD'].concat(blank).concat([
          meta.label || c.srcType,
          c.orderNum, c.lineNo == null ? '' : c.lineNo,
          c.counterparty || '', c.counterparty2 || '',
          c.statusName || '', c.lgName || '',
          fmtDate(c.dateSched),
          meta.isOutbound ? c.qty : '',
          meta.isOutbound ? c.committed : '',
          !meta.isOutbound ? c.qty : ''
        ]);
        lines.push(row.map(csvEscape).join(','));
      });
    }
  });
  const blob = new Blob([lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const stamp = new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19);
  a.href = url; a.download = 'inventory_availability_' + stamp + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

function printTable() { window.print(); }

// ── Bootstrap ───────────────────────────────────────────────────────
async function bootstrapData() {
  try {
    await loadLocationGroups();
    // The LG + Part widgets were built in init(); swap in the real option lists
    // and re-apply any saved selection.
    setLgItems(_lgList);
    syncLgSelected();
    await loadPartOptions();
    setPartItems(_partOpts);
    syncPartSelected();
    await refresh();
  } catch (e) {
    setStatus('Error: ' + (e.message || e));
    showToast('Init failed: ' + (e.message || e), 'error', 5000);
  }
}

async function init() {
  loadSavedState();
  applyUiFromState();

  // Listen for save-on-change for child source toggles, so the cached
  // child rows just re-render rather than re-fetching.
  document.querySelectorAll('.src-toggle').forEach(cb => {
    const pill = cb.closest('.src-pill');
    const syncPill = () => { if (pill) pill.classList.toggle('on', cb.checked); };
    syncPill();
    cb.addEventListener('change', () => {
      _childSources[cb.dataset.src] = cb.checked;
      syncPill();
      renderTable();
    });
  });

  // "Only with data" and "Open orders only" are pure client-side toggles over
  // already-loaded parts — re-render instantly, no re-query.
  document.getElementById('onlyWithData').addEventListener('change', e => {
    _onlyWithData = e.target.checked;
    renderTable();
  });
  document.getElementById('openOrdersOnly').addEventListener('change', e => {
    _openOrdersOnly = e.target.checked;
    renderTable();
  });

  // Build the LG + Part multi-selects up front (their option lists are swapped
  // in by bootstrapData once the queries resolve). Saved selection is applied
  // here via the Sets passed to create(). Each build is isolated so a widget
  // that fails to construct (e.g. an fb-lib mismatch) degrades to "filter
  // missing" + a visible reason, instead of aborting the whole report load.
  try { buildLgMS(); } catch (e) { console.error('[InvAvail] buildLgMS failed:', e); }
  try { buildPartMS(); }
  catch (e) {
    console.error('[InvAvail] buildPartMS failed:', e);
    showToast('Part filter unavailable — ' + (e && e.message ? e.message : e) + ' (re-save fb-lib, then this report)', 'error', 7000);
  }

  await bootstrapData();
}

document.addEventListener('DOMContentLoaded', init);
</script>
