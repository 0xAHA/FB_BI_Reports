<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Report Launcher — mockup</title>
<!--
  MOCKUP: Report Launcher. This is Phase 1 of the plan, a dummy rendering.

  It is standalone, with no fb-lib and no Fishbowl bridges, so it opens
  straight in a browser. The sample rows come from demodb bireport/biscript
  (2026-10-09). Descriptions on custom reports are illustrative, because most
  live ones only repeat the report name. State is kept in memory only.

  The tokens are copied from scripts/fb-styles.css §1 so the page reads like
  the real reports. The real report includes fb-styles instead.
-->
<style>
:root {
    --fb-blue: #2d9cdb; --fb-blue-accent: #1e7bb4;
    --fb-blue-hover: #4FB0E4; --fb-blue-pressed: #176C9E;
    --fb-success: #1B7A46; --fb-warning: #B26A14;
    --fb-negative: #C43046; --fb-neutral: #506872;
    --bg-1: #F7F7F7; --bg-2: #EBEEED; --bg-3: #E3E3E3; --bg-4: #C6D0D4;
    --border: #E3E3E3; --border-strong: #C6D0D4;
    --menu-bg: #0B3140; --menu-bg-2: #0E3646;
    --c-primary: #101010; --c-secondary: #506872; --c-tertiary: #8FA1A7;
    --tint-blue: #DEEAF4; --tint-blue-2: #CBE5FB;
    --acc-purple: #845EEB; --acc-purple-bg: #D9CEF7; --acc-purple-con: #3D2380;
    --acc-maroon: #802842; --acc-maroon-bg: #F0D7DD; --acc-maroon-con: #5E1D30;
    --acc-orange: #F69133; --acc-orange-bg: #F5E7DD; --acc-orange-con: #8A4E10;
    --acc-yellow: #F7C23A; --acc-yellow-bg: #FBEDC4; --acc-yellow-con: #7A5A08;
    --acc-sage: #DBE8E1; --acc-sage-con: #1B7A46;
    --font: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    --r-btn: 6px; --r-card: 10px; --r-pill: 999px;
    --sh1: 0 1px 3px rgba(16,16,16,.10);
    --sh2: 0 4px 12px rgba(16,16,16,.13);
    --sh3: 0 12px 32px rgba(16,16,16,.24);
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { font-family: var(--font); font-size: 13px; color: var(--c-primary); background: var(--bg-1); }
button, select, input { font-family: inherit; }

/* Category tones: icon colour + chip tint */
.t-sales         { --tc: #1e7bb4; --tb: #DEEAF4; }
.t-purchasing    { --tc: #B26A14; --tb: #F5E7DD; }
.t-manufacturing { --tc: #6A45D1; --tb: #E6DEFA; }
.t-inventory     { --tc: #1B7A46; --tb: #DBE8E1; }
.t-shipping      { --tc: #8A6A0A; --tb: #FBEDC4; }
.t-parts         { --tc: #802842; --tb: #F0D7DD; }
.t-customers     { --tc: #176C9E; --tb: #CBE5FB; }
.t-dashboards    { --tc: #0E3646; --tb: #DDE5E8; }
.t-utilities     { --tc: #415157; --tb: #E3E3E3; }
.t-other         { --tc: #8FA1A7; --tb: #EEF1F1; }
.t-standard      { --tc: #1e7bb4; --tb: #DEEAF4; }
.t-favs          { --tc: #C8701A; --tb: #F5E7DD; }
.t-recent        { --tc: #506872; --tb: #EBEEED; }

/* Top bar, after fb-styles §22 */
.topbar { position: sticky; top: 0; z-index: 40; background: #fff; border-bottom: 1px solid var(--border); padding: 0 22px; }
.topbar-row1 { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; padding: 8px 0; flex-wrap: wrap; }
.title-wrap { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.crumb { font-size: 11px; color: var(--c-tertiary); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
.title-wrap h1 { font-size: 19px; font-weight: 800; letter-spacing: -.01em; margin: 0; line-height: 1.1; }
.subline { font-size: 11.5px; color: var(--c-secondary); }
.subline .admin-tag { display: inline-block; margin-left: 6px; padding: 0 7px; border-radius: var(--r-pill); background: var(--menu-bg); color: #fff; font-size: 10.5px; font-weight: 700; line-height: 17px; }
.top-actions { display: flex; align-items: center; gap: 8px; }
.search { position: relative; }
.search input { width: 340px; height: 36px; border: 1px solid var(--border); border-radius: var(--r-btn);
    padding: 0 34px 0 34px; font-size: 13px; color: var(--c-primary); background: var(--bg-1); outline: none; transition: .15s; }
.search input:focus { border-color: var(--fb-blue); background: #fff; box-shadow: 0 0 0 3px rgba(45,156,219,.18); }
.search > svg { position: absolute; left: 10px; top: 9px; width: 17px; height: 17px; color: var(--c-tertiary); pointer-events: none; }
.search kbd { position: absolute; right: 9px; top: 9px; font: 600 11px/16px var(--font); color: var(--c-tertiary);
    border: 1px solid var(--border-strong); border-radius: 4px; padding: 0 5px; background: #fff; pointer-events: none; }
.search input:focus + kbd, .search input:not(:placeholder-shown) + kbd { display: none; }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-btn); overflow: hidden; }
.seg button { height: 34px; width: 36px; border: 0; background: #fff; color: var(--c-secondary); display: grid; place-items: center; cursor: pointer; }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button svg { width: 17px; height: 17px; }
.seg button.on { background: var(--tint-blue); color: var(--fb-blue-accent); }

/* Category chip bar, after fb-styles §25 .fchip */
.catbar { display: flex; flex-wrap: wrap; gap: 6px; padding: 0 0 10px; }
.fchip { height: 28px; padding: 0 11px; border-radius: var(--r-pill); border: 1px solid var(--border-strong); background: #fff;
    color: var(--c-secondary); font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 6px;
    cursor: pointer; white-space: nowrap; transition: .15s; }
.fchip:hover { background: var(--bg-1); }
.fchip .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--tc); }
.fchip .n { color: var(--c-tertiary); font-weight: 600; }
.fchip.on { background: var(--tint-blue); border-color: var(--tint-blue-2); color: var(--fb-blue-accent); }
.fchip.on .n { color: var(--fb-blue-accent); }
.fchip:disabled { opacity: .45; cursor: default; }

main { padding: 18px 22px 96px; max-width: 1480px; margin: 0 auto; }

/* Sections */
.sec { margin-bottom: 20px; scroll-margin-top: 120px; }
.sec-head { display: flex; align-items: center; gap: 9px; width: 100%; background: none; border: 0; padding: 4px 2px; cursor: pointer; text-align: left; color: var(--c-primary); }
.sec-head .chev { width: 16px; height: 16px; color: var(--c-tertiary); transition: transform .15s; flex: 0 0 auto; }
.sec.collapsed .chev { transform: rotate(-90deg); }
.sec-ico { width: 24px; height: 24px; border-radius: 7px; display: grid; place-items: center; background: var(--tb); color: var(--tc); flex: 0 0 auto; }
.sec-ico svg { width: 15px; height: 15px; }
.sec-title { font-size: 14px; font-weight: 700; }
.sec-head:hover .sec-title { color: var(--fb-blue-accent); }
.sec-count { font-size: 11px; font-weight: 700; color: var(--c-secondary); background: var(--bg-2); border-radius: var(--r-pill); padding: 1px 8px; }
.sec-hint { margin-left: auto; font-size: 11.5px; color: var(--c-tertiary); font-weight: 500; }
.sec-body { padding-top: 10px; }
.sec.collapsed .sec-body { display: none; }
.divider { height: 1px; background: var(--border); margin: 4px 0 22px; }

/* Tile grid */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.view-compact .grid { grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 6px; }

.tile { position: relative; background: #fff; border: 1px solid var(--border); border-radius: var(--r-card); box-shadow: var(--sh1);
    padding: 14px 12px 12px 14px; display: flex; flex-direction: column; gap: 10px; min-height: 136px;
    transition: border-color .15s, box-shadow .15s, transform .15s; }
.tile:hover { border-color: var(--tint-blue-2); box-shadow: var(--sh2); transform: translateY(-1px); }
.tile:focus-within { border-color: var(--fb-blue); box-shadow: 0 0 0 3px rgba(45,156,219,.18); }
.tile-head { display: flex; align-items: flex-start; gap: 11px; }
.ico { flex: 0 0 auto; width: 40px; height: 40px; border-radius: 10px; background: var(--tb); color: var(--tc); display: grid; place-items: center; }
.ico svg { width: 21px; height: 21px; }
/* The whole tile opens the report: the button's ::after stretches over it.
   Tools and the admin row sit above it (z-index 2). */
.tile-main { flex: 1; min-width: 0; border: 0; background: none; padding: 0; margin: 0; text-align: left; cursor: pointer; color: inherit; font: inherit; outline: none; }
.tile-main::after { content: ''; position: absolute; inset: 0; border-radius: var(--r-card); }
.tile-kicker { display: block; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--tc); margin-bottom: 2px; }
.tile-name { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    font-size: 13.5px; font-weight: 700; line-height: 1.3; color: var(--c-primary); }
.tile:hover .tile-name { color: var(--fb-blue-accent); }
.tile-desc { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    margin-top: 4px; font-size: 12px; color: var(--c-secondary); line-height: 1.45; }
.tile-desc.none { color: var(--c-tertiary); font-style: italic; }
.tile-tools { position: relative; z-index: 2; display: flex; gap: 0; margin: -6px -4px 0 0; }
.tbtn { width: 28px; height: 28px; border-radius: 7px; border: 0; background: none; display: grid; place-items: center; color: var(--bg-4); cursor: pointer; transition: .12s; }
.tile:hover .tbtn { color: var(--c-tertiary); }
.tbtn:hover { background: var(--bg-1); color: var(--c-secondary) !important; }
.tbtn svg { width: 17px; height: 17px; }
.tbtn.on.star { color: var(--acc-orange) !important; }
.tbtn.on.pin  { color: var(--fb-blue) !important; }
.tbtn.on svg { fill: currentColor; }
.tile-foot { margin-top: auto; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; padding-left: 51px; }
.chip { font-size: 10.5px; font-weight: 700; padding: 2px 7px; border-radius: var(--r-pill); background: var(--bg-2); color: var(--c-secondary); white-space: nowrap; line-height: 14px; }
.chip.fb { background: var(--tint-blue); color: var(--fb-blue-pressed); }
.chip.std { background: var(--acc-sage); color: var(--acc-sage-con); }
.when { margin-left: auto; font-size: 11px; color: var(--c-tertiary); white-space: nowrap; }
.tile-admin { position: relative; z-index: 2; display: flex; align-items: center; gap: 6px; margin: 0 -12px -12px -14px;
    padding: 7px 12px 7px 14px; border-top: 1px dashed var(--border-strong); background: #FAFBFB; border-radius: 0 0 var(--r-card) var(--r-card);
    font-size: 11px; font-weight: 600; color: var(--c-secondary); }
.tile-admin select { flex: 1; min-width: 0; font-size: 11.5px; padding: 3px 6px; border: 1px solid var(--border-strong); border-radius: 6px; background: #fff; color: var(--c-secondary); }
.tile-admin select.override { border-color: var(--fb-blue); color: var(--fb-blue-accent); font-weight: 600; }

/* Compact view: one row per report */
.view-compact .tile { min-height: 0; padding: 8px 8px 8px 10px; gap: 0; flex-direction: row; align-items: center; }
.view-compact .tile-head { flex: 1; min-width: 0; align-items: center; gap: 10px; }
.view-compact .ico { width: 30px; height: 30px; border-radius: 8px; }
.view-compact .ico svg { width: 16px; height: 16px; }
.view-compact .tile-name { -webkit-line-clamp: 1; font-size: 13px; }
.view-compact .tile-desc { -webkit-line-clamp: 1; margin-top: 1px; font-size: 11.5px; }
.view-compact .tile-kicker, .view-compact .tile-foot, .view-compact .tile-admin { display: none; }
.view-compact .tile-tools { margin: 0; }

mark { background: #FBEDC4; color: inherit; border-radius: 3px; padding: 0 1px; }

/* Empty states */
.empty-row { border: 1.5px dashed var(--border-strong); border-radius: var(--r-card); padding: 14px 16px; color: var(--c-tertiary);
    font-size: 12.5px; display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,.6); }
.empty-row svg { width: 18px; height: 18px; flex: 0 0 auto; }
.empty-state { text-align: center; padding: 70px 20px; color: var(--c-secondary); }
.empty-state svg { width: 44px; height: 44px; color: var(--bg-4); }
.empty-state .title { font-size: 15px; font-weight: 700; color: var(--c-primary); margin: 10px 0 4px; }
.empty-state .hint { font-size: 12.5px; color: var(--c-tertiary); margin-bottom: 14px; }
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; font-size: 12px; font-weight: 600;
    border: 1px solid var(--border-strong); background: #fff; color: #415157; border-radius: 7px; cursor: pointer; }
.btn:hover { background: var(--bg-2); }

/* Mockup controls (not part of the design) */
.mock-ctl { position: fixed; left: 16px; bottom: 16px; z-index: 60; background: var(--menu-bg); color: #fff; border-radius: 10px;
    box-shadow: var(--sh3); padding: 7px 8px 7px 12px; display: flex; align-items: center; gap: 10px; font-size: 12px; font-weight: 600; }
.mock-ctl .lbl { color: #9FC3D3; text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; }
.mock-ctl .mseg { display: inline-flex; background: var(--menu-bg-2); border-radius: 7px; padding: 2px; }
.mock-ctl .mseg button, .mock-ctl .reset { border: 0; background: none; color: #CFE3EC; font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 5px; cursor: pointer; }
.mock-ctl .mseg button.on { background: #fff; color: var(--menu-bg); }
.mock-ctl .reset:hover { color: #fff; }

/* Toasts, fb-styles §14 */
.toast-container { position: fixed; bottom: 1rem; right: 1rem; z-index: 9999; display: flex; flex-direction: column; gap: .5rem; pointer-events: none; }
.toast { pointer-events: auto; min-width: 280px; max-width: min(380px, calc(100vw - 2rem)); padding: 12px 14px; background: #fff; border-radius: 10px;
    box-shadow: 0 10px 25px -5px rgba(0,0,0,.2); border-left: 4px solid var(--fb-blue); display: flex; gap: 10px;
    animation: toastIn .25s ease-out; transition: opacity .25s ease; }
.toast .toast-msg { font-size: 12.5px; color: #415157; font-weight: 500; line-height: 1.4; }
.toast .toast-msg b { color: var(--c-primary); display: block; margin-bottom: 2px; }
@keyframes toastIn { from { transform: translateX(400px); opacity: 0; } to { transform: none; opacity: 1; } }

@media (max-width: 760px) {
    .topbar { padding: 0 16px; }
    main { padding: 14px 16px 96px; }
    .top-actions { width: 100%; }
    .search { flex: 1; }
    .search input { width: 100%; }
    .catbar { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
    .sec-hint { display: none; }
    .grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="topbar">
    <div class="topbar-row1">
        <div class="title-wrap">
            <span class="crumb">BI Reports</span>
            <h1>Reports</h1>
            <span class="subline" id="subline"></span>
        </div>
        <div class="top-actions">
            <label class="search">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
                <input id="q" type="search" placeholder="Search reports by name or description" autocomplete="off" aria-label="Search reports">
                <kbd>/</kbd>
            </label>
            <div class="seg" role="group" aria-label="View">
                <button id="vTiles" title="Tiles" aria-label="Tiles view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.5"/></svg></button>
                <button id="vCompact" title="Compact list" aria-label="Compact list view"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg></button>
            </div>
        </div>
    </div>
    <nav class="catbar" id="catbar" aria-label="Categories"></nav>
</div>

<main id="main"></main>

<div class="mock-ctl" aria-label="Mockup controls">
    <span class="lbl">Mockup</span>
    <span>View as</span>
    <span class="mseg">
        <button id="asUser" class="on">User</button>
        <button id="asAdmin">Admin</button>
    </span>
    <button class="reset" id="reset" title="Restore the sample state">Reset</button>
</div>
<div class="toast-container" id="toasts"></div>

<script>

    [62, '- Part - Part Activity', 'Everything that touched a part: orders, receipts, picks, adjustments and cost changes.', 0, null, null, 5],
    [9,  'Part QR Code Label', 'Resizable part labels with QR code', 0, 'part-qr-code-label', 5, 380],
    [5,  'Top Products Chart', 'Shows the top products by revenue', 0, 'top-products', 4, 380],
    [48, 'Customer Status', 'Review and change customer account status in bulk.', 0, null, null, 60],
    [30, 'Company Dashboard', 'Dashboard for miscellaneous company details.', 0, 'company-dashboard', 12, 30],
    [17, '- Dashboard', '- Dashboard', 0, null, null, 260],
    [16, '- Dashboard - Sales', 'Dashboard - Sales', 0, null, null, 260],
    [15, '- Dashboard - Purchasing', '- Dashboard - Purchasing', 0, null, null, 260],
    [47, 'Audit Trail', 'Who changed what, and when, across orders, parts and settings.', 0, null, null, 8],
    [55, 'Fishbowl Import Builder', 'Build Fishbowl CSV imports from a spreadsheet, with validation.', 0, null, null, 70],
    [28, '- PPvP Validation', '5. PPvP Validation', 0, null, null, 330],
].map(([id, name, description, widget, fbname, fbversion, days]) =>
    ({ id, name, description, widget, fbname, fbversion, datelastmodified: NOW - days * DAY }));

// ---- Categories ------------------------------------------------------------
const CATS = [
    { id: 'sales',         label: 'Sales',                  icon: 'sales' },
    { id: 'purchasing',    label: 'Purchasing',             icon: 'purchasing' },
    { id: 'manufacturing', label: 'Manufacturing',          icon: 'manufacturing' },
    { id: 'inventory',     label: 'Inventory',              icon: 'inventory' },
    { id: 'shipping',      label: 'Shipping & Receiving',   icon: 'shipping' },
    { id: 'parts',         label: 'Parts & Products',       icon: 'parts' },
    { id: 'customers',     label: 'Customers & Vendors',    icon: 'customers' },
    { id: 'dashboards',    label: 'Dashboards & Analytics', icon: 'dashboards' },
    { id: 'utilities',     label: 'Utilities & Admin',      icon: 'utilities' },
    { id: 'other',         label: 'Other',                  icon: 'other' },
];
const CAT = Object.fromEntries(CATS.map(c => [c.id, c]));

// '- Folder - Report' prefixes that map straight to a category. Dashboard is
// generic: the rest of the name decides the category, and the display name
// becomes '<rest> Dashboard'.
const FOLDER_ALIAS = {
    sales: 'sales', purchasing: 'purchasing', purchase: 'purchasing',
    manufacturing: 'manufacturing', mfg: 'manufacturing', inventory: 'inventory',
    part: 'parts', parts: 'parts', product: 'parts', customer: 'customers', vendor: 'customers',
    shipping: 'shipping', receiving: 'shipping', system: 'utilities', admin: 'utilities', audit: 'utilities',
    dashboard: null,
};
// The first match wins. Rules run on the name first, then on the description.
const DOMAIN_RULES = [
    ['manufacturing', /\b(mo|wo|bom|manufactur\w*|production|work orders?|build|capacity)\b/],
    ['purchasing',    /\b(po|purchas\w*|vendors?|bid request|reorder)\b/],
    ['shipping',      /\b(ship\w*|pick\w*|receiv\w*|deliver\w*|route|transfer)\b/],
    ['customers',     /\bcustomers?\b/],
    ['sales',         /\b(sales?|so|quotes?|revenue|rma|orders?)\b/],
    ['inventory',     /\b(inventory|stock|availab\w*|on.?hand|cycle count|adjust\w*|valuation|watch ?list)\b/],
    ['parts',         /\b(parts?|products?|labels?|qr)\b/],
];
const UTIL_RULE = /\b(audit|import|utility|probe|template|converter)\b/;
const DASH_RULE = /\b(dashboard|chart|kpi|analytics)\b/;

function parseName(raw) {
    const m = /^-+\s*([^-]+?)\s+-\s+(.+)$/.exec(raw);
    if (m) {
        const folder = m[1].trim(), rest = m[2].trim(), key = folder.toLowerCase();
        if (key in FOLDER_ALIAS) {
            return FOLDER_ALIAS[key]
                ? { display: rest, folderCat: FOLDER_ALIAS[key] }
                : { display: rest + ' ' + folder, folderCat: null };
        }
    }
    return { display: raw.replace(/^-+\s*/, ''), folderCat: null };
}

function autoCategory(display, desc, folderCat) {
    if (folderCat) return folderCat;
    const n = display.toLowerCase(), d = (desc || '').toLowerCase();
    for (const [c, re] of DOMAIN_RULES) if (re.test(n)) return c;
    if (UTIL_RULE.test(n)) return 'utilities';
    for (const [c, re] of DOMAIN_RULES) if (re.test(d)) return c;
    if (DASH_RULE.test(n) || DASH_RULE.test(d)) return 'dashboards';
    if (UTIL_RULE.test(d)) return 'utilities';
    return 'other';
}

// A description that only repeats the name (often with a '1.' prefix) is hidden.
const norm = s => String(s || '').toLowerCase().replace(/^[\s-]*\d+[.)]\s*/, '').replace(/[^a-z0-9]+/g, '');

const REPORTS = ROWS.map(r => {
    const { display, folderCat } = parseName(r.name);
    const dn = norm(r.description);
    const desc = dn && dn !== norm(r.name) && dn !== norm(display) ? r.description.trim() : '';
    return { ...r, display, desc, auto: autoCategory(display, desc, folderCat), hay: (display + '\n' + r.name + '\n' + desc).toLowerCase() };
});
const BY_ID = new Map(REPORTS.map(r => [r.id, r]));

// ---- Icons -----------------------------------------------------------------
const P = {
    sales:         '<polyline points="3 17 9 11 13 15 21 7"/><polyline points="15 7 21 7 21 13"/>',
    purchasing:    '<circle cx="9" cy="20" r="1.4"/><circle cx="18" cy="20" r="1.4"/><path d="M2 3h3l2.6 12.2a1.5 1.5 0 0 0 1.5 1.2h8.7a1.5 1.5 0 0 0 1.5-1.1L21 8H6.1"/>',
    manufacturing: '<path d="M2.5 21h19"/><path d="M4 21V11l5 3v-3l5 3V5h5v16"/><path d="M7 18h1M11 18h1"/>',
    inventory:     '<path d="M21 7.5l-9-4.5-9 4.5 9 4.5 9-4.5z"/><path d="M3 7.5v9l9 4.5 9-4.5v-9"/><path d="M12 12v9"/>',
    shipping:      '<rect x="1.5" y="6" width="12" height="10" rx="1"/><path d="M13.5 9h4l3.5 3.5V16h-7.5"/><circle cx="6" cy="18" r="2"/><circle cx="17" cy="18" r="2"/>',
    parts:         '<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/>',
    customers:     '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.2a6.5 6.5 0 0 1 3.5 5.8"/>',
    dashboards:    '<rect x="3" y="3" width="7.5" height="9" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="5" rx="1.5"/><rect x="13.5" y="11" width="7.5" height="10" rx="1.5"/><rect x="3" y="15" width="7.5" height="6" rx="1.5"/>',
    utilities:     '<path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"/><circle cx="16" cy="6" r="2"/><circle cx="10" cy="12" r="2"/><circle cx="18" cy="18" r="2"/>',
    other:         '<path d="M14 3H6.5A1.5 1.5 0 0 0 5 4.5v15A1.5 1.5 0 0 0 6.5 21h11a1.5 1.5 0 0 0 1.5-1.5V8z"/><path d="M14 3v5h5"/><path d="M8.5 13h7M8.5 17h5"/>',
    standard:      '<rect x="4" y="3" width="16" height="18" rx="1.5"/><path d="M8.5 7h1.5M14 7h1.5M8.5 11h1.5M14 11h1.5M8.5 15h1.5M14 15h1.5"/><path d="M10 21v-3h4v3"/>',
    star:          '<polygon points="12 2.8 14.9 8.7 21.4 9.6 16.7 14.2 17.8 20.6 12 17.6 6.2 20.6 7.3 14.2 2.6 9.6 9.1 8.7"/>',
    pin:           '<path d="M9 3h6l-1 6 3 3v2H7v-2l3-3z"/><path d="M12 14v7"/>',
    clock:         '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
    chev:          '<polyline points="6 9 12 15 18 9"/>',
    search:        '<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>',
};
const svg = (k, sw = 1.8) => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${P[k]}</svg>`;

// ---- State -----------------------------------------------------------------
// Phase 2 keeps the per-user part in FBLib.Settings (favs, recents, collapsed,
// view) and the company part in FBLib.SharedData (standard, overrides).
function sampleState() {
    return {
        q: '', cat: null, view: 'tiles', admin: false,
        favs: new Set([40, 61, 47]),
        recents: [{ id: 61, at: NOW - 2 * HOUR }, { id: 68, at: NOW - DAY - 3 * HOUR }, { id: 40, at: NOW - 3 * DAY }, { id: 22, at: NOW - 6 * DAY }],
        standard: [61, 59, 66, 68, 32],
        overrides: { 13: 'sales' },
        collapsed: new Set(['other']),
    };
}
const S = sampleState();
const MAX_RECENTS = 8;

// ---- Helpers ---------------------------------------------------------------
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const catOf = r => S.overrides[r.id] || r.auto;

function highlight(text) {
    if (!S.q) return esc(text);
    const re = new RegExp('(' + S.q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'ig');
    return String(text).split(re).map((part, i) => i % 2 ? `<mark>${esc(part)}</mark>` : esc(part)).join('');
}

function relTime(ts) {
    const m = Math.round((NOW - ts) / 6e4);
    if (m < 1) return 'just now';
    if (m < 60) return m + 'm ago';
    const h = Math.round(m / 60);
    if (h < 24) return h + 'h ago';
    const d = Math.round(h / 24);
    if (d < 2) return 'yesterday';
    if (d < 30) return d + 'd ago';
    const mo = Math.round(d / 30);
    if (mo < 12) return mo + 'mo ago';
    return Math.round(d / 365) + 'y ago';
}

const matches = r => !S.q || r.hay.includes(S.q.toLowerCase());
const byName = (a, b) => a.display.localeCompare(b.display, undefined, { numeric: true, sensitivity: 'base' });

// ---- Rendering -------------------------------------------------------------
function tileHtml(r, { kicker = false, when = null } = {}) {
    const c = catOf(r), cat = CAT[c];
    const fav = S.favs.has(r.id), std = S.standard.includes(r.id);
    const chips = [
        r.fbname ? `<span class="chip fb" title="Stock Fishbowl report · ${esc(r.fbname)}">Fishbowl v${esc(r.fbversion)}</span>` : '',
        std ? '<span class="chip std">Standard</span>' : '',
    ].join('');
    const opts = CATS.map(x => `<option value="${x.id}"${S.overrides[r.id] === x.id ? ' selected' : ''}>${esc(x.label)}</option>`).join('');
    return `
    <div class="tile t-${c}" data-id="${r.id}">
        <div class="tile-head">
            <span class="ico">${svg(cat.icon)}</span>
            <button class="tile-main" data-act="open" title="${esc(r.name)}">
                ${kicker ? `<span class="tile-kicker">${esc(cat.label)}</span>` : ''}
                <span class="tile-name">${highlight(r.display)}</span>
                ${r.desc
                    ? `<span class="tile-desc">${highlight(r.desc)}</span>`
                    : `<span class="tile-desc none">No description${S.admin ? ' — add one in the BI Script Editor' : ''}</span>`}
            </button>
            <div class="tile-tools">
                ${S.admin ? `<button class="tbtn pin${std ? ' on' : ''}" data-act="pin" aria-pressed="${std}" title="${std ? 'Remove from' : 'Add to'} company standard reports">${svg('pin')}</button>` : ''}
                <button class="tbtn star${fav ? ' on' : ''}" data-act="star" aria-pressed="${fav}" title="${fav ? 'Remove from' : 'Add to'} favourites">${svg('star')}</button>
            </div>
        </div>
        <div class="tile-foot">${chips}<span class="when">${when || 'Updated ' + relTime(r.datelastmodified)}</span></div>
        ${S.admin ? `
        <div class="tile-admin">
            <span>Category</span>
            <select data-act="cat" class="${S.overrides[r.id] ? 'override' : ''}" aria-label="Category for ${esc(r.display)}">
                <option value=""${S.overrides[r.id] ? '' : ' selected'}>Auto (${esc(CAT[r.auto].label)})</option>${opts}
            </select>
        </div>` : ''}
    </div>`;
}

function sectionHtml({ id, title, tone, icon, items, hint = '', empty = '', forceOpen = false, tileOpts = () => ({}) }) {
    const collapsed = !forceOpen && S.collapsed.has(id);
    const body = items.length
        ? `<div class="grid">${items.map(r => tileHtml(r, tileOpts(r))).join('')}</div>`
        : `<div class="empty-row">${empty}</div>`;
    return `
    <section class="sec t-${tone}${collapsed ? ' collapsed' : ''}" id="sec-${id}">
        <button class="sec-head" data-act="sec" data-sec="${id}" aria-expanded="${!collapsed}">
            ${svg('chev', 2).replace('<svg', '<svg class="chev"')}
            <span class="sec-ico">${svg(icon)}</span>
            <span class="sec-title">${esc(title)}</span>
            <span class="sec-count">${items.length}</span>
            ${hint ? `<span class="sec-hint">${hint}</span>` : ''}
        </button>
        <div class="sec-body">${body}</div>
    </section>`;
}

function render() {
    const main = document.getElementById('main');
    const browsing = !S.q && !S.cat;
    const hits = REPORTS.filter(matches);
    let html = '';

    if (browsing) {
        const std = S.standard.map(id => BY_ID.get(id)).filter(Boolean);
        if (std.length || S.admin) {
            html += sectionHtml({
                id: 'standard', title: 'Company standard', tone: 'standard', icon: 'standard', items: std,
                hint: S.admin ? 'Everyone sees these · use the pin on any tile to change them' : 'Chosen by your administrator',
                empty: `${svg('pin')} Pin reports to show them to everyone in the company.`,
                tileOpts: () => ({ kicker: true }),
            });
        }
        const favs = REPORTS.filter(r => S.favs.has(r.id)).sort(byName);
        html += sectionHtml({
            id: 'favs', title: 'Favourites', tone: 'favs', icon: 'star', items: favs, hint: 'Only you see these',
            empty: `${svg('star')} Star a report to keep it here.`,
            tileOpts: () => ({ kicker: true }),
        });
        const rec = S.recents.map(x => ({ r: BY_ID.get(x.id), at: x.at })).filter(x => x.r);
        const recAt = new Map(rec.map(x => [x.r.id, x.at]));
        html += sectionHtml({
            id: 'recent', title: 'Recent', tone: 'recent', icon: 'clock', items: rec.map(x => x.r),
            empty: `${svg('clock')} Reports you open from here will show up here.`,
            tileOpts: r => ({ kicker: true, when: 'Opened ' + relTime(recAt.get(r.id)) }),
        });
        html += '<div class="divider"></div>';
    }

    let shown = 0;
    for (const c of CATS) {
        if (S.cat && S.cat !== c.id) continue;
        const items = hits.filter(r => catOf(r) === c.id).sort(byName);
        if (!items.length) continue;
        shown += items.length;
        html += sectionHtml({ id: c.id, title: c.label, tone: c.id, icon: c.icon, items, forceOpen: !browsing });
    }

    if (!browsing && !shown) {
        html = `
        <div class="empty-state">
            ${svg('search', 1.6)}
            <div class="title">No reports match${S.q ? ` “${esc(S.q)}”` : ''}</div>
            <div class="hint">Search covers report names and descriptions${S.cat ? ` in ${esc(CAT[S.cat].label)}` : ''}.</div>
            <button class="btn" data-act="clear">Clear search${S.cat ? ' and category' : ''}</button>
        </div>`;
    }

    main.className = 'view-' + S.view;
    main.innerHTML = html;
    renderCatbar(hits);
    renderSubline(hits.length);
    document.getElementById('vTiles').classList.toggle('on', S.view === 'tiles');
    document.getElementById('vCompact').classList.toggle('on', S.view === 'compact');
}

function renderCatbar(hits) {
    const counts = {};
    for (const r of hits) { const c = catOf(r); counts[c] = (counts[c] || 0) + 1; }
    document.getElementById('catbar').innerHTML =
        `<button class="fchip${S.cat ? '' : ' on'}" data-cat="">All <span class="n">${hits.length}</span></button>` +
        CATS.map(c => {
            const n = counts[c.id] || 0;
            return `<button class="fchip t-${c.id}${S.cat === c.id ? ' on' : ''}" data-cat="${c.id}"${n ? '' : ' disabled'}><span class="dot"></span>${esc(c.label)} <span class="n">${n}</span></button>`;
        }).join('');
}

function renderSubline(hitCount) {
    const admin = S.admin ? '<span class="admin-tag">Admin</span>' : '';
    document.getElementById('subline').innerHTML = S.q
        ? `${hitCount} of ${REPORTS.length} reports match “${esc(S.q)}”${admin}`
        : `${REPORTS.length} reports · ${S.standard.length} company standard · ${S.favs.size} favourite${S.favs.size === 1 ? '' : 's'}${admin}`;
}

// ---- Actions ---------------------------------------------------------------
// The one place that opens a report. Phase 2 tries openModule here and falls
// back to copying the name.
function launch(id) {
    const r = BY_ID.get(id);
    if (!r) return;
    S.recents = [{ id, at: Date.now() }, ...S.recents.filter(x => x.id !== id)].slice(0, MAX_RECENTS);
    toast(`Would open “${r.name}”`, 'BI reports can’t open other reports yet. This is where openModule would go.');
    render();
}

function toast(title, msg) {
    const host = document.getElementById('toasts');
    const el = document.createElement('div');
    el.className = 'toast';
    el.innerHTML = `<div class="toast-msg"><b>${esc(title)}</b>${esc(msg)}</div>`;
    host.appendChild(el);
    setTimeout(() => { el.style.opacity = '0'; setTimeout(() => el.remove(), 300); }, 3800);
}

document.getElementById('main').addEventListener('click', e => {
    const btn = e.target.closest('[data-act]');
    if (!btn || btn.tagName === 'SELECT') return;
    const tile = btn.closest('.tile'), id = tile ? Number(tile.dataset.id) : null;
    switch (btn.dataset.act) {
        case 'open': launch(id); break;
        case 'star': S.favs.has(id) ? S.favs.delete(id) : S.favs.add(id); render(); break;
        case 'pin':
            S.standard = S.standard.includes(id) ? S.standard.filter(x => x !== id) : [...S.standard, id];
            render(); break;
        case 'sec': {
            const k = btn.dataset.sec;
            S.collapsed.has(k) ? S.collapsed.delete(k) : S.collapsed.add(k);
            btn.closest('.sec').classList.toggle('collapsed', S.collapsed.has(k));
            btn.setAttribute('aria-expanded', String(!S.collapsed.has(k)));
            break;
        }
        case 'clear': S.q = ''; S.cat = null; document.getElementById('q').value = ''; render(); break;
    }
});

document.getElementById('main').addEventListener('change', e => {
    const sel = e.target.closest('select[data-act="cat"]');
    if (!sel) return;
    const id = Number(sel.closest('.tile').dataset.id);
    if (sel.value) S.overrides[id] = sel.value; else delete S.overrides[id];
    render();
});

document.getElementById('catbar').addEventListener('click', e => {
    const b = e.target.closest('.fchip');
    if (!b || b.disabled) return;
    const c = b.dataset.cat || null;
    S.cat = S.cat === c ? null : c;
    render();
    window.scrollTo({ top: 0 });
});

const q = document.getElementById('q');
q.addEventListener('input', () => { S.q = q.value.trim(); render(); });
q.addEventListener('keydown', e => { if (e.key === 'Escape') { q.value = ''; S.q = ''; render(); q.blur(); } });
document.addEventListener('keydown', e => {
    if (e.key === '/' && !/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); q.focus(); }
});

document.getElementById('vTiles').onclick = () => { S.view = 'tiles'; render(); };
document.getElementById('vCompact').onclick = () => { S.view = 'compact'; render(); };

function setAdmin(on) {
    S.admin = on;
    document.getElementById('asUser').classList.toggle('on', !on);
    document.getElementById('asAdmin').classList.toggle('on', on);
    render();
}
document.getElementById('asUser').onclick = () => setAdmin(false);
document.getElementById('asAdmin').onclick = () => setAdmin(true);
document.getElementById('reset').onclick = () => {
    const fresh = sampleState(), keep = { view: S.view, admin: S.admin };
    S.favs.clear(); fresh.favs.forEach(x => S.favs.add(x));
    S.collapsed.clear(); fresh.collapsed.forEach(x => S.collapsed.add(x));
    Object.assign(S, { q: '', cat: null, recents: fresh.recents, standard: fresh.standard, overrides: fresh.overrides }, keep);
    q.value = '';
    render();
};

render();
</script>
</body>
</html>
