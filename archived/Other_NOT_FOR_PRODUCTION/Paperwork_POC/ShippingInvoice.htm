<!DOCTYPE html>
<!--
================================================================================
  REPORT: Shipping Invoice / Pro-forma  (PROOF OF CONCEPT)
  PATH:   Other_NOT_FOR_PRODUCTION/Paperwork_POC/ShippingInvoice.htm
  --------------------------------------------------------------------------------
  HTML replica of Fishbowl's standard Ship/ShippingInvoice.jrxml, printed and
  saved as PDF from the BI Report module's own Print / Save / Email buttons.
  The stock master is only a dispatcher; this one page does all six of its
  subreports:
    shipment Shipped (30)   the posted invoice    subShippingInvoice_AU / _US / _CA
    any other status        the live pro-forma    subShippingProForma_AU / _US / _CA
  plus subCarton (the optional carton block). The edition comes from the
  QBVersion system property (FBDoc.app env.edition): AU, US, anything else is
  the CA / international variant, as PropertyUtil.isCaOrInternational().
  fb-doc.js lays the shipment out into fixed-size sheets: page header on every
  sheet, item-table column header repeated, "Page X of Y" on every sheet,
  totals / approval line pinned to the bottom of the last sheet, kits kept
  with their components.

  SOURCE vs BUILD
    This file is the source. `node build.js ShippingInvoice.htm` inlines
    fb-doc.js and fb-doc-fonts.css into dist/ShippingInvoice.htm. Paste the
    dist file into the BI Script Editor (fb-lib and fb-styles are the deployed
    shared records).

  SCREEN
    The toolbar, shipment picker, Settings drawer, paper choice and launch
    handling are FBDoc.app (fb-doc.js); this file supplies the document only.

  FISHBOWL REPORT SETTINGS (Parameters button on the BI Report)
    Shipment     the shipment to print (Fishbowl's own shipment picker); adopted
                 once, after that each user's in-page pick stands
    Page_setup   paper size / margins (default A4, Jasper margins)
    The setting tokens are in the text/plain blocks at the top of <body>. They
    are substituted by global text replacement: never repeat them anywhere else.

  LAUNCH FROM THE SHIPPING MODULE (LAUNCH_CONTEXT.md)
    The fb-launch meta tag in <head> (content SHIP) lists this report under
    Reports > Apps in the Shipping module (report_btn plugin). Opened from
    there, the host's window.FB_LAUNCH names the open shipment: it is printed
    straight away and cannot be changed (the toolbar shows only Print and
    Settings). Write that tag only once: the plugin reads the first one.

  OPTIONS
    The stock report's saved options (reportparameter rows of
    ShippingInvoice.jasper) are the starting point. The subreports are not
    registered reports and have no saved options of their own: every option
    is the master's and reaches them through its parameter map (so the master
    defaults win: logo "left", ShowTotals true). The price columns follow the
    Multi Currency property like the jrxml's "Property..." defaults; the
    Shipping Terms default names a property that does not exist and is taken
    as on. An admin can override them in Settings and save for everyone
    (FBLib.Settings master).

  DELIBERATE DEVIATIONS FROM THE JRXML
    - LEFT joins throughout: a null payment terms / FOB / ship terms / carrier
      no longer blanks the order strip, a line with no tax code or UOM is no
      longer dropped from the items.
    - Null-safe text: no literal "null" for a missing phone / email / fax /
      country / ABN / description; empty address parts leave no stray ", ";
      a line with qty-to-fulfill 0 no longer divides by zero.
    - Currency: the order's own currency (so.currencyId, the customer's as
      fallback) instead of always the customer's; identical whenever the
      order is in the customer's currency (every demodb order).
    - Order Currency column shows the home currency code, not a hard-coded
      "USD", when multi-currency is off.
    - Invoice ship-to, number and date come from the shipment printed (the
      jrxml takes the posting's first shipment: the same unless one posting
      covers several shipments); the posting is the lowest one reached
      through the shipment's items (the jrxml takes an arbitrary first row).
    - Totals: the order-currency column's Total adds the order-currency tax
      (the jrxml adds the home-currency tax). CA pro-forma: amounts are no
      longer divided by the currency rate twice, and its home tax is in home
      currency.
    - CA company address: a missing GST/HST number drops only that line (the
      jrxml blanks the whole address). CA "order-currency tax" column compares
      currency codes by value (the jrxml compares string references).
    - Item numbering with "Number kit lines too" off counts every non-kit row
      (the AU invoice stops counting across consecutive unshipped lines).
    - Cartons: a USPS tracking number prints once (the jrxml's "UPS" test also
      matches it); the carton count uses its own Cartoncount title; blank
      dimensions print blank.
    - A shipment that cannot be invoiced (not a sales-order shipment, not
      posted, no items) shows the red "Cannot create invoice" message in every
      variant (the US pro-forma and the master's no-item case print a blank
      page). Tracking comes from the tracking tables when the client's
      tracking bridge is unavailable (the format may differ from the server's).
    - Item columns keep the edition's jrxml widths and the text columns (Item,
      Description) absorb the difference to the paper's content width, so the
      table always spans it exactly (the jrxml packs visible columns left and
      runs 1-2pt past its column); too many columns drop a font step instead
      of running off the page. The order strip keeps its 92pt boxes and falls
      back to equal shares when more than six are on (the jrxml runs off).
    - Kit headers re-shown "(continued)" on the next page when a kit runs over
      a page break; long notes and descriptions split across pages.

  STATUS: proof of concept. Desk-tested against demodb through the live-SQL
  harness (tests/ShippingInvoice.test.js). Not client-tested.
================================================================================
-->

<!-- Fishbowl report settings: each token exactly once, never elsewhere. -->
<script type="text/plain" id="set-ship">$SHIP{Shipment|0|Shipment}</script>
<script type="text/plain" id="set-print">$PRINT{Page_setup|A4|Print}</script>

<script>
// ============================================================================
//  BAIL EARLY — needs the Fishbowl embedded browser, fb-lib and fb-doc.
// ============================================================================
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#506872;">' +
        '<h2>Not running inside Fishbowl</h2><p>Open this report from the Fishbowl client\'s BI module.</p></div>';
    throw new Error('runQuery unavailable');
}
if (!window.FBLib || !window.FBDoc) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="background:#F0D7DD;color:#8A1E30;padding:10px 16px;font:13px sans-serif">' +
        'Missing ' + (!window.FBLib ? 'fb-lib' : 'fb-doc') + '. Paste the BUILT file (dist/ShippingInvoice.htm), not the source.</div>');
    throw new Error('fb-lib / fb-doc missing');
}

// Shell access (FBDoc.app, created at the end of this script).
function opt(name) { return APP.opt(name); }
function label(key, dflt) { return APP.label(key, dflt); }
function debugLog(m, t) { APP.debug(m, t); }

var esc = FBDoc.esc;
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round2(x) { return Math.sign(x) * Math.round(Math.abs(x) * 100 + 1e-7) / 100; }
function has(v) { return v != null && String(v) !== ''; }

// The stock master's `country` variable: CA / international first, then AU, else US.
function editionOf(E) {
    var e = String((E && E.edition) || 'US').toUpperCase();
    return e === 'AU' ? 'AU' : e === 'US' ? 'US' : 'CA';
}

// ============================================================================
//  OPTIONS — master jrxml defaults (spec §1.5), stock presets, admin
// ============================================================================
var REPORT_PATH = '../reports/Ship/ShippingInvoice.jasper';

function jrxmlDefaults(env) {
    var MC = env.multiCurrency;
    var d = {
        cbOrderNumber: 'Ship', cbLogoAlignment: 'left',
        ShowCompanyName: true, ShowCompanyAddress: true, ShowBarcode: true,
        ShowCountry: false, ShowBillToPhone: true, ShowBillToFax: true, ShowBillToEmail: true,
        SalesPerson: true, PaymentTerms: true, FOBPoint: true, ShippingTerms: true, ShipVia: true, ReqShipDate: true,
        OrderCurrency: false, OrderCurrencyRate: false, 'Column:CustomFooterText': true,
        ItemLineNumber: true, Type: true, ItemNumberAndDescription: false, ItemNumber: true, ItemDescription: true,
        UnitPrice: !MC, ExtendedPrice: !MC, CurrencyUnitPrice: MC, CurrencyExtendedPrice: MC, QtyShipped: true,
        TaxCode: true, TaxAmount: true, ItemCurrencyTax: false,
        ShowTotals: true, ShowCurrencyTotals: MC, ShowHomeCurrencyTotals: false, ShowTotalQty: false,
        ShowDeliverySignature: false, ShowCartonInfo: false, IncludeKitsInItemNumbering: true, ShowNote: true,
        ShowSOCustomFields: false, ShowCfItem1: false, ShowCfItem2: false, ShowCfItem3: false,
        ShowPayOnlineButton: true, DisplayText: true, PaymentText: ''
    };
    for (var i = 1; i <= 6; i++) { d['ShowCfSO' + i] = true; d['CustomField:SO' + i] = -1; }
    for (var j = 1; j <= 3; j++) d['CustomField:Item' + j] = -1;
    return d;
}

// The options shown in the Settings drawer (labels are the stock report's).
var OPTION_GROUPS = [
    ['Header', [['cbLogoAlignment', 'Logo position', ['left', 'top']], ['ShowCompanyName', 'Company name'], ['ShowCompanyAddress', 'Company address'],
        ['ShowBarcode', 'Barcode'], ['cbOrderNumber', 'Order # shows', ['Ship', 'SO', 'PO']]]],
    ['Address', [['ShowCountry', 'Show country'], ['ShowBillToPhone', 'Bill-to phone'], ['ShowBillToEmail', 'Bill-to email'], ['ShowBillToFax', 'Bill-to fax']]],
    ['Order fields', [['SalesPerson', 'Sales person'], ['PaymentTerms', 'Payment terms'], ['FOBPoint', 'FOB point'], ['ShippingTerms', 'Shipping terms'],
        ['ShipVia', 'Carrier'], ['ReqShipDate', 'Date scheduled'], ['OrderCurrency', 'Order currency'], ['OrderCurrencyRate', 'Currency rate'],
        ['ShowSOCustomFields', 'SO custom fields'], ['ShowCfSO1', 'SO CF 1'], ['ShowCfSO2', 'SO CF 2'], ['ShowCfSO3', 'SO CF 3'],
        ['ShowCfSO4', 'SO CF 4'], ['ShowCfSO5', 'SO CF 5'], ['ShowCfSO6', 'SO CF 6']]],
    ['Item columns', [['ItemLineNumber', 'Item #'], ['Type', 'Type'], ['ItemNumberAndDescription', 'Item / Description'], ['ItemNumber', 'Item'],
        ['ItemDescription', 'Description'], ['TaxCode', 'Tax code (AU/CA)'], ['TaxAmount', 'Tax amount (AU/CA)'], ['ItemCurrencyTax', 'Order-currency tax (AU/CA)'],
        ['UnitPrice', 'Unit price (home)'], ['CurrencyUnitPrice', 'Unit price (order currency)'], ['QtyShipped', 'Qty shipped'],
        ['ExtendedPrice', 'Extended price (home)'], ['CurrencyExtendedPrice', 'Extended price (order currency)'],
        ['ShowCfItem1', 'Item CF 1'], ['ShowCfItem2', 'Item CF 2'], ['ShowCfItem3', 'Item CF 3']]],
    ['Totals', [['ShowTotals', 'Totals (single currency)'], ['ShowCurrencyTotals', 'Totals in order currency (multi-currency)'],
        ['ShowHomeCurrencyTotals', 'Home-currency column (multi-currency)'], ['ShowTotalQty', 'Total qty under the Qty column']]],
    ['Other settings', [['ShowNote', 'Order notes'], ['ShowCartonInfo', 'Carton info'], ['IncludeKitsInItemNumbering', 'Number kit lines too'],
        ['ShowDeliverySignature', 'Delivery signature (Fishbowl GO)'], ['Column:CustomFooterText', 'Footer message (SO Notice / approval line)']]],
    ['Pay Online (US edition)', [['ShowPayOnlineButton', 'Pay Online button'], ['DisplayText', 'Payment caption']]]
];

// ============================================================================
//  DATA
// ============================================================================
// Configured custom-field columns only, each with a leading comma. Never select
// a bare NULL: the server's MariaDB driver types it as a binary string and the
// whole query fails with "An unknown error has occurred". An omitted column
// simply reads as undefined (blank).
function cfSelect(prefix, alias, count, keyBase) {
    var out = '', params = [];
    for (var i = 1; i <= count; i++) {
        var id = opt('CustomField:' + keyBase + i);
        if (id > 0) { out += ', CustomFieldById(' + alias + '.customFields, ?) AS ' + prefix + i; params.push(id); }
    }
    return { sql: out, params: params };
}

var RATE = 'COALESCE(NULLIF(so.currencyRate, 0), 1)';

// The main dataset's sums (spec §2.4 / §4.2 / §4.3), per document and edition.
// Type 40 (subtotal) lines are left out, as in the jrxml.
function totalsQuery(m) {
    var US = m.edition === 'US', R = RATE, taxable = '(i.taxableFlag + 0) = 1';
    if (m.invoice) {
        var tp = 'COALESCE(psi.totalPrice, 0)';
        return { params: [m.postSoId], sql: [
            'SELECT SUM(' + tp + ') AS subtotal,',
            US ? '  SUM(CASE WHEN ' + taxable + ' THEN COALESCE(so.taxRate, 0) ELSE 0 END * ' + tp + ') AS ordertotaltax,'
               : '  SUM(ROUND(COALESCE(i.taxRate, 0) * ' + tp + ', 2)) AS ordertotaltax,',
            US ? '  SUM(CASE WHEN ' + taxable + ' THEN ' + tp + ' * COALESCE(so.taxRate, 0) / ' + R + ' ELSE 0 END) AS currencytaxtotal,'
               : '  SUM(ROUND(' + tp + ' * COALESCE(i.taxRate, 0) / ' + R + ', 2)) AS currencytaxtotal,',
            '  SUM(' + tp + ' / ' + R + ') AS currencysubtotal',
            'FROM postsoitem psi',
            'JOIN soitem i ON i.id = psi.soItemId',
            'JOIN so ON so.id = i.soId',
            'WHERE psi.postSoId = ? AND i.typeId <> 40'
        ].join('\n') };
    }
    var q = 'COALESCE(si.qtyShipped, 0)', up = 'COALESCE(i.unitPrice, 0)', base = q + ' * ' + up;
    var sel;
    if (m.edition === 'CA') {
        // CA pro-forma: the order-currency, adjustment-inclusive unit amount (not rounded per line).
        var B = '(' + up + ' / ' + R + ' + (COALESCE(i.adjustAmount, 0) / COALESCE(NULLIF(i.qtyToFulfill, 0), 1)) / ' + R + ')';
        sel = ['SELECT SUM(' + q + ' * ' + B + ') AS subtotal,',
               '  SUM(' + q + ' * ' + B + ' * COALESCE(i.taxRate, 0)) AS currencytaxtotal,',
               '  SUM(' + q + ' * ' + B + ') AS currencysubtotal'];
    } else if (US) {
        sel = ['SELECT SUM(' + base + ') AS subtotal,',
               '  SUM(CASE WHEN ' + taxable + ' THEN COALESCE(so.taxRate, 0) ELSE 0 END * ' + base + ') AS ordertotaltax,',
               '  SUM(CASE WHEN ' + taxable + ' THEN ' + base + ' * COALESCE(so.taxRate, 0) / ' + R + ' ELSE 0 END) AS currencytaxtotal,',
               '  SUM(' + base + ' / ' + R + ') AS currencysubtotal'];
    } else {
        sel = ['SELECT SUM(' + base + ') AS subtotal,',
               '  SUM(ROUND(COALESCE(i.taxRate, 0) * ' + base + ', 2)) AS ordertotaltax,',
               '  SUM(ROUND(' + base + ' * COALESCE(i.taxRate, 0) / ' + R + ', 2)) AS currencytaxtotal,',
               '  SUM(' + base + ' / ' + R + ') AS currencysubtotal'];
    }
    return { params: [m.shipId], sql: sel.concat([
        'FROM shipitem si',
        'JOIN soitem i ON i.id = si.soItemId',
        'JOIN so ON so.id = i.soId',
        'WHERE si.shipId = ? AND i.typeId <> 40'
    ]).join('\n') };
}

async function fetchModel(shipId) {
    shipId = parseInt(shipId, 10);
    var E = APP.env, ed = editionOf(E);
    // ---- the master: status picks the document; the posting via the shipment's items ----
    var s0 = await FBDoc.q([
        'SELECT ship.id, ship.num, ship.statusId AS statusid, ship.orderTypeId AS ordertypeid, ship.soId AS soid,',
        '  (SELECT MIN(psi.postSoId) FROM shipitem si JOIN postsoitem psi ON psi.shipItemId = si.id WHERE si.shipId = ship.id) AS postsoid,',
        '  (SELECT COUNT(*) FROM shipitem si WHERE si.shipId = ship.id) AS shipitems',
        'FROM ship WHERE ship.id = ?'
    ].join('\n'), [shipId]);
    if (!s0.length) throw new Error('Shipment ' + shipId + ' not found');
    var s = s0[0];
    var invoice = parseInt(s.statusid, 10) === 30;
    var model = {
        shipId: shipId, invoice: invoice, edition: ed, postSoId: parseInt(s.postsoid, 10) || 0, statusId: parseInt(s.statusid, 10),
        h: { num: s.num, shipnum: s.num }, lines: [], totals: {}, cartons: [], signature: null, companyAddress: '', error: false
    };
    // The subreport's "Cannot create invoice" case: no sales order / posting behind the shipment.
    if (parseInt(s.ordertypeid, 10) !== 20 || !has(s.soid) || !(num(s.shipitems) > 0) || (invoice && !model.postSoId)) {
        model.error = true;
        return model;
    }

    // ---- header: SO bill-to, shipment ship-to, order info strip ----
    var cfS = cfSelect('socf', 'so', 6, 'SO');
    var hdr = await FBDoc.q([
        'SELECT company.name AS company, company.abn AS abn, so.id AS soid, so.num AS sonum,',
        '  so.customerContact AS customercontact, so.customerPO AS customerpo,',
        '  so.billToName AS billtoname, so.billToAddress AS billtoaddress, so.billToCity AS billtocity, bs.name AS billtostate,',
        '  so.billToZip AS billtozip, bc.name AS billcountry,',
        '  ship.num AS shipnum, ship.dateShipped AS dateshipped,',
        '  ship.shipToName AS shiptoname, ship.shipToAddress AS shiptoaddress, ship.shipToCity AS shiptocity, ss.name AS shiptostate,',
        '  ship.shipToZip AS shiptozip, sc.name AS shipcountry,',
        '  so.locationGroupId AS lgid, COALESCE(so.note, \'\') AS sonote, ' + RATE + ' AS currencyrate,',
        '  cur.code AS currencycode, hc.code AS homecurrencycode, so.phone, so.email, so.paymentLink AS paymentlink,',
        '  (SELECT c.datus FROM contact c WHERE c.accountId = customer.accountId AND c.typeId = 40 AND c.defaultFlag = 1 ORDER BY c.id LIMIT 1) AS fax,',
        '  so.salesman AS soseller, pt.name AS paymentterms, fob.name AS fobpoint, st.name AS shippingterms, car.name AS carrier,',
        '  so.dateFirstShip AS shipdate' + cfS.sql,
        'FROM ship',
        'JOIN so ON so.id = ship.soId',
        'JOIN customer ON customer.id = so.customerId',
        'LEFT JOIN company ON company.id = 1',
        'LEFT JOIN stateconst bs ON bs.id = so.billToStateId',
        'LEFT JOIN countryconst bc ON bc.id = so.billToCountryId',
        'LEFT JOIN stateconst ss ON ss.id = ship.shipToStateId',
        'LEFT JOIN countryconst sc ON sc.id = ship.shipToCountryId',
        'LEFT JOIN currency cur ON cur.id = COALESCE(so.currencyId, customer.currencyId)',
        'LEFT JOIN currency hc ON hc.homeCurrency = 1',
        'LEFT JOIN paymentterms pt ON pt.id = so.paymentTermsId',
        'LEFT JOIN fobpoint fob ON fob.id = so.fobPointId',
        'LEFT JOIN shipterms st ON st.id = so.shipTermsId',
        'LEFT JOIN carrier car ON car.id = ship.carrierId',
        'WHERE ship.id = ?'
    ].join('\n'), cfS.params.concat([shipId]));
    if (!hdr.length) { model.error = true; return model; }
    var h = hdr[0];
    h.num = h.shipnum;
    model.h = h;

    // ---- totals (main dataset sums) ----
    var tq = totalsQuery(model);
    model.totals = (await FBDoc.q(tq.sql, tq.params))[0] || {};

    // ---- items: posted rows (invoice) or the shipment's own rows (pro-forma) ----
    var cfI = cfSelect('itemcf', 'i', 3, 'Item');
    var common = [
        '  i.id AS soitemid, i.soLineItem AS lineno, sit.name AS itemtype, i.typeId AS typeid,',
        '  COALESCE(i.unitPrice, 0) AS unitprice, COALESCE(i.adjustAmount, 0) AS adjust, COALESCE(i.qtyToFulfill, 0) AS qtytofulfill,',
        '  uom.code AS uomcode, i.productNum AS productnum, i.customerPartNum AS cpn, oto.recordId2 AS kitparent,',
        '  i.note AS note, i.description AS description, tr.code AS taxcode, COALESCE(i.taxRate, 0) AS taxrate' + cfI.sql
    ];
    var joins = [
        'JOIN soitemtype sit ON sit.id = i.typeId',
        'LEFT JOIN uom ON uom.id = i.uomId',
        'LEFT JOIN taxrate tr ON tr.id = i.taxId',
        'LEFT JOIN objecttoobject oto ON oto.typeId = 30 AND oto.recordId1 = i.id'
    ];
    var lines = invoice
        ? await FBDoc.q(['SELECT psi.id AS rowid, psi.shipItemId AS shipitemid, COALESCE(psi.qty, 0) AS qty, COALESCE(psi.totalPrice, 0) AS totalprice,']
            .concat(common, ['FROM postsoitem psi', 'JOIN soitem i ON i.id = psi.soItemId'], joins,
                    ['WHERE psi.postSoId = ?', 'ORDER BY i.soLineItem, psi.id']).join('\n'), cfI.params.concat([model.postSoId]))
        : await FBDoc.q(['SELECT si.id AS rowid, si.id AS shipitemid, COALESCE(si.qtyShipped, 0) AS qty,',
                         '  COALESCE(si.qtyShipped, 0) * COALESCE(i.unitPrice, 0) AS totalprice,']
            .concat(common, ['FROM shipitem si', 'JOIN soitem i ON i.id = si.soItemId'], joins,
                    ['WHERE si.shipId = ?', 'ORDER BY i.soLineItem, si.id']).join('\n'), cfI.params.concat([shipId]));
    await attachTracking(lines);
    model.lines = lines;

    // ---- subCarton ----
    if (opt('ShowCartonInfo')) {
        model.cartons = await FBDoc.q([
            'SELECT sc.id AS cartonid, sc.cartonNum AS cartonnum, sc.trackingNum AS trackingnum, sc.freightWeight AS weight,',
            '  car.name AS carriername, COALESCE(wu.code, \'lbs\') AS weightuom, sc.len AS len, sc.width AS width, sc.height AS height,',
            '  COALESCE(sc.sizeUOM, \'\') AS uom',
            'FROM shipcarton sc',
            'LEFT JOIN carrier car ON car.id = sc.carrierId',
            'LEFT JOIN sysproperties sp ON sp.sysKey = \'Default Weight UomId\'',
            'LEFT JOIN uom wu ON wu.id = sp.sysValue',
            'WHERE sc.shipId = ?',
            'ORDER BY sc.cartonNum, sc.id'
        ].join('\n'), [shipId]);
    }
    // ---- delivery signature (Fishbowl GO), image of the Ship record ----
    if (opt('ShowDeliverySignature')) {
        var img = await FBDoc.q("SELECT imageFull AS full, type AS mime FROM image WHERE LOWER(tableName) = 'ship' AND recordId = ? ORDER BY id LIMIT 1", [shipId]);
        if (img.length && img[0].full) {
            var b = String(img[0].full);
            model.signature = b.indexOf('data:') === 0 ? b : 'data:' + (/^image\/[\w.+-]+$/.test(img[0].mime || '') ? img[0].mime : 'image/png') + ';base64,' + b;
        }
    }
    try {
        model.companyAddress = typeof getCompanyAddress === 'function' ? String(getCompanyAddress(parseInt(h.lgid, 10), !!opt('ShowCountry')) || '') : '';
    } catch (e) { debugLog('getCompanyAddress failed: ' + e.message, 'warn'); }
    return model;
}

// Lot / serial / expiry text per shipped row (the jrxml's getAllShipItemTrackingInfo).
// The client bridge is used when it returns a per-id map; otherwise the values are
// read from the tracking tables the shipment's inventory log entries carry.
var SHIPITEM_TABLE_ID = 1555030112;
async function attachTracking(lines) {
    var ids = [];
    lines.forEach(function (l) { var id = parseInt(l.shipitemid, 10); if (id > 0 && ids.indexOf(id) < 0) ids.push(id); });
    var map = {};
    if (ids.length && typeof getAllTrackingInfo === 'function') {
        try {
            var raw = getAllTrackingInfo('ShipItem', ids.join(','));
            debugLog('getAllTrackingInfo: ' + String(raw).slice(0, 300), 'info');
            var o = typeof raw === 'string' ? JSON.parse(raw) : raw;
            if (o && typeof o === 'object' && !Array.isArray(o)) {
                ids.forEach(function (id) { if (typeof o[id] === 'string' && o[id].trim()) map[id] = o[id].trim(); });
            }
        } catch (e) { debugLog('getAllTrackingInfo unusable, reading the tracking tables: ' + FBDoc.errText(e), 'info'); }
    }
    var missing = ids.filter(function (id) { return !map[id]; });
    if (missing.length) {
        var rows = await FBDoc.q([
            'SELECT il.recordId AS shipitemid, pt.sortOrder AS sortorder, pt.abbr AS abbr, pt.typeId AS ptype,',
            '  til.info AS info, til.infoDate AS infodate, til.infoDouble AS infodouble, til.infoInteger AS infointeger, tilsn.serialNum AS serialnum',
            'FROM inventorylog il',
            'JOIN tiinventorylog til ON til.inventoryLogId = il.id',
            'JOIN parttracking pt ON pt.id = til.partTrackingId',
            'LEFT JOIN tiinventorylogsn tilsn ON tilsn.tiInventoryLogId = til.id',
            'WHERE il.tableId = ? AND il.recordId IN (' + missing.map(function () { return '?'; }).join(',') + ')',
            'ORDER BY il.recordId, pt.sortOrder, pt.abbr, til.id, tilsn.id'
        ].join('\n'), [SHIPITEM_TABLE_ID].concat(missing));
        var E = APP.env, by = {};
        rows.forEach(function (r) {
            var t = parseInt(r.ptype, 10), v;
            if (t === 20 || t === 30) v = FBDoc.fmt.date(E.date, r.infodate);
            else if (t === 40) v = r.serialnum;
            else if (t === 50) v = FBDoc.fmt.number('#,##0.00', r.infodouble);
            else if (t === 60) v = FBDoc.fmt.number('#,##0.#####', r.infodouble);
            else if (t === 70 || t === 80) v = r.infointeger;
            else v = r.info;
            if (!has(v)) return;
            var per = by[r.shipitemid] = by[r.shipitemid] || { order: [], vals: {} };
            if (!per.vals[r.abbr]) { per.vals[r.abbr] = []; per.order.push(r.abbr); }
            if (per.vals[r.abbr].indexOf(String(v)) < 0) per.vals[r.abbr].push(String(v));
        });
        Object.keys(by).forEach(function (id) {
            map[id] = by[id].order.map(function (a) { return a + ': ' + by[id].vals[a].join(', '); }).join('    ');
        });
    }
    lines.forEach(function (l) { l.tracking = map[parseInt(l.shipitemid, 10)] || ''; });
}

// ============================================================================
//  CALCULATIONS — the itemInfo variables (§2.6) and the totals table (§2.7)
// ============================================================================
function lineVals(l, rate) {
    var t = parseInt(l.typeid, 10), up = num(l.unitprice), adj = num(l.adjust), qtf = num(l.qtytofulfill);
    var q = num(l.qty), tp = num(l.totalprice);
    var unitCost = up + adj / (qtf || 1);
    return {
        t: t, q: q, tp: tp, unitCost: unitCost,
        curUnit: unitCost / rate,                                 // CURRENCYUNITPRICE (the UOM factor is always 1)
        curExt: tp / rate,                                        // CURRENCYTOTALEXTENDEDPRICE
        ext: (t === 30 || t === 40) ? round2(tp) : round2(unitCost * q),   // extendedPrice
        tax: q * unitCost * num(l.taxrate)                        // AU/CA line tax, not rounded
    };
}

function totalsOf(m) {
    var T = m.totals || {}, rate = num(m.h.currencyrate) || 1;
    var curSub, curTax, homeTax;
    if (m.edition === 'US') {
        curSub = round2(num(T.currencysubtotal)); curTax = round2(num(T.currencytaxtotal)); homeTax = round2(num(T.ordertotaltax));
    } else {
        curSub = num(T.currencysubtotal); curTax = num(T.currencytaxtotal);
        homeTax = (m.edition === 'CA' && !m.invoice) ? curTax * rate : num(T.ordertotaltax);
    }
    var hcSub = round2((curSub + curTax) * rate) - curTax * rate;     // HCSubTotal
    return { rate: rate, curSub: curSub, curTax: curTax, curTotal: curSub + curTax, hcSub: hcSub, homeTax: homeTax, homeTotal: hcSub + homeTax };
}

// ============================================================================
//  DOCUMENT BUILD — bands + blocks for FBDoc.paginate
// ============================================================================
// Item column widths of each edition's subreport (pt at the jrxml's 552 column).
var COL_W = {
    AU: { line: 30, type: 35, cf: 90, numdesc: 219, num: 69, desc: 150, taxCode: 27, taxAmt: 52, curTax: 52, unitPrice: 65, curUnitPrice: 65, qty: 60, total: 65, curTotal: 65 },
    CA: { line: 30, type: 44, cf: 90, numdesc: 216, num: 66, desc: 150, taxCode: 29, taxAmt: 43, curTax: 43, unitPrice: 65, curUnitPrice: 65, qty: 62, total: 65, curTotal: 65 },
    US: { line: 32, type: 45, cf: 90, numdesc: 263, num: 100, desc: 163, unitPrice: 71, curUnitPrice: 71, qty: 71, total: 72, curTotal: 71 }
};

function buildDoc(m, geom) {
    var E = APP.env, ed = m.edition || editionOf(E), h = m.h, US = ed === 'US', AU = ed === 'AU';
    var K = geom.CWpt / 552;                       // jrxml x-positions scale to this page's content width
    var X = function (x) { return (x * K).toFixed(2) + 'pt'; };
    var MC = !!E.multiCurrency;
    var homeSym = FBDoc.fmt.currencySymbol(h.homecurrencycode, E.useCode);
    var curSym = FBDoc.fmt.currencySymbol(h.currencycode || h.homecurrencycode, E.useCode);   // coalesceSymbol
    var fmtCur = function (sym, v, pat) { return FBDoc.fmt.number(pat, v, { symbol: sym, rounding: 'halfUp' }); };
    var fmtRaw = function (v, pat) { return FBDoc.fmt.number(pat, v); };
    var fmtD = function (v) { return FBDoc.fmt.date(E.date, v); };

        : cbOrder === 'SO' ? h.sonum : (has(h.customerpo) ? h.customerpo : h.sonum);
    var docDate = m.error ? '' : fmtD(dateOnly(h.dateshipped) || (m.invoice ? null : new Date()));
    var logo = E.logo ? '<img src="' + E.logo + '" alt="">' : '';
    var taxIdLine = function (bold) {
        if (AU) return '<b>ABN: </b>' + esc(h.abn || '') + '\n';

    };
    var showAddr = opt('ShowCompanyAddress') && !m.error;

    var align = String(opt('cbLogoAlignment') || '');

          (showAddr ? '<div class="si-abs si-caddr" style="left:0;top:60pt;width:' + X(358) + ';height:74pt;padding-bottom:3pt">' + taxIdLine(false) + esc(m.companyAddress) + '</div>' : '')
        : align === 'left'
        ? '<div class="si-abs si-logo" style="left:0;top:0;width:' + X(75) + ';height:134pt;align-items:center;justify-content:center">' + logo + '</div>' +
          (showName ? '<div class="si-abs si-company" style="left:' + X(75) + ';top:33pt;width:' + X(283) + ';height:20pt;padding-left:3pt">' + esc(h.company) + '</div>' : '') +
          (showAddr ? '<div class="si-abs si-caddr" style="left:' + X(75) + ';top:53pt;width:' + X(283) + ';height:81pt;padding-left:3pt">' + taxIdLine(true) + esc(m.companyAddress) + '</div>' : '')
        : '';
    var pageHeader =
        '<div class="si-doc" style="position:relative;height:134pt">' + left +
        '<div class="si-abs si-title" style="left:' + X(358) + ';top:0;width:' + X(194) + ';height:24pt">' + esc(title) + '</div>' +
        '<div class="si-abs si-lbl si-center" style="left:' + X(358) + ';top:34pt;width:' + X(125) + ';height:17pt">' + esc(label('Order#', 'Order #')) + '</div>' +
        '<div class="si-abs si-lbl si-center" style="left:' + X(483) + ';top:34pt;width:' + X(69) + ';height:17pt;border-left:0">' + esc(label('Date', 'Date')) + '</div>' +
        '<div class="si-abs si-box si-center" style="left:' + X(358) + ';top:51pt;width:' + X(125) + ';height:17pt;font-size:10pt;font-weight:700;padding:0 3pt;border-top:0">' + esc(orderNo) + '</div>' +
        '<div class="si-abs si-box si-center" style="left:' + X(483) + ';top:51pt;width:' + X(69) + ';height:17pt;font-size:10pt;border-top:0;border-left:0">' + esc(docDate) + '</div>' +
        (opt('ShowBarcode') && has(h.shipnum) && !m.error
            ? '<div class="si-abs si-center" style="left:' + X(358) + ';top:73pt;width:' + X(194) + ';height:47pt">' + FBDoc.code128.svg(h.shipnum, { module: 1, quiet: 0 }) + '</div>' : '') +
        '</div>';

    // ---- footers: the master's page footer on every sheet; the sub's last-page footer above it ----
    var printed = FBDoc.fmt.printedAt();
    var footLine = function (ctx) {
        return '<div class="si-foot"><span>' + esc(printed) + '</span><span class="pg">Page ' + ctx.pageNo + ' of ' + ctx.pageCount + '</span></div>';
    };
    var pageFooter = function (ctx) { return '<div class="si-doc">' + footLine(ctx) + '</div>'; };

    var c = totalsOf(m);
    var hasCur = has(h.currencycode);
    var showHome = !!opt('ShowHomeCurrencyTotals'), showCurT = !!opt('ShowCurrencyTotals');

    var colAD = !showHome || !MC || !hasCur, colE = showHome && MC && hasCur && showCurT, colF = showHome && MC && hasCur, colB = colF && !showCurT;
    var taxLabel = label('SalesTax', AU ? 'GST:' : 'Sales Tax:');
    var totRows = [

        [label('Total', 'Total:'), c.curTotal, c.curTotal, c.homeTotal, true]

    var totalsHtml = '';

        var head = (colE || colF) ? '<thead><tr>' + colsDef.map(function (cd) {

        }).join('') + '</tr></thead>' : '';
        totalsHtml = '<table><colgroup>' + colsDef.map(function (cd) { return tw(cd[0]); }).join('') + '</colgroup>' + head + '<tbody>' +
            totRows.map(function (r) {

    var approval = 'Approval:' + (US && !m.invoice ? '_'.repeat(29) : '_'.repeat(25)) + '     Date:' + '_'.repeat(13);

    var noticeHtml = US ? esc(notice).replace(/&lt;(\/?)(b|i|u|br)\s*\/?&gt;/gi, '<$1$2>') : esc(notice);
    var leftFoot = sigOn

            : esc(ptxt).replace(/&lt;(\/?)(b|i|u|br)\s*\/?&gt;/gi, '<$1$2>');
        payHtml = '<a class="si-pay" href="' + esc(h.paymentlink) + '" target="_blank" style="left:' + X(440) + ';top:87pt;width:' + X(112) + '">' + esc(label('PayButton', 'Pay Online')) + '</a>' +
            (opt('DisplayText') ? '<div class="si-paytxt" style="left:' + X(293) + ';top:113pt;width:' + X(259) + '">' + caption + '</div>' : '');
    }
    var lastPageFooter = function (ctx) {
        return '<div class="si-doc si-last">' + leftFoot +
            (totalsHtml ? '<div class="tot" style="left:' + X(293) + ';top:' + (US ? 31 : 48) + 'pt;width:' + X(259) + '">' + totalsHtml + '</div>' : '') +
            payHtml + '<div class="foot">' + footLine(ctx) + '</div></div>';
    };

    var blocks = [], tables = {};
    var doc = { id: 'si-' + (h.shipnum || h.num || m.shipId), pageHeader: pageHeader, pageFooter: pageFooter, lastPageFooter: lastPageFooter, tables: tables, blocks: blocks };
    // No sales order / posting: the Title band's red message above the page header, and
    // (AllSectionsNoDetail) the address group with nothing in it; no detail bands.
    if (m.error) doc.pageHeader = '<div class="si-doc si-err">Cannot create invoice. Order must be shipped and be a Sales Order type.</div>' + pageHeader;

    // ---- CustomerAddress group (prints once) ----
    var billTo = m.error ? '' : [h.billtoname || '']
        .concat(has(h.billtoaddress) ? [h.billtoaddress] : [])
        .concat([(has(h.billtocity) ? h.billtocity + ', ' : '') + (has(h.billtostate) ? h.billtostate + '  ' : '  ') + (h.billtozip || '')])
        .concat(opt('ShowCountry') ? [h.billcountry || ''] : [])
        .concat(opt('ShowBillToPhone') && has(h.phone) ? ['Phone: ' + h.phone] : [])
        .concat(opt('ShowBillToEmail') && has(h.email) ? ['Email: ' + h.email] : [])
        .concat(opt('ShowBillToFax') && has(h.fax) ? ['Fax: ' + h.fax] : []).join('\n');
    var shipTo = m.error ? '' : (has(h.shiptoname) ? h.shiptoname + '\n' : '') + (has(h.shiptoaddress) ? h.shiptoaddress + '\n' : '') +
        (h.shiptocity || '') + (has(h.shiptostate) ? ', ' + h.shiptostate : '  ') + (has(h.shiptozip) ? '  ' + h.shiptozip : '') +
        (opt('ShowCountry') ? '\n' + (h.shipcountry || '') : '');
    var contact = has(h.customercontact) ? 'Contact: ' + h.customercontact : '';
    var po = has(h.customerpo) ? 'PO Number: ' + h.customerpo : '';
    var cp = [contact, po].filter(Boolean).join('\n');
    blocks.push({ html:
        '<div class="si-doc si-addr" style="grid-template-columns:' + X(271) + ' ' + X(10) + ' ' + X(271) + '">' +
        '<div class="col"><div class="h">' + esc(label('BillTo', 'Bill To:')) + '</div><div class="b bill">' + esc(billTo) + '</div></div><div></div>' +
        '<div class="col"><div class="h">' + esc(label('ShipTo', 'Ship To:')) + '</div><div class="b ship">' + esc(shipTo) + '</div>' +
        '<div class="cp">' + esc(cp) + '</div></div></div>' });
    if (m.error) return doc;

    // ---- CartonInfo group (subCarton) ----
    if (opt('ShowCartonInfo')) cartonBlocks(m, geom, K, X, blocks, tables);

    // ---- Detail 1: SO notes (splits across pages when long) ----
    if (opt('ShowNote') && has(h.sonote)) {
        var nl = ed === 'AU' ? [1, 49, 51, 3, 3] : ed === 'CA' ? [0, 49, 49, 3, 0] : [0, 50, 50, 3, 3];   // label x, w; text x, padL, padR
        blocks.push({ split: true, html:
            '<div class="si-doc si-notes" style="width:' + X(553) + ';max-width:100%"><div class="lbl" style="margin-left:' + X(nl[0]) + ';width:' + X(nl[2] - nl[0]) + '">SO Notes:</div>' +
            '<div class="txt" data-fbdoc-split style="padding-left:' + nl[3] + 'pt;padding-right:' + nl[4] + 'pt">' + esc(h.sonote) + '</div></div>' });
    }

    // ---- Detail 2: order info strip ----
    // Cells with no font size in the CA / US jrxml print at the 9pt default: CA the currency
    // details, US the date and currency headers and details. [key, title, value, td class, th class]
    var f9 = ed !== 'AU', h9 = US ? 'f9' : '';
    var strip = [
        ['SalesPerson', label('SalesPerson', 'Sales Person'), h.soseller, ''],
        ['PaymentTerms', label('PaymentTerms', 'Payment Terms'), h.paymentterms, ''],
        ['FOBPoint', label('FOBPoint', 'FOB Point'), h.fobpoint, ''],
        ['ShippingTerms', label('ShippingTerms', 'Shipping Terms'), h.shippingterms, ''],
        ['ShipVia', label('Carrier', 'Carrier'), h.carrier, ''],
        ['ReqShipDate', label('DateScheduled', 'Date Scheduled'), fmtD(h.shipdate), US ? 'f9' : '', h9],
        ['OrderCurrency', label('OrderCurrency', 'Order Currency'), MC ? (hasCur ? h.currencycode : h.homecurrencycode) : h.homecurrencycode, f9 ? 'f9' : '', h9],
        ['OrderCurrencyRate', label('CurrencyRate', 'Currency Rate'), FBDoc.fmt.number(' #,##0.0#######', h.currencyrate), f9 ? 'f9' : '', h9]
    ].filter(function (s) { return opt(s[0]); });
    if (strip.length) blocks.push({ html: stripHtml(strip, geom, K, '') });

    // ---- Detail 3: SO custom fields strip ----
    if (opt('ShowSOCustomFields')) {
        var cfs = [];
        for (var n = 1; n <= 6; n++) if (opt('ShowCfSO' + n)) cfs.push(['', label('SOcf' + n, 'Custom Field ' + n), h['socf' + n], '']);
        if (cfs.length) blocks.push({ html: stripHtml(cfs, geom, K, 'cf') });
    }

    // ---- Detail 4: items table ----
    itemBlocks(m, geom, K, blocks, tables, { MC: MC, homeSym: homeSym, curSym: curSym, fmtCur: fmtCur, fmtRaw: fmtRaw, hasCur: hasCur, rate: c.rate });
    return doc;
}

// Boxed key/value strip: 92pt columns packed left like the jrxml table; equal
// shares of the width when they would run off the page.
function stripHtml(cells, geom, K, cls) {
    var w = 92 * K, n = cells.length;
    var wpt = n * w <= geom.CWpt + 0.01 ? w : geom.CWpt / n;
    return '<div class="si-doc si-strip' + (cls ? ' ' + cls : '') + '"><table style="width:' + (wpt * n).toFixed(2) + 'pt">' +
        '<colgroup>' + cells.map(function () { return '<col style="width:' + wpt.toFixed(2) + 'pt">'; }).join('') + '</colgroup>' +
        '<thead><tr>' + cells.map(function (c) { return '<th' + (c[4] ? ' class="' + c[4] + '"' : '') + ' title="' + esc(c[1]) + '">' + esc(c[1]) + '</th>'; }).join('') + '</tr></thead>' +
        '<tbody><tr>' + cells.map(function (c) { return '<td' + (c[3] ? ' class="' + c[3] + '"' : '') + '>' + esc(c[2] == null ? '' : c[2]) + '</td>'; }).join('') + '</tr></tbody></table></div>';
}

// Java Double.toString for the carton weights ("5.0", "30.391000649").
function javaDouble(v) {
    var n = Number(v);
    if (!isFinite(n)) return '';
    if (Number.isInteger(n) && Math.abs(n) < 1e7) return n.toFixed(1);
    return String(n);
}

var TRACK_URL = {
    USPS: 'http://trkcnfrm1.smi.usps.com/PTSInternetWeb/InterLabelInquiry.do?strOrigTrackNum=',
    UPS: 'http://wwwapps.ups.com/WebTracking/processInputRequest?HTMLVersion=5.0&tracknums_displayed=1&TypeOfInquiryNumber=T&loc=en_US&InquiryNumber1=',
    FED: 'https://www.fedex.com/fedextrack/?trknbr='
};
function trackingCell(c, container) {
    var tn = String(c.trackingnum == null ? '' : c.trackingnum).trim();
    if (!tn) return '';
    var car = String(c.carriername || ''), url = null;
    if (car.indexOf('USPS') >= 0) url = TRACK_URL.USPS + encodeURIComponent(tn);
    else if (car.indexOf('UPS') >= 0) url = TRACK_URL.UPS + encodeURIComponent(tn) + '&track.x=Track';
    else if (car.indexOf('Fed') >= 0) url = TRACK_URL.FED + encodeURIComponent(tn);
    return url ? '<a href="' + esc(url) + '" target="_blank" title="' + esc('Track My ' + container) + '">' + esc(tn) + '</a>' : esc(tn);
}

function cartonBlocks(m, geom, K, X, blocks, tables) {
    var E = APP.env;
    var container = (E.sys && has(E.sys['DefaultContainer'])) ? E.sys['DefaultContainer'] : 'Carton';
    var fit = FBDoc.Columns.fit([{ key: 'c', basis: 120 * K, flex: 0 }, { key: 'w', basis: 113 * K, flex: 0 },
                                 { key: 'd', basis: 154 * K, flex: 0 }, { key: 't', basis: 165 * K, flex: 0 }], geom.CWpt);
    tables.carton = {
        className: 'si-doc si-cartons', colgroup: FBDoc.Columns.colgroup(fit.widths),
        thead: '<thead><tr><th>' + esc(label('Carton#', container + ' #')) + '</th><th class="b">' + esc(label('Weight', 'Weight')) + '</th>' +
            '<th class="b">' + esc(label('LxWxH', 'L x W x H')) + '</th><th class="r">' + esc(label('Tracking#', 'Tracking #')) + '</th></tr></thead>'
    };
    blocks.push({ kwn: true, html: '<div class="si-doc si-ctitle">' + esc(label('CartonInfo', container + ' Info')) + '</div>' });
    var qtyFmt = function (v) { return v == null || v === '' ? '' : FBDoc.fmt.number(E.qty, v); };
    var running = 0, count = 0, uomCode = 'lbs';
    m.cartons.forEach(function (c) {
        running += num(c.weight); count++; uomCode = c.weightuom || uomCode;
        var dims = (c.len == null && c.width == null && c.height == null) ? ''
            : qtyFmt(c.len) + ' ' + c.uom + ' x ' + qtyFmt(c.width) + ' ' + c.uom + ' x ' + qtyFmt(c.height) + ' ' + c.uom;
        blocks.push({ table: 'carton', html: '<tr><td>' + esc(c.cartonnum) + '</td><td>' + esc(running > 0 ? javaDouble(c.weight) + ' ' + c.weightuom : '') + '</td>' +
            '<td>' + esc(dims) + '</td><td class="r">' + trackingCell(c, container) + '</td></tr>' });
    });
    var countTitle = label('Cartoncount', null);
    var countTxt = countTitle != null ? countTitle + ': ' + count : container + ' Count: ' + count;
    blocks.push({ table: 'carton', kwp: true, html: '<tr class="sum"><td colspan="4"><div class="si-csum">' +
        '<span style="width:' + X(145) + ';text-align:right">' + esc(label('TotalWeight', 'Total Weight:')) + '</span>' +
        '<span style="width:' + X(242) + ';padding-left:3pt">' + esc(running > 0 ? javaDouble(running) + ' ' + uomCode : '') + '</span>' +
        '<span style="width:' + X(165) + ';text-align:right;padding-right:3pt">' + esc(countTxt) + '</span></div></td></tr>' });
}

// Visible item columns in the jrxml's order for the edition (column printWhens are
// evaluated once against the main dataset, like Jasper).
function itemColumns(m, o) {
    var ed = m.edition, W = COL_W[ed] || COL_W.AU, h = m.h, US = ed === 'US', CA = ed === 'CA', AUINV = ed === 'AU' && m.invoice;
    var cols = [];
    // Cell padding as the jrxml cells. Header: Item # both sides, text columns left, money
    // columns right. Detail (dp below): text columns left, custom fields both sides; the AU
    // invoice also pads tax code left and money right; the AU pro-forma pads only its prices;
    // CA / US pad no money column (CA pads its Type column instead).
    var HP = { line: 'pl pr', numdesc: 'pl', num: 'pl', desc: 'pl', unitPrice: 'pr', curUnitPrice: 'pr', total: 'pr', curTotal: 'pr' };
    var add = function (on, key, kind, lbl, ha, da, dp) {
        if (on) cols.push({ key: key, kind: kind, basis: W[kind], label: lbl, ha: ha + (HP[key] ? ' ' + HP[key] : ''), da: da, cls: dp || '' });
    };
    var curHdr = function (t) { return o.hasCur ? h.currencycode + '\n' + t : t; };
    var itemT = label('Item', null), descT = label('Description', null);
    var numDescT = (itemT == null && descT == null) ? 'Item / Description' : (itemT || 'Item') + ' / ' + (descT || 'Description');
    var money = (CA || US) ? '' : 'pr';
    add(opt('ItemLineNumber'), 'line', 'line', label('Item#', 'Item #'), 'c', 'c');
    add(opt('Type'), 'type', 'type', label('Type', 'Type'), 'c', 'c', CA ? 'pl pr' : '');
    add(opt('ShowCfItem1'), 'cf1', 'cf', label('Itemcf1', 'Item CF 1'), 'c', 'c', 'pl pr');
    add(opt('ItemNumberAndDescription'), 'numdesc', 'numdesc', numDescT, 'l', 'l', 'pl');
    add(opt('ItemNumber'), 'num', 'num', label('Item', 'Item'), 'l', 'l', 'pl');
    add(opt('ItemDescription'), 'desc', 'desc', label('Description', 'Description'), 'l', 'l', 'pl');
    add(opt('ShowCfItem2'), 'cf2', 'cf', label('Itemcf2', 'Item CF 2'), 'c', 'c', 'pl pr');
    if (!US) {
        add(opt('TaxCode'), 'taxCode', 'taxCode', label('TaxCode', 'Tax Code'), 'c', CA ? 'c' : 'l', AUINV ? 'pl' : '');
        add(CA ? (!o.MC || (opt('TaxAmount') && h.homecurrencycode === h.currencycode)) : opt('TaxAmount'),
            'taxAmt', 'taxAmt', label('TaxAmount', 'Tax Amount'), 'c', 'r', AUINV ? 'pr' : '');
        add(CA ? (o.MC && opt('ItemCurrencyTax') && h.homecurrencycode !== h.currencycode) : opt('ItemCurrencyTax'),
            'curTax', 'curTax', o.hasCur ? h.currencycode + '\nTax Amount' : 'Tax\nAmount', 'c', 'r', AUINV ? 'pr' : '');
    }
    add(opt('UnitPrice'), 'unitPrice', 'unitPrice', label('UnitPrice', 'Unit Price'), 'r', 'r', money);
    add(opt('CurrencyUnitPrice'), 'curUnitPrice', 'curUnitPrice', curHdr(label('UnitPrice', 'Unit Price')), 'r', 'r', money);
    add(opt('QtyShipped'), 'qty', 'qty', label('QtyShipped', 'Qty Shipped'), 'c', 'qty');
    add(opt('ExtendedPrice'), 'total', 'total', label('ExtendedPrice', 'Extended Price'), 'r', 'r', money);
    add(opt('CurrencyExtendedPrice'), 'curTotal', 'curTotal', curHdr(label('ExtendedPrice', 'Extended\nPrice')), AUINV ? 'c' : 'r', 'r', money);
    add(opt('ShowCfItem3'), 'cf3', 'cf', label('Itemcf3', 'Item CF 3'), 'c', 'c', 'pl pr');
    return cols;
}

function itemBlocks(m, geom, K, blocks, tables, o) {
    var E = APP.env, rows = m.lines;
    if (!rows.length) return;
    var cols = itemColumns(m, o);
    if (!cols.length) return;
    // jrxml widths as the basis: numeric columns keep them, the text columns (catalogue flex)
    // absorb the difference to this page's content width.
    var fit = FBDoc.Columns.fit(cols.map(function (c) { return { key: c.key, kind: c.kind, basis: c.basis }; }), geom.CWpt);
    var aCls = function (a) { return a === 'qty' ? 'qc' : a; };
    tables.items = {
        className: 'si-doc si-items' + (fit.compact ? ' compact' : ''),
        colgroup: FBDoc.Columns.colgroup(fit.widths),
        thead: '<thead><tr>' + cols.map(function (c) { return '<th class="' + c.ha + '">' + esc(c.label) + '</th>'; }).join('') + '</tr></thead>'
    };
    blocks.push({ kwn: true, html: '<div class="si-gap14"></div>' });   // the table sits 14pt into its band

    var splitKey = cols.some(function (c) { return c.key === 'desc'; }) ? 'desc' : 'numdesc';
    var kitIds = {}, present = {};
    rows.forEach(function (l) { present[l.soitemid] = true; if (l.kitparent != null) kitIds[l.kitparent] = true; });
    var inclKits = !!opt('IncludeKitsInItemNumbering');
    var rowNo = 0, lineNo = 0, totalQty = 0;

    rows.forEach(function (l) {
        var v = lineVals(l, o.rate), t = v.t;
        rowNo++; if (t !== 80) lineNo++;
        totalQty += v.q;
        var kitChild = l.kitparent != null;
        var indent = kitChild ? '     ' : '';
        var pn = has(l.productnum) ? (has(l.cpn) ? l.productnum + ' (' + l.cpn + ')' : l.productnum) : '';
        var desc = l.description == null ? '' : String(l.description);
        var extra = (has(l.tracking) ? '\n  ' + l.tracking : '') + (has(l.note) ? '\n  ' + l.note : '');
        var partInfo = indent + pn + ((!has(l.productnum) || !desc) ? '' : ' - ') + desc;
        var cells = cols.map(function (c) {
            var k = c.key, val = '';
            switch (k) {
                case 'line': val = esc(inclKits ? rowNo : (t === 80 ? '' : lineNo)); break;
                case 'type': val = esc(String(l.itemtype || '').indexOf('Discount') === 0 ? 'Discount' : (l.itemtype || '')); break;
                case 'cf1': case 'cf2': case 'cf3': val = esc(l['itemcf' + k.charAt(2)] == null ? '' : l['itemcf' + k.charAt(2)]); break;
                case 'numdesc': val = '<div class="pre"' + (splitKey === 'numdesc' ? ' data-fbdoc-split' : '') + '>' + esc(partInfo + extra) + '</div>'; break;
                case 'num': val = '<div class="pre">' + esc(indent + pn) + '</div>'; break;
                case 'desc': val = '<div class="pre" data-fbdoc-split>' + esc(desc + extra) + '</div>'; break;
                case 'taxCode': val = esc(l.taxcode || ''); break;
                case 'taxAmt': val = esc(o.MC ? o.fmtCur(o.homeSym, v.tax, E.price) : o.fmtRaw(v.tax, E.price)); break;
                case 'curTax': val = esc(o.fmtCur(o.curSym, v.tax / o.rate, E.price)); break;
                case 'unitPrice': val = esc(o.MC ? o.fmtCur(o.homeSym, t === 30 ? v.tp : v.unitCost, E.price) : o.fmtRaw(t === 30 ? v.tp : v.unitCost, E.price)); break;
                case 'curUnitPrice': val = esc(o.MC ? o.fmtCur(o.curSym, t === 30 ? v.curExt : v.curUnit, E.price) : o.fmtRaw(t === 30 ? v.tp : v.unitCost, E.price)); break;
                case 'qty': val = '<div class="qty"><span class="q">' + esc(FBDoc.fmt.number(E.qty, v.q)) + '</span><span class="u">' + esc(l.uomcode || '') + '</span></div>'; break;
                case 'total': val = esc(o.MC ? o.fmtCur(o.homeSym, v.ext, E.total) : o.fmtRaw(v.ext, E.total)); break;
                case 'curTotal': val = esc(o.MC ? o.fmtCur(o.curSym, v.curExt, E.total) : o.fmtRaw(v.ext, E.total)); break;
            }
            return '<td class="' + aCls(c.da) + (c.cls ? ' ' + c.cls : '') + '">' + val + '</td>';
        });
        var block = { table: 'items', stripe: true, split: true, html: '<tr>' + cells.join('') + '</tr>' };
        // Kit parent: keep with its first component; re-shown "(continued)" if the kit runs over a page.
        if (t === 80 && kitIds[l.soitemid]) {
            block.kwn = true;
            block.groupHeader = 'kit' + l.rowid;
            l._grp = block.groupHeader;
            var hasNum = cols.some(function (c) { return c.key === 'num' || c.key === 'numdesc'; });
            block.repeatHtml = '<tr>' + cols.map(function (c) {
                var txt = (c.key === 'num' || c.key === 'numdesc') ? esc(pn + ' (continued)')
                        : (c.key === 'desc' && !hasNum) ? esc(desc + ' (continued)') : '';
                return '<td class="l cont">' + txt + '</td>';
            }).join('') + '</tr>';
            kitIds[l.soitemid] = block.groupHeader;
        }
        if (kitChild && typeof kitIds[l.kitparent] === 'string' && present[l.kitparent]) block.grp = [kitIds[l.kitparent]];
        blocks.push(block);
    });

    // Table footer row: always there (13pt); the total only with ShowTotalQty.
    blocks.push({ table: 'items', kwp: true, html: '<tr class="tq">' + cols.map(function (c) {
        if (c.key !== 'qty' || !opt('ShowTotalQty')) return '<td></td>';
        return '<td class="qc"><div class="qty"><span class="q tqv">' + esc(FBDoc.fmt.number(E.qty, totalQty)) + '</span></div></td>';
    }).join('') + '</tr>' });
}

// ============================================================================
//  SHIPMENT PICKER — typeahead + browse with status / period filters (per user)
// ============================================================================
var PERIODS = [{ value: '30', label: '30 days' }, { value: '90', label: '90 days' }, { value: '365', label: '1 year' }, { value: 'all', label: 'All' }];
function pickFilterSql(f) {
    var where = ['ship.orderTypeId = 20'];                    // sales-order shipments: the only ones this document prints
    var st = ((f && f.status) || []).map(function (x) { return parseInt(x, 10); }).filter(function (n) { return !isNaN(n); });
    if (st.length) where.push('ship.statusId IN (' + st.join(',') + ')');
    var days = parseInt(f && f.period, 10);
    if (days > 0) where.push('ship.dateCreated >= DATE_SUB(CURDATE(), INTERVAL ' + days + ' DAY)');
    return where;
}
async function searchShipments(term, f) {
    var where = pickFilterSql(f), params = [];
    if (term) {
        where.push('(ship.num LIKE ? OR so.num LIKE ? OR c.name LIKE ?)');
        params.push(term + '%', term + '%', '%' + term + '%');
    }
    var rows = await FBDoc.q(
        'SELECT ship.id, ship.num, so.num AS sonum, c.name AS customer, st.name AS status, ship.dateCreated AS datecreated, ship.dateShipped AS dateshipped ' +
        'FROM ship LEFT JOIN so ON so.id = ship.soId LEFT JOIN customer c ON c.id = so.customerId LEFT JOIN shipstatus st ON st.id = ship.statusId ' +
        'WHERE ' + where.join(' AND ') + ' ' +
        'ORDER BY ship.dateCreated DESC, ship.id DESC LIMIT 60', params);
    return rows.map(function (r) {
        return { value: r.id, label: r.num, sub: (r.customer || '') + (has(r.sonum) ? ' · SO ' + r.sonum : ''),
                 meta: [r.status || '', FBDoc.fmt.date(APP.env ? APP.env.date : 'dd/MM/yyyy', r.dateshipped || r.datecreated)] };
    });
}

// ============================================================================
//  THE APP — FBDoc.app runs the screen; this report supplies its document.
// ============================================================================
var APP = FBDoc.app({
    title: 'Shipping Invoice',
    record: {
        code: 'SHIP', table: 'ship', numColumn: 'num', noun: 'shipment', setting: 'set-ship',
        newest: async function () { var r = await FBDoc.q('SELECT MAX(id) AS id FROM ship WHERE orderTypeId = 20'); return r.length ? parseInt(r[0].id, 10) || 0 : 0; }
    },
    sys: ['SO Notice', 'DefaultContainer'],
    env: function (env, s) { env.notice = s['SO Notice'] == null ? null : s['SO Notice']; },
    presets: function () { return [REPORT_PATH]; },
    defaults: function (env) { return jrxmlDefaults(env); },
    options: OPTION_GROUPS,
    optionsIntro: 'the stock Shipping Invoice report',
    fetch: function (id) { return fetchModel(id); },
    build: function (model, geom) { return buildDoc(model, geom); },
    picker: {
        placeholder: 'Shipment #, SO # or customer…',
        alias: 'ship',
        where: pickFilterSql,
        search: function (term, f) { return searchShipments(term, f); },
        filters: async function (saved) {
            var statuses = [];
            try { statuses = await FBDoc.q('SELECT id, name FROM shipstatus ORDER BY id'); } catch (e) { debugLog('shipstatus: ' + FBDoc.errText(e), 'warn'); }
            return [
                { key: 'status', label: 'Status', multi: true, value: saved.status || [],
                  options: statuses.map(function (r) { return { value: String(r.id), label: r.name }; }) },
                { key: 'period', label: 'Created', value: saved.period || '365', options: PERIODS }
            ];
        }
    }
});
