<!DOCTYPE html>
<!--
================================================================================
  REPORT: Work Order Traveler  (PROOF OF CONCEPT)
  PATH:   Other_NOT_FOR_PRODUCTION/Paperwork_POC/WOTraveler.htm
  --------------------------------------------------------------------------------
  HTML replica of Fishbowl's standard WorkOrder/WOTraveler.jrxml (spec:
  specs/WOTraveler.md), printed and saved as PDF from the BI Report module's own
  Print / Save / Email buttons. The page IS the paper: fb-doc.js lays the work
  order out into fixed-size sheets — the page header (company, title, WO # / Date
  boxes, barcode, BOM, customer / SO, scheduled dates, category, header-info
  table) on every sheet, Notes, the optional BOM or WO instructions, Finished
  Goods and Raw Goods with their column headers repeated on every sheet a table
  reaches, and the page footer "Page X of Y". The stock report has no summary or
  last-page footer, so neither does this one.

  SOURCE vs BUILD
    This file is the source. `node build.js WOTraveler.htm` inlines fb-doc.js and
    fb-doc-fonts.css into dist/WOTraveler.htm. Paste the dist file into the BI
    Script Editor (fb-lib and fb-styles are the deployed shared records).

  SCREEN
    The toolbar, record picker (WO number, MO number or finished-good part; status
    chips from wostatus; period on the WO's created date), Settings drawer, paper
    choice and launch handling are FBDoc.app (fb-doc.js); this file supplies the
    document only.

  FISHBOWL REPORT SETTINGS (Parameters button on the BI Report)
    Work_Order  the work order to print (Fishbowl's own WO picker); adopted once,
                after that each user's in-page pick stands
    Page_setup  paper size / margins (default A4, Jasper margins)
    The setting tokens are in the text/plain blocks at the top of <body>. They
    are substituted by global text replacement: never repeat them anywhere else.

  LAUNCH FROM THE WORK ORDER MODULE (LAUNCH_CONTEXT.md)
    The fb-launch meta tag in <head> (content WO) lists this report under
    Reports > Apps in the Work Order module (report_btn plugin). Opened from
    there, the host's window.FB_LAUNCH names the open work order: it is printed
    straight away and cannot be changed (the toolbar shows only Print and
    Settings). Write that tag only once: the plugin reads the first one in the page.

  OPTIONS
    Every option parameter of the jrxml (cbShowInstructions, Show*, DisplayTime,
    col*, colHeader:*, colBOMInstructions:*, colWOInstructions: *, ReportTitle)
    defaults to the jrxml default; the stock report's saved options (reportparameter
    rows of WOTraveler.jasper) are read as the starting point, so a customer's
    existing setup carries over. An admin can override them in Settings and save
    for everyone (FBLib.Settings master, userProperties storage). ReportTitle has
    no control in the drawer (the shell has no text options); it still comes
    from the stock preset.

  DELIBERATE DEVIATIONS FROM THE JRXML
    - JasperReports evaluates NPE-throwing expressions to null (blank). The same
      visible outcome is reproduced null-safely: no Category text (label too) when
      the WO has no calendar category; an empty 1pt tracking row for an untracked
      part; no status icon when qtyReady is null. A missing ReportTitle prints
      "Work Order Traveler" (stock JR prints a blank title when it is null).
    - One BOM for the "BOM:" line and the BOM-instructions table: the first BOM
      found on the WO's items (the finished good's first), not the first row of
      an unordered query (the stock line can vanish when that row's moitem has
      no BOM).
    - The WO is fetched by id, exactly (the stock report matches wo.num LIKE).
    - Header "Status" column: shown when colHeader:Class AND colHeader:Status are
      on (stock wires it to colHeader:Class only and ignores colHeader:Status).
      With the stock presets the output is the same.
    - ShowTimeStamp (unused in the jrxml) hides the footer's printed-at stamp.
    - WO instruction text: an empty-string description prints just the name
      (stock compares with == "" and prints "Name - ").
    - BOM-instructions URL header reads "URL" (stock: "URLoved", clipped).
    - Category colour with no colour code: no swatch (stock prints raw markup).
    - Untimed scheduled date with Scheduled times on: blank, never "null".
    - The Date box and the barcode end at the column edge (stock: 1pt past it).
    - Fulfilled-WO tracking values: the BI bridge getAllTrackingInfo("WOItem", id)
      when the client provides it; otherwise rebuilt in SQL from trackinginfo
      (woitem table id -355941248) as "Abbr: value" per tracking type, serials
      comma-separated, types separated by two spaces (the server helper's
      format), dates in REPORT_DATE_FORMAT.
    - Status icon (ShowWOInstructionStatus): the client's getIcon("WO", 40) when
      available, else an inline check mark.
    - Items with equal moitem.sortIdInstruct are ordered by woitem id (stock:
      undefined order).

  STATUS: proof of concept. Desk-tested against demodb through the live-SQL
  harness (tests/). Not client-tested.
================================================================================
-->

<!-- Fishbowl report settings: each token exactly once, never elsewhere. -->
<script type="text/plain" id="set-wo">$WO{Work_Order|0|Order}</script>
<script type="text/plain" id="set-print">$PRINT{Page_setup|A4|Print}</script>

<script>
// ============================================================================
//  BAIL EARLY — needs the Fishbowl embedded browser, fb-lib and fb-doc.
// ============================================================================
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
    document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#506872;">' +
        '<h2>Not running inside Fishbowl</h2><p>Open this report from the Fishbowl client\'s BI module.</p></div>';
    throw new Error('runQuery unavailable');
}
if (!window.FBLib || !window.FBDoc) {
    document.body.insertAdjacentHTML('afterbegin', '<div style="background:#F0D7DD;color:#8A1E30;padding:10px 16px;font:13px sans-serif">' +
        'Missing ' + (!window.FBLib ? 'fb-lib' : 'fb-doc') + '. Paste the BUILT file from dist/, not the source.</div>');
    throw new Error('fb-lib / fb-doc missing');
}

// Shell access (FBDoc.app, created at the end of this script).
function opt(name) { return APP.opt(name); }
function label(key, dflt) { return APP.label(key, dflt); }
function debugLog(m, t) { APP.debug(m, t); }

var esc = FBDoc.esc;
function num(v) { var n = parseFloat(v); return isNaN(n) ? 0 : n; }
function round2(x) { return Math.sign(x) * Math.round(Math.abs(x) * 100 + 1e-7) / 100; }
function has(v) { return v != null && String(v) !== ''; }

// ============================================================================
//  OPTIONS — jrxml defaults (spec §2b), stock presets, admin
// ============================================================================
var WO_REPORT_PATH = '../reports/WorkOrder/WOTraveler.jasper';

function jrxmlDefaults() {
    return {
        cbShowInstructions: 'none', ShowBarcode: true, DisplayTime: false, ShowCategory: true, ShowCategoryColor: true,
        ShowPageFooter: true, ShowTimeStamp: true, ReportTitle: '',
        'colPart#': true, colDescription: true, colBOMQty: true, colWOQty: true, colFinished: true, colUsed: true, colScrapped: true,
        'colHeader:Priority': true, 'colHeader:CustomerJob': true, 'colHeader:WOQty': true, 'colHeader:Class': true,
        'colHeader:Location': true, 'colHeader:Status': true,
        'colBOMInstructions:Order': true, 'colBOMInstructions:Name': true, 'colBOMInstructions:Description': true,
        'colBOMInstructions:Details': true, 'colBOMInstructions:URL': true,
        'colWOInstructions: Step': true, 'colWOInstructions: Instructions': true, 'colWOInstructions: Ready': true,
        'colWOInstructions: Completed': true, 'colWOInstructions: Status': true, 'colWOInstructions: URL': false,
        ShowWOInstructionDetails: false, ShowWOInstructionCompleted: false, ShowWOInstructionStatus: false
    };
}

// The options shown in the Settings drawer (cbShowInstructions: none / wo = Work
// Order Instructions / bom = BOM Instructions, the stock report's values).
var OPTION_GROUPS = [
    ['Header', [['ShowBarcode', 'Barcode'], ['DisplayTime', 'Scheduled times'], ['ShowCategory', 'Category'],
        ['ShowCategoryColor', 'Category colour']]],
    ['Header table', [['colHeader:Priority', 'Priority'], ['colHeader:CustomerJob', 'Customer job'], ['colHeader:WOQty', 'WO qty'],
        ['colHeader:Class', 'Class (and Status)'], ['colHeader:Location', 'Location'], ['colHeader:Status', 'Status']]],
    ['Sections', [['cbShowInstructions', 'Instructions (none / wo / bom)', ['none', 'wo', 'bom']],
        ['ShowPageFooter', 'Page footer'], ['ShowTimeStamp', 'Footer timestamp']]],
    ['Item columns', [['colPart#', 'Part #'], ['colDescription', 'Description'], ['colBOMQty', 'BOM qty'], ['colWOQty', 'WO qty'],
        ['colFinished', 'Finished (finished goods)'], ['colUsed', 'Used (raw goods)'], ['colScrapped', 'Scrapped (raw goods)']]],
    ['BOM instructions', [['colBOMInstructions:Order', 'Order'], ['colBOMInstructions:Name', 'Name'],
        ['colBOMInstructions:Description', 'Description'], ['colBOMInstructions:Details', 'Details'], ['colBOMInstructions:URL', 'URL']]],
    ['WO instructions', [['colWOInstructions: Step', 'Step'], ['colWOInstructions: Instructions', 'Instructions'],
        ['colWOInstructions: Ready', 'Ready'], ['colWOInstructions: Completed', 'Completed'], ['colWOInstructions: Status', 'Status'],
        ['colWOInstructions: URL', 'URL (narrower columns)'], ['ShowWOInstructionDetails', 'Details under each step'],
        ['ShowWOInstructionCompleted', 'Print qty completed'], ['ShowWOInstructionStatus', 'Done icon']]]
];

// ============================================================================
//  DATA
// ============================================================================
var WOITEM_TABLE_ID = -355941248;   // trackinginfo.tableId of woitem

function inList(ids) { return ids.map(function () { return '?'; }).join(','); }

async function fetchModel(woId) {
    // Header (main query + headerInfo dataset, one row: spec §3, §6.1).
    var hdr = await FBDoc.q([
        'SELECT wo.id, wo.num, wo.statusId AS statusid, wo.note, wo.qtyOrdered AS qtyordered,',
        '  wo.dateScheduledToStart AS datestart, wo.dateScheduled AS datefinish,',
        '  company.name AS company, priority.name AS priority, wostatus.name AS wostatus,',
        "  CONCAT(locationgroup.name, '-', location.name) AS location, customer.name AS customerjob, qbclass.name AS class,",
        '  calcategory.name AS calcat, calcategory.color AS catcolor',
        'FROM wo',
        'LEFT JOIN company ON company.id = 1',
        'LEFT JOIN priority ON priority.id = wo.priorityId',
        'LEFT JOIN wostatus ON wostatus.id = wo.statusId',
        'LEFT JOIN locationgroup ON locationgroup.id = wo.locationGroupId',
        'LEFT JOIN location ON location.id = wo.locationId',
        'LEFT JOIN customer ON customer.id = wo.customerId',
        'LEFT JOIN qbclass ON qbclass.id = wo.qbClassId',
        'LEFT JOIN calcategory ON calcategory.id = wo.calCategoryId',
        'WHERE wo.id = ?'
    ].join('\n'), [woId]);
    if (!hdr.length) throw new Error('Work order ' + woId + ' not found');
    var h = hdr[0];

    // BOM / SO of the WO's items: the first BOM found, the finished good's first.
    var link = await FBDoc.q([
        'SELECT bom.num AS bomnum, bom.description AS bomdesc, so.billToName AS customername, so.num AS sonum',
        'FROM woitem wi JOIN moitem mi ON mi.id = wi.moItemId',
        'LEFT JOIN bom ON bom.id = mi.bomId LEFT JOIN mo ON mo.id = mi.moId LEFT JOIN so ON so.id = mo.soId',
        'WHERE wi.woId = ?',
        'ORDER BY (bom.id IS NULL), (wi.typeId = 10) DESC, wi.id LIMIT 1'
    ].join('\n'), [woId]);
    var L = link[0] || {};
    h.bomnum = L.bomnum; h.bomdesc = L.bomdesc; h.customername = L.customername; h.sonum = L.sonum;

    // Finished goods (typeId 10, 31) and raw goods (everything else): §6.4, §6.5.
    var items = await FBDoc.q([
        'SELECT wi.id AS woitemid, wi.typeId AS typeid, wi.partId AS partid, part.num AS partnum, part.description AS partdesc,',
        '  mi.description AS itemname, (wi.qtyTarget / wo.qtyTarget) AS bomqty, wi.qtyTarget AS woqty, uom.code AS uomcode',
        'FROM wo JOIN woitem wi ON wi.woId = wo.id JOIN moitem mi ON mi.id = wi.moItemId',
        'LEFT JOIN part ON part.id = wi.partId LEFT JOIN uom ON uom.id = wi.uomId',
        'WHERE wo.id = ?',
        'ORDER BY COALESCE(mi.sortIdInstruct, 500), wi.id'
    ].join('\n'), [woId]);

    // Tracking types per part (the TRACKVALUE derived table + its row duplication).
    var partIds = [];
    items.forEach(function (it) { var p = parseInt(it.partid, 10); if (p > 0 && partIds.indexOf(p) < 0) partIds.push(p); });
    var tracks = {};
    if (partIds.length) {
        var tr = await FBDoc.q('SELECT ptt.partId AS partid, pt.abbr, pt.sortOrder AS sortorder FROM parttotracking ptt ' +
            'JOIN parttracking pt ON pt.id = ptt.partTrackingId WHERE ptt.partId IN (' + inList(partIds) + ') ' +
            'ORDER BY ptt.partId, pt.sortOrder, pt.id', partIds);
        tr.forEach(function (r) { (tracks[r.partid] = tracks[r.partid] || []).push(r); });
    }

    // Fulfilled WO: the recorded tracking values (ReportHelperModule.getAllTrackingInfo).
    var values = {};
    if (parseInt(h.statusid, 10) === 40 && items.length) values = await trackingValues(items, tracks);

    // Instructions (only the section that is switched on).
    var mode = String(opt('cbShowInstructions') || 'none').toLowerCase();
    var bomInstr = [], woInstr = [], instrTitle = 'Instructions', icon = null;
    if (mode === 'bom' && has(h.bomnum)) {
        bomInstr = await FBDoc.q('SELECT bii.name AS instructname, bii.description AS biidesc, bii.details, bii.sortOrder AS sortorder, bii.url ' +
            'FROM bom LEFT JOIN bominstructionitem bii ON bii.bomId = bom.id WHERE bom.num = ? ORDER BY bii.sortOrder, bii.id', [h.bomnum]);
    }
    if (mode === 'wo') {
        woInstr = await FBDoc.q('SELECT x.qtyReady AS qtyready, x.qtyFulfilled AS qtyfulfilled, x.sortOrder AS sortorder, x.name, x.description, ' +
            "COALESCE(x.details, '') AS details, bii.url FROM woinstruction x " +
            'LEFT JOIN bominstructionitem bii ON bii.id = x.bomInstructionItemId WHERE x.woId = ? ORDER BY x.sortOrder, x.id', [woId]);
        var t = await FBDoc.q("SELECT sysValue AS v FROM sysproperties WHERE sysKey = 'BOMInstructionsName' AND readAllowed = 1 LIMIT 1");
        if (t.length && has(t[0].v)) instrTitle = String(t[0].v);
        if (opt('ShowWOInstructionStatus')) icon = statusIcon();
    }
    return { h: h, items: items, tracks: tracks, values: values, bomInstr: bomInstr, woInstr: woInstr, instrTitle: instrTitle, icon: icon };
}

// getAllTrackingInfo("WOItem", id) through the BI bridge when the client has it;
// else the same text rebuilt from trackinginfo: "Abbr: value" per tracking type
// (serials comma-separated), types separated by two spaces.
async function trackingValues(items, tracks) {
    var ids = items.map(function (it) { return parseInt(it.woitemid, 10); });
    var out = {}, need = [];
    if (typeof getAllTrackingInfo === 'function') {
        items.forEach(function (it) {
            var id = parseInt(it.woitemid, 10);
            if (!tracks[it.partid]) { need.push(id); return; }
            try {
                var r = getAllTrackingInfo('WOItem', String(id));
                var txt = bridgeText(r, id);
                if (txt == null) need.push(id); else out[id] = txt;
            } catch (e) { need.push(id); debugLog('getAllTrackingInfo(' + id + '): ' + FBDoc.errText(e), 'warn'); }
        });
    } else need = ids;
    if (!need.length) return out;
    var rows = await FBDoc.q([
        'SELECT ti.recordId AS woitemid, ti.id AS tiid, pt.id AS ptid, pt.abbr, pt.typeId AS typeid, ti.info, ti.infoDate AS infodate,',
        '  ti.infoDouble AS infodouble, ti.infoInteger AS infointeger, sn.serialNum AS serialnum',
        'FROM trackinginfo ti JOIN parttracking pt ON pt.id = ti.partTrackingId',
        'LEFT JOIN trackinginfosn sn ON sn.trackingInfoId = ti.id AND pt.typeId = 40',
        'WHERE ti.tableId = ? AND ti.recordId IN (' + inList(need) + ')',
        'ORDER BY ti.recordId, pt.sortOrder, pt.id, ti.id, sn.id'
    ].join('\n'), [WOITEM_TABLE_ID].concat(need));
    var E = APP.env, by = {};
    rows.forEach(function (r) {
        var rec = by[r.woitemid] = by[r.woitemid] || { order: [], types: {} };
        var T = rec.types[r.ptid];
        if (!T) { T = rec.types[r.ptid] = { abbr: r.abbr, vals: [] }; rec.order.push(r.ptid); }
        var t = parseInt(r.typeid, 10), v = '';
        if (t === 40) v = r.serialnum == null ? '' : String(r.serialnum);
        else if (t === 20 || t === 30) v = FBDoc.fmt.date(E.date, r.infodate);
        else if (t === 50) v = FBDoc.fmt.number(E.price, r.infodouble);
        else if (t === 60) v = FBDoc.fmt.number('#,##0.#####', r.infodouble);
        else if (t === 70) v = String(r.infointeger != null ? r.infointeger : Math.round(num(r.infodouble)));
        else if (t === 80) v = (String(r.info).toLowerCase() === 'true' || parseInt(r.infointeger, 10) === 1) ? 'Yes' : 'No';
        else v = r.info == null ? '' : String(r.info);
        if (v !== '' && (t === 40 || T.vals.indexOf(v) < 0)) T.vals.push(v);
    });
    need.forEach(function (id) {
        var rec = by[id];
        out[id] = rec ? rec.order.map(function (k) { var T = rec.types[k]; return T.abbr + ': ' + T.vals.join(', '); }).join('  ') : '';
    });
    return out;
}
// The bridge's reply: plain text, or (defensively) JSON keyed by id. null = unusable.
function bridgeText(r, id) {
    if (r == null) return null;
    var s = String(r);
    if (/^\s*<ERROR/i.test(s)) return null;
    if (/^\s*[\[{]/.test(s)) {
        try {
            var j = JSON.parse(s);
            if (j && !Array.isArray(j) && typeof j[id] === 'string') return j[id];
        } catch (_) {}
        return null;
    }
    return s;
}

// WO status 40 ("Fulfilled") icon: the client's own (getIcon), else a check mark.
var CHECK_SVG = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16"><circle cx="8" cy="8" r="7.5" fill="#2E9E44"/>' +
    '<path d="M4.2 8.3l2.5 2.5 5-5.2" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
function statusIcon() {
    try {
        if (typeof getIcon === 'function') {
            var b = getIcon('WO', 40);
            if (b && String(b).length > 20) return '<img alt="" src="data:image/png;base64,' + esc(String(b).replace(/\s+/g, '')) + '">';
        }
    } catch (e) { debugLog('getIcon: ' + FBDoc.errText(e), 'warn'); }
    return CHECK_SVG;
}

// TRACKVALUE of the jrxml: GROUP_CONCAT(abbr) per (part, sortOrder), then
// GROUP_CONCAT(x, '___', '') — e.g. "Lot#___,ExpDate___".
function trackValue(list) {
    if (!list || !list.length) return null;
    var groups = [], bySort = {};
    list.forEach(function (r) {
        var k = String(r.sortorder);
        if (!bySort[k]) { bySort[k] = []; groups.push(bySort[k]); }
        bySort[k].push(r.abbr == null ? '' : r.abbr);
    });
    return groups.map(function (g) { return g.join(',') + '___'; }).join(',');
}

// A jr:table: visible columns at their jrxml widths (scaled), then a filler
// column so the table element spans the content width like every fb-doc table.
function tableDef(cls, cols, geom, K) {
    var widths = cols.map(function (c) { return round2(c.w * K); });
    var used = widths.reduce(function (a, b) { return a + b; }, 0);
    var rest = round2(geom.CWpt - used);
    if (Math.abs(rest) < 0.05 && widths.length) { widths[widths.length - 1] = round2(widths[widths.length - 1] + rest); rest = 0; }
    if (rest > 0) widths.push(rest);
    return { className: 'wt-doc wt-tbl ' + cls, colgroup: FBDoc.Columns.colgroup(widths),
             thead: '<thead><tr>' + cols.map(function (c) { return c.hd; }).join('') + '</tr></thead>' };
}

// The TrackingItem group row (§6.4): write-in prompts (one per tracking type, at
// the first tab stop) unless the WO is Fulfilled, then the recorded values.
function trackingRow(model, it, status, span) {
    var text = '', indent = false;
    if (status !== 40) {
        var tv = trackValue(model.tracks[it.partid]);
        if (tv != null) {
            var s = '\t' + tv.split('___').join(':').split(',').join('\n\t');
            text = s.split('\n').map(function (ln) { return ln.replace(/^\t/, ''); }).join('\n');
            indent = true;
        }
    } else {
        var v = model.values[parseInt(it.woitemid, 10)];
        text = v == null ? '' : String(v);
    }
    if (!text) return '<tr><td class="trk0" colspan="' + span + '"></td></tr>';
    return '<tr><td class="trk" colspan="' + span + '"><div class="wt-pre' + (indent ? ' ind' : '') + '" data-fbdoc-split>' + esc(text) + '</div></td></tr>';
}

// Continuation label of a row split over a page break: fb-doc empties every cell
// of the continuation fragment except the one being split, so a cell that is never
// empty in the original row (its text sits in a div) shows "… (continued)" when
// emptied (CSS td.cl:empty::before). Returns the rest of a class attribute.
function contCell(txt) {
    return has(txt) ? ' cl" data-cont="' + esc(String(txt).replace(/\s+/g, ' ') + ' (continued)') + '"' : '"';
}

// ============================================================================
//  WORK ORDER PICKER — typeahead + browse with status / period filters (per user)
// ============================================================================
var PERIODS = [{ value: '30', label: '30 days' }, { value: '90', label: '90 days' }, { value: '365', label: '1 year' }, { value: 'all', label: 'All' }];
function pickFilterSql(f) {
    var where = [];
    var st = ((f && f.status) || []).map(function (x) { return parseInt(x, 10); }).filter(function (n) { return !isNaN(n); });
    if (st.length) where.push('wo.statusId IN (' + st.join(',') + ')');
    var days = parseInt(f && f.period, 10);
    if (days > 0) where.push('wo.dateCreated >= DATE_SUB(CURDATE(), INTERVAL ' + days + ' DAY)');
    return where;
}
async function searchOrders(term, f) {
    var where = pickFilterSql(f), params = [];
    if (term) {
        where.push('(wo.num LIKE ? OR mo.num LIKE ? OR wo.id IN (SELECT fi.woId FROM woitem fi JOIN part fp ON fp.id = fi.partId ' +
            'WHERE fi.typeId IN (10, 31) AND fp.num LIKE ?))');
        params.push(term + '%', term + '%', '%' + term + '%');
    }
    var rows = await FBDoc.q(
        'SELECT wo.id, wo.num, mo.num AS monum, st.name AS status, wo.dateCreated AS datecreated, wo.qtyTarget AS qtytarget, ' +
        '(SELECT p.num FROM woitem w2 JOIN part p ON p.id = w2.partId WHERE w2.woId = wo.id AND w2.typeId IN (10, 31) ORDER BY w2.id LIMIT 1) AS fgpart ' +
        'FROM wo LEFT JOIN wostatus st ON st.id = wo.statusId LEFT JOIN moitem wmi ON wmi.id = wo.moItemId LEFT JOIN mo ON mo.id = wmi.moId ' +
        (where.length ? 'WHERE ' + where.join(' AND ') + ' ' : '') +
        'ORDER BY wo.dateCreated DESC, wo.id DESC LIMIT 60', params);
    return rows.map(function (r) {
        return { value: r.id, label: r.num, sub: (has(r.fgpart) ? r.fgpart : '') + (has(r.monum) ? ' · MO ' + r.monum : ''),
                 meta: [r.status || '', FBDoc.fmt.date(APP.env ? APP.env.date : 'dd/MM/yyyy', r.datecreated),
                        'Qty ' + FBDoc.fmt.number(APP.env ? APP.env.qty : '#,##0.##', r.qtytarget)] };
    });
}
// ============================================================================
//  THE APP — FBDoc.app runs the screen; this report supplies its document.
// ============================================================================
var APP = FBDoc.app({
    title: 'Work Order Traveler',
    record: { code: 'WO', table: 'wo', numColumn: 'num', noun: 'work order', setting: 'set-wo' },
    presets: function () { return [WO_REPORT_PATH]; },
    defaults: function () { return jrxmlDefaults(); },
    options: OPTION_GROUPS,
    optionsIntro: 'the stock Work Order Traveler report',
    fetch: function (id) { return fetchModel(id); },
    build: function (model, geom) { return buildDoc(model, geom); },
    picker: {
        placeholder: 'WO #, MO # or finished good…',
        alias: 'wo',
        where: pickFilterSql,
        search: function (term, f) { return searchOrders(term, f); },
        filters: async function (saved) {
            var statuses = [];
            try { statuses = await FBDoc.q('SELECT id, name FROM wostatus ORDER BY id'); } catch (e) { debugLog('wostatus: ' + FBDoc.errText(e), 'warn'); }
            return [
                { key: 'status', label: 'Status', multi: true, value: saved.status || [],
                  options: statuses.map(function (r) { return { value: String(r.id), label: r.name }; }) },
                { key: 'period', label: 'Created', value: saved.period || '365', options: PERIODS }
            ];
        }
    }
});
