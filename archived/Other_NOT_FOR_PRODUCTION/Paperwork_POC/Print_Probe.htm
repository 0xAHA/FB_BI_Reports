<!DOCTYPE html>
<!--
================================================================================
  PRINT PROBE (Phase 0 of the paperwork proof of concept)
  PATH: Other_NOT_FOR_PRODUCTION/Paperwork_POC/Print_Probe.htm

  Save dist/Print_Probe.htm (after `node build.js`) as a BI script + BI Report in
  a test database, open it in the BI Report module and:
    1. Click Parameters, set Sales_Order / Invoice / Page_setup, OK. Note what
       the dialog shows for each setting.
    2. Read the "Setting tokens" panel: the raw text Fishbowl substituted.
    3. Toolbar Save -> PDF: check the paper size, the page count (should equal
       the sheet count shown), that the 100 mm ruler measures 100 mm, that the
       grey stripes and borders printed, that there is no blank last page and no
       browser header/footer, and that the link is clickable.
    4. Toolbar Print and Email: same checks. Also try the in-page Print button.
  Send back the panel text + the PDF.
================================================================================
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="description" content="A test page for the BI print and PDF toolbar settings.">
    <title>Print Probe</title>
    <!-- @inline-style fb-doc-fonts.css -->
    <!-- @inline-script fb-doc.js -->
    <style>
        html, body { margin: 0; height: 100%; font: 13px sans-serif; }
        body { display: flex; flex-direction: column; height: 100vh; }
        #probePanel { padding: 10px 14px; background: #f4f6f7; border-bottom: 1px solid #ccd; max-height: 40vh; overflow: auto; }
        #probePanel pre { margin: 4px 0; white-space: pre-wrap; font: 12px/1.35 Consolas, monospace; }
        #probeCanvas { flex: 1 1 auto; min-height: 0; }
        .ruler { position: relative; height: 12mm; border-bottom: 0.3mm solid #000; }
        .ruler span { position: absolute; bottom: 0; width: 0; border-left: 0.3mm solid #000; }
        .corner { position: absolute; width: 6mm; height: 6mm; border: 0 solid #000; }
        .zt th { background: #EAEAEA; font-weight: 700; text-align: left; border-bottom: 0.5pt solid #000; padding: 2pt 3pt; }
        .zt td { padding: 2pt 3pt; }
        .zt tbody.fbdoc-zebra td { background: #EAEAEA; }
        .pdiag { font: 700 9pt sans-serif; color: #8A1E30; margin: 2pt 0 4pt; }
    </style>
</head>
<body>
<script type="text/plain" id="set-so">$SO{Sales_Order|0|Order}</script>
<script type="text/plain" id="set-invoice">$CHECK{Invoice|false|Document}</script>
<script type="text/plain" id="set-print">$PRINT{Page_setup|A4|Print}</script>

<div id="probePanel">
    <strong>Print probe</strong> — <button type="button" onclick="FBDoc.printWindow({ title: 'Print probe' })">In-page Print</button>
    <pre id="probeOut">running…</pre>
</div>
<div id="probeCanvas"></div>

<script>
(async function () {
    var out = [];
    function line(k, v) { out.push(k + ': ' + v); document.getElementById('probeOut').textContent = out.join('\n'); }
    function raw(id) { var e = document.getElementById(id); return e ? JSON.stringify(e.textContent) : '(missing)'; }
    try {
        line('User agent', navigator.userAgent);
        line('devicePixelRatio', window.devicePixelRatio);
        line('Setting tokens (raw)', '\n  SO      ' + raw('set-so') + '\n  CHECK   ' + raw('set-invoice') + '\n  PRINT   ' + raw('set-print'));
        var spec = FBDoc.page.resolve(FBDoc.param.fromEl('set-print', 'A4'));
        line('Page resolved', JSON.stringify({ name: spec.name, wMm: spec.wMm, hMm: spec.hMm, orientation: spec.orientation, margin: spec.margin, source: spec.source, warnings: spec.warnings }));
        line('SO id parsed', FBDoc.param.int(FBDoc.param.fromEl('set-so'), 0) + ' · Invoice parsed ' + FBDoc.param.bool(FBDoc.param.fromEl('set-invoice'), false));

        if (typeof runQueryAsync === 'function') {
            try { var r = await runQueryAsync({ query: 'SELECT ? AS a, ? AS b', parameters: ['x', 2] }); line('runQueryAsync bind params (needs Data Access API)', JSON.stringify(r)); }
            catch (e) { line('runQueryAsync bind params (needs Data Access API)', 'REFUSED: ' + FBDoc.errText(e)); }
            try { var r2 = await FBDoc.q('SELECT ? AS a, ? AS b', ['x', 2]); line('FBDoc.q inline binding', JSON.stringify(r2)); }
            catch (e) { line('FBDoc.q inline binding', 'FAILED: ' + FBDoc.errText(e)); }
        } else line('runQueryAsync', 'not available (outside Fishbowl)');

        var t0 = Date.now();
        var fontOk0 = document.fonts ? document.fonts.check('9pt "FB Doc Open Sans"') : 'n/a';

        // Print-path diagnostic: in print, CSS width/height media queries see the
        // PRINT SETTINGS' page (the printer / dialog paper minus margins), not the
        // page's @page size. 1 mm buckets print that area on the paper: if it is
        // smaller than this sheet, that print path shrinks the sheet to fit
        // (e.g. a dialog defaulting to Letter while the document is A4).
        var g0 = FBDoc.page.geometry(spec);
        var EXPECT = (g0.W / FBDoc.units.PX_PER_MM).toFixed(1) + ' × ' + ((g0.H + 2) / FBDoc.units.PX_PER_MM).toFixed(1) + ' mm';
        var css = '.pw,.ph{display:none}.pscr{display:inline}@media print{.pscr{display:none}}';
        var PDIAG = '<span class="pscr">(shown when printed)</span>';
        for (var mw = 80; mw <= 460; mw++) {
            css += '@media print and (min-width:' + mw + 'mm) and (max-width:' + (mw + 0.999) + 'mm){.pw' + mw + '{display:inline}}';
            PDIAG += '<span class="pw pw' + mw + '">' + mw + '–' + (mw + 1) + ' mm wide</span>';
        }
        PDIAG += ' × ';
        for (var mh = 80; mh <= 460; mh++) {
            css += '@media print and (min-height:' + mh + 'mm) and (max-height:' + (mh + 0.999) + 'mm){.ph' + mh + '{display:inline}}';
            PDIAG += '<span class="ph ph' + mh + '">' + mh + '–' + (mh + 1) + ' mm high</span>';
        }
        var dst = document.createElement('style'); dst.textContent = css; document.head.appendChild(dst);

        // Synthetic document: ruler + corner marks on every sheet, 140 zebra rows, a link.
        var rows = [];
        for (var i = 1; i <= 140; i++) rows.push({ table: 'z', stripe: true, html: '<tr><td>' + i + '</td><td>Row ' + i + ' — the quick brown fox jumps over the lazy dog</td><td style="text-align:right">$ ' + (i * 12.5).toFixed(2) + '</td></tr>' });
        var ruler = '<div class="ruler" style="width:100mm">' + Array.from({ length: 11 }, function (_, k) {
            return '<span style="left:' + (k * 10) + 'mm;height:' + (k % 5 ? 3 : 6) + 'mm"></span>'; }).join('') + '</div>' +
            '<div style="font-size:8pt">↑ this rule must measure exactly 100 mm on paper · corner marks sit 2 mm inside the printable area: ≈12 mm from the paper edge</div>' +
            '<div class="pdiag">Printer page area (paper − margins from the print settings): ' + PDIAG + ' · this sheet needs ' + EXPECT + '</div>';
        var doc = {
            id: 'probe',
            pageHeader: function (ctx) { return '<div style="display:flex;justify-content:space-between;font:700 14pt \'FB Doc Open Sans\'"><span>Print probe</span><span>Sheet ' + ctx.pageNo + ' / ' + ctx.pageCount + '</span></div>' + ruler; },
            pageFooter: function (ctx) { return '<div style="font-size:9pt;text-align:right">Page ' + ctx.pageNo + ' of ' + ctx.pageCount + ' — not the last page</div>'; },
            lastPageFooter: function (ctx) { return '<div style="font-size:9pt;border-top:0.5pt solid #000;padding-top:4pt">LAST PAGE FOOTER · <a href="https://www.fishbowlinventory.com">clickable link</a> · Page ' + ctx.pageNo + ' of ' + ctx.pageCount + '</div>'; },
            tables: { z: { className: 'zt', colgroup: '<colgroup><col style="width:12%"><col><col style="width:20%"></colgroup>', thead: '<thead><tr><th>#</th><th>Text</th><th>Amount</th></tr></thead>' } },
            blocks: [{ html: '<p style="font-size:10pt;margin:6pt 0">Fonts: embedded Open Sans · colours: grey stripes must print.</p>' }].concat(rows)
        };
        var res = await FBDoc.paginate({ mount: document.getElementById('probeCanvas'), page: spec, docs: [doc] });
        line('Font loaded', 'before=' + fontOk0 + ' after=' + (document.fonts ? document.fonts.check('9pt "FB Doc Open Sans"') : 'n/a') + ' (' + (Date.now() - t0) + ' ms)');
        line('Sheets rendered', res.sheets + ' (PDF must have exactly this many pages) · geometry W×H px ' + res.geometry.W.toFixed(2) + '×' + res.geometry.H.toFixed(2) + ' · warnings ' + JSON.stringify(res.warnings));
        // Corner marks inside each sheet's margin box.
        Array.prototype.forEach.call(document.querySelectorAll('.fbdoc-sheet'), function (s) {
            [['left', 'top'], ['right', 'top'], ['left', 'bottom'], ['right', 'bottom']].forEach(function (c) {
                var m = document.createElement('div'); m.className = 'corner';
                m.style[c[0]] = '2mm'; m.style[c[1]] = '2mm';
                m.style['border' + c[0][0].toUpperCase() + c[0].slice(1) + 'Width'] = '0.3mm';
                m.style['border' + c[1][0].toUpperCase() + c[1].slice(1) + 'Width'] = '0.3mm';
                s.appendChild(m);
            });
        });
    } catch (e) { line('ERROR', e && e.stack || e); }
})();
</script>
</body>
</html>
