<!DOCTYPE html>
<!--
    Redirect-only landing page for the QuickOrder Pages site.
    Cloudflare Pages serves this when staff hit the apex
    (https://0xaha.com/) with no path; without it the Pages router
    returns 404. It sends them to the released QuickOrder, v1.2.
    (v1.0, QuickOrder.htm, was retired to archived/ on 2026-10-01, so
    an old /QuickOrder.htm bookmark 404s after the next deploy.)

    location.search + location.hash are preserved so any URL params
    (?key=…, ?worker=…) carry through to QuickOrder_v1.2.htm. The <meta
    refresh> fallback covers browsers where JS is disabled or blocked.
-->
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=QuickOrder_v1.2.htm">
    <title>Quick Order</title>
    <script>
        location.replace('QuickOrder_v1.2.htm' + location.search + location.hash);
    </script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
               display: flex; align-items: center; justify-content: center;
               height: 100vh; margin: 0; color: #475569; background: #f8fafc; }
        a { color: #2563eb; }
    </style>
</head>
<body>
    <p>Loading Quick Order — <a href="QuickOrder_v1.2.htm">click here if not redirected</a>.</p>
</body>
</html>
