<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Open Orders Report - Fishbowl BI</title>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <!-- Shared Fishbowl BI lib (Settings layer + Common formatting/debug helpers).
       Inlined by Fishbowl from the saved script named "fb-lib". Source of truth
       lives at scripts/fb-lib.js. Uses FBLib.Common + FBLib.Settings only. -->
  <script>
    {% Script fb-lib %}
  </script>

  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; font-size: 13px; color: #1e293b; background: #f8fafc; }

    /* ── HEADER BAR ── */
    header { position: sticky; top: 0; z-index: 50; background: #fff; border-bottom: 1px solid #e2e8f0; box-shadow: 0 1px 2px rgba(0,0,0,0.04); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 56px; }
    header h1 { font-size: 16px; font-weight: 700; color: #0f172a; margin: 0; line-height: 1.15; }
    #statusLine { font-size: 12px; color: #94a3b8; line-height: 1.15; margin: 0; }
    .hdr-actions { display: flex; align-items: center; gap: 8px; }
    .hdr-btn { display: flex; align-items: center; gap: 5px; padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 500; border: 1px solid #e2e8f0; background: #fff; color: #475569; cursor: pointer; transition: all 0.15s; white-space: nowrap; font-family: inherit; }
    .hdr-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .hdr-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
    .hdr-btn-icon { padding: 7px; border-radius: 8px; }

    /* ── PAGE ── */
    .wrap { max-width: 100%; margin: 0; padding: 16px 20px 60px; }
    .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 10px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); margin-bottom: 16px; }

    /* ── CONTROLS ── */
    .controls { display: flex; flex-wrap: wrap; gap: 14px 20px; padding: 14px 16px; align-items: flex-end; }
    .field { display: flex; flex-direction: column; gap: 4px; }
    .field label { font-size: 10px; font-weight: 600; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em; }
    .field select, .field input { padding: 7px 9px; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 13px; color: #1e293b; background: #fff; font-family: inherit; }
    .field input[type=text] { min-width: 220px; }
    .field select:focus, .field input:focus { outline: none; border-color: #2563eb; box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
    .field .chk { display: flex; align-items: center; gap: 7px; text-transform: none; font-size: 12px; font-weight: 500; color: #475569; cursor: pointer; padding-bottom: 7px; }
    .field .chk input { width: auto; padding: 0; margin: 0; border: 0; box-shadow: none; }

    /* ── TABLE ── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 12.5px; table-layout: fixed; }
    .data-table th { background: #1e3a5f; color: #fff; font-weight: 500; font-size: 11px; text-align: left; padding: 8px 10px; white-space: nowrap; position: sticky; top: 56px; z-index: 5; text-transform: uppercase; letter-spacing: 0.03em; cursor: grab; user-select: none; overflow: hidden; }
    .data-table th.nr { text-align: right; }
    .data-table th.dragging { opacity: 0.4; }
    .data-table th.drag-over { box-shadow: inset 3px 0 0 #60a5fa; }
    .col-resize { position: absolute; top: 0; right: 0; width: 7px; height: 100%; cursor: col-resize; }
    .data-table td { padding: 6px 10px; border-bottom: 1px solid #eef2f7; white-space: nowrap; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
    .data-table tbody tr.item:hover td { background: #eff6ff; }
    .group-row td { background: #eef2f7; font-weight: 600; color: #0f172a; padding: 7px 10px; border-bottom: 1px solid #e2e8f0; position: sticky; top: 88px; z-index: 4; }
    .group-row .cat-name { color: #1e3a5f; }
    .group-row .group-sub { color: #64748b; font-weight: 500; font-size: 11px; margin-left: 8px; }
    .num-cell { text-align: right; font-variant-numeric: tabular-nums; }
    .muted { color: #94a3b8; }
    .row-link { color: #2563eb; cursor: pointer; text-decoration: none; font-weight: 600; }
    .row-link:hover { text-decoration: underline; }
    .past-due { color: #b91c1c; font-weight: 600; }
    .short { color: #b91c1c; font-weight: 700; }   /* qty required > 0 (shortfall) */
    .covered { color: #047857; font-weight: 600; } /* qty required <= 0 (covered) */
    .part-row td { background: #f1f5f9; font-weight: 600; }
    .pcount { color: #94a3b8; font-weight: 500; font-size: 11px; }
    .pdesc { color: #64748b; font-weight: 400; }
    .so-row td { color: #475569; }
    .so-row .so-prod { border-left: 3px solid #cbd5e1; }
    .empty { padding: 36px; text-align: center; color: #94a3b8; font-style: italic; }

    /* ── SPINNER ── */
    #spinner { display: none; padding: 40px; text-align: center; color: #64748b; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spin { animation: spin 0.8s linear infinite; }

    /* ── DEBUG ── */
    #debugConsole { display: none; }
    #debugConsole .dc-head { display: flex; justify-content: space-between; align-items: center; background: #0f172a; padding: 10px 14px; border-radius: 10px 10px 0 0; }
    #debugConsole .dc-head h3 { margin: 0; font-size: 12px; color: #e2e8f0; }
    #debugLog { background: #0f172a; border-radius: 0 0 10px 10px; padding: 12px; max-height: 260px; overflow-y: auto; font-family: ui-monospace, monospace; font-size: 11px; color: #e2e8f0; white-space: pre-wrap; }
    .mini-btn { padding: 4px 9px; font-size: 11px; border-radius: 6px; border: 1px solid #334155; background: #1e293b; color: #cbd5e1; cursor: pointer; font-family: inherit; }

    /* ── SETTINGS PANEL ── */
    #setOverlay { position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 1001; display: none; justify-content: flex-end; }
    #setPanel { background: #f8fafc; width: 360px; max-width: 95vw; height: 100%; overflow-y: auto; box-shadow: -2px 0 12px rgba(0,0,0,0.25); display: flex; flex-direction: column; }
    #setPanel .ds-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 18px; border-bottom: 1px solid #e2e8f0; background: #fff; }
    #setPanel .ds-header h2 { margin: 0; font-size: 15px; }
    #setPanel .ds-close { background: transparent; border: none; font-size: 24px; cursor: pointer; color: #64748b; line-height: 1; }
    #setPanel .ds-body { padding: 16px 18px; flex: 1; }
    #setPanel .ds-section { margin-bottom: 20px; }
    #setPanel .ds-label { display: block; font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: #475569; margin-bottom: 8px; }
    #setPanel .ds-checks label { display: block; padding: 5px 0; font-size: 13px; cursor: pointer; }
    #setPanel .ds-checks input { margin-right: 7px; }
    #setPanel .ds-footer { padding: 12px 18px; border-top: 1px solid #e2e8f0; background: #fff; display: flex; gap: 8px; justify-content: flex-end; }
    #setPanel .ds-btn { padding: 7px 14px; font-size: 13px; border-radius: 6px; border: 1px solid #cbd5e1; background: #fff; cursor: pointer; font-family: inherit; }
    #setPanel .ds-btn-primary { background: #2563eb; color: #fff; border-color: #2563eb; }
    #setPanel .ds-admin { border-top: 1px dashed #cbd5e1; padding-top: 16px; }
    #setPanel .ds-btn-admin { display: block; width: 100%; margin-bottom: 6px; background: #fef3c7; border-color: #f59e0b; color: #7c2d12; }
    #setPanel .ds-lock-badge { background: #fef3c7; color: #92400e; border: 1px solid #f59e0b; padding: 6px 10px; border-radius: 6px; font-size: 12px; margin-bottom: 14px; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>Open Orders Report</h1>
      <p id="statusLine">Initialising…</p>
    </div>
    <div class="hdr-actions">
      <button class="hdr-btn" onclick="loadData()" title="Reload"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>Refresh</button>
      <button class="hdr-btn" onclick="exportCSV()" title="Export CSV"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>CSV</button>
      <button class="hdr-btn" onclick="printReport()" title="Print / PDF (landscape)"><svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>Print</button>
      <button class="hdr-btn hdr-btn-icon" onclick="PageSettings.openPanel()" title="Settings"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M19.14 12.94c.04-.31.06-.62.06-.94 0-.32-.02-.63-.06-.94l2.03-1.58a.49.49 0 00.12-.61l-1.92-3.32a.488.488 0 00-.59-.22l-2.39.96a7.03 7.03 0 00-1.62-.94l-.36-2.54a.484.484 0 00-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.56-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.04.31-.06.63-.06.94 0 .32.02.63.06.94l-2.03 1.58a.49.49 0 00-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6A3.6 3.6 0 018.4 12 3.6 3.6 0 0112 8.4a3.6 3.6 0 013.6 3.6 3.6 3.6 0 01-3.6 3.6z"/></svg></button>
    </div>
  </header>

  <div class="wrap">

    <!-- CONTROLS -->
    <div class="card">
      <div class="controls">
        <div class="field">
          <label>Search product / SO / customer</label>
          <input type="text" id="search" placeholder="contains…" oninput="applyFiltersDebounced()" />
        </div>
        <div class="field">
          <label>Category</label>
          <select id="catFilter" onchange="applyFilters()"><option value="">All categories</option></select>
        </div>
        <div class="field">
          <label class="chk"><input type="checkbox" id="onlyShort" onchange="applyFilters()" /> Only shortfalls (qty required &gt; 0)</label>
        </div>
      </div>
    </div>

    <!-- TABLE -->
    <div class="card">
      <div id="spinner"><svg class="spin" width="30" height="30" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#e2e8f0" stroke-width="3"/><path d="M12 2a10 10 0 0 1 10 10" stroke="#2563eb" stroke-width="3" stroke-linecap="round"/></svg><div style="margin-top:8px;">Loading open orders, on-hand &amp; production…</div></div>
      <table class="data-table" id="ooTable">
        <colgroup id="ooColgroup"></colgroup>
        <thead id="ooHead"></thead>
        <tbody id="ooBody">
          <tr><td class="empty" colspan="9">Loading…</td></tr>
        </tbody>
      </table>
    </div>

    <!-- DEBUG -->
    <div class="card" id="debugConsole">
      <div class="dc-head"><h3>Debug Console</h3><button class="mini-btn" onclick="clearDebug()">Clear</button></div>
      <div id="debugLog"></div>
    </div>

  </div>

  <!-- SETTINGS PANEL -->
  <div id="setOverlay" onclick="PageSettings.closeIfOverlay(event)">
    <div id="setPanel" onclick="event.stopPropagation()">
      <div class="ds-header">
        <h2>Settings — Open Orders</h2>
        <button type="button" class="ds-close" onclick="PageSettings.closePanel()">&times;</button>
      </div>
      <div class="ds-body">
        <div id="dsLockBadge" class="ds-lock-badge" style="display:none;">Locked by admin — your changes won't be saved.</div>
        <div class="ds-section ds-checks">
          <label class="ds-label">Options</label>
          <label><input type="checkbox" id="dsOnlyShort" /> Default to only shortfalls</label>
          <label><input type="checkbox" id="dsDebug" /> Show debug console</label>
        </div>
        <div id="dsAdminSection" class="ds-section ds-admin" style="display:none;">
          <label class="ds-label">Admin</label>
          <button type="button" class="ds-btn ds-btn-admin" onclick="PageSettings.publishMaster()">Publish as default for everyone</button>
          <button type="button" class="ds-btn ds-btn-admin" id="dsLockBtn" onclick="PageSettings.toggleLock()">Lock user editing</button>
        </div>
      </div>
      <div class="ds-footer">
        <button type="button" class="ds-btn" onclick="PageSettings.resetToDefaults()">Reset to defaults</button>
        <button type="button" class="ds-btn ds-btn-primary" onclick="PageSettings.saveUser()">Save (just me)</button>
      </div>
    </div>
  </div>

<script>
/* ── RUNTIME GUARD ── */
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#475569;"><h2>Not running inside Fishbowl</h2><p>This report requires the Fishbowl BI environment.</p></div>';
  throw new Error('Fishbowl API not available');
}

/* ── FB-LIB SETTINGS ── */
FBLib.Settings.init({
  userKey:   'cdx.bi.openOrders.user.v1',
  masterKey: 'cdx.bi.openOrders.master.v1',
  defaults: { v: 1, onlyShort: false, cols: [], debug: false },
  propFallback: { debug: { name: 'BI_SHOW_DEBUG', dflt: 'false', parse: v => (v === 'true' || v === true) } }
});

/* ── THIN HELPERS ── */
const _C = (window.FBLib && FBLib.Common) ? FBLib.Common : null;
function fmtQty(v) {
  if (_C && _C.formatQty) return _C.formatQty(v);
  const n = parseFloat(v); if (isNaN(n)) return '';
  return n % 1 === 0 ? String(Math.round(n)) : n.toFixed(4).replace(/\.?0+$/, '');
}
function fmtDate(s) { try { return _C && _C.formatDate ? _C.formatDate(s) : String(s || '').split(' ')[0]; } catch (_) { return String(s || ''); } }
function escHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
function setStatus(m) { document.getElementById('statusLine').textContent = m; }

/* ── QUERY HELPERS ── */
function norm(r) {
  if (r == null) return [];
  if (typeof r === 'string') { try { const p = JSON.parse(r); return Array.isArray(p) ? p : []; } catch (_) { return []; } }
  return Array.isArray(r) ? r : [];
}
async function qp(sql) {
  try { return norm(await runQueryAsync(sql)); }
  catch (e) { try { return norm(runQuery(sql)); } catch (e2) { throw e2; } }
}

/* ── STATE ── */
let _parts = [];      // part groups: {category, partid, productnum, partnum, onHand, inProd, lines:[]}
let _shown = [];      // filtered: [{ g, lines, sumToShip, required }]
let _filterTimer = null;
const _UNCAT = '(Uncategorised)';
const _todayStr = new Date().toISOString().split('T')[0];

/* ── COLUMNS (reorderable + resizable, persisted via fb-lib) ── */
const _DEFAULT_COLS = [
  { key: 'product',   label: 'Product',          w: 280 },
  { key: 'scheduled', label: 'Scheduled',        w: 110 },
  { key: 'sonum',     label: 'SO #',             w: 120 },
  { key: 'custpo',    label: 'Customer PO',      w: 140 },
  { key: 'customer',  label: 'Customer',         w: 200 },
  { key: 'toship',    label: 'Qty to Ship',      w: 110, nr: true },
  { key: 'onhand',    label: 'Qty On Hand',      w: 110, nr: true },
  { key: 'inprod',    label: 'Qty In Production', w: 130, nr: true },
  { key: 'required',  label: 'Qty Required',     w: 120, nr: true }
];
let _cols = _DEFAULT_COLS.map(function (c) { return Object.assign({}, c); });
let _dragKey = null;
let _resizing = null;

function loadColPrefs() {
  let saved = null;
  try { saved = FBLib.Settings.resolve('cols'); } catch (_) {}
  if (!Array.isArray(saved) || !saved.length) { _cols = _DEFAULT_COLS.map(function (c) { return Object.assign({}, c); }); return; }
  const byKey = {}; _DEFAULT_COLS.forEach(function (c) { byKey[c.key] = c; });
  const out = []; const seen = {};
  saved.forEach(function (s) {
    const d = byKey[s.key];
    if (d && !seen[s.key]) { out.push(Object.assign({}, d, { w: (s.w > 40 ? s.w : d.w) })); seen[s.key] = 1; }
  });
  _DEFAULT_COLS.forEach(function (c) { if (!seen[c.key]) out.push(Object.assign({}, c)); });
  _cols = out;
}
function saveColPrefs() {
  try { FBLib.Settings.setUserKey('cols', _cols.map(function (c) { return { key: c.key, w: c.w }; })); FBLib.Settings.saveUser(); } catch (_) {}
}

function renderHead() {
  const cg = document.getElementById('ooColgroup');
  const head = document.getElementById('ooHead');
  let total = 0;
  cg.innerHTML = _cols.map(function (c) { total += c.w; return '<col style="width:' + c.w + 'px">'; }).join('');
  document.getElementById('ooTable').style.width = total + 'px';

  const tr = document.createElement('tr');
  _cols.forEach(function (c) {
    const th = document.createElement('th');
    if (c.nr) th.className = 'nr';
    th.dataset.key = c.key;
    th.draggable = true;
    th.appendChild(document.createTextNode(c.label));
    const rz = document.createElement('div'); rz.className = 'col-resize';
    rz.addEventListener('mousedown', function (e) { startResize(e, c, th); });
    th.appendChild(rz);
    th.addEventListener('dragstart', function (e) { if (_resizing) { e.preventDefault(); return; } _dragKey = c.key; e.dataTransfer.effectAllowed = 'move'; th.classList.add('dragging'); });
    th.addEventListener('dragover', function (e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; if (_dragKey && _dragKey !== c.key) th.classList.add('drag-over'); });
    th.addEventListener('dragleave', function () { th.classList.remove('drag-over'); });
    th.addEventListener('drop', function (e) {
      e.preventDefault(); th.classList.remove('drag-over');
      if (!_dragKey || _dragKey === c.key) return;
      const fi = _cols.findIndex(function (x) { return x.key === _dragKey; });
      const ti = _cols.findIndex(function (x) { return x.key === c.key; });
      if (fi < 0 || ti < 0) return;
      const m = _cols.splice(fi, 1)[0]; _cols.splice(ti, 0, m);
      saveColPrefs(); renderHead(); render();
    });
    th.addEventListener('dragend', function () { _dragKey = null; document.querySelectorAll('#ooHead th').forEach(function (t) { t.classList.remove('dragging', 'drag-over'); }); });
    tr.appendChild(th);
  });
  head.innerHTML = ''; head.appendChild(tr);
}

function startResize(e, col, th) {
  e.preventDefault(); e.stopPropagation();
  _resizing = { col: col, startX: e.clientX, startW: col.w };
  th.draggable = false;
  document.addEventListener('mousemove', onResizeMove);
  document.addEventListener('mouseup', onResizeUp);
}
function onResizeMove(e) {
  if (!_resizing) return;
  const w = Math.max(50, _resizing.startW + (e.clientX - _resizing.startX));
  _resizing.col.w = w;
  const idx = _cols.indexOf(_resizing.col);
  const colEl = document.getElementById('ooColgroup').children[idx];
  if (colEl) colEl.style.width = w + 'px';
  let total = 0; _cols.forEach(function (c) { total += c.w; });
  document.getElementById('ooTable').style.width = total + 'px';
}
function onResizeUp() {
  document.removeEventListener('mousemove', onResizeMove);
  document.removeEventListener('mouseup', onResizeUp);
  if (_resizing) { _resizing = null; saveColPrefs(); renderHead(); }
}

function link(text, fn) {
  const a = document.createElement('a'); a.className = 'row-link'; a.href = '#'; a.textContent = text;
  a.addEventListener('click', function (e) { e.preventDefault(); fn(); });
  return a;
}

/* ── DEBUG ── */
function dbg(msg, type) { try { if (FBLib.Common.DEBUG_MODE) FBLib.Common.debugLog(msg, type || 'info'); } catch (_) {} }
function clearDebug() { try { FBLib.Common.clearDebugLog(); } catch (_) {} if (!FBLib.Common.DEBUG_MODE) document.getElementById('debugConsole').style.display = 'none'; }

/* ── LOAD DATA ── */
async function loadData() {
  document.getElementById('spinner').style.display = 'block';
  document.getElementById('ooTable').style.display = 'none';
  setStatus('Loading…');

  try {
    let allowed = null;
    try { if (typeof getLocationGroupList === 'function') allowed = getLocationGroupList(); } catch (_) {}
    const lgClause = (Array.isArray(allowed) && allowed.length) ? (' AND so.locationgroupid IN (' + allowed.join(',') + ') ') : ' ';

    // Open SO lines: issued / in-progress orders, line not yet shipped, with a
    // product (→ part). Category = the product's product-tree node (one per
    // product via MIN tree id to avoid many-to-many duplication).
    const rows = await qp(
      "SELECT so.num AS sonum, so.customerpo AS custpo, cust.name AS customername, " +
      "soitem.id AS soitemid, soitem.datescheduledfulfillment AS scheduled, " +
      "soitem.productnum AS productnum, COALESCE(prod.description, soitem.description) AS proddesc, " +
      "prod.partid AS partid, part.num AS partnum, " +
      "(COALESCE(soitem.qtytofulfill,0) - COALESCE(soitem.qtyfulfilled,0)) AS qtytoship, " +
      "ptree.name AS category " +
      "FROM so " +
      "JOIN soitem ON soitem.soid = so.id " +
      "JOIN product prod ON prod.id = soitem.productid " +
      "LEFT JOIN customer cust ON cust.id = so.customerid " +
      "LEFT JOIN part ON part.id = prod.partid " +
      "LEFT JOIN (SELECT productid, MIN(producttreeid) AS treeid FROM producttotree GROUP BY productid) ptt ON ptt.productid = soitem.productid " +
      "LEFT JOIN producttree ptree ON ptree.id = ptt.treeid " +
      "WHERE so.statusid IN (20, 25) " +
      "AND soitem.statusid NOT IN (50, 60, 70, 75) " +
      "AND (COALESCE(soitem.qtytofulfill,0) - COALESCE(soitem.qtyfulfilled,0)) > 0" + lgClause +
      "ORDER BY ptree.name, soitem.productnum, so.num LIMIT 10000");

    // Distinct manufacturable/stocked part ids for the supplementary roll-ups.
    const partIds = [...new Set(rows.map(function (r) { return r.partid; }).filter(function (x) { return x != null; }))];

    // Qty on hand (company-wide) — tag types 30/40, by part.
    const onhand = {};
    for (let i = 0; i < partIds.length; i += 1000) {
      const chunk = partIds.slice(i, i + 1000); if (!chunk.length) continue;
      const oh = await qp(
        "SELECT t.partid AS partid, COALESCE(SUM(t.qty),0) AS qty " +
        "FROM tag t WHERE t.typeid IN (30,40) AND t.partid IN (" + chunk.join(',') + ") GROUP BY t.partid");
      oh.forEach(function (r) { onhand[r.partid] = parseFloat(r.qty) || 0; });
    }

    // Qty in production — WOs (statusId < 40) whose produced part (moitem.partId
    // via wo.moItemId) is the part, summing the WO target quantity.
    const prod = {};
    for (let i = 0; i < partIds.length; i += 1000) {
      const chunk = partIds.slice(i, i + 1000); if (!chunk.length) continue;
      const pr = await qp(
        "SELECT moitem.partid AS partid, COALESCE(SUM(COALESCE(wo.qtytarget, wo.qtyordered, 0)),0) AS qty " +
        "FROM wo JOIN moitem ON moitem.id = wo.moitemid " +
        "WHERE wo.statusid < 40 AND moitem.partid IN (" + chunk.join(',') + ") GROUP BY moitem.partid");
      pr.forEach(function (r) { prod[r.partid] = parseFloat(r.qty) || 0; });
    }

    // Group SO lines by category + part. On-hand / in-production are part-level
    // (one value per part); qty-to-ship aggregates across the part's SO lines.
    const map = {}; const orderKeys = []; let lineCount = 0;
    rows.forEach(function (r) {
      const cat = r.category || _UNCAT;
      const key = cat + '||' + (r.partid != null ? 'p' + r.partid : 'n' + (r.productnum || ''));
      let g = map[key];
      if (!g) {
        g = { key: key, category: cat, partid: r.partid, productnum: r.productnum || '', proddesc: r.proddesc || '', partnum: r.partnum || '',
              onHand: r.partid != null ? (onhand[r.partid] || 0) : 0,
              inProd: r.partid != null ? (prod[r.partid] || 0) : 0, lines: [] };
        map[key] = g; orderKeys.push(key);
      }
      g.lines.push({ scheduled: r.scheduled, sonum: r.sonum, custpo: r.custpo || '', customer: r.customername || '', toShip: parseFloat(r.qtytoship) || 0 });
      lineCount++;
    });
    _parts = orderKeys.map(function (k) { return map[k]; });

    buildFilters();
    applyFilters();
    let shortParts = 0, shortQty = 0;
    _parts.forEach(function (g) {
      const req = g.lines.reduce(function (s, l) { return s + l.toShip; }, 0) - g.onHand - g.inProd;
      if (req > 0) { shortParts++; shortQty += req; }
    });
    setStatus(_parts.length + ' part(s) · ' + lineCount + ' open line(s) · ' + shortParts + ' part(s) short (' + fmtQty(shortQty) + ' units)');
  } catch (e) {
    console.error(e);
    setStatus('Error: ' + (e.message || e));
    document.getElementById('ooBody').innerHTML = '<tr><td class="empty" colspan="' + _cols.length + '">Error: ' + escHtml(e.message || String(e)) + '</td></tr>';
  } finally {
    document.getElementById('spinner').style.display = 'none';
    document.getElementById('ooTable').style.display = '';
  }
}

function buildFilters() {
  const catSel = document.getElementById('catFilter');
  const cur = catSel.value;
  const cats = [...new Set(_parts.map(function (g) { return g.category; }))].sort(function (a, b) { return a.localeCompare(b); });
  catSel.innerHTML = '<option value="">All categories</option>';
  cats.forEach(function (c) {
    const o = document.createElement('option'); o.value = c; o.textContent = c;
    if (c === cur) o.selected = true; catSel.appendChild(o);
  });
}

/* ── FILTER + RENDER ── */
function applyFiltersDebounced() { clearTimeout(_filterTimer); _filterTimer = setTimeout(applyFilters, 200); }

function applyFilters() {
  const q = (document.getElementById('search').value || '').trim().toLowerCase();
  const cat = document.getElementById('catFilter').value;
  const onlyShort = document.getElementById('onlyShort').checked;
  persistControls();
  _shown = [];
  _parts.forEach(function (g) {
    if (cat && g.category !== cat) return;
    let lines = g.lines;
    if (q) lines = lines.filter(function (l) { return (g.productnum + ' ' + g.proddesc + ' ' + l.sonum + ' ' + l.custpo + ' ' + l.customer).toLowerCase().indexOf(q) !== -1; });
    if (!lines.length) return;
    const sumToShip = lines.reduce(function (s, l) { return s + l.toShip; }, 0);
    const required = sumToShip - g.onHand - g.inProd;
    if (onlyShort && !(required > 0)) return;
    _shown.push({ g: g, lines: lines, sumToShip: sumToShip, required: required });
  });
  render();
}

function render() {
  const tbody = document.getElementById('ooBody');
  tbody.innerHTML = '';
  if (!_shown.length) {
    tbody.innerHTML = '<tr><td class="empty" colspan="' + _cols.length + '">No open order lines match the current filters.</td></tr>';
    return;
  }
  const frag = document.createDocumentFragment();
  let curCat = null;
  _shown.forEach(function (item) {
    if (item.g.category !== curCat) { curCat = item.g.category; frag.appendChild(buildCatHeader(curCat)); }
    frag.appendChild(buildPartRow(item));                                    // part summary
    item.lines.forEach(function (l) { frag.appendChild(buildDetailRow(item.g, l)); });  // SO detail lines
  });
  tbody.appendChild(frag);
}

function buildCatHeader(cat) {
  const items = _shown.filter(function (it) { return it.g.category === cat; });
  const toShip = items.reduce(function (s, it) { return s + it.sumToShip; }, 0);
  const req = items.reduce(function (s, it) { return s + Math.max(0, it.required); }, 0);
  const tr = document.createElement('tr'); tr.className = 'group-row';
  const td = document.createElement('td'); td.colSpan = _cols.length;
  td.innerHTML = '<span class="cat-name">▸ ' + escHtml(cat) + '</span>' +
    '<span class="group-sub">' + items.length + ' part(s) · ' + fmtQty(toShip) + ' to ship · ' + fmtQty(req) + ' short</span>';
  tr.appendChild(td);
  return tr;
}

// Part summary row: aggregate qty-to-ship + the part-level on-hand / production / required.
function buildPartRow(item) {
  const tr = document.createElement('tr'); tr.className = 'part-row';
  _cols.forEach(function (c) { tr.appendChild(partCell(item, c)); });
  return tr;
}
function partCell(item, col) {
  const g = item.g;
  if (col.key === 'product') {
    const td = document.createElement('td');
    if (g.partnum) { const a = link(g.productnum, function () { openModule('Part', g.partnum); }); a.title = 'Open part ' + g.partnum; td.appendChild(a); }
    else { td.appendChild(document.createTextNode(g.productnum)); }
    if (g.proddesc) { const d = document.createElement('span'); d.className = 'pdesc'; d.textContent = ' — ' + g.proddesc; td.appendChild(d); }
    const cnt = document.createElement('span'); cnt.className = 'pcount';
    cnt.textContent = ' (' + item.lines.length + ' order' + (item.lines.length === 1 ? '' : 's') + ')';
    td.appendChild(cnt);
    td.title = g.productnum + (g.proddesc ? ' — ' + g.proddesc : '');
    return td;
  }
  if (col.key === 'toship')   return numTd(fmtQty(item.sumToShip));
  if (col.key === 'onhand')   return numTd(fmtQty(g.onHand), g.onHand ? '' : 'muted');
  if (col.key === 'inprod')   return numTd(fmtQty(g.inProd), g.inProd ? '' : 'muted');
  if (col.key === 'required') { const td = numTd(fmtQty(item.required)); td.classList.add(item.required > 0 ? 'short' : 'covered'); return td; }
  return cell('', '');   // scheduled / sonum / custpo / customer blank on the summary row
}

// SO detail line: only the per-line qty to ship; part-level columns blank.
function buildDetailRow(g, l) {
  const tr = document.createElement('tr'); tr.className = 'so-row';
  _cols.forEach(function (c) { tr.appendChild(detailCell(g, l, c)); });
  return tr;
}
function detailCell(g, l, col) {
  switch (col.key) {
    case 'product': return cell('', 'so-prod');   // indent marker (blank — product shown on summary)
    case 'scheduled': {
      const td = document.createElement('td'); td.textContent = fmtDate(l.scheduled);
      if (l.scheduled && String(l.scheduled).split(' ')[0] < _todayStr) td.className = 'past-due';
      return td;
    }
    case 'sonum': { const td = document.createElement('td'); td.appendChild(link(l.sonum, function () { openModule('Sales Order', l.sonum); })); return td; }
    case 'custpo':   return cell(l.custpo, 'muted');
    case 'customer': return cell(l.customer, 'muted');
    case 'toship':   return numTd(fmtQty(l.toShip));
    default:         return numTd('—', 'muted');   // onhand / inprod / required — part-level only
  }
}
function cell(text, cls) { const el = document.createElement('td'); el.textContent = text == null ? '' : text; if (cls) el.className = cls; if (text) el.title = text; return el; }
function numTd(text, cls) { const el = document.createElement('td'); el.className = 'num-cell' + (cls ? ' ' + cls : ''); el.textContent = text == null ? '' : text; return el; }

/* ── CSV ── */
function exportCSV() {
  if (!_shown.length) { alert('Nothing to export.'); return; }
  const q = function (v) { return '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"'; };
  const lines = ['Category,Product,Description,Scheduled,SO #,Customer PO,Customer,Line Qty to Ship,Part Qty to Ship,Qty On Hand,Qty In Production,Qty Required'];
  _shown.forEach(function (item) {
    const g = item.g;
    item.lines.forEach(function (l) {
      lines.push([g.category, g.productnum, g.proddesc, fmtDate(l.scheduled), l.sonum, l.custpo, l.customer, l.toShip,
        item.sumToShip, g.onHand, g.inProd, item.required].map(q).join(','));
    });
  });
  const blob = new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'OpenOrders_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click(); URL.revokeObjectURL(url);
}

/* ── PRINT (landscape PDF via standalone window — JxBrowser ignores window.print() on the page) ── */
function printPartCellHtml(item, c) {
  const g = item.g;
  switch (c.key) {
    case 'product': {
      let h = escHtml(g.productnum);
      if (g.proddesc) h += ' <span class="pdesc">— ' + escHtml(g.proddesc) + '</span>';
      h += ' <span class="pcount">(' + item.lines.length + ' order' + (item.lines.length === 1 ? '' : 's') + ')</span>';
      return '<td>' + h + '</td>';
    }
    case 'toship':   return '<td class="nr">' + escHtml(fmtQty(item.sumToShip)) + '</td>';
    case 'onhand':   return '<td class="nr' + (g.onHand ? '' : ' muted') + '">' + escHtml(fmtQty(g.onHand)) + '</td>';
    case 'inprod':   return '<td class="nr' + (g.inProd ? '' : ' muted') + '">' + escHtml(fmtQty(g.inProd)) + '</td>';
    case 'required': return '<td class="nr ' + (item.required > 0 ? 'short' : 'covered') + '">' + escHtml(fmtQty(item.required)) + '</td>';
    default:         return '<td' + (c.nr ? ' class="nr"' : '') + '></td>';   // scheduled/sonum/custpo/customer blank on summary
  }
}
function printDetailCellHtml(g, l, c) {
  switch (c.key) {
    case 'product':  return '<td></td>';
    case 'scheduled': {
      const pd = (l.scheduled && String(l.scheduled).split(' ')[0] < _todayStr) ? ' class="past-due"' : '';
      return '<td' + pd + '>' + escHtml(fmtDate(l.scheduled)) + '</td>';
    }
    case 'sonum':    return '<td>' + escHtml(l.sonum) + '</td>';
    case 'custpo':   return '<td class="muted">' + escHtml(l.custpo) + '</td>';
    case 'customer': return '<td class="muted">' + escHtml(l.customer) + '</td>';
    case 'toship':   return '<td class="nr">' + escHtml(fmtQty(l.toShip)) + '</td>';
    default:         return '<td class="nr muted">—</td>';   // onhand / inprod / required — part-level only
  }
}
function printReport() {
  if (!_shown.length) { alert('Nothing to print.'); return; }

  // Honour the on-screen column order + proportional widths (table-layout:fixed wraps long text).
  const totalW = _cols.reduce(function (s, c) { return s + c.w; }, 0) || 1;
  const colgroup = _cols.map(function (c) { return '<col style="width:' + (c.w / totalW * 100).toFixed(2) + '%">'; }).join('');
  const headCells = _cols.map(function (c) { return '<th' + (c.nr ? ' class="nr"' : '') + '>' + escHtml(c.label) + '</th>'; }).join('');

  const body = [];
  let curCat = null;
  _shown.forEach(function (item) {
    if (item.g.category !== curCat) {
      curCat = item.g.category;
      const catItems = _shown.filter(function (it) { return it.g.category === curCat; });
      const toShip = catItems.reduce(function (s, it) { return s + it.sumToShip; }, 0);
      const req = catItems.reduce(function (s, it) { return s + Math.max(0, it.required); }, 0);
      body.push('<tr class="cat"><td colspan="' + _cols.length + '">▸ ' + escHtml(curCat) +
        ' <span class="pcount">' + catItems.length + ' part(s) · ' + escHtml(fmtQty(toShip)) + ' to ship · ' + escHtml(fmtQty(req)) + ' short</span></td></tr>');
    }
    body.push('<tr class="part">' + _cols.map(function (c) { return printPartCellHtml(item, c); }).join('') + '</tr>');
    item.lines.forEach(function (l) {
      body.push('<tr class="detail">' + _cols.map(function (c) { return printDetailCellHtml(item.g, l, c); }).join('') + '</tr>');
    });
  });

  // Filter / summary line for the header.
  const filters = [];
  const q = (document.getElementById('search').value || '').trim();
  if (q) filters.push('search "' + q + '"');
  const cat = document.getElementById('catFilter').value;
  if (cat) filters.push('category ' + cat);
  if (document.getElementById('onlyShort').checked) filters.push('only shortfalls');
  const filterText = filters.length ? 'Filters: ' + filters.join(' · ') : 'All open orders';
  const summary = document.getElementById('statusLine').textContent || '';

  const doc = '<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Open Orders Report</title><style>' +
    '@page{size:A4 landscape;margin:10mm;}' +
    '*{box-sizing:border-box;}' +
    'body{font-family:Arial,Helvetica,sans-serif;font-size:9px;color:#1e293b;margin:0;-webkit-print-color-adjust:exact;print-color-adjust:exact;}' +
    'h1{font-size:15px;margin:0 0 2px;color:#0f172a;}' +
    '.sub{font-size:9px;color:#64748b;margin:0 0 2px;}' +
    '.meta{font-size:8px;color:#94a3b8;margin:0 0 10px;}' +
    'table{width:100%;border-collapse:collapse;table-layout:fixed;}' +
    'thead{display:table-header-group;}' +
    'th{background:#1e3a5f;color:#fff;font-size:8px;text-transform:uppercase;letter-spacing:.03em;text-align:left;padding:5px 6px;border:1px solid #1e3a5f;}' +
    'th.nr{text-align:right;}' +
    'td{padding:3px 6px;border:1px solid #e5e7eb;vertical-align:top;word-wrap:break-word;overflow-wrap:break-word;}' +
    'td.nr{text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums;}' +
    'tr{page-break-inside:avoid;}' +
    'tr.cat td{background:#eef2f7;font-weight:700;color:#1e3a5f;}' +
    'tr.cat{page-break-after:avoid;}' +
    'tr.part td{background:#f1f5f9;font-weight:700;}' +
    'tr.detail td{color:#475569;}' +
    '.short{color:#b91c1c;font-weight:700;}' +
    '.covered{color:#047857;font-weight:600;}' +
    '.past-due{color:#b91c1c;font-weight:700;}' +
    '.muted{color:#94a3b8;}' +
    '.pdesc{color:#64748b;font-weight:400;}' +
    '.pcount{color:#94a3b8;font-weight:500;}' +
    '</style></head><body>' +
    '<h1>Open Orders Report</h1>' +
    '<div class="sub">' + escHtml(filterText) + '</div>' +
    (summary ? '<div class="sub">' + escHtml(summary) + '</div>' : '') +
    '<div class="meta">Generated ' + escHtml(new Date().toLocaleString()) + '</div>' +
    '<table><colgroup>' + colgroup + '</colgroup><thead><tr>' + headCells + '</tr></thead><tbody>' + body.join('') + '</tbody></table>' +
    '</body></html>';

  const w = window.open('', '_blank');
  if (!w) { alert('Pop-up blocked — allow pop-ups for this report to print.'); return; }
  w.document.write(doc); w.document.close(); w.focus();
  setTimeout(function () { try { w.print(); } catch (_) {} }, 200);
}

/* ── SETTINGS PERSISTENCE ── */
function persistControls() {
  try {
    FBLib.Settings.setUserKey('onlyShort', document.getElementById('onlyShort').checked);
    FBLib.Settings.saveUser();
  } catch (_) {}
}

/* ── SETTINGS PANEL ── */
window.PageSettings = (function () {
  'use strict';
  function init() {
    const admin = document.getElementById('dsAdminSection');
    if (admin) admin.style.display = FBLib.Settings.isAdmin() ? 'block' : 'none';
    refreshLockUI();
  }
  function refreshLockUI() {
    const allowed = FBLib.Settings.userEditingAllowed();
    const badge = document.getElementById('dsLockBadge');
    if (badge) badge.style.display = (!allowed && !FBLib.Settings.isAdmin()) ? 'block' : 'none';
    const lockBtn = document.getElementById('dsLockBtn');
    if (lockBtn) lockBtn.textContent = allowed ? 'Lock user editing' : 'Unlock user editing';
  }
  function openPanel() {
    const eff = FBLib.Settings.effective();
    document.getElementById('dsOnlyShort').checked = !!eff.onlyShort;
    document.getElementById('dsDebug').checked = !!eff.debug;
    refreshLockUI();
    document.getElementById('setOverlay').style.display = 'flex';
  }
  function closePanel() { document.getElementById('setOverlay').style.display = 'none'; }
  function closeIfOverlay(e) { if (e && e.target && e.target.id === 'setOverlay') closePanel(); }
  function readPanel() {
    return { onlyShort: document.getElementById('dsOnlyShort').checked, debug: document.getElementById('dsDebug').checked };
  }
  function applyAndClose() {
    closePanel();
    document.getElementById('onlyShort').checked = !!FBLib.Settings.resolve('onlyShort');
    document.getElementById('debugConsole').style.display = FBLib.Common.DEBUG_MODE ? 'block' : 'none';
    loadColPrefs(); renderHead();   // a settings reset may have changed/cleared column prefs
    applyFilters();
  }
  function saveUser() {
    const p = readPanel();
    Object.keys(p).forEach(function (k) { FBLib.Settings.setUserKey(k, p[k]); });
    if (!FBLib.Settings.saveUser()) { alert('User editing is locked by admin.'); return; }
    applyAndClose();
  }
  function resetToDefaults() { if (!confirm('Reset your personal settings to defaults?')) return; FBLib.Settings.clearUser(); applyAndClose(); }
  function publishMaster() {
    if (!FBLib.Settings.isAdmin()) return;
    if (!confirm('Publish current panel values as the default for all users?')) return;
    FBLib.Settings.publishMaster(readPanel()); alert('Published.'); applyAndClose();
  }
  function toggleLock() {
    if (!FBLib.Settings.isAdmin()) return;
    const nowLocked = FBLib.Settings.userEditingAllowed();
    FBLib.Settings.setLock(nowLocked); refreshLockUI();
    alert('User editing: ' + (nowLocked ? 'LOCKED' : 'UNLOCKED'));
  }
  return { init: init, openPanel: openPanel, closePanel: closePanel, closeIfOverlay: closeIfOverlay,
    saveUser: saveUser, resetToDefaults: resetToDefaults, publishMaster: publishMaster, toggleLock: toggleLock };
})();

/* ── INIT ── */
window.onload = function () {
  document.getElementById('onlyShort').checked = !!FBLib.Settings.resolve('onlyShort');
  if (FBLib.Common.DEBUG_MODE) document.getElementById('debugConsole').style.display = 'block';
  PageSettings.init();
  loadColPrefs();
  renderHead();
  loadData();
};
</script>
