<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Outsourced Part Demand - Fishbowl BI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; }

    #filtersPanel { background: white; border-bottom: 1px solid #e2e8f0; padding: 10px 20px; display: none; flex-shrink: 0; }
    #filtersPanel.open { display: block; }
    #filtersPanel select, #filtersPanel input[type=text] {
      padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 6px;
      font-size: 12px; color: #374151; background: #f9fafb; font-family: 'Inter', sans-serif;
    }

    .ms-container { position: relative; }
    .ms-trigger {
      display: flex; align-items: center; flex-wrap: nowrap; gap: 3px;
      border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px 8px;
      background: white; height: 30px; overflow: hidden; cursor: pointer; font-size: 12px;
    }
    .ms-trigger:hover { border-color: #9ca3af; }
    .ms-tag { background: #dbeafe; color: #1d4ed8; padding: 1px 5px; border-radius: 3px; font-size: 11px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
    .ms-tag-x { cursor: pointer; font-weight: bold; }
    .ms-placeholder { color: #9ca3af; }
    .ms-dropdown {
      position: absolute; z-index: 500; top: calc(100% + 2px); left: 0; right: 0; min-width: 220px;
      background: white; border: 1px solid #d1d5db; border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.13); display: flex; flex-direction: column; max-height: 280px;
    }
    .ms-search { padding: 6px 8px; border-bottom: 1px solid #f3f4f6; }
    .ms-search input { width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px 8px; font-size: 12px; outline: none; font-family: 'Inter', sans-serif; }
    .ms-actions { padding: 3px 10px; border-bottom: 1px solid #f3f4f6; display: flex; gap: 10px; font-size: 11px; }
    .ms-actions span { color: #3b82f6; cursor: pointer; }
    .ms-actions span:hover { text-decoration: underline; }
    .ms-list { overflow-y: auto; flex: 1; }
    .ms-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
    .ms-item:hover { background: #eff6ff; }
    .ms-empty { padding: 12px; color: #9ca3af; font-size: 12px; text-align: center; }

    #dataTable { border-collapse: collapse; width: 100%; font-size: 12px; table-layout: auto; }
    #dataTable th {
      background: #1e3a5f; color: white; font-weight: 500;
      padding: 7px 10px; text-align: left; white-space: nowrap;
      cursor: grab; user-select: none; position: sticky; top: 0; z-index: 10;
    }
    #dataTable th:active { cursor: grabbing; }
    #dataTable th:hover { background: #264f80; }
    #dataTable th.sort-asc::after  { content: ' \2191'; opacity: 0.8; }
    #dataTable th.sort-desc::after { content: ' \2193'; opacity: 0.8; }
    #dataTable th.col-drag-over { background: #1a4f8a; border-left: 3px solid #60a5fa; }
    #dataTable td { padding: 4px 10px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; vertical-align: top; }
    #dataTable td.detail-cell { white-space: normal; min-width: 160px; vertical-align: top; padding: 5px 10px; }
    #dataTable tr:nth-child(even) td { background: #f9fafb; }
    #dataTable tr:hover td { background: #eff6ff !important; }
    .num-cell { text-align: right; font-variant-numeric: tabular-nums; }
    .desc-cell { max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* Status badges */
    .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .bst-action   { background: #fee2e2; color: #991b1b; }
    .bst-inprog   { background: #fde68a; color: #78350f; }
    .bst-nodemand { background: #dbeafe; color: #1e40af; }
    .bst-ok       { background: #d1fae5; color: #065f46; }
    .bst-short    { background: #fecaca; color: #7f1d1d; font-size: 10px; }

    tr.row-action td { background: #fff5f5 !important; }
    tr.row-action:hover td { background: #fee2e2 !important; }

    .row-link { color: #2d9cdb; cursor: pointer; text-decoration: none; font-weight: 600; }
    .row-link:hover { text-decoration: underline; color: #1e7bb4; }

    /* LED indicators */
    .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .led-grey   { background: #d1d5db; }
    .led-green  { background: #22c55e; box-shadow: 0 0 3px #22c55e88; }
    .led-amber  { background: #f59e0b; box-shadow: 0 0 3px #f59e0b88; }
    .led-red    { background: #ef4444; box-shadow: 0 0 3px #ef444488; }

    /* Inline detail blocks */
    .detail-po-block { font-size: 11px; line-height: 1.5; padding: 3px 0; }
    .detail-po-block + .detail-po-block { border-top: 1px solid #e5e7eb; margin-top: 3px; padding-top: 4px; }
    .detail-led-row { display: flex; gap: 10px; align-items: center; margin-top: 2px; }
    .detail-led-item { display: flex; align-items: center; gap: 3px; font-size: 10px; color: #94a3b8; }
    .detail-wo-block { display: flex; align-items: center; gap: 6px; font-size: 11px; line-height: 1.6; }
    .detail-wo-block + .detail-wo-block { margin-top: 1px; }
    .detail-date { color: #64748b; margin-left: 4px; }
    .detail-late { color: #dc2626; font-size: 10px; font-weight: 600; }

    #colPanel {
      position: absolute; z-index: 200; top: calc(100% + 4px); right: 0;
      background: white; border: 1px solid #d1d5db; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.13); width: 220px; max-height: 400px; overflow-y: auto;
    }
    .col-row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #f3f4f6; cursor: grab; user-select: none; }
    .col-row:last-child { border: none; }
    .col-row:active { cursor: grabbing; }
    .col-row.drag-over { background: #eff6ff; border-top: 2px solid #3b82f6; }
    .col-row.dragging { opacity: 0.4; }
    .col-row label { font-size: 12px; cursor: pointer; flex: 1; color: #374151; }
    .drag-handle { color: #94a3b8; font-size: 13px; flex-shrink: 0; cursor: grab; line-height: 1; }

    .hdr-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
      border: 1px solid #e2e8f0; background: white; color: #475569;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .hdr-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .hdr-btn.active { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
    .hdr-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.75s linear infinite; }

    /* Debug console */
    #debugConsoleContainer { flex-shrink: 0; border-top: 1px solid #e2e8f0; }
    #debugConsoleContainer .debug-hdr {
      display: flex; align-items: center; justify-content: space-between;
      padding: 6px 16px; background: #f8fafc; cursor: pointer; font-size: 12px;
    }
    #debugConsoleContainer .debug-hdr:hover { background: #f1f5f9; }
    #debugLog {
      background: #0f172a; color: #cbd5e1; padding: 10px 14px;
      font-family: monospace; font-size: 11px; max-height: 180px; overflow-y: auto;
      scrollbar-width: thin; scrollbar-color: #334155 #0f172a;
    }
    #debugSqlBlock {
      background: #1e293b; color: #a5f3fc; padding: 10px 14px;
      font-family: monospace; font-size: 11px; white-space: pre; overflow-x: auto;
      max-height: 200px; border-top: 1px solid #1e3a5f;
    }
  </style>
</head>
<body class="bg-slate-50 flex flex-col">

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 px-5 flex items-center justify-between flex-shrink-0 shadow-sm" style="height:56px;">
    <div>
      <h1 class="text-base font-bold text-slate-900 leading-tight">Outsourced Part Demand</h1>
      <p id="statusLine" class="text-xs text-slate-400 leading-tight">Initialising...</p>
    </div>
    <div class="flex items-center gap-2">

      <button id="filtersBtn" onclick="toggleFilters()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
        Filters
      </button>

      <div class="relative" id="colWrap">
        <button onclick="toggleColPanel()" class="hdr-btn" id="colBtn">
          <svg fill="currentColor" viewBox="0 0 24 24"><circle cx="8" cy="6" r="1.5"/><circle cx="8" cy="12" r="1.5"/><circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="6" r="1.5"/><circle cx="16" cy="12" r="1.5"/><circle cx="16" cy="18" r="1.5"/></svg>
          Columns
        </button>
        <div id="colPanel" class="hidden">
          <div class="px-3 py-2 text-xs font-semibold text-slate-400 border-b border-slate-100 sticky top-0 bg-white">Show / Reorder</div>
          <div id="colList"></div>
        </div>
      </div>

      <div class="w-px h-6 bg-slate-200 mx-1"></div>

      <button onclick="runQuery()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>

      <div class="flex" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;flex-shrink:0;">
        <button onclick="saveCurrentSettings()" class="hdr-btn" style="border:none;border-radius:0;border-right:1px solid #e2e8f0;" title="Save settings">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save
        </button>
        <button onclick="resetSettings()" class="hdr-btn" style="border:none;border-radius:0;" title="Reset to defaults">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
      </div>

      <div class="w-px h-6 bg-slate-200 mx-1"></div>

      <button onclick="exportCSV()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        CSV
      </button>

      <button onclick="printTable()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print
      </button>

    </div>
  </header>

  <!-- FILTERS PANEL -->
  <div id="filtersPanel">
    <div class="flex flex-wrap gap-x-5 gap-y-2 items-start">

      <!-- Status -->
      <div style="min-width:180px; max-width:260px;">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Status</div>
        <div class="ms-container" id="status-ms">
          <div class="ms-trigger" id="statusTrigger"><span class="ms-placeholder" id="statusPlaceholder">All statuses</span></div>
          <div class="ms-dropdown hidden" id="statusDropdown">
            <div class="ms-actions" style="padding:5px 10px;"><span id="statusAll">Select All</span><span id="statusClear">Clear All</span></div>
            <div class="ms-list" id="statusList"></div>
          </div>
        </div>
      </div>

      <!-- Vendor -->
      <div style="min-width:200px; max-width:280px; flex:1;">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Outsourcer / Vendor</div>
        <div class="ms-container" id="vendor-ms">
          <div class="ms-trigger" id="vendorTrigger"><span class="ms-placeholder" id="vendorPlaceholder">All vendors</span></div>
          <div class="ms-dropdown hidden" id="vendorDropdown">
            <div class="ms-search"><input type="text" placeholder="Search..." id="vendorSearch" /></div>
            <div class="ms-actions"><span id="vendorAll">Select All</span><span id="vendorClear">Clear All</span></div>
            <div class="ms-list" id="vendorList"></div>
          </div>
        </div>
      </div>

      <!-- Part text filter -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Part Number</div>
        <input type="text" id="filterPart" placeholder="contains…" style="width:140px;" />
      </div>

      <!-- Apply -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Apply</div>
        <button onclick="applyAndClose()"
                title="Apply Filters"
                class="flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors" style="width:32px;height:30px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 8 6.5 13 14 3"/></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- TABLE WRAPPER -->
  <div id="tableWrap" class="flex-1 overflow-auto" style="min-height:0; position:relative;">
    <div id="loadingOverlay" style="display:none; position:sticky; top:0; left:0; right:0; height:0; z-index:30; overflow:visible;">
      <div style="display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; height:100vh; background:rgba(248,250,252,0.85);">
        <svg class="spinner" width="36" height="36" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#e2e8f0" stroke-width="3"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span style="font-size:13px; color:#64748b; font-family:'Inter',sans-serif; font-weight:500;">Loading data...</span>
      </div>
    </div>
    <table id="dataTable">
      <thead id="tHead"></thead>
      <tbody id="tBody">
        <tr><td style="padding:2rem;color:#9ca3af;text-align:center;" colspan="99">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- DEBUG CONSOLE -->
  <div id="debugConsoleContainer" style="display:none;">
    <div class="debug-hdr" onclick="toggleDebugConsole()">
      <div class="flex items-center gap-2">
        <svg width="14" height="14" fill="none" stroke="#64748b" stroke-width="2" viewBox="0 0 24 24"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        <span class="text-xs font-semibold text-slate-600">Debug Console</span>
        <span class="text-xs text-slate-400">Query diagnostics &amp; last SQL</span>
      </div>
      <div class="flex items-center gap-3">
        <span class="text-xs text-slate-400 cursor-pointer hover:text-slate-600" onclick="event.stopPropagation(); clearDebugLog()">Clear</span>
        <svg id="debugChevron" width="14" height="14" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24" style="transition:transform 0.2s;"><path d="M19 9l-7 7-7-7"/></svg>
      </div>
    </div>
    <div id="debugContent" class="hidden">
      <div id="debugLog"></div>
      <div id="debugSqlBlock" class="hidden"></div>
    </div>
  </div>

<script>
/* ── RUNTIME GUARD ── */
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#475569;"><h2>Not running inside Fishbowl</h2><p>This report requires the Fishbowl BI environment.</p></div>';
  throw new Error('Fishbowl API not available');
}

/* ── DEBUG ── */
var DEBUG_MODE = (function() {
  try { return (typeof getProperty === 'function' ? getProperty('BI_SHOW_DEBUG', 'false') : 'false') === 'true'; } catch(e) { return false; }
})();
if (DEBUG_MODE) document.getElementById('debugConsoleContainer').style.display = '';

function debugLog(msg, type) {
  if (!DEBUG_MODE) return;
  type = type || 'info';
  var colors = {info:'#60a5fa', warn:'#facc15', error:'#f87171', success:'#4ade80', query:'#a78bfa'};
  var prefix  = {info:'[INF]', warn:'[WRN]', error:'[ERR]', success:'[OK ]', query:'[SQL]'};
  var ts = new Date().toLocaleTimeString();
  var log = document.getElementById('debugLog');
  if (!log) return;
  if (log.querySelector('.debug-init')) log.innerHTML = '';
  var entry = document.createElement('div'); entry.style.marginBottom = '2px';
  entry.innerHTML = '<span style="color:#475569">[' + ts + ']</span> <span style="color:' + (colors[type]||colors.info) + '">' + (prefix[type]||'[INF]') + ' ' + msg + '</span>';
  log.appendChild(entry); log.scrollTop = log.scrollHeight;
  console.log((prefix[type]||'[INF]') + ' [' + ts + '] ' + msg);
}
function showDebugSQL(sql) {
  if (!DEBUG_MODE) return;
  var el = document.getElementById('debugSqlBlock');
  if (el) { el.textContent = sql; el.classList.remove('hidden'); }
}
function toggleDebugConsole() {
  var c = document.getElementById('debugContent'), v = document.getElementById('debugChevron');
  c.classList.contains('hidden') ? (c.classList.remove('hidden'), v.style.transform = 'rotate(180deg)')
                                 : (c.classList.add('hidden'),    v.style.transform = 'rotate(0deg)');
}
function clearDebugLog() {
  var el = document.getElementById('debugLog'); if (el) el.innerHTML = '<div style="color:#475569;font-style:italic">Log cleared.</div>';
  var sq = document.getElementById('debugSqlBlock'); if (sq) { sq.textContent = ''; sq.classList.add('hidden'); }
}

/* ── CONFIG ── */
const _KEY = 'outsourced.demand.v3';

const STATUS_BADGE = {
  'ACTION REQUIRED':                   'bst-action',
  'PO in progress':                    'bst-inprog',
  'Received - Pending Reconciliation': 'bst-inprog',
  'PO open - no current demand':       'bst-nodemand',
  'OK':                                'bst-ok',
};

/* ── DATE FORMAT ── */
var _dateFmt = 'MM/DD/YYYY';
(function() {
  try { var jf = typeof getProperty === 'function' ? getProperty('DateFormatShort','MM/dd/yyyy') : 'MM/dd/yyyy'; _dateFmt = jf.replace(/yyyy/g,'YYYY').replace(/dd/g,'DD'); } catch(e) {}
})();
function formatDate(s) {
  if (!s || String(s).length < 10) return s || '';
  var str = String(s);
  return _dateFmt.replace('YYYY',str.substring(0,4)).replace('MM',str.substring(5,7)).replace('DD',str.substring(8,10));
}

/* ── QTY ── */
function formatQty(v) {
  if (v == null || isNaN(v)) return '';
  var n = parseFloat(v);
  return n % 1 === 0 ? String(Math.round(n)) : n.toFixed(4).replace(/\.?0+$/, '');
}

/* ── COLUMNS ──
   custom values: 'status' | 'podetail' | 'wodetail'
   noSort:true  → header click does not sort
*/
let _columns = [
  {key:'outsourcedpartnum',  label:'Outsourced Part #',   vis:true,  qty:false, link:'Part'},
  {key:'outsourcedpartdesc', label:'Outsourced Part Desc', vis:true,  qty:false, truncate:true},
  {key:'finishedpartnum',    label:'Finished Part #',      vis:true,  qty:false, link:'Part'},
  {key:'finishedpartdesc',   label:'Finished Part Desc',   vis:false, qty:false, truncate:true},
  {key:'finishedonhand',     label:'On Hand',              vis:true,  qty:true},
  {key:'demandqty',          label:'Demand Qty',           vis:true,  qty:true},
  {key:'shortfall',          label:'Shortfall',            vis:true,  qty:true},
  {key:'qtyonorder',         label:'Qty On Order',         vis:true,  qty:true},
  {key:'outsourcervendors',  label:'Vendor(s)',             vis:true,  qty:false},
  {key:'status',             label:'Status',               vis:true,  qty:false, custom:'status'},
  {key:'podetails',          label:'PO Progress',          vis:true,  qty:false, custom:'podetail', noSort:true},
  {key:'wodetails',          label:'WOs – Finished Part',  vis:true,  qty:false, custom:'wodetail', noSort:true},
  {key:'mfgwodetails',       label:'WOs – Outsourced Part',vis:false, qty:false, custom:'wodetail', noSort:true},
];

/* ── STATE ── */
let _dataset = [], _sortCol = null, _sortDir = 'asc';
let _vendorList = [], _selVendor = new Set();
let _activeMS = null, _dragIdx = null, _dragColKey = null;
const CHUNK_SIZE = 200;
let _renderOffset = 0, _visRows = [];
var _statusSuffix = '';

const _statusOptions = [
  {val:'ACTION REQUIRED',                   lbl:'Action Required'},
  {val:'PO in progress',                    lbl:'PO in Progress'},
  {val:'Received - Pending Reconciliation', lbl:'Received — Pending Reconciliation'},
  {val:'PO open - no current demand',       lbl:'PO Open — No Demand'},
  {val:'OK',                                lbl:'OK'},
];
let _selStatus = new Set(['ACTION REQUIRED', 'PO in progress', 'Received - Pending Reconciliation']);

/* ── SQL ──
   Packed column format ('~~' = field sep, '||' = record sep):
     poDetails  : poNum ~~ qty ~~ scheduledDate ~~ pickStatus ~~ shipStatus ~~ rcptStatus
     woDetails  : woNum ~~ scheduledToStart
   These are parsed in JS with '~~' and '||'.
*/
const _SQL = `SELECT
    pu.num                                                                    AS outsourcedPartNum,
    pu.description                                                            AS outsourcedPartDesc,
    pf.num                                                                    AS finishedPartNum,
    pf.description                                                            AS finishedPartDesc,
    COALESCE(inv.onHand, 0)                                                   AS finishedOnHand,
    COALESCE(demand.qtyNeeded, 0)                                             AS demandQty,
    GREATEST(0, COALESCE(demand.qtyNeeded, 0) - COALESCE(inv.onHand, 0))     AS shortfall,
    COALESCE(openpo.openPoCount, 0)                                           AS openPoCount,
    COALESCE(openpo.qtyOnOrder, 0)                                            AS qtyOnOrder,
    COALESCE(openpo.vendors, '')                                              AS outsourcerVendors,
    COALESCE(openpo.poDetails, '')                                            AS poDetails,
    COALESCE(demand.woDetails, '')                                            AS woDetails,
    COALESCE(mfgdemand.woDetails, '')                                         AS mfgWoDetails,
    IFNULL(DATE_FORMAT(openpo.minPoDate, '%Y-%m-%d'), '')                     AS minPoDate,
    CASE
        WHEN COALESCE(demand.qtyNeeded, 0) > COALESCE(inv.onHand, 0)
             AND COALESCE(openpo.openPoCount, 0) = 0
        THEN 'ACTION REQUIRED'
        WHEN COALESCE(demand.qtyNeeded, 0) > COALESCE(inv.onHand, 0)
             AND COALESCE(openpo.qtyOnOrder, 0) > 0
        THEN 'PO in progress'
        WHEN COALESCE(openpo.openPoCount, 0) > 0
             AND COALESCE(openpo.qtyOnOrder, 0) = 0
        THEN 'Received - Pending Reconciliation'
        WHEN COALESCE(openpo.openPoCount, 0) > 0
        THEN 'PO open - no current demand'
        ELSE 'OK'
    END AS status
FROM part pu
JOIN poitemtype pit ON pit.id = pu.defaultPoItemTypeId AND pit.id = 30
JOIN part pf ON pf.id = pu.defaultOutsourcedReturnItemId
LEFT JOIN (
    SELECT t.partId, SUM(t.qty) AS onHand
    FROM tag t JOIN location l ON l.id = t.locationId
    WHERE t.typeId IN (30, 40)
    GROUP BY t.partId
) inv ON inv.partId = pf.id
LEFT JOIN (
    SELECT wi.partId,
           SUM(wi.qtyTarget - COALESCE(wi.qtyUsed, 0)) AS qtyNeeded,
           MIN(DATE(COALESCE(w.dateScheduledToStart, w.dateScheduled)))         AS minWoDate,
           GROUP_CONCAT(
               CONCAT_WS('~~', w.num,
                   IFNULL(DATE_FORMAT(COALESCE(w.dateScheduledToStart, w.dateScheduled), '%Y-%m-%d'), ''),
                   wi.qtyTarget - COALESCE(wi.qtyUsed, 0))
               ORDER BY COALESCE(w.dateScheduledToStart, w.dateScheduled)
               SEPARATOR '||'
           ) AS woDetails
    FROM woitem wi JOIN wo w ON w.id = wi.woId
    WHERE w.statusId < 40
      AND wi.typeId IN (20, 30)
      AND wi.qtyTarget - COALESCE(wi.qtyUsed, 0) > 0
    GROUP BY wi.partId
) demand ON demand.partId = pf.id
LEFT JOIN (
    SELECT wi.partId,
           GROUP_CONCAT(
               CONCAT_WS('~~', w.num,
                   IFNULL(DATE_FORMAT(COALESCE(w.dateScheduledToStart, w.dateScheduled), '%Y-%m-%d'), ''),
                   wi.qtyTarget - COALESCE(wi.qtyUsed, 0))
               ORDER BY COALESCE(w.dateScheduledToStart, w.dateScheduled)
               SEPARATOR '||'
           ) AS woDetails
    FROM woitem wi JOIN wo w ON w.id = wi.woId
    WHERE w.statusId < 40
      AND wi.typeId = 10
      AND wi.qtyTarget - COALESCE(wi.qtyUsed, 0) > 0
    GROUP BY wi.partId
) mfgdemand ON mfgdemand.partId = pu.id
LEFT JOIN (
    SELECT
        poi.partId,
        COUNT(DISTINCT po.id)                                                   AS openPoCount,
        SUM(poi.qtyToFulfill - COALESCE(poi.qtyFulfilled, 0))                  AS qtyOnOrder,
        MIN(DATE(poi.dateScheduledFulfillment))                                  AS minPoDate,
        GROUP_CONCAT(DISTINCT v.name ORDER BY v.name SEPARATOR ', ')            AS vendors,
        GROUP_CONCAT(
            CONCAT_WS('~~',
                po.num,
                poi.qtyToFulfill,
                IFNULL(DATE_FORMAT(poi.dateScheduledFulfillment, '%Y-%m-%d'), ''),
                IFNULL(pk_agg.statuses, ''),
                IFNULL(sh_agg.statuses, ''),
                IFNULL(rc_agg.statuses, ''),
                po.statusId
            )
            ORDER BY po.num
            SEPARATOR '||'
        ) AS poDetails
    FROM poitem poi
    JOIN po ON po.id = poi.poId
    JOIN vendor v ON v.id = po.vendorId
    LEFT JOIN (
        SELECT pi2.poItemId,
               GROUP_CONCAT(DISTINCT ps.name SEPARATOR ', ') AS statuses
        FROM pickitem pi2
        JOIN pick pk2 ON pk2.id = pi2.pickId
        JOIN pickstatus ps ON ps.id = pk2.statusId
        WHERE pi2.poItemId IS NOT NULL
        GROUP BY pi2.poItemId
    ) pk_agg ON pk_agg.poItemId = poi.id
    LEFT JOIN (
        SELECT si2.poItemId,
               GROUP_CONCAT(DISTINCT ss.name SEPARATOR ', ') AS statuses
        FROM shipitem si2
        JOIN ship sh2 ON sh2.id = si2.shipId
        JOIN shipstatus ss ON ss.id = sh2.statusId
        WHERE si2.poItemId IS NOT NULL
        GROUP BY si2.poItemId
    ) sh_agg ON sh_agg.poItemId = poi.id
    LEFT JOIN (
        SELECT ri2.poItemId,
               GROUP_CONCAT(DISTINCT rs.name SEPARATOR ', ') AS statuses
        FROM receiptitem ri2
        JOIN receipt r2 ON r2.id = ri2.receiptId
        JOIN receiptstatus rs ON rs.id = r2.statusId
        WHERE ri2.poItemId IS NOT NULL
        GROUP BY ri2.poItemId
    ) rc_agg ON rc_agg.poItemId = poi.id
    WHERE po.statusId BETWEEN 20 AND 55
      AND poi.statusId IN (10, 20, 30, 40, 45)
      AND poi.typeId = 30
      AND (poi.qtyToFulfill - COALESCE(poi.qtyFulfilled, 0) > 0 OR poi.statusId = 30)
    GROUP BY poi.partId
) openpo ON openpo.partId = pu.id
WHERE pu.activeFlag = 1
  AND pu.defaultOutsourcedReturnItemId IS NOT NULL
  AND pu.defaultOutsourcedReturnItemId != pu.id
  AND (COALESCE(demand.qtyNeeded, 0) > 0 OR COALESCE(openpo.openPoCount, 0) > 0)
ORDER BY
    CASE WHEN COALESCE(demand.qtyNeeded, 0) > COALESCE(inv.onHand, 0)
              AND COALESCE(openpo.openPoCount, 0) = 0 THEN 0 ELSE 1 END,
    pu.num`;

/* ── PACKED STRING HELPERS ── */
function parsePacked(str, rowSep, colSep) {
  if (!str) return [];
  return str.split(rowSep).map(r => r.split(colSep));
}

function statusLed(statusStr, label) {
  var s = (statusStr || '').toLowerCase();
  var cls = 'led-grey';
  if (s.includes('done') || s.includes('finish') || s.includes('fulfil') || s.includes('receiv') || s.includes('shipped') || s.includes('complet') || s.includes('reconcil')) {
    cls = 'led-green';
  } else if (s.includes('pick') || s.includes('partial') || s.includes('progress') || s.includes('start') || s.includes('issued')) {
    cls = 'led-amber';
  } else if (s.includes('short') || s.includes('void') || s.includes('cancel') || s.includes('error')) {
    cls = 'led-red';
  }
  var title = statusStr ? label + ': ' + statusStr : label + ': none';
  return '<span class="led ' + cls + '" title="' + title + '"></span>';
}

function reconLed(statusStr, label) {
  var s = (statusStr || '').toLowerCase();
  var cls = 'led-grey';
  if (s.includes('reconcil') || s.includes('fulfil')) cls = 'led-green';
  else if (s.includes('receiv') || s.includes('partial')) cls = 'led-amber';
  else if (s.includes('void') || s.includes('cancel') || s.includes('error')) cls = 'led-red';
  var title = statusStr ? (label || 'Recon') + ': ' + statusStr : (label || 'Recon') + ': none';
  return '<span class="led ' + cls + '" title="' + title + '"></span>';
}

function dateAlertLed(woDateStr, minPoDateStr) {
  if (!woDateStr || !minPoDateStr) return '<span class="led led-grey" title="Scheduled dates not set"></span>';
  var wd = new Date(woDateStr), pd = new Date(minPoDateStr);
  if (isNaN(wd) || isNaN(pd)) return '<span class="led led-grey" title="Invalid date"></span>';
  if (pd > wd) return '<span class="led led-red" title="PO due ' + formatDate(minPoDateStr) + ' — AFTER WO start ' + formatDate(woDateStr) + '"></span>';
  return '<span class="led led-green" title="PO due ' + formatDate(minPoDateStr) + ' — before WO start ' + formatDate(woDateStr) + '"></span>';
}

/* ── CUSTOM CELL RENDERERS ── */
function renderStatusCell(td, row) {
  var shortfall  = parseFloat(row.shortfall)  || 0;
  var qtyOnOrder = parseFloat(row.qtyonorder) || 0;
  var status     = row.status || 'OK';

  var badge = document.createElement('span');
  badge.className = 'badge ' + (STATUS_BADGE[status] || 'bst-ok');
  badge.textContent = status;
  td.appendChild(badge);

  // Show residual shortfall when POs only partially cover demand
  if (shortfall > 0 && qtyOnOrder > 0 && shortfall > qtyOnOrder) {
    var rem = shortfall - qtyOnOrder;
    var short = document.createElement('div'); short.style.marginTop = '3px';
    var sp = document.createElement('span'); sp.className = 'badge bst-short';
    sp.textContent = 'Still short: ' + formatQty(rem);
    short.appendChild(sp); td.appendChild(short);
  }
}

function renderPoDetailCell(td, row) {
  var poDetails = row.podetails || '';
  td.className = 'detail-cell';
  if (!poDetails) { td.textContent = '—'; return; }

  var pos = parsePacked(poDetails, '||', '~~');
  pos.forEach(function(po) {
    var poNum = po[0], qty = po[1], schedDate = po[2], pickSt = po[3], shipSt = po[4], rcptSt = po[5], poStatusId = parseInt(po[6]) || 0;
    if (!poNum) return;

    // Complete = receipt reconciled OR PO fulfilled (statusId 55)
    var rcptLower = (rcptSt || '').toLowerCase();
    var isComplete = poStatusId >= 55 || rcptLower.includes('reconcil');

    var block = document.createElement('div'); block.className = 'detail-po-block';

    // PO link + qty + scheduled date
    var line1 = document.createElement('div');
    var a = document.createElement('a'); a.className = 'row-link'; a.href = '#'; a.textContent = poNum;
    a.addEventListener('click', function(e) { e.preventDefault(); openModule('Purchase Order', poNum); });
    line1.appendChild(a);
    var qtySpan = document.createElement('span'); qtySpan.className = 'detail-date';
    qtySpan.textContent = ' · ' + formatQty(parseFloat(qty) || 0) + ' ea';
    line1.appendChild(qtySpan);
    if (schedDate) {
      var ds = document.createElement('span'); ds.className = 'detail-date';
      ds.textContent = ' · Due ' + formatDate(schedDate);
      line1.appendChild(ds);
    }
    block.appendChild(line1);

    // LED status row
    var ledRow = document.createElement('div'); ledRow.className = 'detail-led-row';
    [{label:'Pick', st:pickSt, fn:statusLed}, {label:'Ship', st:shipSt, fn:statusLed},
     {label:'Rcvd', st:rcptSt, fn:statusLed}, {label:'Recon', st:rcptSt, fn:reconLed}]
    .forEach(function(p) {
      var item = document.createElement('span'); item.className = 'detail-led-item';
      item.innerHTML = p.fn(p.st, p.label) + ' ' + p.label;
      ledRow.appendChild(item);
    });
    block.appendChild(ledRow);

    if (isComplete) {
      var doneLine = document.createElement('div'); doneLine.style.marginTop = '2px';
      var doneSpan = document.createElement('span');
      doneSpan.style.cssText = 'color:#16a34a; font-size:10px; font-weight:600;';
      doneSpan.textContent = poStatusId >= 55 ? '✓ Fulfilled' : '✓ Reconciled';
      doneLine.appendChild(doneSpan); block.appendChild(doneLine);
    }

    td.appendChild(block);
  });
}

function renderWoDetailCell(td, row, dataKey) {
  var woDetails = row[dataKey || 'wodetails'] || '';
  var minPoDate = row.minpodate || '';
  td.className = 'detail-cell';
  if (!woDetails) { td.textContent = '—'; return; }

  var wos = parsePacked(woDetails, '||', '~~');
  wos.forEach(function(wo) {
    var woNum = wo[0], woDate = wo[1], woQty = wo[2];
    if (!woNum) return;

    var block = document.createElement('div'); block.className = 'detail-wo-block';
    block.innerHTML = dateAlertLed(woDate, minPoDate);

    var a = document.createElement('a'); a.className = 'row-link'; a.href = '#'; a.textContent = woNum;
    a.addEventListener('click', function(e) { e.preventDefault(); openModule('Work Order', woNum); });
    block.appendChild(a);

    if (woQty) {
      var qs = document.createElement('span'); qs.className = 'detail-date';
      qs.textContent = ' · ' + formatQty(parseFloat(woQty) || 0) + ' ea';
      block.appendChild(qs);
    }

    if (woDate) {
      var ds = document.createElement('span'); ds.className = 'detail-date';
      ds.textContent = formatDate(woDate);
      block.appendChild(ds);
    }

    // Date conflict label (inline, only when late)
    if (minPoDate && woDate) {
      var pd = new Date(minPoDate), wd = new Date(woDate);
      if (!isNaN(pd) && !isNaN(wd) && pd > wd) {
        var warn = document.createElement('span'); warn.className = 'detail-late';
        warn.textContent = 'LATE';
        block.appendChild(warn);
      }
    }

    td.appendChild(block);
  });
}

/* ── INIT ── */
async function init() {
  setStatus('Loading...');
  debugLog('init: starting', 'info');
  loadSavedSettings();
  buildMS('status');
  buildColPanel();

  document.getElementById('tableWrap').addEventListener('scroll', function() {
    if (_renderOffset < _visRows.length &&
        this.scrollTop + this.clientHeight >= this.scrollHeight - 400) {
      appendChunk(_columns.filter(c => c.vis), document.getElementById('tBody'));
    }
  });

  document.addEventListener('click', e => {
    if (_activeMS) {
      const ms = document.getElementById(_activeMS + '-ms');
      if (ms && !ms.contains(e.target)) closeMS(_activeMS);
    }
    const cw = document.getElementById('colWrap');
    if (!cw.contains(e.target)) document.getElementById('colPanel').classList.add('hidden');
  });

  await runQuery();
}

/* ── FILTERS TOGGLE ── */
function toggleFilters() {
  const panel = document.getElementById('filtersPanel'), btn = document.getElementById('filtersBtn');
  panel.classList.toggle('open');
  btn.classList.toggle('active', panel.classList.contains('open'));
}

function applyAndClose() {
  renderTable();
  document.getElementById('filtersPanel').classList.remove('open');
  document.getElementById('filtersBtn').classList.remove('active');
  const f = filteredData();
  _statusSuffix = f.length.toLocaleString() + ' of ' + _dataset.length.toLocaleString() + ' rows';
  setStatus(_statusSuffix);
  debugLog('applyAndClose: ' + f.length + ' rows after filter', 'info');
}

/* ── SETTINGS ── */
function loadSavedSettings() {
  debugLog('loadSavedSettings: key=' + _KEY, 'info');
  try {
    const raw = loadSettings(_KEY);
    if (!raw) { debugLog('loadSavedSettings: no saved settings', 'warn'); return; }
    const s = JSON.parse(raw);
    if (s.v !== 3) return;
    if (Array.isArray(s.selStatus)) _selStatus = new Set(s.selStatus);
    if (Array.isArray(s.selVendor)) _selVendor = new Set(s.selVendor);
    if (s.filterPart) { const el = document.getElementById('filterPart'); if (el) el.value = s.filterPart; }
    if (Array.isArray(s.cols)) {
      const savedMap = Object.fromEntries(s.cols.map(c => [c.key, c]));
      const reordered = s.cols.map(sc => _columns.find(c => c.key === sc.key)).filter(Boolean);
      const extras = _columns.filter(c => !savedMap[c.key]);
      _columns = [...reordered, ...extras];
      _columns.forEach(c => { if (savedMap[c.key]) c.vis = savedMap[c.key].vis; });
    }
    debugLog('loadSavedSettings: OK', 'success');
  } catch(e) { debugLog('loadSavedSettings: error — ' + e, 'error'); }
}

function saveCurrentSettings() {
  const s = { v:3, selStatus:[..._selStatus], selVendor:[..._selVendor],
    filterPart: document.getElementById('filterPart')?.value || '',
    cols: _columns.map(c => ({key:c.key, vis:c.vis})) };
  saveSettings(_KEY, JSON.stringify(s));
  setStatus('Settings saved. ' + _statusSuffix);
  debugLog('saveCurrentSettings: OK', 'success');
}

function resetSettings() { saveSettings(_KEY, ''); debugLog('resetSettings: cleared', 'warn'); location.reload(); }

/* ── VENDOR FILTER ── */
function populateVendorFilter() {
  const seen = new Set();
  _dataset.forEach(row => { (row.outsourcervendors || '').split(', ').forEach(v => { if (v.trim()) seen.add(v.trim()); }); });
  _vendorList = [...seen].sort((a,b) => a.localeCompare(b, undefined, {sensitivity:'base'})).map(v => ({val:v, lbl:v}));
  buildMS('vendor');
  debugLog('populateVendorFilter: ' + _vendorList.length + ' vendors', 'info');
}

/* ── MULTI-SELECT ── */
function msData(type) {
  return ({status:{list:_statusOptions,sel:_selStatus}, vendor:{list:_vendorList,sel:_selVendor}})[type] || {list:[],sel:new Set()};
}

function buildMS(type) {
  const {list, sel} = msData(type);
  const listEl = document.getElementById(type + 'List');
  if (!listEl) return;
  const search = document.getElementById(type + 'Search');
  renderMSList(type, list, sel, listEl);
  updateMSTrigger(type);
  const trigger = document.getElementById(type + 'Trigger');
  if (trigger && !trigger._msBuilt) {
    trigger._msBuilt = true;
    trigger.addEventListener('click', () => toggleMS(type));
    document.getElementById(type + 'All').addEventListener('click', () => { list.forEach(o => sel.add(o.val)); renderMSList(type, list, sel, listEl); updateMSTrigger(type); });
    document.getElementById(type + 'Clear').addEventListener('click', () => { sel.clear(); renderMSList(type, list, sel, listEl); updateMSTrigger(type); });
    if (search) search.addEventListener('input', () => { const f = search.value.toLowerCase(); renderMSList(type, f ? list.filter(o => o.lbl.toLowerCase().includes(f)) : list, sel, listEl); });
  }
}

function renderMSList(type, list, sel, listEl) {
  listEl.innerHTML = '';
  if (!list.length) { listEl.innerHTML = '<div class="ms-empty">No items</div>'; return; }
  list.forEach(o => {
    const div = document.createElement('div'); div.className = 'ms-item';
    const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = sel.has(o.val);
    const sp = document.createElement('span'); sp.textContent = o.lbl;
    div.appendChild(cb); div.appendChild(sp);
    div.addEventListener('click', () => { sel.has(o.val) ? sel.delete(o.val) : sel.add(o.val); cb.checked = sel.has(o.val); updateMSTrigger(type); });
    listEl.appendChild(div);
  });
}

function updateMSTrigger(type) {
  const {list, sel} = msData(type);
  const trigger = document.getElementById(type + 'Trigger'), ph = document.getElementById(type + 'Placeholder');
  if (!trigger || !ph) return;
  trigger.querySelectorAll('.ms-tag').forEach(t => t.remove());
  if (!sel.size) { ph.textContent = ({status:'All statuses',vendor:'All vendors'})[type]||'All'; ph.style.display=''; return; }
  ph.style.display = 'none';
  [...sel].slice(0,3).forEach(v => {
    const item = list.find(o => o.val === v);
    const tag = document.createElement('span'); tag.className = 'ms-tag';
    const lbl = document.createElement('span'); lbl.textContent = item ? item.lbl : v;
    const x = document.createElement('span'); x.className = 'ms-tag-x'; x.textContent = '×';
    x.addEventListener('click', e => { e.stopPropagation(); sel.delete(v); updateMSTrigger(type); });
    tag.appendChild(lbl); tag.appendChild(x); trigger.insertBefore(tag, ph);
  });
  if (sel.size > 3) { const m = document.createElement('span'); m.className='ms-tag'; m.style.cssText='background:#e5e7eb;color:#374151;'; m.textContent='+' +(sel.size-3)+' more'; trigger.insertBefore(m,ph); }
}

function toggleMS(type) {
  const dd = document.getElementById(type + 'Dropdown');
  if (_activeMS && _activeMS !== type) closeMS(_activeMS);
  if (dd.classList.contains('hidden')) {
    dd.classList.remove('hidden'); _activeMS = type;
    const search = document.getElementById(type + 'Search');
    if (search) { search.value = ''; search.focus(); }
    const {list, sel} = msData(type);
    renderMSList(type, list, sel, document.getElementById(type + 'List'));
  } else { closeMS(type); }
}

function closeMS(type) { const dd = document.getElementById(type+'Dropdown'); if (dd) dd.classList.add('hidden'); if (_activeMS===type) _activeMS=null; }

/* ── QUERY ── */
async function runQuery() {
  setStatus('Loading...');
  showSpinner();
  debugLog('runQuery: executing SQL', 'query');
  showDebugSQL(_SQL);
  const t0 = Date.now();
  try {
    _dataset = await qp(_SQL);
    const ms = Date.now() - t0;
    debugLog('runQuery: ' + _dataset.length + ' rows in ' + (ms/1000).toFixed(2) + 's', 'success');
    populateVendorFilter();
    renderTable();
    const shown = filteredData().length;
    _statusSuffix = shown.toLocaleString() + ' of ' + _dataset.length.toLocaleString() + ' rows (' + (ms/1000).toFixed(1) + 's)';
    setStatus(_statusSuffix);
  } catch(e) {
    setStatus('Error: ' + (e.message || String(e)));
    debugLog('runQuery: error — ' + (e.message || String(e)), 'error');
    console.error(e);
  } finally { hideSpinner(); }
}

/* ── CLIENT-SIDE FILTER ── */
function filteredData() {
  const partText = (document.getElementById('filterPart')?.value || '').trim().toLowerCase();
  return _dataset.filter(row => {
    if (_selStatus.size && !_selStatus.has(row.status)) return false;
    if (_selVendor.size) {
      const vendors = (row.outsourcervendors || '').split(', ').map(v => v.trim());
      if (!vendors.some(v => _selVendor.has(v))) return false;
    }
    if (partText) {
      if (!(row.outsourcedpartnum||'').toLowerCase().includes(partText) &&
          !(row.finishedpartnum||'').toLowerCase().includes(partText)) return false;
    }
    return true;
  });
}

/* ── TABLE ── */
function renderTable() {
  _visRows = sortedData(filteredData());
  const vis = _columns.filter(c => c.vis);
  renderHead(vis);
  renderBody(vis);
}

function renderHead(vis) {
  const tr = document.createElement('tr');
  vis.forEach(col => {
    const th = document.createElement('th'); th.textContent = col.label; th.draggable = true;
    if (col.qty) th.style.textAlign = 'right';
    if (_sortCol === col.key) th.classList.add('sort-' + _sortDir);
    if (!col.noSort) th.addEventListener('click', () => sortBy(col.key));
    else th.style.cursor = 'default';
    th.addEventListener('dragstart', e => { _dragColKey = col.key; setTimeout(() => th.style.opacity = '0.4', 0); e.dataTransfer.effectAllowed = 'move'; });
    th.addEventListener('dragend',   () => { _dragColKey = null; th.style.opacity = ''; tr.querySelectorAll('th').forEach(h => h.classList.remove('col-drag-over')); });
    th.addEventListener('dragover',  e => { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; tr.querySelectorAll('th').forEach(h => h.classList.remove('col-drag-over')); if (_dragColKey && _dragColKey !== col.key) th.classList.add('col-drag-over'); });
    th.addEventListener('dragleave', () => th.classList.remove('col-drag-over'));
    th.addEventListener('drop', e => {
      e.preventDefault(); th.classList.remove('col-drag-over');
      if (!_dragColKey || _dragColKey === col.key) return;
      const fi = _columns.findIndex(c => c.key === _dragColKey), ti = _columns.findIndex(c => c.key === col.key);
      if (fi === -1 || ti === -1) return;
      const [mv] = _columns.splice(fi, 1); _columns.splice(ti, 0, mv);
      renderTable(); buildColPanel();
    });
    tr.appendChild(th);
  });
  const head = document.getElementById('tHead'); head.innerHTML = ''; head.appendChild(tr);
}

function renderBody(vis) {
  _renderOffset = 0;
  const tbody = document.getElementById('tBody'); tbody.innerHTML = '';
  if (!_visRows.length) {
    tbody.innerHTML = `<tr><td style="padding:2rem;color:#9ca3af;text-align:center;" colspan="${vis.length}">No results for the selected filters.</td></tr>`;
    return;
  }
  appendChunk(vis, tbody);
}

function appendChunk(vis, tbody) {
  const slice = _visRows.slice(_renderOffset, _renderOffset + CHUNK_SIZE);
  if (!slice.length) return;
  const frag = document.createDocumentFragment();
  slice.forEach(row => {
    const tr = document.createElement('tr');
    if (row.status === 'ACTION REQUIRED') tr.classList.add('row-action');
    vis.forEach(col => {
      const td = document.createElement('td');
      const raw = row[col.key];

      if (col.custom === 'status') {
        renderStatusCell(td, row);
      } else if (col.custom === 'podetail') {
        renderPoDetailCell(td, row);
      } else if (col.custom === 'wodetail') {
        renderWoDetailCell(td, row, col.key);
      } else if (col.link) {
        if (raw) { const a = document.createElement('a'); a.className='row-link'; a.href='#'; a.textContent=raw; a.addEventListener('click', e => { e.preventDefault(); openModule(col.link, raw); }); td.appendChild(a); }
      } else if (col.qty) {
        td.className = 'num-cell'; td.textContent = raw != null ? formatQty(parseFloat(raw)) : '';
      } else if (col.truncate) {
        td.className = 'desc-cell'; td.textContent = raw ?? ''; if (raw) td.title = raw;
      } else {
        td.textContent = raw ?? '';
      }
      tr.appendChild(td);
    });
    frag.appendChild(tr);
  });
  tbody.appendChild(frag);
  _renderOffset += slice.length;
}

function sortedData(rows) {
  if (!_sortCol) return rows;
  const col = _columns.find(c => c.key === _sortCol);
  return [...rows].sort((a, b) => {
    let va = a[_sortCol], vb = b[_sortCol];
    if (col && col.qty) { va = parseFloat(va)||0; vb = parseFloat(vb)||0; }
    else { va = (va??'').toString().toLowerCase(); vb = (vb??'').toString().toLowerCase(); }
    return (va < vb ? -1 : va > vb ? 1 : 0) * (_sortDir === 'asc' ? 1 : -1);
  });
}

function sortBy(key) { _sortDir = _sortCol===key ? (_sortDir==='asc'?'desc':'asc') : 'asc'; _sortCol = key; renderTable(); }

/* ── COLUMN PANEL ── */
function buildColPanel() {
  const list = document.getElementById('colList'); list.innerHTML = '';
  _columns.forEach((col, i) => {
    const div = document.createElement('div'); div.className='col-row'; div.draggable=true; div.dataset.idx=i;
    const handle = document.createElement('span'); handle.className='drag-handle';
    handle.innerHTML = '<svg width="12" height="10" viewBox="0 0 12 10" fill="currentColor"><rect y="0" width="12" height="2" rx="1"/><rect y="4" width="12" height="2" rx="1"/><rect y="8" width="12" height="2" rx="1"/></svg>';
    const cb = document.createElement('input'); cb.type='checkbox'; cb.checked=col.vis; cb.id='cv_'+col.key;
    cb.addEventListener('change', () => { col.vis=cb.checked; renderTable(); });
    const lbl = document.createElement('label'); lbl.htmlFor=cb.id; lbl.textContent=col.label;
    div.appendChild(handle); div.appendChild(cb); div.appendChild(lbl);
    div.addEventListener('dragstart', e => { _dragIdx=i; setTimeout(()=>div.classList.add('dragging'),0); e.dataTransfer.effectAllowed='move'; });
    div.addEventListener('dragend',   () => { _dragIdx=null; div.classList.remove('dragging'); list.querySelectorAll('.col-row').forEach(r=>r.classList.remove('drag-over')); });
    div.addEventListener('dragover',  e => { e.preventDefault(); e.dataTransfer.dropEffect='move'; list.querySelectorAll('.col-row').forEach(r=>r.classList.remove('drag-over')); if(_dragIdx!==null&&_dragIdx!==i)div.classList.add('drag-over'); });
    div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
    div.addEventListener('drop', e => {
      e.preventDefault(); div.classList.remove('drag-over');
      const from=_dragIdx; if(from===null||from===i)return;
      const [moved]=_columns.splice(from,1); _columns.splice(i,0,moved);
      buildColPanel(); renderTable();
    });
    list.appendChild(div);
  });
}
function toggleColPanel() { document.getElementById('colPanel').classList.toggle('hidden'); }

/* ── CSV EXPORT ── */
function csvVal(col, row) {
  var raw = row[col.key] ?? '';
  if (col.custom === 'status') {
    var parts = [row.status || ''];
    if (row.podetails) parsePacked(row.podetails, '||', '~~').forEach(p => { if (p[0]) parts.push(p[0] + ': ' + formatQty(parseFloat(p[1])||0) + ' ea'); });
    return parts.join(' | ');
  }
  if (col.custom === 'podetail') {
    if (!row.podetails) return '';
    return parsePacked(row.podetails, '||', '~~').map(p => {
      var statusId = parseInt(p[6])||0;
      var rcvdLower = (p[5]||'').toLowerCase();
      var reconStatus = rcvdLower.includes('reconcil') || statusId >= 55 ? 'Reconciled' : rcvdLower.includes('receiv') ? 'Pending' : '';
      var parts = [p[0], formatQty(parseFloat(p[1])||0)+' ea',
        p[2] ? 'Due '+formatDate(p[2]) : '',
        p[3] ? 'Pick:'+p[3] : '',
        p[4] ? 'Ship:'+p[4] : '',
        p[5] ? 'Rcvd:'+p[5] : '',
        reconStatus ? 'Recon:'+reconStatus : ''];
      return parts.filter(Boolean).join(' ');
    }).join(' / ');
  }
  if (col.custom === 'wodetail') {
    var woData = row[col.key] || '';
    if (!woData) return '';
    return parsePacked(woData, '||', '~~').map(p =>
      [p[0], p[2] ? formatQty(parseFloat(p[2])||0)+' ea' : '', p[1] ? formatDate(p[1]) : ''].filter(Boolean).join(' ')
    ).join(' / ');
  }
  if (col.qty && raw != null) return formatQty(parseFloat(raw));
  return String(raw);
}

function exportCSV() {
  const vis = _columns.filter(c => c.vis), rows = sortedData(filteredData());
  const hdr = vis.map(c => `"${c.label.replace(/"/g,'""')}"`).join(',');
  const body = rows.map(row => vis.map(col => `"${csvVal(col, row).replace(/"/g,'""')}"`).join(','));
  const blob = new Blob(['﻿' + [hdr,...body].join('\r\n')], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href=url; a.download='OutsourcedPartDemand_'+new Date().toISOString().split('T')[0]+'.csv';
  a.click(); URL.revokeObjectURL(url);
  debugLog('exportCSV: '+rows.length+' rows', 'info');
}

/* ── PRINT ── */
function printTable() {
  const vis = _columns.filter(c => c.vis), rows = sortedData(filteredData());
  const esc = s => String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const hdrHtml = vis.map(c => `<th>${esc(c.label)}</th>`).join('');
  const bodyHtml = rows.map(row => {
    const cells = vis.map(col => `<td${col.qty?' class="nr"':''}>${esc(csvVal(col, row))}</td>`).join('');
    return `<tr${row.status==='ACTION REQUIRED'?' style="background:#fff0f0"':''}>${cells}</tr>`;
  }).join('');
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"/>
<title>Outsourced Part Demand</title>
<style>
  body{font-family:Arial,sans-serif;font-size:8pt;margin:.4in;color:#111}
  h2{font-size:11pt;margin:0 0 4px;color:#1e3a5f}.sub{font-size:7.5pt;color:#64748b;margin:0 0 10px}
  table{border-collapse:collapse;width:100%}
  th{background:#1e3a5f;color:#fff;font-size:7pt;padding:4px 5px;text-align:left;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  td{font-size:7.5pt;padding:3px 5px;border-bottom:1px solid #e5e7eb}
  tr:nth-child(even) td{background:#f9fafb;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .nr{text-align:right} @page{size:A4 landscape;margin:.4in}
</style></head><body>
<h2>Outsourced Part Demand</h2>
<p class="sub">${rows.length.toLocaleString()} rows &mdash; printed ${new Date().toLocaleDateString()}</p>
<table><thead><tr>${hdrHtml}</tr></thead><tbody>${bodyHtml}</tbody></table>
</body></html>`;
  const w = window.open('','_blank'); w.document.write(html); w.document.close(); w.focus(); w.print();
}

/* ── HELPERS ── */
function showSpinner() { document.getElementById('loadingOverlay').style.display='block'; }
function hideSpinner() { document.getElementById('loadingOverlay').style.display='none'; }
async function qp(sql) {
  try { return normalise(await runQueryAsync(sql)); }
  catch(e) { try { return normalise(runQuery(sql)); } catch(e2) { throw e2; } }
}
function normalise(r) {
  if (r==null) return [];
  if (typeof r==='string') { try { var p=JSON.parse(r); return Array.isArray(p)?p:[]; } catch(_){return[];} }
  return Array.isArray(r)?r:[];
}
function setStatus(msg) { document.getElementById('statusLine').textContent = msg; }
