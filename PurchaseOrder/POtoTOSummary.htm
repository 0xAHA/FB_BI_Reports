<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>PO → Transfer Order Summary - Fishbowl BI</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    html, body { height: 100%; margin: 0; padding: 0; overflow: hidden; font-family: 'Inter', sans-serif; }

    #filtersPanel { background: white; border-bottom: 1px solid #e2e8f0; padding: 10px 20px; display: none; flex-shrink: 0; }
    #filtersPanel.open { display: block; }
    #filtersPanel select, #filtersPanel input[type=text], #filtersPanel input[type=date] {
      padding: 4px 8px; border: 1px solid #e2e8f0; border-radius: 6px;
      font-size: 12px; color: #374151; background: #f9fafb; font-family: 'Inter', sans-serif;
    }
    #filtersPanel input[type=date] { background: white; }

    .ms-container { position: relative; }
    .ms-trigger {
      display: flex; align-items: center; flex-wrap: nowrap; gap: 3px;
      border: 1px solid #e2e8f0; border-radius: 6px; padding: 3px 8px;
      background: white; height: 30px; overflow: hidden; cursor: pointer; font-size: 12px;
    }
    .ms-trigger:hover { border-color: #9ca3af; }
    .ms-tag { background: #dbeafe; color: #1d4ed8; padding: 1px 5px; border-radius: 3px; font-size: 11px; display: flex; align-items: center; gap: 2px; white-space: nowrap; }
    .ms-tag-x { cursor: pointer; font-weight: bold; }
    .ms-placeholder { color: #9ca3af; }
    .ms-dropdown {
      position: absolute; z-index: 500; top: calc(100% + 2px); left: 0; right: 0; min-width: 220px;
      background: white; border: 1px solid #d1d5db; border-radius: 6px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.13); display: flex; flex-direction: column; max-height: 280px;
    }
    .ms-search { padding: 6px 8px; border-bottom: 1px solid #f3f4f6; }
    .ms-search input { width: 100%; border: 1px solid #d1d5db; border-radius: 4px; padding: 4px 8px; font-size: 12px; outline: none; font-family: 'Inter', sans-serif; }
    .ms-actions { padding: 3px 10px; border-bottom: 1px solid #f3f4f6; display: flex; gap: 10px; font-size: 11px; }
    .ms-actions span { color: #3b82f6; cursor: pointer; }
    .ms-actions span:hover { text-decoration: underline; }
    .ms-list { overflow-y: auto; flex: 1; }
    .ms-item { display: flex; align-items: center; gap: 8px; padding: 5px 10px; cursor: pointer; font-size: 12px; }
    .ms-item:hover { background: #eff6ff; }
    .ms-empty { padding: 12px; color: #9ca3af; font-size: 12px; text-align: center; }

    #dataTable { border-collapse: collapse; width: 100%; font-size: 12px; table-layout: fixed; }
    #dataTable th {
      background: #1e3a5f; color: white; font-weight: 500;
      padding: 7px 10px; text-align: left; white-space: nowrap; overflow: hidden;
      cursor: grab; user-select: none; position: sticky; top: 0; z-index: 10;
    }
    #dataTable th:active { cursor: grabbing; }
    #dataTable th:hover { background: #264f80; }
    #dataTable th.sort-asc::after  { content: ' \2191'; opacity: 0.8; }
    #dataTable th.sort-desc::after { content: ' \2193'; opacity: 0.8; }
    #dataTable th.col-drag-over { background: #1a4f8a; border-left: 3px solid #60a5fa; }
    #dataTable td { padding: 4px 10px; border-bottom: 1px solid #e5e7eb; white-space: nowrap; vertical-align: middle; overflow: hidden; text-overflow: ellipsis; }
    .col-resize-handle { position: absolute; top: 0; right: 0; bottom: 0; width: 5px; cursor: col-resize; z-index: 2; background: transparent; }
    .col-resize-handle:hover  { background: rgba(255,255,255,0.35); }
    .col-resize-handle.active { background: rgba(255,255,255,0.6); }
    .num-cell { text-align: right; font-variant-numeric: tabular-nums; }

    /* PO header rows */
    tr.po-hdr td {
      background: #eef2ff; border-bottom: 2px solid #c7d2fe;
      cursor: pointer; padding: 4px 10px; vertical-align: middle;
    }
    tr.po-hdr:hover td { background: #e0e7ff; }
    .po-hdr-inner { display: flex; align-items: center; gap: 6px; white-space: nowrap; flex-wrap: wrap; }
    .po-toggle { width: 14px; flex-shrink: 0; font-size: 10px; color: #6366f1; text-align: center; }
    .po-num { font-weight: 700; color: #1e3a5f; font-size: 12px; }
    .po-meta { font-size: 11px; color: #6b7280; }
    .po-separator { color: #d1d5db; }
    tr.item-row.even-item td { background: #f9fafb; }
    tr.item-row:hover td { background: #eff6ff !important; }
    tr.container-hdr td { background: #f1f5f9; border-bottom: 1px solid #cbd5e1; padding: 3px 10px 3px 24px; vertical-align: middle; }
    .container-hdr-inner { display: flex; align-items: center; gap: 6px; }

    /* Badges */
    .badge { display: inline-block; padding: 1px 7px; border-radius: 3px; font-size: 11px; font-weight: 500; white-space: nowrap; }
    .b-issued   { background: #dbeafe; color: #1e40af; }
    .b-picking  { background: #fde68a; color: #78350f; }
    .b-partial  { background: #fed7aa; color: #7c2d12; }
    .b-picked   { background: #e0f2fe; color: #075985; }
    .b-shipped  { background: #d1fae5; color: #065f46; }
    .b-complete { background: #bbf7d0; color: #14532d; }
    .b-void     { background: #fee2e2; color: #991b1b; }
    .b-default  { background: #f3f4f6; color: #374151; }

    /* Transfer Status badges */
    .tx-none     { background: #f3f4f6; color: #6b7280; }
    .tx-progress { background: #fde68a; color: #78350f; }
    .tx-shipped  { background: #d1fae5; color: #065f46; }
    .tx-complete { background: #bbf7d0; color: #14532d; }
    .tx-partial  { background: #fed7aa; color: #7c2d12; }

    /* LED indicators */
    .led { display: inline-block; width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
    .led-grey   { background: #d1d5db; }
    .led-green  { background: #22c55e; box-shadow: 0 0 3px #22c55e88; }
    .led-amber  { background: #f59e0b; box-shadow: 0 0 3px #f59e0b88; }
    .led-blue   { background: #3b82f6; box-shadow: 0 0 3px #3b82f688; }
    .led-red    { background: #ef4444; box-shadow: 0 0 3px #ef444488; }

    /* TO detail cell */
    #dataTable td.detail-cell { white-space: normal; vertical-align: top; padding: 5px 10px; min-width: 160px; }
    .to-block { font-size: 11px; line-height: 1.6; padding: 2px 0; }
    .to-block + .to-block { border-top: 1px solid #e5e7eb; margin-top: 3px; padding-top: 4px; }
    .to-led-row { display: flex; gap: 8px; align-items: center; margin-top: 2px; flex-wrap: wrap; }
    .to-led-item { display: flex; align-items: center; gap: 3px; font-size: 10px; color: #94a3b8; }
    .to-qty-match { color: #16a34a; font-weight: 600; font-size: 10px; }
    .to-qty-short { color: #dc2626; font-weight: 600; font-size: 10px; }

    /* Container complete pip */
    .container-pip { display: inline-flex; align-items: center; justify-content: center; width: 14px; height: 14px; border-radius: 50%; font-size: 9px; font-weight: 700; flex-shrink: 0; }
    .pip-complete { background: #22c55e; color: white; }
    .pip-shipped  { background: #3b82f6; color: white; }
    .pip-partial  { background: #f59e0b; color: white; }
    .pip-none     { background: #d1d5db; color: #6b7280; }

    .row-link { color: #2d9cdb; cursor: pointer; text-decoration: none; font-weight: 600; }
    .row-link:hover { text-decoration: underline; color: #1e7bb4; }

    #colPanel {
      position: absolute; z-index: 200; top: calc(100% + 4px); right: 0;
      background: white; border: 1px solid #d1d5db; border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.13); width: 220px; max-height: 400px; overflow-y: auto;
    }
    .col-row { display: flex; align-items: center; gap: 8px; padding: 5px 10px; border-bottom: 1px solid #f3f4f6; cursor: grab; user-select: none; }
    .col-row:last-child { border: none; }
    .col-row:active { cursor: grabbing; }
    .col-row.drag-over { background: #eff6ff; border-top: 2px solid #3b82f6; }
    .col-row.dragging { opacity: 0.4; }
    .col-row label { font-size: 12px; cursor: pointer; flex: 1; color: #374151; }
    .drag-handle { color: #94a3b8; font-size: 13px; flex-shrink: 0; cursor: grab; line-height: 1; }

    .hdr-btn {
      display: flex; align-items: center; gap: 5px;
      padding: 6px 10px; border-radius: 8px; font-size: 12px; font-weight: 500;
      border: 1px solid #e2e8f0; background: white; color: #475569;
      cursor: pointer; transition: all 0.15s; white-space: nowrap;
    }
    .hdr-btn:hover { background: #f8fafc; border-color: #cbd5e1; }
    .hdr-btn.active { background: #eff6ff; border-color: #bfdbfe; color: #2563eb; }
    .hdr-btn svg { width: 14px; height: 14px; flex-shrink: 0; }

    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin 0.75s linear infinite; }

    /* Toast Container */
    .toast-container {
        position: fixed;
        bottom: 1rem;
        right: 1rem;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        gap: 0.5rem;
    }
    .toast {
        min-width: 300px;
        padding: 1rem;
        background: white;
        border-radius: 0.75rem;
        box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        border-left: 4px solid;
        animation: slideIn 0.3s ease-out;
    }
    @keyframes slideIn {
        from { transform: translateX(400px); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }
    .toast.success { border-color: #10b981; }
    .toast.error { border-color: #ef4444; }
    .toast.info { border-color: #6366f1; }
  </style>
</head>
<body class="bg-slate-50 flex flex-col">

  <!-- HEADER -->
  <header class="bg-white border-b border-slate-200 px-5 flex items-center justify-between flex-shrink-0 shadow-sm" style="height:56px;">
    <div>
      <h1 class="text-base font-bold text-slate-900 leading-tight">PO → Transfer Order Summary</h1>
      <p id="statusLine" class="text-xs text-slate-400 leading-tight">Initialising...</p>
    </div>
    <div class="flex items-center gap-2">

      <button id="filtersBtn" onclick="toggleFilters()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.293A1 1 0 013 6.586V4z"/></svg>
        Filters
      </button>

      <div class="relative" id="colWrap">
        <button onclick="toggleColPanel()" class="hdr-btn" id="colBtn">
          <svg fill="currentColor" viewBox="0 0 24 24"><circle cx="8" cy="6" r="1.5"/><circle cx="8" cy="12" r="1.5"/><circle cx="8" cy="18" r="1.5"/><circle cx="16" cy="6" r="1.5"/><circle cx="16" cy="12" r="1.5"/><circle cx="16" cy="18" r="1.5"/></svg>
          Columns
        </button>
        <div id="colPanel" class="hidden">
          <div class="px-3 py-2 text-xs font-semibold text-slate-400 border-b border-slate-100 sticky top-0 bg-white">Show / Reorder</div>
          <div id="colList"></div>
        </div>
      </div>

      <button onclick="runDiagnostics()" class="hdr-btn" title="Check XO custom field keys and poitem.note values">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
        Diagnose
      </button>

      <div class="w-px h-6 bg-slate-200 mx-1"></div>

      <div class="flex" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;flex-shrink:0;">
        <button onclick="expandAll()" class="hdr-btn" style="border:none;border-radius:0;border-right:1px solid #e2e8f0;" title="Expand all">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14" stroke-linecap="round"/></svg>
          Expand
        </button>
        <button onclick="collapseAll()" class="hdr-btn" style="border:none;border-radius:0;" title="Collapse all">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M5 12h14" stroke-linecap="round"/></svg>
          Collapse
        </button>
      </div>

      <button onclick="runReport()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
        Refresh
      </button>

      <div class="flex" style="border:1px solid #e2e8f0;border-radius:8px;overflow:hidden;flex-shrink:0;">
        <button onclick="saveCurrentSettings()" class="hdr-btn" style="border:none;border-radius:0;border-right:1px solid #e2e8f0;">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21H5a2 2 0 01-2-2V5a2 2 0 012-2h11l5 5v11a2 2 0 01-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
          Save
        </button>
        <button onclick="resetSettings()" class="hdr-btn" style="border:none;border-radius:0;">
          <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
          Reset
        </button>
      </div>

      <div class="w-px h-6 bg-slate-200 mx-1"></div>

      <button onclick="exportCSV()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
        CSV
      </button>

      <button onclick="printTable()" class="hdr-btn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"/></svg>
        Print
      </button>

    </div>
  </header>

  <!-- FILTERS PANEL -->
  <div id="filtersPanel">
    <div class="flex flex-wrap gap-x-5 gap-y-2 items-start">

      <!-- PO Status -->
      <div style="min-width:150px; max-width:220px;">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">PO Status</div>
        <div class="ms-container" id="postatus-ms">
          <div class="ms-trigger" id="postatusTrigger"><span class="ms-placeholder" id="postatusPlaceholder">All statuses</span></div>
          <div class="ms-dropdown hidden" id="postatusDropdown">
            <div class="ms-actions"><span id="postatusAll">Select All</span><span id="postatusClear">Clear All</span></div>
            <div class="ms-list" id="postatusList"></div>
          </div>
        </div>
      </div>

      <!-- Transfer Status -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Transfer Status</div>
        <select id="filterTxStatus">
          <option value="">All</option>
          <option value="none">Not Started (no TO)</option>
          <option value="progress">In Progress</option>
          <option value="shipped">Shipped</option>
          <option value="complete">Complete</option>
        </select>
      </div>

      <!-- Date range -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Date Issued</div>
        <div class="flex items-center gap-2">
          <input type="date" id="dateFrom" />
          <span class="text-slate-400 text-xs">to</span>
          <input type="date" id="dateTo" />
        </div>
      </div>

      <!-- Vendor -->
      <div style="min-width:180px; max-width:260px;">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Vendor</div>
        <div class="ms-container" id="vendor-ms">
          <div class="ms-trigger" id="vendorTrigger"><span class="ms-placeholder" id="vendorPlaceholder">All vendors</span></div>
          <div class="ms-dropdown hidden" id="vendorDropdown">
            <div class="ms-search"><input type="text" placeholder="Search..." id="vendorSearch" /></div>
            <div class="ms-actions"><span id="vendorAll">Select All</span><span id="vendorClear">Clear All</span></div>
            <div class="ms-list" id="vendorList"></div>
          </div>
        </div>
      </div>

      <!-- Location Group -->
      <div style="min-width:160px; max-width:240px;">
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Location Group</div>
        <div class="ms-container" id="lg-ms">
          <div class="ms-trigger" id="lgTrigger"><span class="ms-placeholder" id="lgPlaceholder">All location groups</span></div>
          <div class="ms-dropdown hidden" id="lgDropdown">
            <div class="ms-actions"><span id="lgAll">Select All</span><span id="lgClear">Clear All</span></div>
            <div class="ms-list" id="lgList"></div>
          </div>
        </div>
      </div>

      <!-- PO # -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">PO #</div>
        <input type="text" id="filterPoNum" placeholder="contains…" style="width:110px;" />
      </div>

      <!-- Container # -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Container #</div>
        <input type="text" id="filterContainer" placeholder="contains…" style="width:110px;" />
      </div>

      <!-- Part # -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Part #</div>
        <input type="text" id="filterPart" placeholder="contains…" style="width:110px;" />
      </div>

      <!-- Apply -->
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-1">Apply</div>
        <button onclick="runReport(); document.getElementById('filtersPanel').classList.remove('open'); document.getElementById('filtersBtn').classList.remove('active');"
                class="flex items-center justify-center bg-blue-600 hover:bg-blue-700 text-white rounded-lg transition-colors" style="width:32px;height:30px;">
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="2 8 6.5 13 14 3"/></svg>
        </button>
      </div>

    </div>
  </div>

  <!-- TABLE WRAPPER -->
  <div id="tableWrap" class="flex-1 overflow-auto" style="min-height:0; position:relative;">
    <div id="loadingOverlay" style="display:none; position:sticky; top:0; left:0; right:0; height:0; z-index:30; overflow:visible;">
      <div style="display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; height:100vh; background:rgba(248,250,252,0.85);">
        <svg class="spinner" width="36" height="36" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" stroke="#e2e8f0" stroke-width="3"/>
          <path d="M12 2a10 10 0 0 1 10 10" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
        </svg>
        <span style="font-size:13px; color:#64748b; font-family:'Inter',sans-serif; font-weight:500;">Loading data...</span>
      </div>
    </div>
    <table id="dataTable">
      <thead id="tHead"></thead>
      <tbody id="tBody">
        <tr><td style="padding:2rem;color:#9ca3af;text-align:center;" colspan="99">Loading...</td></tr>
      </tbody>
    </table>
  </div>

  <!-- DEBUG CONSOLE -->
  <div id="debugConsoleContainer" style="display:none;position:fixed;bottom:0;left:0;right:0;z-index:9000;">
    <div id="debugResizeHandle" style="height:5px;background:transparent;cursor:ns-resize;border-top:2px solid #e2e8f0;"></div>
    <div style="max-width:100%;background:white;box-shadow:0 -4px 24px rgba(0,0,0,.12);">
      <button onclick="toggleDebugConsole()" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 14px;background:#1e293b;border:none;cursor:pointer;font-family:'Inter',sans-serif;">
        <div style="display:flex;align-items:center;gap:8px;">
          <span style="font-size:12px;font-weight:600;color:#e2e8f0;">Debug Console</span>
          <span id="debugModeLabel" style="font-size:10px;padding:1px 6px;border-radius:3px;background:#0f172a;color:#94a3b8;"></span>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <button onclick="event.stopPropagation();copyDebugLog()" style="padding:2px 8px;font-size:11px;background:#334155;color:#94a3b8;border:1px solid #475569;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;">Copy</button>
          <button onclick="event.stopPropagation();clearDebugLog()" style="padding:2px 8px;font-size:11px;background:#334155;color:#94a3b8;border:1px solid #475569;border-radius:4px;cursor:pointer;font-family:'Inter',sans-serif;">Clear</button>
          <svg id="debugChevron" width="16" height="16" fill="none" stroke="#94a3b8" stroke-width="2" viewBox="0 0 24 24" style="transform:rotate(180deg);transition:transform .2s;flex-shrink:0;"><polyline points="6 9 12 15 18 9"/></svg>
        </div>
      </button>
      <div id="debugContent" style="display:none;border-top:1px solid #0f172a;">
        <div id="debugLog" style="background:#0f172a;height:200px;overflow-y:auto;font-family:'Courier New',monospace;font-size:11px;padding:8px 10px;"></div>
      </div>
    </div>
  </div>

  <div class="toast-container"></div>

<script>
/* ── RUNTIME GUARD ── */
if (typeof runQuery !== 'function' && typeof runQueryAsync !== 'function') {
  document.body.innerHTML = '<div style="padding:40px;font-family:sans-serif;color:#475569;"><h2>Not running inside Fishbowl</h2><p>This report requires the Fishbowl BI environment.</p></div>';
  throw new Error('Fishbowl API not available');
}

/* ── CONFIG ──
   XO_CONTAINER_FIELD: the JSON key in xo.customFields that stores the container reference.

/* ── DEBUG ── */
var _debugLines = [];
function debugLog(msg, type) {
  type = type || 'info';
  const colors = {info:'#60a5fa', warn:'#facc15', error:'#f87171', success:'#4ade80', query:'#a78bfa'};
  const prefix  = {info:'[INF]', warn:'[WRN]', error:'[ERR]', success:'[OK ]', query:'[SQL]'};
  const ts = new Date().toLocaleTimeString();
  const line = (prefix[type]||'[INF]') + ' [' + ts + '] ' + msg;
  _debugLines.push(line);
  if (!DEBUG_MODE) return;
  const log = document.getElementById('debugLog');
  if (!log) return;
  const entry = document.createElement('div'); entry.style.marginBottom = '2px';
  entry.innerHTML = '<span style="color:#475569">[' + ts + ']</span> <span style="color:' + (colors[type]||colors.info) + '">' + (prefix[type]||'[INF]') + ' ' + msg + '</span>';
  log.appendChild(entry); log.scrollTop = log.scrollHeight;
}
function toggleDebugConsole() {
  const c = document.getElementById('debugContent'), v = document.getElementById('debugChevron');
  c.style.display === 'none' ? (c.style.display='', v.style.transform='rotate(0deg)') : (c.style.display='none', v.style.transform='rotate(180deg)');
}
function copyDebugLog() {
  navigator.clipboard?.writeText(_debugLines.join('\n')).then(() => showToast('Debug log copied'));
}
function clearDebugLog() {
  _debugLines = [];
  const log = document.getElementById('debugLog'); if (log) log.innerHTML = '';
}
(function() {
  if (!DEBUG_MODE) return;
  document.getElementById('debugConsoleContainer').style.display = 'block';
  document.getElementById('tableWrap').style.paddingBottom = '244px';
  document.getElementById('debugModeLabel').textContent = 'DEBUG ON';
  const rh = document.getElementById('debugResizeHandle');
  if (!rh) return;
  let startY, startH;
  rh.addEventListener('mousedown', e => {
    startY = e.clientY;
    const logEl = document.getElementById('debugLog');
    startH = logEl ? logEl.offsetHeight : 200;
    document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
  });
  function onMove(e) {
    const logEl = document.getElementById('debugLog');
    if (logEl) logEl.style.height = Math.max(60, startH - (e.clientY - startY)) + 'px';
  }
  function onUp() { document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
})();

/* ── CURRENCY / DATE ── */
var _currencyLocale = (function() {
  try { return typeof currencyLocale === 'function' ? currencyLocale() : {locale:'en-US',symbol:'$'}; } catch(e) { return {locale:'en-US',symbol:'$'}; }
})();
var _localeCode = _currencyLocale.locale || 'en-US';
var _dateFmt = 'MM/DD/YYYY';
(function() {
  try { var jf = typeof getProperty === 'function' ? getProperty('DateFormatShort','MM/dd/yyyy') : 'MM/dd/yyyy'; _dateFmt = jf.replace(/yyyy/g,'YYYY').replace(/dd/g,'DD'); } catch(e) {}
})();
function formatDate(s) {
  if (!s || String(s).length < 10) return '';
  var str = String(s);
  return _dateFmt.replace('YYYY',str.substring(0,4)).replace('MM',str.substring(5,7)).replace('DD',str.substring(8,10));
}
function formatQty(v) {
  if (v == null || v === '' || isNaN(v)) return '';
  var n = parseFloat(v);
  return n % 1 === 0 ? String(Math.round(n)) : n.toFixed(4).replace(/\.?0+$/,'');
}
function escSQL(s) { return String(s).replace(/'/g,"''"); }
function safeDate(s) { return /^\d{4}-\d{2}-\d{2}$/.test(s) ? s : ''; }

/* ── PACKED STRING HELPERS ── */
function parsePacked(str) {
  if (!str) return [];
  return str.split('||').map(r => r.split('~~'));
}

/* ── TRANSFER STATUS HELPERS ── */
function calcTransferStatus(row) {
  const xopacked  = row.xopacked || '';
  const maxSid    = parseInt(row.xomaxstatusid) || 0;
  const toQty     = parseFloat(row.totalxoqty)  || 0;
  const qtyMatch  = toQty > 0;

  if (!xopacked) return {key:'none',    label:'Not Started', cls:'tx-none',     ord:0, qtyMatch:false};
  if (maxSid >= 60) return {key:'complete', label:'Complete', cls:'tx-complete', ord:3, qtyMatch};
  if (maxSid >= 55) return {key:'shipped',  label:'Shipped',  cls:'tx-shipped',  ord:2, qtyMatch};
  return               {key:'progress', label:'In Progress', cls:'tx-progress',  ord:1, qtyMatch};
}

/* ── LED from status string ── */
function statusLed(statusStr, label) {
  var s = (statusStr || '').toLowerCase();
  var cls = 'led-grey';
  if (s.includes('fulfil') || s.includes('finish') || s.includes('receiv') || s.includes('reconcil') || s.includes('shipped') || s.includes('complet')) cls = 'led-green';
  else if (s.includes('pick') || s.includes('partial') || s.includes('progress') || s.includes('start') || s.includes('issued') || s.includes('packed')) cls = 'led-amber';
  else if (s.includes('short') || s.includes('void') || s.includes('cancel')) cls = 'led-red';
  var title = statusStr ? label + ': ' + statusStr : label + ': none';
  return '<span class="led ' + cls + '" title="' + escHtml(title) + '"></span>';
}

function escHtml(s) { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── CUSTOM CELL RENDERERS ── */
function parsedTOs(row) {
  const xopacked = row.xopacked || '';
  if (!xopacked) return [];
  const tos = parsePacked(xopacked);
  const seen = new Map();
  tos.forEach(t => {
    const num = t[0] || '';
    if (!num) return;
    if (!seen.has(num)) {
      seen.set(num, {
        num, statusid: parseInt(t[1])||0, statusname: t[2]||'', tolgname: t[3]||'',
        qtytofulfill: parseFloat(t[4])||0, qtyfulfilled: parseFloat(t[5])||0,
        pickstatus: t[6]||'', shipstatus: t[7]||'', rcptstatus: t[8]||''
      });
    } else {
      var ex = seen.get(num);
      ex.qtytofulfill += parseFloat(t[4])||0;
      ex.qtyfulfilled += parseFloat(t[5])||0;
    }
  });
  return [...seen.values()];
}

/* ── DIAGNOSTICS ── */
async function runDiagnostics() {
  // Make the debug console visible
  const dc = document.getElementById('debugConsoleContainer');
  if (dc) dc.style.display = 'block';
  const content = document.getElementById('debugContent');
  if (content) content.style.display = '';
  const chevron = document.getElementById('debugChevron');
  if (chevron) chevron.style.transform = 'rotate(0deg)';
  document.getElementById('tableWrap').style.paddingBottom = '244px';

  debugLog('=== DIAGNOSTICS START ===', 'info');

  const cfN   = XO_CONTAINER_FIELD.replace(/'/g, "''");

  // 1. Show all custom field names defined on the TO module (any TO with non-empty customfields)
  try {
    const sample = await qp(`
      SELECT xo.num, xo.statusid,
             CustomFieldByName(xo.customfields, '${cfN}') AS extracted_container,
             SUBSTR(xo.customfields, 1, 300) AS raw_cf
      FROM xo
      WHERE xo.customfields IS NOT NULL AND xo.customfields NOT IN ('{}','null')
      ORDER BY xo.id DESC
      LIMIT 10
    `);
    if (!sample.length) {
      debugLog('XO sample: no TOs with customfields found', 'warn');
    } else {
      debugLog('--- Recent TOs: CustomFieldByName(customfields, "' + XO_CONTAINER_FIELD + '") ---', 'info');
      sample.forEach(r => {
        const val = (r.extracted_container == null || r.extracted_container === 'null') ? 'NULL/empty' : r.extracted_container;
        debugLog('  TO ' + r.num + ' (status ' + r.statusid + '): extracted="' + val + '" | raw=' + (r.raw_cf || '').substring(0, 150), val === 'NULL/empty' ? 'warn' : 'success');
      });
    }
  } catch(e) { debugLog('XO sample error: ' + (e.message || 'unknown'), 'error'); }

  // 3. Sample poitem.note values
  try {
    const notes = await qp(`
      SELECT po.num AS ponum, poitem.polineitem AS line,
             TRIM(poitem.note) AS note, poitem.partnum
      FROM poitem
      JOIN po ON po.id = poitem.poid
      WHERE poitem.note IS NOT NULL AND TRIM(poitem.note) != ''
      ORDER BY po.id DESC
      LIMIT 15
    `);
    if (!notes.length) {
      debugLog('poitem.note: no rows with non-empty note found', 'warn');
    } else {
      debugLog('--- Recent poitem.note values ---', 'info');
      notes.forEach(r => {
        debugLog('  PO ' + r.ponum + ' line ' + r.line + ' (' + r.partnum + '): note="' + r.note + '"', 'info');
      });
    }
  } catch(e) { debugLog('poitem.note scan error: ' + (e.message || 'unknown'), 'error'); }

  // 4. Direct match check — does any xo container value equal any poitem.note?
  try {
    const matches = await qp(`
      SELECT po.num AS ponum, poitem.partnum,
             TRIM(poitem.note) AS po_container,
             xo.num AS xonum,
             CustomFieldByName(xo.customfields, '${cfN}') AS xo_container
      FROM poitem
      JOIN po  ON po.id  = poitem.poid
      JOIN xo  ON CustomFieldByName(xo.customfields, '${cfN}') = TRIM(poitem.note)
      WHERE poitem.note IS NOT NULL AND TRIM(poitem.note) != ''
      LIMIT 10
    `);
    if (!matches.length) {
      debugLog('MATCH CHECK: No rows found where CustomFieldByName(xo.customfields, "' + XO_CONTAINER_FIELD + '") = poitem.note. The join produces nothing.', 'error');
      debugLog('  → Either the TO Container field is empty/unset, or the values do not match the PO note exactly.', 'warn');
    } else {
      debugLog('MATCH CHECK: Found ' + matches.length + ' matching row(s) — join is working:', 'success');
      matches.forEach(r => debugLog('  PO ' + r.ponum + ' (' + r.partnum + ') note="' + r.po_container + '" ↔ TO ' + r.xonum + ' field="' + r.xo_container + '"', 'success'));
    }
  } catch(e) { debugLog('Match check error: ' + (e.message || 'unknown'), 'error'); }

  debugLog('=== DIAGNOSTICS END ===', 'info');
}

/* ── SETTINGS ── */
function loadSavedSettings() {
  try {
    const raw = loadSettings(_KEY); if (!raw) return;
    const s = JSON.parse(raw); if (s.v !== 1) return;
    if (Array.isArray(s.selPoStatus)) { _selPoStatus.clear(); s.selPoStatus.forEach(v => _selPoStatus.add(v)); }
    if (s.selLg)     _selLg     = new Set(s.selLg);
    if (s.selVendor) _selVendor = new Set(s.selVendor);
    if (s.dateFrom) document.getElementById('dateFrom').value = s.dateFrom;
    if (s.dateTo)   document.getElementById('dateTo').value   = s.dateTo;
    const textIds = ['filterPoNum','filterContainer','filterPart','filterTxStatus'];
    textIds.forEach(id => { if (s[id] != null) { const el = document.getElementById(id); if (el) el.value = s[id]; } });
    if (Array.isArray(s.cols)) {
      const savedMap  = Object.fromEntries(s.cols.map(c => [c.key, c]));
      const reordered = s.cols.map(sc => _columns.find(c => c.key === sc.key)).filter(Boolean);
      const extras    = _columns.filter(c => !savedMap[c.key]);
      _columns = [...reordered, ...extras];
      _columns.forEach(c => { if (savedMap[c.key]) { c.vis = savedMap[c.key].vis; if (savedMap[c.key].colW) c.colW = savedMap[c.key].colW; } });
    }
  } catch(e) { console.warn('loadSettings error', e); }
}

function saveCurrentSettings() {
  const s = {
    v: 1,
    selPoStatus: [..._selPoStatus],
    selLg:       [..._selLg],
    selVendor:   [..._selVendor],
    dateFrom:    document.getElementById('dateFrom').value,
    dateTo:      document.getElementById('dateTo').value,
    cols:        _columns.map(c => ({key:c.key, vis:c.vis, colW:c.colW})),
  };
  ['filterPoNum','filterContainer','filterPart','filterTxStatus'].forEach(id => { s[id] = document.getElementById(id)?.value || ''; });
  saveSettings(_KEY, JSON.stringify(s));
  setStatus('Settings saved. ' + _statusSuffix);
  showToast('Layout settings saved');
}

function resetSettings() {
  saveSettings(_KEY, '');
  location.reload();
}

/* ── LOOKUP POPULATION ── */
async function populateLG() {
  const ids  = getLocationGroupList();
  if (!ids.length) { buildMS('lg'); return; }
  const rows = await qp(`SELECT id, name FROM locationgroup WHERE id IN (${ids.join(',')}) AND activeFlag = 1 ORDER BY name`);
  _lgList = rows.map(r => ({val:String(r.id), lbl:r.name}));
  buildMS('lg');
}
async function populateVendor() {
  const rows = await qp('SELECT id, name FROM vendor WHERE activeFlag = 1 ORDER BY name LIMIT 2000');
  _vendorList = rows.map(r => ({val:String(r.id), lbl:r.name}));
  buildMS('vendor');
}

/* ── MULTI-SELECT ── */
function msData(type) {
  const map = {
    postatus: {list:PO_STATUS_LIST, sel:_selPoStatus},
    vendor:   {list:_vendorList,    sel:_selVendor},
    lg:       {list:_lgList,        sel:_selLg},
  };
  return map[type] || {list:[], sel:new Set()};
}

function buildMS(type) {
  const {list, sel} = msData(type);
  const listEl = document.getElementById(type + 'List');
  const search  = document.getElementById(type + 'Search');
  if (!listEl) return;
  renderMSList(type, list, sel, listEl);
  updateMSTrigger(type);
  const trigger = document.getElementById(type + 'Trigger');
  if (trigger && !trigger._msBuilt) {
    trigger._msBuilt = true;
    trigger.addEventListener('click', () => toggleMS(type));
    document.getElementById(type + 'All').addEventListener('click', () => { list.forEach(o => sel.add(o.val)); renderMSList(type, list, sel, listEl); updateMSTrigger(type); });
    document.getElementById(type + 'Clear').addEventListener('click', () => { sel.clear(); renderMSList(type, list, sel, listEl); updateMSTrigger(type); });
    if (search) search.addEventListener('input', () => { const f = search.value.toLowerCase(); renderMSList(type, f ? list.filter(o => o.lbl.toLowerCase().includes(f)) : list, sel, listEl); });
  }
}

function renderMSList(type, list, sel, listEl) {
  listEl.innerHTML = '';
  if (!list.length) { listEl.innerHTML = '<div class="ms-empty">No items</div>'; return; }
  list.forEach(o => {
    const div = document.createElement('div'); div.className = 'ms-item';
    const cb  = document.createElement('input'); cb.type = 'checkbox'; cb.checked = sel.has(o.val);
    const sp  = document.createElement('span'); sp.textContent = o.lbl;
    div.appendChild(cb); div.appendChild(sp);
    div.addEventListener('click', () => { sel.has(o.val) ? sel.delete(o.val) : sel.add(o.val); cb.checked = sel.has(o.val); updateMSTrigger(type); });
    listEl.appendChild(div);
  });
}

function updateMSTrigger(type) {
  const {list, sel} = msData(type);
  const trigger = document.getElementById(type + 'Trigger');
  const ph      = document.getElementById(type + 'Placeholder');
  if (!trigger || !ph) return;
  trigger.querySelectorAll('.ms-tag').forEach(t => t.remove());
  const phText = {postatus:'All statuses', vendor:'All vendors', lg:'All location groups'};
  if (!sel.size) { ph.textContent = phText[type] || 'All'; ph.style.display = ''; return; }
  ph.style.display = 'none';
  [...sel].slice(0, 3).forEach(v => {
    const item = list.find(o => o.val === v);
    const tag  = document.createElement('span'); tag.className = 'ms-tag';
    const lbl  = document.createElement('span'); lbl.textContent = item ? item.lbl : v;
    const x    = document.createElement('span'); x.className = 'ms-tag-x'; x.textContent = '×';
    x.addEventListener('click', e => { e.stopPropagation(); sel.delete(v); updateMSTrigger(type); });
    tag.appendChild(lbl); tag.appendChild(x); trigger.insertBefore(tag, ph);
  });
  if (sel.size > 3) {
    const more = document.createElement('span'); more.className = 'ms-tag'; more.style.cssText = 'background:#e5e7eb;color:#374151;';
    more.textContent = '+' + (sel.size - 3) + ' more'; trigger.insertBefore(more, ph);
  }
}

function toggleMS(type) {
  const dd = document.getElementById(type + 'Dropdown');
  if (_activeMS && _activeMS !== type) closeMS(_activeMS);
  if (dd.classList.contains('hidden')) { dd.classList.remove('hidden'); _activeMS = type; const s = document.getElementById(type+'Search'); if (s) { s.value=''; s.focus(); } }
  else closeMS(type);
}
function closeMS(type) {
  const dd = document.getElementById(type + 'Dropdown'); if (dd) dd.classList.add('hidden');
  if (_activeMS === type) _activeMS = null;
}

/* ── SQL BUILD ── */
function buildSQL() {
  const poStatuses = [..._selPoStatus];
  if (!poStatuses.length) return null;

  const lgIds       = getLocationGroupList();
  const selLgIds    = _selLg.size > 0 ? lgIds.filter(id => _selLg.has(String(id))) : lgIds;
  const from        = document.getElementById('dateFrom').value;
  const to          = document.getElementById('dateTo').value;
  const poNumF      = (document.getElementById('filterPoNum')?.value  || '').trim();
  const containerF  = (document.getElementById('filterContainer')?.value || '').trim();
  const partF       = (document.getElementById('filterPart')?.value   || '').trim();
  const vendorIds   = _selVendor.size > 0 ? [..._selVendor].map(v => parseInt(v)).filter(n => !isNaN(n)) : null;

  const where = [];
  where.push(`po.statusid IN (${poStatuses.map(Number).join(',')})`);
  if (selLgIds.length) where.push(`po.locationgroupid IN (${selLgIds.join(',')})`);
  if (from && to)      where.push(`DATE(po.dateissued) BETWEEN '${safeDate(from)}' AND '${safeDate(to)}'`);
  if (vendorIds && vendorIds.length) where.push(`po.vendorid IN (${vendorIds.join(',')})`);
  if (poNumF)     where.push(`po.num LIKE '%${escSQL(poNumF)}%'`);
  if (partF)      where.push(`COALESCE(part.num, poitem.partnum) LIKE '%${escSQL(partF)}%'`);
  if (containerF) where.push(`TRIM(poitem.note) LIKE '%${escSQL(containerF)}%'`);

  const cfName        = escSQL(XO_CONTAINER_FIELD);
  const xoField       = `CustomFieldByName(xo.customfields, '${cfName}')`;
  const xoFieldExists = `CustomFieldByName(xo.customfields, '${cfName}') IS NOT NULL`;

  const sql = `
SELECT
  po.id                          AS poid,
  po.num                         AS ponum,
  po.statusid                    AS postatusid,
  CASE po.statusid
    WHEN 20 THEN 'Issued'   WHEN 30 THEN 'Picking' WHEN 40 THEN 'Partial'
    WHEN 50 THEN 'Picked'   WHEN 55 THEN 'Shipped' WHEN 60 THEN 'Fulfilled'
    WHEN 70 THEN 'Closed Short' WHEN 80 THEN 'Void' WHEN 10 THEN 'Bid Request'
    WHEN 15 THEN 'Pending Approval'
    ELSE CONCAT('Status ', po.statusid)
  END                            AS postatusname,
  DATE(po.dateissued)            AS dateissued,
  DATE(po.datefirstship)         AS datefirstship,
  vendor.name                    AS vendorname,
  vendor.id                      AS vendorid,
  fromlg.name                    AS locationgroupname,
  fromlg.id                      AS locationgroupid,
  poitem.id                      AS poitemid,
  poitem.polineitem               AS linenum,
  COALESCE(part.num, poitem.partnum) AS partnum,
  COALESCE(part.description, poitem.description) AS description,
  TRIM(poitem.note)              AS container,
  poitem.qtytofulfill            AS qtyordered,
  COALESCE(poitem.qtyfulfilled, 0) AS qtyfulfilled,
  poitem.statusid                AS poitemstatusid,
  CASE poitem.statusid
    WHEN 10 THEN 'Entered'  WHEN 20 THEN 'Picking' WHEN 30 THEN 'Partial'
    WHEN 40 THEN 'Picked'   WHEN 45 THEN 'Part. Fulfilled' WHEN 50 THEN 'Fulfilled'
    WHEN 60 THEN 'Closed Short' WHEN 70 THEN 'Void'
    ELSE ''
  END                            AS poitemstatusname,
  DATE(poitem.datescheduledfulfillment) AS datescheduled,
  COALESCE(rcv.totalreceived, 0)                                           AS totalreceived,
  GREATEST(0, poitem.qtytofulfill - COALESCE(rcv.totalreceived, 0))       AS qtyremaining,
  COALESCE(rcv.receiptstatusname, '')                                      AS receiptstatusname,
  COALESCE(xo_agg.xopacked, '')  AS xopacked,
  COALESCE(xo_agg.totalxoqty, 0) AS totalxoqty,
  COALESCE(xo_agg.xomaxstatusid, 0) AS xomaxstatusid

FROM po
JOIN vendor       ON vendor.id   = po.vendorid
JOIN locationgroup fromlg ON fromlg.id = po.locationgroupid
JOIN poitem       ON poitem.poid = po.id
LEFT JOIN part    ON part.id     = poitem.partid

LEFT JOIN (
  SELECT ri.poitemid,
         SUM(ri.qty)                                                     AS totalreceived,
         GROUP_CONCAT(DISTINCT ris.name ORDER BY ris.id SEPARATOR ', ') AS receiptstatusname
  FROM receiptitem ri
  LEFT JOIN receiptitemstatus ris ON ris.id = ri.statusid
  WHERE ri.poitemid IS NOT NULL
    AND ri.statusid > 10
  GROUP BY ri.poitemid
) rcv ON rcv.poitemid = poitem.id

LEFT JOIN (
  -- Outer aggregation: pack per (partid, container)
  SELECT
    xob.partid,
    xob.container,
    GROUP_CONCAT(
      CONCAT_WS('~~',
        xob.xonum, xob.xostatusid, xob.xostatusname, xob.tolgname,
        xob.qty_ordered, xob.qty_fulfilled,
        xob.pickstatusname, xob.shipstatusname, xob.rcptstatusname
      )
      ORDER BY xob.xonum SEPARATOR '||'
    ) AS xopacked,
    SUM(xob.qty_ordered)  AS totalxoqty,
    MAX(xob.xostatusid)   AS xomaxstatusid
  FROM (
    -- Inner aggregation: one row per (xo, partid, container)
    SELECT
      xoi.partid,
      xo.id                                        AS xoid,
      xo.num                                       AS xonum,
      xo.statusid                                  AS xostatusid,
      COALESCE(xos.name, '')                       AS xostatusname,
      COALESCE(tolg.name, '')                      AS tolgname,
      TRIM(${xoField})                             AS container,
      SUM(xoi.qtytofulfill)                        AS qty_ordered,
      COALESCE(SUM(xoi.qtyfulfilled), 0)           AS qty_fulfilled,
      COALESCE(pk_xo.pickstatusname, '')           AS pickstatusname,
      COALESCE(sh_xo.shipstatusname, '')           AS shipstatusname,
      COALESCE(rc_xo.rcptstatusname, '')           AS rcptstatusname
    FROM xoitem xoi
    JOIN xo ON xo.id = xoi.xoid
    LEFT JOIN xostatus xos ON xos.id = xo.statusid
    LEFT JOIN locationgroup tolg ON tolg.id = xo.shiptolgid
    LEFT JOIN (
      SELECT pi.orderId AS xoid,
             GROUP_CONCAT(DISTINCT ps.name ORDER BY ps.id SEPARATOR ', ') AS pickstatusname
      FROM pickitem pi
      JOIN pick pk ON pk.id = pi.pickId
      LEFT JOIN pickstatus ps ON ps.id = pk.statusId
      WHERE pi.orderTypeId = 40
      GROUP BY pi.orderId
    ) pk_xo ON pk_xo.xoid = xo.id
    LEFT JOIN (
      SELECT sh.xoId,
             GROUP_CONCAT(DISTINCT ss.name ORDER BY ss.id SEPARATOR ', ') AS shipstatusname
      FROM ship sh
      LEFT JOIN shipstatus ss ON ss.id = sh.statusId
      GROUP BY sh.xoId
    ) sh_xo ON sh_xo.xoId = xo.id
    LEFT JOIN (
      SELECT r.xoId,
             GROUP_CONCAT(DISTINCT rs.name ORDER BY rs.id SEPARATOR ', ') AS rcptstatusname
      FROM receipt r
      LEFT JOIN receiptstatus rs ON rs.id = r.statusId
      WHERE r.xoId IS NOT NULL AND r.orderTypeId = 40
      GROUP BY r.xoId
    ) rc_xo ON rc_xo.xoId = xo.id
    WHERE ${xoFieldExists}
      AND TRIM(${xoField}) IS NOT NULL
      AND TRIM(${xoField}) != ''
    GROUP BY
      xoi.partid, xo.id, xo.num, xo.statusid, xos.name, tolg.name,
      TRIM(${xoField}),
      pk_xo.pickstatusname, sh_xo.shipstatusname, rc_xo.rcptstatusname
  ) xob
  GROUP BY xob.partid, xob.container
) xo_agg ON xo_agg.partid = poitem.partid
         AND xo_agg.container = TRIM(COALESCE(poitem.note, ''))
         AND poitem.note IS NOT NULL
         AND TRIM(poitem.note) != ''

WHERE ${where.join('\n  AND ')}
ORDER BY po.num, poitem.polineitem
LIMIT 5000`.trim();

  debugLog('SQL built. WHERE: ' + where.join(' | '), 'query');
  debugLog(sql, 'query');
  return sql;
}

/* ── QUERY WRAPPER ── */
async function qp(sql) {
  debugLog('qp: ' + sql.substring(0, 120).replace(/\s+/g,' '), 'query');
  return await runQueryAsync(sql);
}

/* ── RUN REPORT ── */
async function runReport() {
  const sql = buildSQL();
  if (!sql) { setStatus('Select at least one PO status.'); return; }
  setStatus('Loading...'); showSpinner();
  const t0 = Date.now();
  try {
    _dataset = await qp(sql);
    const ms = Date.now() - t0;
    debugLog('Query returned ' + _dataset.length + ' rows in ' + ms + 'ms', _dataset.length === 0 ? 'warn' : 'success');

    // Client-side transfer status filter
    const txFilter = document.getElementById('filterTxStatus')?.value || '';
    const filtered = txFilter ? _dataset.filter(row => {
      const ts = calcTransferStatus(row);
      return ts.key === txFilter;
    }) : _dataset;

    _groups = buildGroups(filtered);
    applyPoSort();
    _expanded.clear();
    _statusSuffix = `${_groups.length.toLocaleString()} PO${_groups.length!==1?'s':''}, ${filtered.length.toLocaleString()} item${filtered.length!==1?'s':''} (${(ms/1000).toFixed(1)}s)${_dataset.length===5000?' — limit reached':''}`;
    setStatus(_statusSuffix);
    renderTable();
  } catch(e) {
    setStatus('Error: ' + (e.message || String(e)));
    debugLog('runReport ERROR: ' + (e.message || String(e)), 'error');
    console.error(e);
  } finally { hideSpinner(); }
}

/* ── GROUPING ── */
function buildGroups(data) {
  const map = new Map();
  data.forEach(row => {
    const pid = row.poid;
    if (!map.has(pid)) {
      map.set(pid, {
        poid:              pid,
        ponum:             row.ponum || '',
        postatusid:        row.postatusid,
        postatusname:      row.postatusname || '',
        dateissued:        row.dateissued,
        datefirstship:     row.datefirstship,
        vendorname:        row.vendorname || '',
        locationgroupname: row.locationgroupname || '',
        items: [],
        containers: new Map(),
      });
    }
    const g = map.get(pid);
    g.items.push(row);

    const cKey = (row.container || '').trim();
    if (cKey) {
      if (!g.containers.has(cKey)) g.containers.set(cKey, {rows:[], maxStatusId:0, totalXoQty:0, totalRcvd:0});
      const c = g.containers.get(cKey);
      c.rows.push(row);
      c.totalXoQty  += parseFloat(row.totalxoqty)    || 0;
      c.totalRcvd   += parseFloat(row.totalreceived)  || 0;
      c.maxStatusId  = Math.max(c.maxStatusId, parseInt(row.xomaxstatusid) || 0);
    }
  });
  return [...map.values()];
}

function containerSummary(group) {
  let total = group.containers.size, complete = 0, shipped = 0, partial = 0;
  group.containers.forEach(c => {
    const sid = c.maxStatusId;
    if (sid >= 60) complete++;
    else if (sid >= 55) shipped++;
    else if (sid > 0) partial++;
  });
  return {total, complete, shipped, partial, none: total - complete - shipped - partial};
}

/* ── PO SORT ── */
const PO_SORT_COLS = {
  ponum:             g => g.ponum,
  vendorname:        g => g.vendorname,
  postatusname:      g => g.postatusid,
  dateissued:        g => g.dateissued || '',
  locationgroupname: g => g.locationgroupname,
};

function applyPoSort() {
  if (!_poSortCol || !PO_SORT_COLS[_poSortCol]) return;
  const fn  = PO_SORT_COLS[_poSortCol];
  const dir = _poSortDir === 'asc' ? 1 : -1;
  _groups.sort((a, b) => {
    const av = fn(a), bv = fn(b);
    return av < bv ? -dir : av > bv ? dir : 0;
  });
}

function poSortBy(col) {
  if (_poSortCol === col) _poSortDir = _poSortDir === 'asc' ? 'desc' : 'asc';
  else { _poSortCol = col; _poSortDir = 'asc'; }
  applyPoSort();
  renderTable();
}

/* ── ITEM SORT ── */
function sortItems(items) {
  if (!_sortCol) return items;
  const col = _columns.find(c => c.key === _sortCol);
  if (!col || col.noSort) return items;
  const dir = _sortDir === 'asc' ? 1 : -1;
  return [...items].sort((a, b) => {
    let av = a[_sortCol] ?? '', bv = b[_sortCol] ?? '';
    if (col.qty || col.date) { av = parseFloat(av) || 0; bv = parseFloat(bv) || 0; }
    else { av = String(av).toLowerCase(); bv = String(bv).toLowerCase(); }
    return av < bv ? -dir : av > bv ? dir : 0;
  });
}

/* ── EXPAND / COLLAPSE ── */
function togglePO(poid) {
  _expanded.has(poid) ? _expanded.delete(poid) : _expanded.add(poid);
  renderTable();
}
function expandAll()   { _groups.forEach(g => _expanded.add(g.poid));    renderTable(); }
function collapseAll() { _expanded.clear();                               renderTable(); }

/* ── TABLE RENDER ── */
function renderTable() {
  const vis = _columns.filter(c => c.vis);
  renderHead(vis);
  renderBody(vis);
}

function renderHead(vis) {
  const table = document.getElementById('dataTable');
  let cg = table.querySelector('colgroup');
  if (!cg) { cg = document.createElement('colgroup'); table.insertBefore(cg, table.firstChild); }
  cg.innerHTML = '';
  const colEls = vis.map(col => {
    const c = document.createElement('col'); c.style.width = col.colW || 'auto'; cg.appendChild(c); return c;
  });

  // PO-level sort header row
  const PO_HDR = {
    partnum:      {key:'ponum',      label:'PO #',     align:'left'},
    description:  {key:'vendorname', label:'Vendor',   align:'left'},
    dateissued:   {key:'dateissued', label:'Date',     align:'center'},
    datescheduled:{key:'datefirstship', label:'Ship Date', align:'center'},
    container:    {key:'locationgroupname', label:'Location Group', align:'left'},
  };
  const partnumIdx = vis.findIndex(c => c.key === 'partnum');
  const mergeCount = partnumIdx > 1 ? partnumIdx : 1;

  function mkPoTh(label, sortKey, colSpan, align) {
    const th = document.createElement('th');
    const isActive = !!(sortKey && _poSortCol === sortKey);
    th.style.cssText = 'background:' + (isActive?'#1a87c4':'#2d9cdb') + ';color:white;font-weight:500;padding:5px 10px;font-size:11px;position:sticky;top:0;z-index:11;text-align:' + (align||'left') + ';white-space:nowrap;border-bottom:1px solid rgba(255,255,255,0.25);' + (sortKey?'cursor:pointer;':'cursor:default;') + 'user-select:none;';
    if (colSpan > 1) th.colSpan = colSpan;
    th.textContent = label + (isActive ? (_poSortDir==='asc'?' ↑':' ↓') : '');
    if (sortKey) th.addEventListener('click', () => poSortBy(sortKey));
    return th;
  }

  const poRow = document.createElement('tr');
  vis.forEach((col, i) => {
    const hdrMap = PO_HDR[col.key];
    if (i < mergeCount) { if (i === 0) { const th = mkPoTh('PO #', 'ponum', mergeCount, 'left'); poRow.appendChild(th); } return; }
    if (hdrMap) poRow.appendChild(mkPoTh(hdrMap.label, hdrMap.key, 1, hdrMap.align));
    else poRow.appendChild(mkPoTh('', null, 1, 'left'));
  });

  // Item-level column header row
  const itemRow = document.createElement('tr');
  vis.forEach((col, colIdx) => {
    const th = document.createElement('th');
    th.style.position = 'relative';
    const isSort = _sortCol === col.key;
    if (isSort) th.className = _sortDir === 'asc' ? 'sort-asc' : 'sort-desc';
    th.textContent = col.label;
    if (!col.noSort) {
      th.addEventListener('click', () => {
        if (_sortCol === col.key) _sortDir = _sortDir === 'asc' ? 'desc' : 'asc';
        else { _sortCol = col.key; _sortDir = 'asc'; }
        renderTable();
      });
    }
    // Drag reorder
    th.draggable = true;
    th.addEventListener('dragstart', e => { _dragColKey = col.key; _dragIdx = colIdx; e.dataTransfer.effectAllowed='move'; });
    th.addEventListener('dragover',  e => { e.preventDefault(); th.classList.add('col-drag-over'); });
    th.addEventListener('dragleave', () => th.classList.remove('col-drag-over'));
    th.addEventListener('drop', e => {
      e.preventDefault(); th.classList.remove('col-drag-over');
      if (_dragColKey && _dragColKey !== col.key) {
        const fromVis = _columns.find(c => c.key === _dragColKey);
        const toVis   = _columns.find(c => c.key === col.key);
        if (fromVis && toVis) {
          const fi = _columns.indexOf(fromVis), ti = _columns.indexOf(toVis);
          _columns.splice(fi, 1); _columns.splice(_columns.indexOf(toVis) + (fi < ti ? 1 : 0), 0, fromVis);
          renderTable(); buildColPanel();
        }
      }
      _dragColKey = null;
    });
    // Resize handle
    const rh = document.createElement('div'); rh.className = 'col-resize-handle';
    rh.addEventListener('mousedown', e => {
      e.stopPropagation(); e.preventDefault(); _resizing = true; rh.classList.add('active');
      const startX = e.clientX, startW = colEls[colIdx] ? colEls[colIdx].offsetWidth : 80;
      function onMove(ev) {
        const w = Math.max(40, startW + ev.clientX - startX);
        col.colW = w + 'px'; if (colEls[colIdx]) colEls[colIdx].style.width = col.colW;
      }
      function onUp() { _resizing = false; rh.classList.remove('active'); document.removeEventListener('mousemove', onMove); document.removeEventListener('mouseup', onUp); }
      document.addEventListener('mousemove', onMove); document.addEventListener('mouseup', onUp);
    });
    th.appendChild(rh);
    itemRow.appendChild(th);
  });

  const thead = document.getElementById('tHead'); thead.innerHTML = '';
  thead.appendChild(poRow); thead.appendChild(itemRow);
}

function renderBody(vis) {
  const tbody = document.getElementById('tBody'); tbody.innerHTML = '';
  if (!_groups.length) {
    tbody.innerHTML = '<tr><td colspan="' + vis.length + '" style="padding:2rem;color:#9ca3af;text-align:center;">No results. Adjust filters and refresh.</td></tr>';
    return;
  }

  _groups.forEach(group => {
    const isOpen = _expanded.has(group.poid);
    const cs = containerSummary(group);

    // PO header row
    const hdrTr = document.createElement('tr'); hdrTr.className = 'po-hdr';
    hdrTr.addEventListener('click', () => togglePO(group.poid));

    const hdrTd = document.createElement('td'); hdrTd.colSpan = vis.length;
    const inner = document.createElement('div'); inner.className = 'po-hdr-inner';

    // Toggle
    const tog = document.createElement('span'); tog.className = 'po-toggle'; tog.textContent = isOpen ? '▼' : '▶'; inner.appendChild(tog);

    // PO # link
    const poLink = document.createElement('a'); poLink.className = 'row-link po-num'; poLink.href = '#'; poLink.textContent = group.ponum;
    poLink.addEventListener('click', e => { e.stopPropagation(); e.preventDefault(); openModule('Purchase Order', group.ponum); });
    inner.appendChild(poLink);

    // PO Status badge
    const badgeCls = PO_STATUS_BADGE[group.postatusid] || 'b-default';
    const sb = document.createElement('span'); sb.className = 'badge ' + badgeCls; sb.textContent = group.postatusname; inner.appendChild(sb);

    // Vendor
    const sep1 = document.createElement('span'); sep1.className = 'po-separator'; sep1.textContent = '|'; inner.appendChild(sep1);
    const vnd = document.createElement('span'); vnd.className = 'po-meta'; vnd.textContent = group.vendorname; inner.appendChild(vnd);

    // Date issued
    if (group.dateissued) {
      const sep2 = document.createElement('span'); sep2.className = 'po-separator'; sep2.textContent = '|'; inner.appendChild(sep2);
      const dt = document.createElement('span'); dt.className = 'po-meta'; dt.textContent = 'Issued: ' + formatDate(group.dateissued); inner.appendChild(dt);
    }

    // Location Group
    const sep3 = document.createElement('span'); sep3.className = 'po-separator'; sep3.textContent = '|'; inner.appendChild(sep3);
    const lg = document.createElement('span'); lg.className = 'po-meta'; lg.textContent = group.locationgroupname; inner.appendChild(lg);

    // Container summary
    const sep4 = document.createElement('span'); sep4.className = 'po-separator'; sep4.textContent = '|'; inner.appendChild(sep4);
    const containerDiv = document.createElement('span'); containerDiv.className = 'po-meta';
    containerDiv.style.display = 'flex'; containerDiv.style.alignItems = 'center'; containerDiv.style.gap = '4px';
    containerDiv.innerHTML = '<span style="color:#6b7280;">Containers:</span>';
    if (cs.total === 0) {
      containerDiv.innerHTML += ' <span style="color:#9ca3af;font-size:11px;">none</span>';
    } else {
      if (cs.complete > 0) { const pip = document.createElement('span'); pip.className = 'container-pip pip-complete'; pip.textContent = cs.complete; pip.title = cs.complete + ' complete'; containerDiv.appendChild(pip); }
      if (cs.shipped  > 0) { const pip = document.createElement('span'); pip.className = 'container-pip pip-shipped';  pip.textContent = cs.shipped;  pip.title = cs.shipped  + ' shipped';  containerDiv.appendChild(pip); }
      if (cs.partial  > 0) { const pip = document.createElement('span'); pip.className = 'container-pip pip-partial';  pip.textContent = cs.partial;  pip.title = cs.partial  + ' in progress'; containerDiv.appendChild(pip); }
      if (cs.none     > 0) { const pip = document.createElement('span'); pip.className = 'container-pip pip-none';     pip.textContent = cs.none;     pip.title = cs.none     + ' not started'; containerDiv.appendChild(pip); }
      const tot = document.createElement('span'); tot.style.cssText = 'font-size:10px;color:#9ca3af;'; tot.textContent = '/' + cs.total; containerDiv.appendChild(tot);
    }
    inner.appendChild(containerDiv);

    // Item count
    const sep5 = document.createElement('span'); sep5.className = 'po-separator'; sep5.textContent = '|'; inner.appendChild(sep5);
    const ic = document.createElement('span'); ic.className = 'po-meta'; ic.textContent = group.items.length + ' line' + (group.items.length !== 1 ? 's' : ''); inner.appendChild(ic);

    hdrTd.appendChild(inner); hdrTr.appendChild(hdrTd); tbody.appendChild(hdrTr);

    // Item rows — grouped by container
    if (isOpen) {
      const sorted = sortItems(group.items);

      // Build ordered container groups
      const containerOrder = [];
      const containerMap = new Map();
      sorted.forEach(row => {
        const key = (row.container || '').trim() || '(No Container)';
        if (!containerMap.has(key)) { containerMap.set(key, []); containerOrder.push(key); }
        containerMap.get(key).push(row);
      });

      let altIdx = 0;
      containerOrder.forEach(cKey => {
        const cItems = containerMap.get(cKey);
        const isReal = cKey !== '(No Container)';
        const cData  = isReal ? group.containers.get(cKey) : null;

        // Container sub-header row
        const chdrTr = document.createElement('tr'); chdrTr.className = 'container-hdr';
        const chdrTd = document.createElement('td'); chdrTd.colSpan = vis.length;
        const chdrIn = document.createElement('div'); chdrIn.className = 'container-hdr-inner';

        const lbl = document.createElement('span');
        lbl.style.cssText = 'font-weight:600;color:#1e3a5f;font-size:11px;';
        lbl.textContent = isReal ? 'Container: ' + cKey : '(No Container)';
        chdrIn.appendChild(lbl);

        if (cData && cData.maxStatusId > 0) {
          const sid = cData.maxStatusId;
          const pipCls = sid >= 60 ? 'pip-complete' : sid >= 55 ? 'pip-shipped' : 'pip-partial';
          const pipLbl = sid >= 60 ? '✓' : sid >= 55 ? '→' : '…';
          const pipTitle = sid >= 60 ? 'Complete' : sid >= 55 ? 'Shipped' : 'In Progress';
          const pip = document.createElement('span'); pip.className = 'container-pip ' + pipCls;
          pip.textContent = pipLbl; pip.title = pipTitle;
          chdrIn.appendChild(pip);
        }

        const cnt = document.createElement('span'); cnt.style.cssText = 'color:#9ca3af;font-size:10px;';
        cnt.textContent = cItems.length + ' item' + (cItems.length !== 1 ? 's' : '');
        chdrIn.appendChild(cnt);

        chdrTd.appendChild(chdrIn); chdrTr.appendChild(chdrTd); tbody.appendChild(chdrTr);

        // Item rows in this container group
        cItems.forEach(row => {
          const tr = document.createElement('tr'); tr.className = 'item-row' + (altIdx % 2 === 1 ? ' even-item' : '');
          altIdx++;
          vis.forEach(col => {
            const td = document.createElement('td');
            if (col.colW) td.style.maxWidth = col.colW;
            if (col.custom === 'tonum')    { renderTONumCell(td, row);    tr.appendChild(td); return; }
            if (col.custom === 'tostatus') { renderTOStatusCell(td, row); tr.appendChild(td); return; }
            if (col.custom === 'topick')   { renderTOPickCell(td, row);   tr.appendChild(td); return; }
            if (col.custom === 'todest')   { renderTODestCell(td, row);   tr.appendChild(td); return; }
            if (col.custom === 'totoqty')  { renderTOQtyCell(td, row);    tr.appendChild(td); return; }
            const val = row[col.key];
            if (col.link) {
              if (val) {
                const a = document.createElement('a'); a.className = 'row-link'; a.href = '#'; a.textContent = val;
                a.addEventListener('click', e => { e.preventDefault(); openModule(col.link, String(val)); });
                td.appendChild(a);
              } else { td.textContent = '—'; }
            } else if (col.date) {
              td.textContent = val ? formatDate(String(val)) : '';
            } else if (col.qty) {
              td.className = 'num-cell'; td.textContent = formatQty(val);
            } else if (col.truncate) {
              td.title = val || ''; td.textContent = val || '';
              td.style.overflow = 'hidden'; td.style.textOverflow = 'ellipsis';
            } else {
              td.textContent = val ?? '';
            }
            tr.appendChild(td);
          });
          tbody.appendChild(tr);
        });
      });
    }
  });
}

/* ── COLUMN PANEL ── */
function buildColPanel() {
  const list = document.getElementById('colList'); list.innerHTML = '';
  _columns.forEach((col, idx) => {
    const row = document.createElement('div'); row.className = 'col-row'; row.draggable = true;
    row.dataset.idx = idx;
    const grip = document.createElement('span'); grip.className = 'drag-handle'; grip.textContent = '⠿';
    const cb   = document.createElement('input'); cb.type = 'checkbox'; cb.checked = col.vis;
    cb.addEventListener('change', () => { col.vis = cb.checked; renderTable(); });
    const lbl  = document.createElement('label'); lbl.textContent = col.label; lbl.addEventListener('click', () => { cb.checked = !cb.checked; col.vis = cb.checked; renderTable(); });
    row.appendChild(grip); row.appendChild(cb); row.appendChild(lbl);
    row.addEventListener('dragstart', e => { row.classList.add('dragging'); e.dataTransfer.effectAllowed='move'; e.dataTransfer.setData('text/plain', String(idx)); });
    row.addEventListener('dragend', () => row.classList.remove('dragging'));
    row.addEventListener('dragover', e => { e.preventDefault(); row.classList.add('drag-over'); });
    row.addEventListener('dragleave', () => row.classList.remove('drag-over'));
    row.addEventListener('drop', e => {
      e.preventDefault(); row.classList.remove('drag-over');
      const fromIdx = parseInt(e.dataTransfer.getData('text/plain'));
      const toIdx   = parseInt(row.dataset.idx);
      if (fromIdx !== toIdx) {
        const moved = _columns.splice(fromIdx, 1)[0];
        _columns.splice(toIdx, 0, moved);
        buildColPanel(); renderTable();
      }
    });
    list.appendChild(row);
  });
}
function toggleColPanel() { document.getElementById('colPanel').classList.toggle('hidden'); }

/* ── CSV EXPORT ── */
function exportCSV() {
  const vis = _columns.filter(c => c.vis && !c.custom);
  const rows = [vis.map(c => '"' + c.label + '"').join(',')];
  _groups.forEach(g => {
    rows.push('"' + [g.ponum, g.vendorname, g.postatusname, formatDate(g.dateissued || ''), g.locationgroupname].map(v => String(v||'').replace(/"/g,'""')).join('","') + '"');
    g.items.forEach(row => {
      rows.push(vis.map(col => {
        let v = row[col.key] ?? '';
        if (col.date) v = formatDate(String(v));
        else if (col.qty) v = formatQty(v);
        return '"' + String(v).replace(/"/g,'""') + '"';
      }).join(','));
    });
  });
  const blob = new Blob([rows.join('\n')], {type:'text/csv'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = 'po_to_summary_' + new Date().toISOString().split('T')[0] + '.csv';
  a.click();
}

/* ── PRINT ── */
function printTable() { window.print(); }

/* ── UI HELPERS ── */
function setStatus(msg) { const el = document.getElementById('statusLine'); if (el) el.textContent = msg; }
function showSpinner() { document.getElementById('loadingOverlay').style.display = ''; }
function hideSpinner() { document.getElementById('loadingOverlay').style.display = 'none'; }
function showToast(message, type = 'info', duration = 3000) {
  const container = document.querySelector('.toast-container');
  const toast = document.createElement('div');
  toast.className = `toast ${type}`;
  const icon = type === 'success' ? '✓' : type === 'error' ? '✕' : 'ℹ';
  toast.innerHTML = `
      <div class="flex items-center gap-3">
          <span class="text-lg">${icon}</span>
          <span class="text-sm font-medium text-slate-700">${message}</span>
      </div>
  `;
  container.appendChild(toast);
  setTimeout(() => {
      toast.style.opacity = '0';
      setTimeout(() => toast.remove(), 300);
  }, duration);
}

init();
</script>
